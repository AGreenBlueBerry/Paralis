 北方联盟的重生\n\n南方的脱离最初在北方引起了恐慌，联盟内部的鹰派要求派民兵阻止分裂，但轮值委员会在辩论后做出了冷静的判断，决定不干涉南方的活动。\n\n南方的脱离意味着北方联盟失去了近一半的领土面积和人口，但也意味着它不再需要养活那些经济上长期拖后腿的成员。更重要的是，瓦琳妮卡山脉以南的区域成为北方与魔族、教会的缓冲层。当魔族西线部队翻越山脉北上时，他们首先要穿过南方邦国的地盘，避免了北方直接受击。\n\n地理隔绝让北方联盟获得了宝贵的发展空间，从约715年到720年代初，北方城市在没有外部直接威胁的环境下完成了一系列制度改革：\n\n- 联盟宪章修正：吸取《均衡提案》被否决的教训，联盟修改了投票规则。涉及财政转移和资源分配的重大提案不再要求三分之二多数，改为简单多数通过，同时增设最低投票率的硬性门槛，防止少数城市利用缺席阻挠立法。\n- 财政平衡基金：在不需要顾忌南方城市之后，北方联盟将原本用于维持南方基础设施的资金转入一个新设立的平衡基金。这笔基金不直接补贴贫困城市，改以低息贷款的形式资助中部城市建立自己的魔导工坊。贷款需要偿还，但利率远低于商业贷款。这避免了"白送钱"引发的道德争议，也让中部城市有动力将贷款转化为有效产能。\n- 军队正规化：自德里克事变以来，博洲的军事力量一直依赖各城各自为政的民兵队。战争的压力催生了北方第一支常备联合防卫军，起初只有不到两千人，但装备精良、训练统一，由联盟直接指挥。这是一次对博洲传统民兵理念的重大突破，但在战时获得了广泛支持。\n- 冒险者公会再定位：公会在战争期间的跨洲业务受到了严重干扰，飞艇航线在博洲周边几乎全部中断。但公会依托在各大洲的办事处，在维持原有业务的同时，一定程度转型为情报和外交中介。战争各方的非正式接触往往通过公会的地方分会进行，公会的冒险者身份让他们可以在交战区域中相对安全地移动，公会也由此发展出了一套超越国家层面的国际联系网络。\n\n到722年，北博洲联盟已经不再是手足无措的松散邦联，它是一个缩减了规模但更加精悍的政治实体，拥有统一的防卫力量、协调的经济政策和比战前更有效率的民主程序。\n而南博洲邦联则走上了完全不同的道路。在教会的宗主权下，邦国保留着形式上的自治，但宗教法律逐渐渗透到日常行政中。光明教会在这里建立了一座新的神学院，培养出第一批本地出生的司祭和教区官员，南方开始形成一种混合的独特政治文化。\n\n这道裂痕在可见的未来内看不到弥合的可能。\n\n### 光明教会的内部演进\n\n第二次圣战为教会赢得南博洲的领土和空前的声望，但狂热消退之后，教会内部的裂痕反而比战前更加深刻。\n\n#### 天使叙事瓦解\n\n天翼族使节艾琳诺在牙里加驻留的数年间，陆续了解到教会"天使降临"叙事的完整背景。\n712年，艾琳诺通过牙里加帝国的外交渠道向拉古教廷发出一份正式照会，称天翼族与教会神话体系中的"天使"没有任何关系。教会未经同意便将天翼族编入自己的宗教叙事，并以此为理由发动战争，这在天翼族看来，是无法接受的冒用。\n\n这份照会的内容被教廷内部刻意控制传播范围，但无法完全锁住。几位原初光明会的神职人员获得了副本，开始在乌洲各邦国秘密散发。\n直至715年，教会内部的矛盾已经激化到无法掩盖的地步。当时的教皇年事已高，权威在战争红利消退后开始衰退。反对者不敢直接攻击教皇本人，便将矛头指向了天使谕令的起草者和执行者。三名红衣枢机主教被指控"误解神谕、误导教会"，其中一人被迫辞去教职。\n\n原初光明会在这次斗争中渔翁得利，他们从未正式否定教皇的地位，只是始终坚持称"教会被魔导技术和世俗政治腐蚀了"。在天使叙事瓦解后，这个立场获得了越来越广泛的支持，尤其是那些亲眼看着光明谷被挖空的老信徒。但他们反对魔导技术，而教会的军事力量恰恰依赖魔导技术，彻底放弃魔导武装意味着在军事上被魔族碾压。保守派在这一点上始终无法给出令人满意的答案。\n\n到720年，教皇换任之后，新任教皇试图走一条中间路线：不否定魔导技术的必要性，但加强对魔导技术使用方式的伦理管控。他推动教令称"魔导技术是神赋予人类理性的成果"。纯粹用于生产或防卫的魔导器是正当的，用于奢侈、情色或背离道德目的的魔导器则应被禁止。\n这个折中立场暂时稳住了局势。原初光明会对此并不满意，但也没有足够的力量推翻教廷。教会内部的紧张被压制了下去，但没有被消除。\n\n#### 内部再次离心\n\n乌洲各世俗邦国则在这场神学争论中保持了实用的沉默。他们既不想得罪教廷，也不想开罪日益虔诚的民众，更不想失去矮人的魔导技术。于是他们也走了一条折中的道路：表面上响应教皇的号召、表面上认同对魔导技术的伦理管控，实际上维持着与矮人的贸易，持续进口魔导设备。拉古教廷对此心知肚明，但已经没有多余的精力去追究，教廷迫切需要这些邦国的军队和税收来维持在博洲南部的教省。\n\n乌洲的政治格局因此呈现出一种奇怪的分层。最高层的教廷在神学争论中消耗精力，中层的世俗邦国在不挑战教廷权威的前提下追求实际利益，底层的信众则在原初光明会和主流教会之间摇摆不定。没有任何一方能压倒其他两方，也没有任何一方愿意彻底决裂。\n\n### 努尔洲僵局\n\n努尔洲在全面战争时期的处境最为复杂。南北矿区之间的内战持续了数年却没有决出胜负，牙里加帝国则在这场泥潭中被拖得精疲力竭。但正是在这种困境中，一些意想不到的变化悄然发生。\n\n#### 消耗战下的资源诅咒\n\n科里克山脉的地形决定了这场南北内战的本质：这是一场双方都无法取胜的**消耗战**。矿道和山隘易守难攻，每次进攻都需要付出不成比例的代价。北方军队在装备上占优，南方军队则拥有地利和更熟悉山区作战的轻步兵。双方在反复争夺中耗尽了各自的兵源储备，却没有一方能够突破对方的核心防线。\n\n但战争对南方联盟的破坏绝对是结构性的。科里克山脉的矿脉在战火中停产大半，矿工被征入军队，矿道被炸毁或封锁。除了矿产，南方几乎没有其他经济支柱。当矿山无法运转时，南方国家的基础财政便濒临崩溃。\n而对北方矿区国家来说，矿产收入虽因牙里加帝国的采购而得以维持，但依赖帝国并不是长久之计。帝国的武器援助和贷款每多持续一年，北方国家就在债务和依赖中陷得越深一分。\n\n#### 牙里加的经济危机\n\n牙里加帝国在内战中选择了间接支持北方，但这个策略的代价远超过了帝国最初的预估。\n\n亚特劳斯城的银行体系开始承受前所未有的压力。战争军费、武器援助、对北方国家的贷款拨款，每一项都在消耗国库。\n而牙里加本身的经济情况就不容乐观：全球贸易因战争而萎缩，长白海峡的关税收入大幅下滑；各族商人在战争期间纷纷撤离亚特劳斯城，商业税收随之下跌；帝国自身的矿产进口也因努尔洲内战而受阻。\n\n716年，亚特劳斯城的一家大型银行因不良贷款而被迫暂停提款，触发了银行体系自建立以来的第一次挤兑危机。恐慌迅速蔓延到其他银行，人们排着长队在柜台前要求取出自己的信用券兑换实物货币。帝国政府紧急向市场注入了一批魔力水晶作为硬通货储备，才勉强稳住了局势。但这次危机暴露出帝国的金融根基已经不再稳固。\n\n更棘手的是皇室本身的问题。此时帝国皇帝年事渐高，皇子们围绕继承权展开明争暗斗，宫廷政治派系与军部、商业寡头和南方殖民势力各自结盟，行政效率因内斗严重下降，多项紧急政策在廷议中被长期拖延，无法及时落地。\n\n#### 从绝对君主到有限君权\n\n718年，帝国的政治危机达到了一个临界点。亚特劳斯城的商会联盟向皇室提出条件：商会愿意认购帝国发行的紧急战争债券，帮助政府渡过财政危机，但前提是皇室必须承诺进行政治改革。\n这个条件在十年前是不可想象的，但此时的帝国已经没有选择。南方矿区的战事还在继续，长城以北的兽人仍在努力渗透，如果财政崩溃，帝国将同时在内外两方面面对灾难。\n\n改革进程谨慎而缓慢，但方向是明确的：\n\n- 帝国设立元老咨询会议，成员由帝国各大城市商会、矮人工匠行会和部分地方贵族推选产生。法律仍然由皇帝颁布，但所有涉及税收、贸易和重大公共支出的政令在颁布前必须经过元老会议的审议和质询。这一机构虽然只有建议权，却首次引入了公开辩论的传统，让不同利益团体有了发声的平台，也让皇室的政策至少在名义上需要回应民众的关切。\n- 帝国中央银行此前只是一个由皇室直接控制的金库机构，现改组为独立于皇室财政的货币管理机构，负责监督商业银行的准备金率、发行标准化货币和信用券。银行体系被纳入政府监管。\n- 针对兽人的劳工政策也出现微调。帝国并未废除兽人劳工制度，但出台了一系列最低限度保护条款，包括限制最长劳动时长、禁止暴力体罚和允许兽人劳工在契约期满后自由选择雇主。这些条款的实际执行参差不齐，但它们代表着迦米莎兽人第一次在帝国法律中获得承认。这一转变的部分原因来自帝国的实用主义计算：兽人劳工已经成为帝国经济不可或缺的一部分，过度的压榨导致劳动力折损过快，反而增加了招募和培训成本。但更隐秘的推力来自迦米莎兽人在全球各地建立起来的互助网络。\n\n牙里加帝国没有像魔族那样经历一场革命性的政变，也没有像博洲那样分裂成两个国家，它选择在新旧之间小心翼翼地移动，这种改革能否在全面战争的压力下存活仍然未定。\n\n### 科技体系升华\n\n全面战争时期，矮人在政治上保持谨慎的中立，转而在科技上完成数次关键性跨越。这些进步部分是被战争需求拉动的，部分则是此前数百年积累的自然结果。\n\n#### 早期化学的诞生\n\n化学知识最初来自冶金和酸蚀工艺的实践积累。在全面战争时期，军需生产对材料性能的要求大幅提高，这些需求推动工匠从"经验配方"向"系统分析"转型。\n\n710年代，一位冶金师在反复试验不同比例的合金时，开始系统地记录每种配比对应的魔力传导效率和机械强度。这是历史上第一次有人试图用定量方法来研究材料，他的工作最终总结出一套"合金配比性能对照表"，被各工坊广泛采用。\n\n同期，酸蚀工艺也经历了重大改良。传统的酸蚀法使用强酸腐蚀金属表面，过程难以精确控制，常常出现过蚀或蚀刻不均的问题。\n但一位工匠发现，在酸液中加入特定比例的某种矿物粉末可以显著降低腐蚀速率，同时提高蚀刻边缘的锐度。他不满足于只知道"加多少"，而是试图弄清楚"为什么"。通过与炼金术士的交流，学者开始意识到酸与金属之间的反应可能遵循某种固定的比例关系。\n\n到720年，经过学术界与工界积极探索，已经初步形成化学学科框架：物质分类（金属、非金属、酸、碱）、反应定量记录、纯度概念、检测方法。虽然距离现代化学还有很长的路，但这已经远远超越了"炼金术"的经验水平。\n不过遗憾的是，这些理论仅传播于学术界前沿于部分实验室内，在实践生产中，人们仍然遵循老一套"炼金术"的方法。\n\n#### 细胞被揭示\n\n697年，一位人类科学家在观察魔法水晶时，被光的折射现象所吸引。在他的不懈努力下，发明了最早的光学显微镜。\n在光物理领域以及魔法领域，这并没有引起轰动，顶多算是一个新奇的小玩具。但701年，当生物学家利用显微镜观察到细胞结构时，人们的认知第一次得到颠覆。\n\n当时没有人能解释显微镜下的细胞单元是什么，但已经有了生物由细胞构成的假说。在有神论国家中，这项研究被迅速禁止。但随着研究深入，配合解剖学，细胞学说的雏形正在开始建立。\n\n#### 物理学系统化\n\n在物理学方面，进步主要体现在两个领域。\n\n一是魔力度量体系的完善。矮人在718年召开了一次国际度量衡会议，尽管正值战争，各国还是派出了代表。会议上正式定义了魔力密度的测量方法、魔力容量的标准单位、以及魔力传导效率的标定流程。这套体系让不同工坊生产的魔导器可以互通互检，对武器标准化尤为关键。\n\n二是经典力学的形式化。魔导引擎的普及积累了大量关于力、功、功率和效率的经验数据，一位数学天赋出众的物理学家总结出这些数据背后的规律，建立了一套以魔法版本为基础的力学理论。其中最重要的一项成果是对热力学第一定律的早期认识。他通过精确测量法阵的能量输入与输出，证明了魔力与热能之间的转化遵循固定的当量关系，永动机在原理上不可能实现。这彻底终结了围绕着热能循环法阵的各种浮夸宣称。\n\n同时，随着热力学体系与能量理论得到彻底完善，魔力也被归类为能量。学术领域认为，魔力平时以势能存在，释放时不会单独产生效果，而是必须转化为其它能量形式。尽管无法彻底揭示法阵的原理，但这套理论几乎成为公认的。（当然，站在全知的上帝视角来看大错特错）\n\n#### 战争科技的双刃剑\n\n科技跨越在军事领域产生了最直接的冲击。\n\n720年，工坊已经能够量产一系列此前只存在于实验室中的武器系统：远程魔导炮、符合符文装甲、改进型军用飞艇……这些武器的出口被矮人称为道德坟场，但没有人能阻止。因为如果矮人不卖，买家会转向更劣质的山寨产品，战争不会因此减少伤亡，只是多了一批不可靠的武器在战场上炸膛。\n\n到全面战争中期，矮人社会已经分裂为和平主义者与接受战争经济的现实主义者。这个矛盾暂时被压抑着，将在未来的某个时刻找到自己的出口。\n\n### 天翼族的坠落与新生\n\n全面战争时期最具象征意义的地理事件，发生在约723年。\n\n#### 超位法阵衰竭\n\n西风浮屿的超位法阵已经持续运转了近三千年，这套法阵的运作从未被天翼族完全理解。\n\n法阵的运作依赖两个条件：一是分流自罗格蒂兰创世之石的能量，二是定期更换浮空晶石。在封闭的两千多年里，这两个条件都没有出过问题。但随着接触开放，天翼族开始将浮空晶石用于与地面种族的贸易，这是他们最稀缺也最有价值的出口资源，浮空晶石的储备开始以远超自然再生速度的速率下降。\n\n孤立派领袖萨菲拉斯在接触初期就警告过这一点，但他的声音在回归派的开放热情和贸易利益的诱惑下被淹没了。当风主会议在约720年终于下令限制浮空晶石出口时，已经晚了。\n\n更致命的是，罗格蒂兰那一侧的能量也在发生变化。全面战争期间，教会和各国探险队在罗格蒂兰的活动日益频繁。虽然没有证据表明他们直接干预了超位法阵，但大量人员的活动、魔导设备的运转、以及可能存在的对法阵遗迹的扰动，都影响了创世之石能量分流的稳定性。这一点从未被任何一方完全意识到，因为没有任何一方的学者真正理解超位法阵的完整原理。\n\n但西风浮屿的法阵感觉到了。\n\n#### 天空坠落\n\n723年初，西风浮屿开始缓慢下降。\n\n最初的下降速度很慢，每天只有几米，以至于许多天翼族在头几周并未察觉，只是感到岛上的风似乎比以前更大了。\n随着高度的持续降低，下降逐渐加速。风主会议紧急召集了所有精通施法的长老，试图修复法阵。但法阵的符文结构已经多处龟裂，浮空晶石储备不足以维持最低能耗。\n萨菲拉斯和艾琳诺的纷争在此刻失去了意义，无论孤立派还是回归派，都无法阻止浮屿的下降。\n\n在随后的时间里，西风浮屿从四千米的高度一路下降到几百米，最终在赤道线附近的泛大洋海面上触水。板块触水后迅速解体，碎成了数个大型碎块和无数小型碎片。大部分碎片正好散布在博洲与涅洲中间，形成赤道列岛。\n\n整个族群被迫从万米高空迁徙到海平面上，许多老年天翼族在低海拔的湿热空气中呼吸困难，翼骨中的魔力平衡因环境剧变而紊乱，坠落中的天翼族伤亡无法准确统计。\n\n#### 战争隔离带\n\n坠落是一场灾难，但灾难的后果并非全然负面。\n\n赤道列岛的位置具有特殊的战略意义。这些新生的岛屿恰好位于魔族与人类之间，形成一道自然的地理隔离带。\n更关键的是，世界各国，包括正在交战中的各方，都共同默认这些岛屿仍然是天翼族的领地。如果一个国家试图占领列岛，其他所有国家都会在道德层面联合反对，因为控制赤道列岛等于控制了全球航运的咽喉。与其让它落入任何一国手中，不如让那个已经在上面居住的种族自行管理。\n\n天翼族是战争的受害者，却意外成为战争的间隔者。赤道列岛在随后的年代里逐渐形成了一种类似海神岛的中立属性。不同的是，海神岛的中立来自监管真空，而赤道列岛的中立来自各方牵制。\n\n#### 被迫融入\n\n坠落之后的岁月对天翼族的考验远比坠落本身更加漫长。\n\n他们从未在地面生活过。高山、海洋层、低压区、紫外线贫乏的低海拔环境，每一个元素都是全新的挑战。天翼族在赤道列岛上尝试重建社会时，发现自己不得不依赖那些曾经被他们视为"地面蝼蚁"的种族。萨菲拉斯的孤立主义至此彻底退出了历史舞台，他本人对艾琳诺留下的最后评价，是一句被传遍天翼族社会的、苦于无力回天的自我嘲讽："我已经没有天空可以据守了。"\n\n风主会议在赤道列岛上重建，天翼族开始学习地面语言，参与列岛中转贸易，甚至逐步接受少数外族在特定岛屿上的临时居留权。他们的魔力系统在对流层复杂环境中反而更加强大，施法威能得到提升。\n\n而随着天翼族人口流动进世界各地，天翼族也开始走进大众视野，人口得到显著提升。\n\n## 战争激化、仇恨升级\n\n萨拉查是一个政治家，不是狂热信徒。如果能以谈判划定势力范围，一纸条约并不比一场战争更糟糕，但教会的反应出乎他的预料。\n\n### 三次遣使\n\n萨拉查在政变后的几年间（710-720年间）先后三次派遣使者，试图与拉古教廷建立沟通渠道。\n\n- 第一次遣使：使者是一名出身西淋默德家族的资深外交官，精通通用语，举止儒雅，携带萨拉查亲笔签名的文书。文书措辞克制，仅表示魔族新政权希望就"博洲南部现状"进行磋商。\n  使者抵达南博洲教省后被当地主教扣留数日，最终在未获准前往拉古教廷的情况下被遣返。主教的口信简短而轻蔑："邪魔无信，不可共语。"\n\n- 第二次遣使：这次他委托一名中立的牙里加商团代表，以"民间贸易协商"的名义携带信函接触教廷。牙里加帝国的中立身份和商业信誉让使者得以进入教会控制区，也确实见到了教廷的一名中层官员。但信函从未被转交给教皇。裁判所不仅没收信函，还将牙里加商人列为"不受欢迎者"，禁止其在南博洲教省从事任何商业活动，理由是"协助异端传递邪说"。\n- 第三次遣使：这是萨拉查的最后一次尝试，也是代价最高昂的一次。萨拉查精心准备信函，用通用语书写，措辞务实，建议在博洲中部河流沿线划定永久停火线，双方在此基础上展开贸易谈判，以避免不必要的生命损失。使者选择了从乌洲东海岸登陆，再经内陆前往拉古教廷。\n  但教会的飞艇巡逻队在乌洲近海拦截了他们的船只，使者表明身份和来意后，被以"邪魔使节"的罪名移交宗教裁判所。两名使者被指控"以异端邪说腐蚀光明子民"，拒绝他们的任何辩解，将他们绑在火焰柱上处决。处决过程被公开示众，信函被当众焚毁。\n\n消息传回魔王城时，萨拉查沉默了很长一段时间。议会最终以绝大多数通过决议：与教会进入全面战争状态，永不再接受任何谈判。\n\n### 三线战略\n\n萨拉查在几年间迅速布局，并完善了他的全局战略，三线同时推进。\n并且，相当明智的是，萨拉查没有选择走教会的极端民族主义，而是始终将教会势力作为首要敌人，拉拢其它可能的力量。\n\n#### 东线\n\n经南极，在努尔洲南端建立据点，牵制牙里加帝国及其与北方矿区的关系，同时尝试接触魔洛希派兽人。依靠外交获取东线稳定航道，并从乌洲东侧登录夹击。\n\n#### 西线\n\n这里远离教会主力驻守的南部防线，紧靠迷雾丛林边缘，地势复杂、人烟稀少，也是博洲联盟防御最薄弱的区域。\n\n萨拉查计划从博洲西北登陆，翻越瓦琳妮卡山脉，自北面施压博洲。压力主要指向已经沦入教会控制区的南博洲邦联，而非北博洲联盟的核心城市。\n西线的渗透相当缓慢，每次出兵量都远少于正常水平，让教会将更多注意力分散到其它战区。实际上却已经建立大量秘密据点，持续积累力量。\n\n#### 中线\n\n西风浮屿在723年坠落解体、赤道列岛成型后，萨拉查第一时间意识到这条新生群岛的战略意义。他迅速在中线部署一支军团，并持续增兵营造正面佯攻的假象，意图争取时间等待东西线完全就位。\n\n### 拉拢北博洲\n\n与教会进入不死不休状态之后，萨拉查开始系统地重新定义魔族的对外关系。\n\n萨拉查花了几周的时间，起草了一份对魔族外交具有奠基意义的文件："如果我们把全部敌人当成一整个阵营来打，我们会被同时推向与他们全体为敌的绝境。如果我们把敌人拆开来看，我们发现真正的敌人只有一个：教会体制。"\n其中，最耐人寻味的一句便是："北博洲和我们一样，是教会的异端。"\n\n724年，中线战场已经开始进攻。萨拉查通过冒险者公会，秘密向北博洲联盟发送一封非正式信函，在魔族历史上称为《北信》。\n\n信函的内容有三个要点：\n\n- 明确划定攻击范围：魔族武装将严格限制其攻击目标为南博洲教省的教区堡垒和圣战军驻地，不会主动攻击北博洲城市的领土、商船或中立聚落。魔族在博洲西部登陆的部队将绕开北博洲城镇，沿着瓦琳妮卡山脉南侧向教会控制区前进。\n- 承认北博洲不是敌人：信函以坦率的口吻指出，北博洲的制度与教会在结构性上是互相排斥的。魔族不会要求北博洲站在自己一边，但也不希望北博洲站在教会一边。\n- 开放非正式沟通渠道：建议双方通过冒险者公会或牙里加商团维持联系，以便在不可避免的边境摩擦发生时能够互相通报、控制升级，防止误判引发不必要的冲突。\n\n请求在北方内部首先迎来争论。一部分委员认为，与入侵种族进行任何形式的接触，都是对博洲先辈的背叛。\n另一部分委员指出，北方联盟面临的最大威胁是正在南方巩固势力的教会，南方七城的脱离已经把教会的力量推到了北方联盟家门口。如果教会以"对抗魔族"为名在博洲全境建立军事防御体系，北方联盟的世俗自治将在自身无法阻止的情况下被架空。\n\n经讨论后，北博洲联盟没有正式回复《北信》，他们不能冒着被教会和南方指责为"通敌"的风险。但城市代表通过冒险者公会，以私人名义向萨拉查的使节传达了一句短话："我们不会替教会挡子弹。"\n这句话被萨拉查视为外交上的重大胜利。他不需要北博洲站在他一边，只需要北博洲不站在教会一边。\n\n但东线的推进却难以取得进展。自身难保的努尔洲无法放心地允许魔族借道，魔族也不想多招惹一方势力，谈判陷入僵局。\n\n### 与外族的协商\n\n对于矮人，萨拉查采取了更加灵活的姿态。他只是确保贸易通道畅通，不要求矮人做出政治回应。\n\n对于精灵，萨拉查延续了卢瑟时代的友好基调，但不再要求精灵在政治上公开表态。他理解精灵的中立，同时也需要精灵维持中立，因为精灵群岛恰好位于魔族航线的一个重要节点上。\n只要精灵不完全倒向教会，魔族的南线补给就不会被切断。为此，萨拉查在战事最紧张的时候仍然维持对精灵的部分贸易配额，确保精灵不会因魔族封锁而感到窒息。\n\n### 战争的全球影响\n\n与此同时，乌尼尔洲至努尔洲之间的海域也因这场拉锯变成空前危险的战区。商船队在战时保险费用飙升到天价，大批民用贸易被迫缩减规模，牙里加帝国的关税收入进一步锐减，加剧努尔洲的经济矛盾。\n博洲北方联盟虽未参战，但也因航线受阻而面临严重的进出口困难。这场战争早已不是魔族与教会的私人恩怨，而是拖全世界下水的一个困局。'}]}]},{id:'世界地形概述',title:'世界地形概述',content:'本文档集描述的所有信息都基于新生纪元最新时代数据，不包含时政与人文因素，仅描述自然环境状态。\n**注：所有区块都有中心坐标和四个方位的边界，但不代表它们是规则的几何图形！边界取的是距离中心最远的值而不是平均值，仅提供范围参考。**\n\n星球规模方面，赤道周长约40000千米，1度经纬度约为111千米，和地球完全对应。泛古陆破碎后，主要可分为四大陆、六群岛与四大洋，详见子文档集。\n\n总体上来说：\n\n星球中心是光明之海，与悬浮在上位于高空的罗格蒂兰浮空群岛。罗格蒂兰因其位于星球中央的特殊位置，同时也被划定为经纬度起点（0,0）。\n\n光明之海外包围的是泛大洋，两片海洋在地理意义上完全相等，但光明之海特指罗格蒂兰下方的海域。西风浮屿位置不定，大体漂浮在泛大洋上空的西风带。\n\n在泛大洋西北侧是博茨瓦岗洲，西南侧则是涅克洛玛洲，两洲再西侧则是静谧之海与海神岛。\n\n泛大洋东北侧是乌尼尔洲，东南侧内海域则分布着艾丽尼亚群岛。乌尼尔洲大陆东海岸线，一直到努尔洲的区域被划为箭洋，南部的空海直连泛大洋，同属于泛大洋。\n\n努尔洲的位置则比较特殊，它位于180经度，和罗格蒂兰在星球意义上是"对面关系"。\n\n南部的南极岛直连努尔洲，大陆边缘与博茨瓦岗洲临近。实际上南极岛的面积偏大，可以算作是大陆板块。',children:[{id:'海洋区域',title:'海洋区域',content:'远古时期，海洋是一片整体。但泛古陆分裂后，海洋被不同的陆地板块分割成多块。主要海域包括：泛大洋、静谧之海与箭洋。',children:[{id:'光明之海',title:'光明之海',content:'光明之海是帕拉里斯的中央海域，其定义并非由洋流或地貌划分，而是由罗格蒂兰决定，其投影所覆盖的圆形海区便是光明之海。\n\n## 海域特性\n\n光明之海面积约六十万平方公里，与地球上的里海相近，但它是一片开放海域。\n\n罗格蒂兰的投影在正午时分恰好落在光明之海的中心，形成一个直径约四十公里的日影区。这片阴影随着罗格蒂兰与太阳的相对位置而移动，但始终不会离开光明之海的范围。因此光明之海也拥有整颗星球上最独特的永久日蚀。\n日影区的存在造就了光明之海独一无二的生态奇观。在阴影边缘，阳光被罗格蒂兰的板块边缘切割成一条锐利的光线，浮游生物形成异常密集的分布带。喜光生物聚集在明亮一侧，喜暗生物潜伏在阴影一侧，两种截然不同的生态群落以一道肉眼可见的光线为界彼此相邻。\n\n更深远的影响来自创世之石。超位法阵虽然深藏浮岛基岩之中，但其能量在漫长岁月里持续向下方海洋辐射，海水中溶解着远高于周边海域的游离魔力，浓度从中心向外围逐渐衰减。这使得光明之海成为世界上少数几处高魔海域之一，这里的海水也被称作圣水。\n虽然人类无法在核心区生存，但教会在边缘安全区建造了巨大的海上平台。身穿厚重保温服的工人和苦修者在这里工作，操作巨大的吊桶和泵机，从海水中提取高浓度的圣水。\n\n## 海底地形与生态\n\n光明之海的海底是泛古陆时代原始地面的残留，由于表面被剥离而沉底，海底留下一个巨大的洼陷，深度从周边的2000至3000米骤降至中央的7000米。\n\n这个洼陷是整片海洋中光照最弱的区域，不仅要承受海水的自然衰减，还要承受罗格蒂兰的永久阴影。这使得中央的海底生态系统非常贫瘠，浮游生物稀少，大型捕食者几乎绝迹。\n但创世之石辐射的微弱魔力让海床上滋生出一种微光群落。这些生物依赖海水中的游离魔力维生，自身发出微弱的生物荧光，铺展在海底形成一片绵延数万平方公里的幽蓝光斑。\n\n海族对这一区域的态度尤为审慎。长老们感知到罗格蒂兰的创世之石能量与海底的某种共鸣，但从不靠近。在海族的古老认知中，这片海域是天上之物与水下之物交汇之处，属于禁区。\n\n## 洋流与气候\n\n光明之海位于赤道与低纬度交界的区域，是泛大洋环流体系的汇聚点。四条主要洋流在光明之海的边缘交汇：来自北方的暖流、来自南方的寒流、以及两条东西向的赤道流。\n\n由于罗格蒂兰的阴影减少海面日照，光明之海的水温比同纬度的泛大洋低约三至七度，中央甚至低于十度。温差使光明之海形成一个独特的气候循环：中心海区的冷空气下沉，向四周扩散；周边暖海面的空气上升，在光明之海边缘形成上升气流。\n大气环流直接导致光明之海常年被一圈低云环带包围，云层在边缘盘旋，却很少进入中心日影区上空。这使得光明之海内永远晴朗，而外围则多雾、多雨、多风暴。\n\n航海者将这条环绕光明之海的云带称为光轮。在远处海平线上，它看起来像是一圈环绕着中央晴空的水汽之墙，穿过光轮进入光明之海，意味着从风雨交加的边缘海区突然驶入一片平静的、被阴影笼罩的中央水域。这种梦幻体验在航海传说中被反复描绘，成为无数诗篇与文学作品的题材。'},{id:'泛大洋',title:'泛大洋',content:'泛大洋是帕拉里斯面积最大的海洋。从光明之海的边缘向外延伸，泛大洋几乎环绕整颗星球，连接起所有主要大陆，是所有远洋航线、跨洲贸易与海上战争的共同舞台。\n\n## 范围与划分\n\n泛大洋的总面积接近地球太平洋，约占帕拉里斯表面积的五分之二。它是由多个相互连通的次级海域组成的庞然大物。按照后世制图学的划分，泛大洋大致包括：\n\n- 核心区：光明之海周围、罗格蒂兰投影覆盖范围之外的低纬度海域。这里是全球最繁忙的航线交汇处，也是西风浮屿坠落前漂浮的主要区域。受罗格蒂兰影响，普通磁罗盘越靠近海域中心越失灵。\n- 北部海域：泛大洋北侧，介于博茨瓦岗洲、乌尼尔洲之间的广阔水域。冬季受极地寒流影响，北部边缘有浮冰，夏季则风平浪静，是东西方贸易的传统航道。\n- 南部海域：泛大洋南侧，紧邻涅克洛玛洲东部与南极岛外缘，海况凶险，风暴频繁，是远洋航线中最危险的一段。\n- 赤道无风带：泛大洋中央沿赤道分布的一条狭窄水域，因南北信风在此抵消而形成常年无风的静海。这条无风带在蒸汽船和魔导船出现之前是帆船的噩梦，无数帆船在此处因无风而困死。进入蒸汽魔导时代后，无风带反而成为最可靠快速的航线。\n\n泛大洋中心离最近的陆地也有上万公里，为了避开没有补给的中心死亡带，古代的所有航线都必须沿着大陆架画出巨大的曲线，中心海直到近代才能踏足，因此泛大洋在民间有别称曲流海。\n\n## 洋流体系\n\n泛大洋的洋流体系是全球气候的引擎。由于罗格蒂兰固定在星球中央，光明之海的低温中心成为整个大洋环流的关键节点。\n\n主要的环流包括：\n\n- 赤道暖流：东西向横贯泛大洋的低纬度暖流，将温暖海水从东部带向西部，是连接四大陆的主要水文通道。\n- 高纬寒流：南北两侧的高纬度寒流将极地冷水向赤道输送。南部寒流尤为强劲，因为它要绕过南极岛的庞大冰架，将巨量的冷水注入泛大洋南部。\n- 光明之海辐散流：光明之海的低温下沉海水向四周扩散，形成一支独特的深层流，在数百米深处缓慢流动，最终在泛大洋边缘上升。这支深层流将光明之海的富魔力海水带到整个大洋，是泛大洋魔化种分布的重要水文背景。\n\n这些洋流交汇的区域往往是渔场，寒暖流交汇带来丰富的营养盐，滋养了密集的浮游生物和鱼群。泛大洋的渔场养活了大半个世界，也是文明资源争夺的潜在焦点。\n\n## 生态与危险\n\n泛大洋的浅海区生态异常丰富。由于帕拉里斯的历史上没有经历过海洋大灭绝，浅海区的物种多样性远超地球海洋。虫鱼、甲壳类、软体动物在浅海区大量繁衍，其中相当一部分是魔化种。\n\n在魔导时代之前，浅海区的庞大生物量是沿海文明最可靠的蛋白质来源，但其危险同样不可小觑。\n不光是魔化种的难缠，深海区生物也会偶尔越过断层壁进入浅海区，利维坦、噬海者的每一次跨界都会给浅海文明带来灾难。海族的巡猎队会沿着断层壁巡逻，既是维持深海秩序，也客观上阻止了大部分深海生物的无序上浮。\n\n蒸汽魔导时代后，泛大洋深层开始向文明敞开。潜艇下潜至浅海区与深海区的交界，第一次窥见了断层壁之下的世界。但那里仍是禁忌之地，忒米妮娅、海须圣地，以及更深处无人知晓的存在，都蛰伏在泛大洋幽暗的海床之上，等待着下一个敢于深潜的文明。\n\n### 萨尔加索大涡旋\n\n萨尔加索位于泛大洋一处巨大的洋流死点，无论是战舰残骸，还是商船的漂浮物，都会顺着洋流在这里汇聚。旋涡中心形成一座完全由朽木、锈铁堆积而成的浮岛。这里充满魔物，但也藏着无数失落的财宝。\n\n## 交通概况\n\n由于蒸汽船和魔导船造价昂贵，帆船仍然普遍用于货运。商业航线集中在大陆架边缘 100 公里内，防止船只深入中心孤立无援。但依赖一系列火山岛链，勇敢的船长们会像青蛙跳荷叶一样，利用这些仅有几平方公里的暂歇点完成跨洋补给，直接从中间穿过海域缩短航程。\n\n除了能自由穿梭的高级船只，空中航线无疑是最好的穿越方式。利用平流层的稳定气流，帆船的死亡之海变成贵族脚下的一道风景线。'},{id:'静谧之海',title:'静谧之海',content:'静谧之海位于博茨瓦岗洲与涅克洛玛洲的西侧，是四大洋中最为封闭、也最为特殊的一片海域。它的名字是对这片水域状态的直观描述，这是一片几乎不存在风浪的海洋，仿佛整片海洋都在沉睡。\n\n## 环境成因\n\n静谧之海的平静并非自然形成，而是远古工程的遗迹。\n\n龙纪元末期，混沌日的尘埃云让全球海面陷入持续的躁动，风暴、巨浪、海啸此起彼伏，连深海的海族都不得安宁。海族最终聚集在普罗地海的中央海沟，在那里，他们找到了那颗沉于海底的创世之石。海族围绕它建立海族圣坛，也就是后世所称的海须圣地。\n\n圣坛的核心是一套由海族与创世之石共同运转的巨型法阵，它持续吸收海水波动中的动能，将其转化为魔力储存在创世之石之中，再缓慢释放为无害的热量。在圣坛法阵的覆盖范围内，海水的机械振动被系统性抑制，风浪因此无法形成。\n\n这种抑制不是无限的。圣坛的阻尼效应在中央海沟附近最强，向四周衰减。因此静谧之海的平静程度呈同心圆分布：\n\n- 核心区（以海神岛为中心，半径约三百公里）：水面如镜，终年无风。海面甚至会出现一种罕见的"镜涌"现象，底层海水缓慢涌动，但表层却毫无波纹。光线在平滑水面上发生完全反射，海平线消失在一整片银白的反光之中。\n- 过渡区（核心区外围至静谧之海边缘）：风浪逐渐恢复，但仍显著弱于普通海洋。这片区域的船只可以航行，却几乎感受不到颠簸。\n- 风暴墙（静谧之海与泛大洋的交界处）：阻尼效应在这里骤减，被抑制的能量在边界上以剧烈的方式释放。围绕静谧之海的外缘，常年盘踞着一圈雷暴与巨浪交替的**风暴环带**，如同守护这片静海的高墙。古代航海者穿越风暴墙进入静谧之海的瞬间，会经历从怒海到死水的极端反差，这种体验在无数航海日志中被形容为"穿过世界的裂缝"。\n\n## 气候与航行\n\n核心区的气温受创世之石能量影响，比同纬度海域略高，海面常年笼罩着一层水汽。\n由于没有风，这层水汽无法散去，形成低垂的平流雾，贴着海面流动。因此在海神岛附近，雾海与镜面海交织，能见度很低，船只只能依靠魔导罗盘引导航行，这在客观上为黑市提供了安全保障。\n\n环境也让这里成为传统与现代、魔法与机械的分水岭。\n没有波浪辅助，帆船仅靠风力根本推不动这种平静的水体。任何误入的帆船都会被困死在海上，最终成为黑市浮岛的一部分。\n而对于螺旋桨蒸汽船来说，没有兴波阻力，全速航行的蒸汽船在这里能跑出快艇的感觉，且能耗大幅降低，这直接促成了横跨此海域的高速走私网络。\n\n## 海底生态\n\n平静的海面之下，静谧之海的生态与水面形成鲜明对比。由于风浪被抑制，表层海水无法像普通海洋那样充分混合，营养物质在表层严重匮乏，浅海区的生物群落相对贫瘠。但深海区却因海族圣坛的能量而维持着一个独特的化能生态圈，圣坛释放的微量热量和魔力滋养海底热泉周围的微生物群，进而支撑起一片不受阳光制约的深海食物网。\n\n海族是这片深海生态的绝对主宰。他们在圣坛周围建立规模庞大的水下聚落，用珊瑚、岩石与自身的分泌物构筑巢穴。从海沟深处望去，海族的巢穴群如同从深渊中深出的无数根须。\n\n静谧之海是海族的家园，也是陆地文明通往深海世界的唯一门户。对海族而言，静谧之海的存在是他们文明的根基。圣坛法阵一旦受损，被抑制了数千年的海洋能量将在时间内释放，届时静谧之海将成为全球最狂暴的风暴中心。'},{id:'箭洋',title:'箭洋',content:'箭洋位于乌尼尔洲东海岸与努尔洲之间的狭长海域，是四大洋中流速最快的水域。它的名字同样源自其最显著的高流速特征，这条洋流如同一支离弦之箭，在两大洲之间的海面上疾驰而过。\n\n## 高流速环境\n\n箭洋的高流速源于独特的地理构造。乌尼尔洲与努尔洲呈南北斜向对峙，两洲海岸之间形成了一条由南向北逐渐收窄的海峡走廊。泛大洋的暖流在进入这条走廊后，被两侧大陆架挤压，如同水流经过狭窄的管道，流速骤然加快。\n\n箭洋流的主干流速常年维持在普通洋流的数倍以上，最窄处甚至达到表层航速每小时数十公里的程度。在箭洋流中段，快速流动的暖水与两侧较慢的水体之间存在密度差，海面会形成一条肉眼可见的流纹带。\n\n箭洋流的海况非常复杂。高速洋流与海底地形相互作用，在走廊沿岸催生了大量的涡流、暗流与潮汐急流。某些狭窄地段的水面会突然出现旋涡，将小型船只卷入；而在另一些地段，底层逆流与表层顺流方向相反，形成"水中有水"的分层结构，非常凶险。\n\n## 气候与航行\n\n箭洋的洋流对航行是一柄双刃剑。\n\n顺流时，船只远超正常航速，箭洋因而成为中古时期以来连接乌尼尔洲与努尔洲的最快通道。逆流则是灾难，帆船航行的速度几乎被抵消殆尽，船只可能在原地打转数日。\n即便在蒸汽与魔导时代，逆流航行依然意味着成倍的燃料消耗与引擎负荷。因此，箭洋两岸的贸易长期遵循着单向航行的规律，南行的商队宁可绕道外海，也不愿与箭洋流正面抗衡。\n\n气候上，箭洋流是一条暖流，为沿岸地区带来了温暖湿润的海风。乌尼尔洲东海岸的矮人城邦与努尔洲西侧的港口城市都受益于这条暖流的调节，冬季气温显著高于同纬度内陆。但暖流与冷空气交汇也使得箭洋流走廊多雾、多降水，海面常常笼罩在灰白色的雨幕之中。\n\n### 战略意义\n\n由于毗邻两个工业大洲，这条海路承载了大部分重型工业品与大宗矿石运输。因为水流太快，海盗很难在此设伏，是名副其实的黄金之路。\n\n箭洋是连接乌尼尔洲与努尔洲的海上命脉。在全面战争时期，这条洋流走廊的战略价值进一步凸显。谁能控制箭洋流，谁就掌握了在两洲之间快速投送兵力与物资的能力。\n牙里加帝国长期保持着对箭洋流主要航道的控制，而矮人的海上城邦则控制着北端的出口。两股势力在箭洋流上的微妙平衡，是努尔洲与乌尼尔洲之间长期既合作又对峙的深层原因之一。\n\n## 生态\n\n箭洋流的流速决定了它的生态特性。高速流动的水体携带大量氧气与营养盐，使箭洋流成为一条富营养的水下高速公路。浮游生物与小型鱼群随洋流迁徙，形成连绵不断的洄游带。每年特定的季节，大群的虫鱼与甲壳类会顺流而下或逆流而上，其规模之庞大，足以让海面数日间被鱼群染成暗色，影响海上交通。\n\n这条洄游带吸引了大量捕食者,浅海区的肉食鱼类、海鸟群、甚至偶尔越界的深海生物都会聚集在箭洋流沿岸觅食。两岸的渔场拥有最富饶的渔业资源，也是两洲沿海文明争夺的焦点之一。'}]},{id:'大陆板块',title:'大陆板块',content:'泛古陆分裂后，总共存在四片大陆，构成新生纪元的四大洲：乌尼尔洲、博茨瓦岗洲、涅克洛玛洲、努尔洲。',children:[{id:'乌尼尔洲',title:'乌尼尔洲',content:'乌尼尔洲位于泛大洋东北侧，是光明教会统治的大陆，也是人族文明的发源地之一。乌洲的自然环境在四大洲中最为温和克制，或许应该说是平衡。但这种温和之下隐藏着深刻的地质伤痕。\n\n## 自然环境\n\n乌洲的地形以两条山脉和一片沙漠为核心骨架，其余地区分布着平原、森林与丘陵：\n\n- 多伦山脉：位于大陆北部，东西走向横贯两端，是人类文明最初的聚居地。多伦山脉地势较为平缓，山间谷地适合农业耕作，但隔绝海风、较为干旱。\n- 托姆山脉：位于大陆中部偏东，南北走向，是乌洲的第二条主山脉。托姆山脉中高外低，仅有几条山谷连通东西，是天然的地理屏障。\n- 光明谷：位于多伦山脉与托姆山脉的交汇处，是乌洲最著名的地标。龙祖与神母的对决将两山交汇点直接抹平，爆炸留下巨大凹陷，使得谷地深处埋藏着巨量的高纯度魔力水晶矿脉。教会将此地视为圣地，蒸汽魔导时代 后又将其开发为巨型采矿场。\n- 伊腊塔干沙漠：泛古陆未分裂时，伊腊塔干地区位于乌尼尔洲板块中部，又被两条山脉阻隔，形成一片广袤的干旱沙漠。沙漠中的泉眼连接的地下水系，是这片荒芜之地唯一的生命。而分裂之后，西、南方受海洋浸润重新恢复生机，大陆中部却保留了大片沙漠，让文明不得不环绕沙漠分布。\n\n山脉与沙漠占据了大量土地，耕地面积有限，使得乌洲的生态在四大洲中相对贫瘠。除去富饶地区，只有耐旱的魔化种和依赖绿洲的生物能够生存。\n而最重要的是，托姆山脉蕴藏着丰富的铜铁矿。乌洲的自然环境虽然略显严酷，山脉资源却为技术文明的发展提供了最关键的矿物基础。\n\n### 历史残留\n\n远古纪元时，早期文明所建的 泰拉西亚古国没有完全消失，沉没在西南诸侯国的地下，被后世称作提尔纳诺废墟。\n\n堆积在地底的除了古文明遗迹，还有大量魔物，尤其是尸体凝聚的触手族。意外保存下来的地底结构错综复杂，成为了和海神岛一样的法外之地，连教皇的手也伸不进去。\n\n## 气候\n\n北部受高纬寒流影响，冬季寒冷，夏季凉爽，是大陆的主要农业区；中部山脉地带气候温和，降水适中；沙漠地带极度干燥，年降水量少，白昼酷热，夜晚寒冷。\n\n而光明谷非常特殊，魔力残留使光明谷的气候异常稳定，且空气中游离魔力浓度远高于周边，几乎都是晴朗的天气。'},{id:'博茨瓦岗洲',title:'博茨瓦岗洲',content:'博茨瓦岗洲本是泛古陆中稳定且富含生命力的中温带区域，在漂移过程中并未遭遇剧烈的地质挤压，自然生态保存良好。\n\n## 自然环境\n\n博洲位于泛大洋西北侧，东临泛大洋，西濒静谧之海，整块大陆形状类似地球上的非洲板块，但更加扁而宽。\n\n博洲最显著的地理骨架是纵贯大陆的瓦琳妮卡山脉。作为大陆的脊梁，它呈不规则S型纵贯全洲，总体位于大陆<u>偏西侧</u>，<u>南北走向</u>，使博洲分为<u>东西两侧</u>。山脉西坡陡峭，直接切入西海岸的狭窄平原；东坡相对平缓，逐渐过渡为大陆主体的丘陵与平原带。\n\n瓦琳妮卡的山势大多平缓圆润，不仅富含便于开采的<u>浅层金属矿</u>和<u>魔力水晶簇</u>，其较低的海拔（大多在2000米以下）和茂密的水平植被带，使其本身就是绝佳的宜居地。\n山脉同时也是魔物的绝佳栖息地，博洲魔物数量与种类位于全球首位，是生态最复杂的地区。\n\n瓦琳妮卡山脉内侧还存在一个特殊的封闭盆地结构，称瓦琳妮卡盆地。四周岩壁阻挡寒风，内部气候与外部几乎完全隔离，成为一片四季稳定的地点。\n\n### 西半陆与迷雾丛林\n\n山脉西侧与静谧之海之间的西海岸带，是一条狭长而潮湿的沿海地带。这里终年被海雾笼罩，森林密不透风。由于靠近静谧之海的风暴墙边缘，西海岸带常年遭受剧烈的天气变化，是最不适合定居的区域。著名的迷雾丛林便位于这条海岸带的北段，覆盖了瓦琳妮卡山脉西北部的广阔区域。\n\n原本的普通橡木在环境刺激下，长得高大扭曲，树皮布满如同血管暴突的黑色裂痕，能直接作为魔导器的核心材料。\n迷雾树还会全天候释放雾气，具有吸光性与声阻尼特性。进入森林内部，就像被塞住耳朵并带上墨镜，外界的阳光变成若有若无的灰暗光晕。\n\n而迷雾森林也是触手族最密集的聚居地，魔物大多位于山脉内或东半陆，迷雾森林大量面积被触手族盘踞。\n\n### 东侧平缓带\n\n从山脉东坡向东，地形依次展开为丘陵带、中央平原带和东部沿海平原。\n\n中央平原带是博洲最肥沃的农业区，河流从瓦琳妮卡山脉发源，向东汇入泛大洋，卑津城市联盟的核心城市都坐落在中央平原或东部沿海。\n\n### 南北概况\n\n靠近北极圈的高海拔区域无人定居，因受南侧暖湿气流影响，被苔原生态所充斥。\n\n大陆南部的地形更加破碎，森林与丘陵交错，南方河流沿线的冲积平原土地肥沃，是魔物生态密集区。\n\n##A 气候\n\n博洲的气候受两大洋的共同影响，呈明显的地理差异。\n\n东部面向泛大洋，多为温带海洋性气候，受暖流调节，沿海地区温暖湿润，降水充沛。\n中央平原四季分明，夏季多雷雨，冬季温和。\n越向西深入，气候越趋于严酷。瓦琳妮卡山脉阻隔大部分湿润气流，西海岸带的气候在暖湿与干冷之间剧烈摇摆。加之靠近静谧之海风暴墙，内陆干旱的同时海岸却常年风雨交加。\n北部靠近极地方向，冬季会出现霜冻，但整体仍属温带。南部气候温暖，全年无霜期长，适合多种作物生长。\n\n这种南北差异与东西差异叠加，使博洲成为四大洲中气候类型最丰富的大陆。\n\n## 沿海资源\n\n博洲东部海岸拥有广阔的大陆架，浅海区资源丰富，辰砂港等东部港口城市依托浅海渔场和航运业繁荣。\n\n由于海洋断层的存在，博洲东海岸的浅海区向外延伸相当距离后，才会在断层壁处骤然坠入泛大洋的深海区。博洲西海岸则不同，濒临静谧之海的海岸线多为陡峭岩壁，缺少天然良港，加上风暴墙的阻隔，西海岸在历史上长期是文明的边缘。'},{id:'涅克洛玛洲',title:'涅克洛玛洲',content:'涅克洛玛洲位于泛大洋西南侧，博洲的正南方，与博洲隔赤道相望，板块形状类似地球上的澳洲。\n\n## 自然环境\n\n涅洲的地形以萨拉默托深渊为核心展开。这条深渊位于大陆板块中心，是外神冲击战役中，火龙王与金龙王同歼星体同归于尽时，高温金属撕裂大地留下的巨大裂缝。\n深渊绵延上千公里，内部熔岩奔涌、矿产裸露，龙化生物与高温魔物在裂缝深处繁衍生息。深渊两侧的火山地带富含硫化物矿脉，浅层的金属碎屑沉积形成易于开采的矿藏，具备丰富的重工业基底。\n\n除此之外，另一天险是澳鑫山脉。山脉自西南沿海起势，完全包围南部海岸线，并延伸到东侧海岸线，直到东北方向才平缓下去。整个大洲被山脉半包围，很大程度上隔绝了南极的寒流。\n\n由于三颗创世之石曾在远古时期落于此处，魔力环境极端复杂。即便在文明高度发展的现代，涅洲的内陆地区仍有许多区域因自然魔法频发而无法定居：\n\n- 北部是面向泛大洋的沿海森林与丘陵，海岸线曲折，生态适中。\n- 中西部是起伏的高原与火山群，与萨拉默托深渊在地底相连，熔岩湖、间歇泉、地热裂隙随处可见；中东部地势平缓，植被集中，是主要宜居地带。\n- 南部逐渐过渡为干燥的荒原，直抵南极方向，被澳鑫山脉隔断。\n\n从西海岸到中部，包括西北、西南地区，都被扭曲丛林所覆盖。\n\n扭曲丛林是魔力环境最复杂的地带，魔力水晶矿脉广布。由于光线折射、自然魔法频发，天空常年呈现彩色交织的油画质感，夜空比极光还要灿烂。\n而其"扭曲"则得名于植被。受自然魔力影响，植物吸收了大量金属离子。不仅外观迥异，有些如金铁般坚硬，有些则渗出水银般的剧毒树脂，成为地表最危险的生态圈。\n\n最危险的是活体变异植物与魔物，不仅藤蔓、花朵会自主捕食，高级魔物、触手族同样泛滥。\n\n## 气候\n\n涅洲的气候受火山与地热活动的强烈影响，无法用简单的纬度规律概括。\n\n北部沿海受泛大洋暖流影响，温暖湿润，是涅洲最宜居的区域之一，魔族的主要城市和港口多分布于此。\n中东部虽然被东部的澳鑫山脉阻隔海风，但北方水汽输送与充沛的雪山化水，让这里比北部更加丰饶，是主要的农业生产地。\n\n中西部因地热活动，局部地区在冬季也保持着异常的高温，熔岩湖周围的空气常年灼热。南部荒原干燥少雨，昼夜温差大，唯一的稳定水源是雪山化水。\n\n最特殊的是深渊地带。萨拉默托深渊的熔岩持续向大气释放热量，在深渊上空形成稳定的热对流气候。深渊沿线常年有上升气流，云雾与热浪交替，偶尔还会因魔力紊乱而形成局部风暴。\n\n## 生态\n\n涅洲的生态是四大洲中最具攻击性的。\n\n魔力乱流使这里的魔化种密度达到全球之最，食尸鬼、腐殖怪等低智慧魔物在涅洲大量繁衍，亚龙同样广布，在所有植被覆盖的复杂地带都能见到它们的身影。\n深渊中的龙化生物更是涅洲独有的顶级掠食者，它们适应了高温高压环境，数量未知，是任何文明都不敢轻易招惹的存在。'},{id:'努尔洲',title:'努尔洲',content:'努尔洲位于星球的180经线上，与罗格蒂兰在星球意义上是正对面关系，被称作世界尽头。它是四大洲中纬度跨度最大、南北差异最悬殊的大陆，是全球贸易的十字路口，也是各方势力争夺的枢纽。\n\n## 自然环境\n\n努洲的地形呈鲜明的南北二分结构，北方是山脉、丘陵、平原的典型过渡，南方则被高耸的山脊进一步一分为二。\n\n### 北努尔洲\n\n安蒂罗斯山区位于大陆最北端，呈中间高四周低的放射状，还保留有大量原始森林。这里地势崎岖、气候严酷，为兽人的进化提供了庇护，同样也成为文明管辖之外的一大法外之地。哥布林在此地同样泛滥，和兽人一样劫掠为生，但与兽人同样不共戴天。\n\n安蒂罗斯山区以南，经过一片丘陵与森林区的过渡，是努洲最广阔的平原地带。这里土地肥沃，接受东西两海的资源，降水充沛。\n\n### 长白海峡\n\n位于南北大陆中间的，是一道天然的长白海峡。\n\n在泛古陆分裂之前，长白海峡是一条跨度巨大的入海河，和龙宫外围的护城河相连。大陆分裂之后，这条河成为割裂大陆的海峡，最深处的河床达百米。\n\n由于西侧箭洋水位略低于东侧的静谧之海，海峡内水流快、落差大，双向通航速度存在较大差异。\n\n### 南努尔洲\n\n如果不看山脉，南努尔洲是一个巨大的平原。但科里克山脉不仅从南到北贯穿南努尔洲，本身更是笔直高耸，将南平原一分为二。山脉海拔平均6000米以上，常年封冻，得称"叹息之墙"。\n\n同时，山脉还蕴藏着全球已探明的最大矿脉，是南方的矿产命脉。\n\n## 气候\n\n努洲南北纬度跨度巨大，气候差异悬殊。\n\n最北部的安蒂罗斯山区属于寒带，冬季漫长酷寒，暴雪封山。兽人在这里的生存方式以狩猎采集为主，环境恶劣但自成体系。\n北部的平原带气候温和，四季分明，适合大规模农业，是牙里加帝国的人口与粮食中心。\n\n中部平原包括南北低纬度地区，位于赤道附近，受暖流影响，气候湿润炎热。这里没有四季，只有无尽的夏天和暴雨，魔化种植被生长疯狂。倘若不定期清理，平原很容易变成森林，再变成丛林。\n\n南部的科里克山脉地带则因海拔较高而气温偏低，山地气候多变。大陆最南端向温带过渡，沿海地区受暖流影响较为宜人。\n\n## 沿海地区\n\n努洲的海岸线在四大洲中最长，也最具战略意义。\n\n北努尔洲西侧濒临箭洋，是努洲与乌洲之间的海上通道，为前往乌洲的商路提供了天然加速通道。南努尔洲西侧则面向广袤的泛大洋，是跨洋贸易航线的重要节点。\n长白海峡作为努洲南北之间的内海通道，不仅是全球贸易的咽喉，更是在东出后直连静谧之海。\n\n由于海洋断层现象，努洲周边的浅海区资源丰富，浅海渔场与海底矿藏是沿海文明的重要补给。但努洲东部受风暴墙影响，南端接近南极岛方向，海况凶险、风暴频繁，是远洋航线的危险段。'}]},{id:'岛屿区块',title:'岛屿区块',content:'四大洲之外，帕拉里斯的海洋中还散布着众多岛屿。其中六个区块因其规模、位置或历史意义，被单独列为地理单元，与四大陆并称。',children:[{id:'罗格蒂兰群岛',title:'罗格蒂兰群岛',content:'罗格蒂兰位于星球中央的正上空，是泛古陆分裂后唯一不在地表的版块。\n\n外神冲击战役末期，神母操纵创世之石的能量，将龙族政治文化中枢从泛古陆上整体剥离。剥离后的板块在超位法阵组的作用下持续上升，最终稳定在距海平面约一万五千米的高空。这片浮空大陆的平面投影恰好覆盖了赤道线上泛大洋的中心区域，因此它被后来的文明确定为整颗星球的经纬度原点。\n\n混沌日的尘埃云在它脚下翻滚了五百年，却从未触及它的表面。当龙纪元结束时，罗格蒂兰已经孤独地悬浮了数千年，保存着那场终结之战的全部痕迹。\n\n## 自然环境\n\n罗格蒂兰的基岩是泛古陆中心的原始地壳碎片，被剥离时大致呈不规则的椭圆状，东西最长处约八十五公里，南北最宽处约五十公里，总面积大约相当于一座中型岛屿。\n\n板块被剥离时带走了泛古陆地表以下数百米的完整岩层，因此罗格蒂兰的底部不是平整的切割面，而是一片倒悬的石质穹顶，在龙族文献中称之为"天底"。在天底的岩石褶皱中，超位法阵组的残缺符文至今仍在发出蓝金色的脉冲光。\n\n整个浮岛大致从西南向东北倾斜。西南端最高处超过一万七千米，裸露的基岩在此处拱起形成"天脊"，是罗格蒂兰的至高点；东北端最低处降至一万三千米左右，龙宫的废墟便坐落在这片相对平缓的台地上。倾斜的地势让罗格蒂兰在远处看起来像一块悬浮的巨楔，最高的一侧刺向星辰，最低的一侧微微垂向云海。\n\n由于海拔极高，罗格蒂兰位于云层之上。失去了大气层和云层的遮蔽，这里永远暴露在的日照和星空之下。气温常年维持在零下五十度以下，极端时可达零下八十度。空气稀薄，气压不足海平面的十分之一。\n失温与缺氧是任何试图登上罗格蒂兰的生命面临的两大杀机。这里看不到任何植被，也没有液态水，只有岩石和砂砾。在龙纪元结束后的漫长岁月里，没有任何生物能在这里生存超过数日，这里完全是一片冰冻的生命荒原。\n\n### 文明残留\n\n罗格蒂兰上的文明遗迹可以分为两个层次：龙族留下的和启曙留下的。两者在终局之战中交织在一起，很难完全分开。\n\n### 龙宫废墟\n\n龙宫位于浮岛东北端的台地上，占地约三十平方公里。龙族在龙纪元891年利用创世之石的力量改造了泛古陆中心的水系，让两条人工河从东西两侧的山脉引出，在荒漠中心交汇，龙宫便建在交汇点上。\n当神母将这片土地剥离大陆时，河流的水源被切断，河床在数千年里彻底干涸，只剩下蜿蜒的深沟环绕着废墟。\n\n龙宫的建筑形态与任何后龙纪元的文明建筑完全不同。龙族不用任何拼接材料，他们在创世之石的辅助下，让岩石像植物一样按照预设的形态生长成型。因此龙宫的所有建筑都没有缝隙，也没有粘合痕迹，至今无法被任何种族复制。\n\n龙宫的主殿群涵盖了巨大的殿堂、巍峨的穹顶和错落分布的石塔。由于没有拼接结构，建筑内部尺度远超任何后世的承重限制。主殿的穹顶跨度近百米，没有一根支柱，据推测是龙族议会或龙祖召集诸王的场所，内部空旷到令人恐惧。殿内散落着碎裂的石质器物，其中一些残片上残留着无法解读的龙族文字。\n\n龙宫地面上残留着大量精美的法阵雕刻，大多数已被战火损坏，但其中一部分仍然与超位法阵体系相连，在特定的位置触摸时，会溢出微弱的魔力。\n\n### 决战遗迹\n\n外神冲击战役的最后一战就发生在罗格蒂兰上，战场遗迹从龙宫主殿一直延伸到浮岛中央的天脊。数万年的风化和极寒环境使得大部分有机残留早已化为齑粉，但岩石忠实地保存了那场毁灭的物理痕迹。\n\n龙宫外侧的大片区域被高温熔融，岩石在启曙的光魔法直击下熔化，再凝固形成玻璃状物质。这种龙泪石呈现出深绿色至黑色的光泽，表面布满冷却裂纹。在后纪元，龙泪石成为珍贵的魔法材料，对特定频率的魔力有超常的传导性。\n地面上还嵌着无法辨认来源的金属碎片，扭曲成诡异的角度，在极寒中始终不结霜。这是歼星体的残骸，其合金成分至今仍未被冶金学解析，但可以依靠高位魔法重塑结构制作武器。\n\n浮岛西南端的天脊上是龙祖与神母最终对决的地点，有一道宽数百米的裂口。裂口底部的岩壁上嵌着大量无规则的闪亮微粒，学者推测这是龙祖献祭自身封印神母爆炸时，其肉身与魔力结晶化的残余。\n\n## 超位法阵组\n\n罗格蒂兰浮空的奥秘隐藏在天底的超位法阵组中。这是龙纪元时期最尖端的魔法工程，由龙族在龙宫地下花费数百年建造，以一颗创世之石作为核心能源。\n\n法阵组的完整结构至今无人能解读。龙族在建造龙宫时，将法阵的主体嵌入基岩内部，像神经网络一样贯穿整个板块。浮岛底部的天底上分布着法阵的若干外部节点，呈放射状排列，每一个节点的直径都超过十米，由复杂的符文簇组成。\n\n超位法阵组的核心功能原本有两个：一是锚定板块，将龙宫所在的区域与泛古陆的其余部分在物理上稳定连接，防止火山活动和地震威胁龙宫；二是能量循环，利用创世之石的能量为龙宫的全部设施提供永续魔力，使龙宫不需要任何外部能源，其内部的法阵回路可以在数万年内持续运转。\n\n神母剥离大陆时，利用她窃习的龙族文献启动了一个关键的符文子集，即减重符文组与反重力效应相关的部分。这个子集将板块的有效重量大幅降低，使其可以被神母的力量抬升至空中。\n但她未能完全控制这个过程，龙祖的干扰和随后她的自爆，使得法阵的控制回路被不可逆地摧毁，失去了调节能力。法阵并未随着龙族的灭亡而失效，反而在无人控制的状态下持续运转，将创世之石的能量不断转化为减重效应，让罗格蒂兰永远悬浮在它被固定的高度上。\n\n天翼族在抬升西风浮屿时，正是利用了举风者偶然发现的超位法阵草图，启动了其中的一个外围回路。这个回路与罗格蒂兰的完整法阵组产生远程共鸣，在无形中分流了罗格蒂兰创世之石的一部分能量。'},{id:'艾丽尼亚群岛',title:'艾丽尼亚群岛',content:'艾丽尼亚群岛位于泛大洋东南侧的内海域，是精灵族的发源地。\n群岛由五块岛屿组成，从天空俯瞰，它们像一片被海水托起的叶片，中央的主岛是叶柄，四块卫星岛如叶脉般向四周舒展。\n\n## 五岛格局\n\n### 母树岛\n\n中央大岛名为母树岛，是群岛的核心，面积第二。岛屿中央矗立着母树，高达千米，树冠直径数公里，根系深入海底岩层，将五块岛屿的基岩连为一体。\n母树岛地势由中央向四周缓降，母树脚下的台地是精灵最初的聚居地。这里是精灵的政治与信仰中心，也是《母树岛条约》划定的绝对禁区。\n\n母树岛中心分布着活木建成的青衫城，作为精灵的政治首都。\n\n### 繁生岛\n\n母树西侧的岛屿是繁生岛，面积最大，地势平坦，土壤肥沃。这些土壤是母树根系在数千年间从海底搬运上来的沉积物，异常肥沃。\n\n繁生岛是群岛的农业与人口中心，岛上遍布精灵的聚落与农田，孕母休养林等生育支持设施也设于此岛。\n\n### 林语岛\n\n西南侧的林语岛地势起伏明显，覆盖着茂密的原始森林。母树的一条主要根系从岛下穿过，导致岛上植物普遍魔化，形成了独特的共鸣生态。古树大多成了精，拥有简单的自我意识。\n\n环境使林语岛成为精灵的学术中心，活木书院坐落于此，丰富的魔力环境同样适合医疗与隐居。\n\n### 海藤岛\n\n北方的海藤岛是群岛中距离母树根系最远的岛屿，植被相对稀疏，是精灵渔业与海洋资源开发的中心，也是唯一的对外贸易特区。主要出售医疗物资，并购入金属、魔力水晶等。\n\n### 潮汐花园\n\n东南方向的潮汐花园是一座微型岛屿，面积小、地势低，每日潮汐涨落会让岛屿边缘交替淹没与暴露。潮汐花园是精灵的精神修养圣地，岛上培育着随潮汐生长的特殊植物群落。\n\n## 气候与生态\n\n艾丽尼亚群岛地处中低纬度内海，气候温暖湿润，全年温差小。母树的存在深刻影响群岛的微气候，树冠蒸腾作用持续向大气释放水汽，使母树岛上空常年笼罩着一层薄云，降水规律而充沛。\n\n群岛的魔力环境非常独特。母树根系从海底抽取溶解的原质，经树干输送到枝叶，再散逸到空气中。越靠近母树，空气中的游离魔力浓度越高。\n这一魔力梯度塑造了群岛的生态：母树岛上的植被几乎全部是魔化种，而海藤岛的植物魔化程度明显较低。'},{id:'斯图尔特群岛',title:'斯图尔特群岛',content:'斯图尔特群岛位于北极圈内，处于乌洲与博洲的交界带。这片区域是外神冲击战役中的直接波及区，大陆架像饼干一样被震碎，变成了如今散落的岛礁。\n群岛的名字源自中古时期一位在风暴中迷失方向的乌洲船长"斯图尔特"，他无意间发现了这片群岛，成为有记载以来第一个穿越此地并活着返回的人。\n\n## 自然环境\n\n斯图尔特群岛由数百个大小不一的岛屿组成，大多是破碎的小岛和冰山，面积狭小，且缺乏淡水。\n\n岛上的植被以耐盐耐风的低矮灌木和苔藓为主，无法支撑大规模定居。接近极点的岛屿更是植物绝迹，只有极端魔化种幸存。\n群岛周围的海区资源贫瘠，低温抑制了浮游生物的稳定繁衍，渔获稀少。斯图尔特群岛因此在漫长的历史中几乎无人问津，只有海鸟、海兽和偶尔避风的船只在此停留。\n\n在北极点最大的岛屿上，矗立着一尊火山，山脚下是北极两仪眼温泉。失去创世之石的辅助后，火山逐渐不再喷发，但地底的熔岩仍然炽热，维持着温泉的温度。\n火山岛周围，温度从外围的-50℃骤升至30℃甚至更高。湿气撞上极寒空气，在岛屿外围形成一堵厚达几公里的雾墙。内部湿热难耐，长满了反常的、高达数十米的巨型蕨类植物，生有大量珍惜魔物，如同穿越回了远古时代。\n\n## 科考站点\n\n虽然非常贫瘠，但斯图尔特群岛的魔法价值是断档的高。除了火山岛内的已灭绝物种，极地的严寒环境更是催生了一批顶级魔物，巨型披毛犀、极地剑齿豹、冬之心苔藓…它们为市场提供最高端的炼金材料。\n\n白鲸港是由冒险者公会建立的季节性据点，每年仅在夏季开放。随着第一场暴风雪降临，所有人员必须坐最后一班破冰船撤离，否则必死无疑。\n\n## 通航价值\n\n斯图尔特群岛是博洲与乌洲之间唯一的天然锚地，在泛大洋隔绝各大洲的前提下，对东西交通来说，斯图尔特群岛是不可或缺的中转站。\n\n教会在中古时期西进博洲时，在斯图尔特群岛建立了最初的登陆点。此后，群岛长期被教会与博洲西海岸的势力交替控制，其价值从未消失，也从未真正被开发。'},{id:'海神岛',title:'海神岛',content:'海神岛位于静谧之海中央，是海族与陆地文明之间唯一的正式接触点。\n\n在混沌日时，破碎的大陆边缘被深海漩涡吸向中心，最终在海面上像泡沫一样聚集、碰撞、融合，形成了这片支离破碎的岛屿。其主体由千疮百孔的火山岩和珊瑚礁构成，地表崎岖难行，但地下却发育着复杂的溶洞与暗河网络。在海族稳定住海面后，它的位置在数千年间几乎不曾变动，成为一座稳定的大型岛屿。\n\n## 自然环境\n\n海神岛的地势平坦，面积适中。由于地处静谧之海核心区，岛上终年无风，海面如镜，平流雾贴着地面缓慢流动。岛屿受海族圣坛能量的影响，气温恒定而温和，几乎没有季节变化。\n\n没有风力辅助，多数植物难以完成授粉与传播，植被稀疏。但岛屿中央有一片奇异的静息林，这里的树木以缓慢的速度生长，枝叶纹丝不动，整片树林笼罩在一种近乎凝固的静谧之中。\n\n海神岛本身没有丰富的资源，它的价值完全来自其下方的海须圣地。圣地持续抑制海水的波动，维持整片静海的平衡，也像海面释放出大量魔力。'},{id:'南极岛',title:'南极岛',content:'南极岛位于星球南极，直连努尔洲南部，是整颗星球上面积最大的岛屿，以至于常被视为第五块大陆。南极岛被终年不化的冰盖覆盖，是生命与文明最难触及的领域。\n\n## 自然环境\n\n南极岛的气候极端严酷，暴风雪常年不断，气温低至任何常规文明都无法深入探索。岛屿主体被数千米厚的冰盖覆盖，只有在沿岸的少数裸露岩层上才能看到基岩的本貌。极昼与极夜交替，使南极岛的光照条件也处于两个极端。\n\n岛屿表面由无数高达数千米、刃角锋利的冰峰和深陷入地壳的巨型盆地组成。这些盆地就像庞大的摇篮，南极岛因此得名巨人摇篮。\n由于冰层结构高度有序，阳光照射时不会像普通雪地那样漫反射，而是形成透镜效应。在某些特定角度，整座冰山会像巨大的凸透镜一样聚焦阳光，产生足以点燃衣物的高温光斑。\n\n## 生态\n\n南极岛的生态环境贫瘠，冰盖之上几乎没有生命，只有沿岸海域的浮冰下存在少量耐寒的海洋生物。\n\n但得益于四周冰山聚焦的光热，盆地底部的气温能维持在惊人的10°C左右，为生命提供温床。地下水流经矿埋层，被加热并带出大量金属离子，形成五颜六色的矿物热泉。\n植物为了适应这种富金环境，从碳基逐步演变为半金属的生命。树干像青铜一样坚硬，叶片则是薄如蝉翼的金箔，呈现晶莹剔透的冰蓝色，供养着周围的动物。\n\n## 文明痕迹\n\n南极岛居住着雪狐与雪豹兽人，作为向导服务于外来的探险队，换取金属器皿和魔法知识。除此之外，这里还是龙族文明的遗址。\n\n龙纪元1563年，金龙王在南极岛腹地建立南极寝宫，将一颗创世之石存放于此，并在寝宫底部设置了以创世之石为核心的超位法阵组，用以固结整座山体。\n这条山脉因此是南极岛上少数未被完全冰封的区域，其深处埋藏着龙族的遗产与核心魔法技术。与外界的冰冷相反，宫殿内壁全部镀金，无数按照星图排列的长明灯照亮寂静的大殿。一口由整块黄色琥珀魔晶雕刻而成的棺椁中，沉睡着金龙族最后的血脉琉瑾玥。'},{id:'西风浮屿',title:'西风浮屿',content:'西风浮屿曾是一片悬浮于天空的大陆，如今坠成一串漂浮于海面的赤道列岛。\n\n## 坠前\n\n西风浮屿的前身是泛古陆解体时撕裂出的一块板块碎片，最初在泛大洋西部随洋流漂流了约两百年。混沌日时，天翼族举风者利用残缺的超位法阵草图，在板块上刻下了减重符文。\n法阵意外启动，通过远程共鸣分流罗格蒂兰创世之石的能量，将板块抬升至距海面约四千米的高空。西风浮屿由此成为真正的浮空岛，也成为天翼族的家园。\n\n浮屿的表面积约相当于一座大型岛屿，呈不规则板块状。它的独特之处在于双层生态：\n\n- 岛屿表面：常年笼罩在稀薄的高空空气中，气温偏低，紫外线强烈。地表多为浅色岩层与耐寒的苔藓、地衣和匍匐灌木。岛屿中央有一处天镜湖，湖水来自高空凝结的水汽，是浮屿唯一的稳定淡水来源。\n- 岛屿底部：板块内部密布气囊空洞，形成错综复杂的洞穴网络。天翼族主要居住在洞穴中，避风、恒温。洞壁生长的光苔吸收法阵散逸的魔力发出荧光，是天然的照明。\n\n浮屿最珍贵的资源是浮空晶石，一种在能量场中长期浸泡而形成的魔力水晶变种，是维持法阵运转的关键耗材。\n\n在坠落之前，西风浮屿随着高空的西风带缓慢漂移，在泛大洋上空位置不定。它没有固定的坐标，只有天翼族能凭翼感找到回家的路。\n\n## 坠后\n\n浮空晶石的过度开采，以及罗格蒂兰能量分流的不稳定，共同摧毁了这套悬浮系统。坠落后的西风浮屿碎片散布在赤道带上，形成了一串东西走向的岛屿，更名赤道列岛。\n\n赤道列岛连接起博洲与涅洲，生态在地表环境下开始恢复。坠落时带下的浮屿土壤中携带高空植物的种子，在赤道环境中艰难适应，与热带植被混杂生长。列岛周边海域则逐渐被珊瑚与浅海生物占据，让整片群岛的生态焕发生机。\n\n原先的洞穴网络已经被淹没，天翼族不得不迁居地表。他们向精灵购入树种，居住在高大的树屋中，远离地面是他们最后的心理慰藉。'}]}]},{id:'种族信息',title:'种族信息',content:'此文档集记述了各种族的详细定义，此处不展示，详见对应的子文档。\n\n不同于地球，帕拉里斯上的部分物种拥有魔力系统，这为生命进化提供了更多方向，总体上分为魔化种与自然种。\n\n- 魔化种是受原质催化加速进化而成的，依赖魔力系统维生，离开魔力往往代表着无法维持正常生理功能，或者机体水平大幅下降。\n\n- 自然种是自然进化的结果，遵循达尔文的自然选择理论。\n\n魔化种一定会有魔化器官，但并非只有魔化种才能拥有施法能力。生物对魔力的控制主要分两种途径：大脑或#魔化器官#。\n\n- 脑操控： 即通过特定思维方式操控魔力流动，利用脑电信号快速、简便地施法。自然种经过变异也可以拥有施法能力。\n- 魔化器官： 部分魔化种进化出了专门的神经密集区，可能是脑的额外部分，或是位于某些附肢上、器官内。这些神经以特定方式排列，不进行思考，只根据意识要求进行变电施法。\n\n对于简单魔法，生物电还是能驾驭的。但大部分魔法还是依赖法阵，此时所有生物能做的都仅仅是控制原质进入献祭窗与激活激发符文。\n\n区分魔化种与自然种的主要依据是"魔力是否为必需品"。\n自然种离开魔力只会失去强大的力量，而魔化种往往面临生存危机甚至死亡风险。\n但相应的，在魔力充足时，魔化种拥有极强的抗逆性与生命力。在魔力充沛的星球环境下，魔化种无疑更占优势。\n\n因此，魔化种与自然种的界定不是绝对、永恒的。如兽人族属于魔化种，后期却演变至自然种；而作为自然种一大代表的兽族也有部分属于魔化种，化身魔物。\n\n## 魔化种的生理共性\n\n### 如何在体内存储、转运"魔力"？\n\n部分有机高分子会吸附魔力原质。而魔力蛋白正是其中之一。\n\n- 魔力蛋白的合成： 魔化种都拥有一种基因用作合成"魔力蛋白"。\n- 魔力蛋白的性质： 魔力蛋白上有一个特殊的含砷基团，并有两个位点可与含砷基团结合，分别是启动位点和静默位点，对应激活态与惰态。当含砷基团位于启动位点，魔力蛋白的结构正好能吸附魔力原质，成为实现魔力的载携、转移。而空余的位点则与一个磷酸基团结合。\n- 魔力蛋白与魔力反噬： 当魔力蛋白里的含砷基团因特殊原因受到破坏，就有可能释放出有毒物质，例如砒霜的化学式为‌As₂O₃‌，是砷的氧化物，毒性极强；单质砷虽有毒，但毒性通常低于其可溶性化合物）。而许多法阵失效会导致局部紊乱，可能导致有毒副物质生成，即常说的魔法反噬。\n\n### 魔力感官：灵视\n\n魔化种的大脑会持续产生微弱的生物电场，这个电场向外扩散，形成一个球形的感知场。当感知场中的开弦受到闭弦扰动时，这种扰动会通过电场的变化回传到大脑。大脑通过分析回传信号的方向、强度和频率，就能判断周围原质的分布情况，即魔力感官。魔力密集会带来明显的空间压迫感，过于庞大的魔力流则会导致头晕、胸闷等反应，被称作魔力压制。\n因此灵视并不是一种视觉，而是一种直接感知魔力的能力，感知范围和精神力息息相关。\n\n### 魔力系统\n\n魔力系统分为三部分：储魔器官、导流器官、效应器官。\n\n- 储魔器官是用于稳定存放激活态魔力蛋白的区域，如字面意思，存储生物的魔力。\n- 导流器官辅助魔力蛋白在身体里流动，移动到各个组织、器官。\n- 效应器官用于发出生物电，是专门为了激发原质而特化的器官。\n\n尽管各魔化种都拥有不同的快速补魔方式，但原质子的自吸附特性使得所有魔化种都有一个通性：能缓慢地从环境中汲取魔力。',children:[{id:'神话种',title:'神话种',content:'神话种真的是神吗？并不见得。但他们古老、强大，更是几乎灭绝。\n他们是旧时代的主宰，也是当今文明口中的传说，拥有最接近"神"的超然力量。',children:[{id:'龙族',title:'龙族',content:'龙纪元0年，创世之石在雷暴天气发生意料之外的反应，孕育出了世界上最强大的生物龙族。龙祖敖溟与羲渊是水蛇变异而来，这场磅礴的自然魔法让它们蜕变的过于强大，是所有龙族的起源。\n\n## 生理构造\n\n龙族的形态具有现实中东方龙的神韵，这些蜿蜒巨兽的躯体盘踞时如山峦起伏。成年龙族体长通常在50至120米之间，龙祖级别的个体可超过200米。其寿命可达1000至3000年，部分龙王据说能活到五千岁以上，但未经证实。\n\n龙族具有若干特异器官：\n\n- 龙角：龙角多为类珊瑚状，拥有晶莹剔透的质地和温润的触感，长在前额偏上的位置。角的基部嵌入颅骨，与颅腔内的骨髓池直接连通。角的形态随年龄增长而不断分叉，每个枝杈都是独立的魔力出口。\n- 龙翼：龙族的翅膀和血族结构类似，都是骨架翼膜构成。但龙族翅膀上覆有鳞片，具备防护能力，大关节处还有骨刺。翼骨中空，内部填充魔力。\n- 龙尾：龙尾类似蜥蜴，尾径较粗、覆有龙鳞，末端还有一节缥缈的须尾作为装饰性存在。尾须中密布神经末梢，是龙族感知环境魔力波动的重要辅助器官。\n- 龙鳞：龙族几乎全身覆盖有鳞片，坚硬耐磨，颜色由基因决定，各不相同。龙鳞内层含有微晶状的魔力沉积层，在龙族主动充能时鳞片会发出对应颜色的光晕。\n\n- 生殖：龙族采用两性卵生，孵化期长达百年，需要吸收巨量的环境魔力来繁衍。龙族采用卵生，孵化期长达百年，需要吸收巨量的环境魔力来繁衍。龙蛋的外壳是一种与魔力水晶近缘的硅酸盐复合物，在孵化期内持续从环境中吸附原质子注入胚胎。\n\n## 魔力系统\n\n龙族的魔力系统以骨髓和龙角为核心，形成一套完整的闭环，整个身体都能是法阵。\n\n- 龙族的储魔器官是骨髓，结构与普通骨髓截然不同。普通骨髓是造血和脂肪存储组织，龙髓则是多孔网状结构。龙髓蛋白作为一种复杂的魔力蛋白聚合物，含有28个含砷基团和独特的三维交联结构，能在单分子层面同时吸附超过四百个原质子，这使它拥有已知所有生物魔力蛋白中最宽广的定耦合带。\n  龙髓中的造血干细胞在产生血细胞的同时，也会复制龙髓蛋白分子进入血液，龙血同样是一种液态魔力容器。龙族受伤流血时，流出的血液在空气中会发光，正是因为血液释放储存的魔力。\n\n- 从骨髓到效应器官，龙族的导流器官是骨骼内部的一套微管道系统，称作骨脉。骨脉是骨质中天然形成的微米级管道网络，内壁衬有魔力蛋白的变体骨脉蛋白。魔力在骨脉中的流动速度远超精灵的晶络或魅魔的导流器官，从产生施法意图到魔力传达效应器官，间隔不到一次心跳的时间。\n\n- 龙角是龙族的效应器官，也是龙族全身上下最精密的天然法阵。龙角的主体材料是角晶，作为有机与无机杂化晶体，角晶的化学性质稳定，物理硬度超高，对魔力的通透性优于任何已知的纯无机晶体。\n  角枝内部有一条从基部贯通至末端的角脉，这是骨脉的延续，进入龙角后分叉进入每一根角枝。在角枝末端，角脉形成一个微型的天然激发符文。\n  额外的，龙鳞也同样是效应器官。龙族全身的鳞片都是优质魔力导体，血液中的魔力会经由鳞片到达体外。虽然量不及龙角，但胜在灵活，可以让龙族用几乎任何部位输出魔力施法。\n\n---\n\n## 化人形\n\n化人形是本世界观中最重要的超位魔法之一，涉及一套高维空间操作的复杂过程，其原理在外神冲击战役后已经失传于世间。\n\n### 为何化人形\n\n这是一个非常重要的问题，答案也很简单：省空间。\n\n一头成年龙族的体型相当于一座小型城堡，数百头龙族要共同居住在一座城市中，其所需的物理空间将大到无法想象。按照龙族的本体尺寸来计算，容纳龙族日常生活的城市将需要跨过大陆板块的尺度，任何基于材料的建筑都无法支撑如此庞大的结构。\n\n因此，当龙族开始建造淮都时，化人形是龙族创造出的最经济、最优雅的解决方案。他们很欣赏人类的身体结构，只要将躯体折叠进人类大小的身形中，龙族便可以像人类一样在正常的城市中生活。\n\n### 化形原理\n\n化人形魔法需要一连串超位法阵组配合，来完成肉体重构、意识转移等步骤，其法阵面积能达数百平方米。具体法阵构造已经无从考证，但其本质可以借助弦宇宙体系来表述，具体分为三个阶段：\n\n- 剥离：将自身构成的所有开弦端点从三维空间中解除固定，开弦本身保持完整，只是端点不再附着于弦盒。\n- 折叠：在端点被剥离后，龙族的身体处于奇异的游离态。龙族在这一阶段维持着对身体的高度精神力控制，将游离态的身体沿第四维坐标折叠。\n  之所以称作折叠，是因为躯体并不是真正意义上的重构。多余器官的开弦会通过缠绕、交叉连在一起，再将需要保留的部分拼接。从三维视角来看，那些组织已经消失，完全感知不到。但本质上，他们仍然连接在身体上不会丢失，只是存在于三维所见不到的四维空间。当然，在龙族主观看来，他们还是在重构躯体。\n  这一步是整个化形过程中最困难的部分。龙族必须精确控制重构的尺度，否则会导致化形后人形过大，或器官缺失。同时，折叠过程中要谨慎变动所有器官的位置关系，否则化形之后内脏会纠缠在一起。\n- 固化：折叠完成后，游离态的开弦端点重新固定回三维空间。此时在三维观测者看来，龙族已经从数十米长的蜿蜒巨兽变成了一米多高的人形生物。\n\n### 化人形态的特征\n\n化人形后的龙族在外观上接近人类，但保留了若干无法掩盖的龙族特征：\n\n- 龙角：龙角是化人形后最明显的特征，方便操控魔力。经过微缩后的龙角仍然具有魔力效应能力，只是输出功率大大降低。\n- 瞳孔：龙族的瞳孔在化人形后保留了龙形的竖梭状结构，虹膜颜色与龙形时的鳞色一致。\n- 局部鳞片：通常在脖颈侧、小臂与手腕外侧、胫骨前、盆骨周围会保留小片的龙鳞。这其实是龙族刻意保留的身份象征，保留的数量和部位因人而异。\n- 龙翼：龙族的翅膀会缩小到一米至两米，位于除了大小外的结构完全不变。连接位置很特殊，在后腰的脊柱两侧，从视觉上来说是最完美的位置。\n- 尾须：龙族的尾巴在化人形后不会消失，只是缩小后长在尾椎骨处，鳞片延伸攀上脊柱。\n\n### 化人形的代价\n\n首先，化人形后龙族无法使用全威力的魔法，任何需要调动全身龙髓储量的魔法都只能在龙形下释放。\n\n其次，缩小后的龙翼比例不足以支撑飞行。人形龙族如果从高处坠落，只能依靠减重魔法来缓冲，无法真正飞行。\n\n更重要的是，化人形的龙族通常更容易受伤。当然，这也只是相对的，其防御力仍高于其它种族，但远不及龙形状态。\n\n最后，化人形和恢复龙形都需要消耗大量魔力。恢复龙形是一个比化人形更危险的过程，如果展开过程中精神不够集中，可能造成器官移位甚至内出血。从人形恢复龙形后通常会经历数日虚脱状态且极其饥饿，需要大量进食和高浓度魔力补充。\n\n所以，龙族通常不会很频繁地切换形态，大多维持人形在安全的淮都内居住。\n\n### 化人形的文化影响\n\n在龙族社会中，化人形不仅是一项实用技术，也逐渐承载了文化含义。\n\n人类固然弱小，但这并不意味着他们排斥人形。在淮都的全盛时期，龙族在日常生活中绝大多数时间都保持人形，龙形只在外出飞行、战斗、长途迁徙或仪式场合才恢复。\n\n值得注意的是，龙族的繁衍在人形会有所不同。龙形态时，龙是没有性器的，筑蛋和受精都由魔力交换直接完成。而人形的龙族拥有人类的性器，其性器甚至自带变温功能，可以完成体内受精。\n不过人形的龙族无法生育，因此也不存在遗精、月经等生理现象，人形龙族的交合纯粹出于情趣和感官需求。\n\n## 身体素材的珍贵用途\n\n龙族死亡后，龙角、龙骨和龙鳞是不会腐烂的。化学惰性使它们能在地质时间尺度上保持完好，龙纪元至今已经过去数千万年，但散落在世界各地的古代龙躯碎片依然晶莹剔透。\n\n对于后世文明而言，龙的身体是最高级别的魔法材料。不仅可以用作魔力容器的核心，也能作为法阵基盘，制作武器，或在炼金术中作为万能催化剂提高魔力亲和。\n\n但龙族绝对不允许自己的角落入任何外族手中，因此安葬处都隐蔽且安全。在龙族看来，龙角是龙族遗体的最高尊严，不应沦为器具或商品。在龙族内部，死者的龙角会被研磨成粉末，撒入龙族选定的一片森林或海洋中，释放回自然中。但神龙战役留下的龙族尸体却没能被妥善处置，成为外族的魔法材料。'},{id:'启曙',title:'启曙',content:'启曙是什么？天外来客？传说中的神圣光辉天使？在世界还处于蒙昧时降临，为了击败奴役万族的龙王而自我牺牲，化作了现在滋养世界的魔力尘埃？\n\n早在星际尺度的远古时期，所谓"神母"就已经诞生。它是一块微型创世之石的变异体，这也带来了碾压性的力量。\n但这颗创世之石的能量密度又很低，几乎没什么储量，导致神母终生都在为填充自身核心而奔波。凭借本能地探索，神母不断寻找魔力源吞噬以延续生命、壮大种族，并发现了分裂繁殖的方法。启曙的起源也注定了它们是一种高度进化、以吞噬魔力为生的星际蝗虫，而它们的星际飞船就是躯体本身。\n\n在吞噬了无数星系的能量后，神母侦测到了帕拉里斯散发出的高能信号。它认为这是一次晋升的绝佳契机，便率领大军压境。\n\n## 生理构造\n\n启曙本体没有碳基生物的特征，它们的真实面貌是一个巨大的悬浮眼球，通过视觉获取信息。它们的眼球上有六个瞳孔，可以全向获取视野。\n周围环绕着即像光环又像羽翼的可变结构，这些羽翼数量从1对到12对不等，除了在有大气的星球上使用气动飞翔，没有任何实际功能意义，是神母为了标识其对应的能级而附加的。\n\n同样的，启曙也没有任何碳基生物的生理需求，严格来说也不属于硅基生命，因为它们没有细胞结构，只需要魔力，可以称为魔基生命。\n\n### 特殊脑\n\n启曙的脑是一个复杂的晶体球，脑内没有任何神经元，是无数光子在镜面中折射起到思考作用。而神经网则由晶体簇替代，本质上类似于光导纤维，通过大量逻辑门运算构建起一个生物意识，通过光折射到全身来传递信号。\n\n所以启曙的本质更像是一台超级计算机。\n\n### 分裂生殖\n\n神母是创世之石，每一只神子同样是创世之石。但其实创世之石并非不可再生，不然启曙族也无法壮大。神母只需要将自身核心分裂部分出去，就可以构建新的启曙个体。\n分裂前，神母需要大量魔力进行准备。消耗巨量魔力仅能创造一个共生硅原子，其中大部分能量都是为了创建12对共用电子对。\n\n而这种特殊构成，让启曙的繁殖变得非常困难。\n母体固然可以将自身分裂，切割出一部分能量，构建新的个体。但这个过程会导致母体能级减半，因此是在资源极端丰富时才能进行的，需要长时间积累。所以神母费尽心思，在宇宙里游荡千百万年，吞噬各星球的能量，也才形成不到四位数的启曙种族。\n\n分裂出的个体自我意识淡薄，与神母一起形成一个蜂巢思维体系。\n\n## 魔力系统\n\n启曙的魔力系统和常规生物不同，因为严格来说它们根本就不属于生物范畴，但也可以使用三项分类法：\n\n- 储魔器官即启曙的核心，也就是创世之石。虽然大部分时候它们可以小到肉眼不可见，但储量不可估量。\n- 启曙体内的晶体簇同样承担了魔力运输的作用，是启曙的导流器官。\n- 启曙内部的光导纤维便是效应器官，每种子类都有特化的功能器官，但基本是依赖瞳孔作为魔法出口。\n  由于启曙们没有成型的魔法体系，也没必要用复杂的法阵增幅自己原有的力量。所以启曙能使用的功能和它们的功能器官绑定，非常单一。哪怕魔力再多，非战斗种类的战斗力也为零。\n\n## 子类图鉴\n\n启曙的翼数直接绑定了它们的能力，也对应了魔力储量和核心大小。启曙本身没有名字，但帕拉里斯种族给每种启曙都分配了名称。\n\n- 1至2翼（天使）：负责侦查与自杀式袭击，虽然魔力储量相对其它种族非常庞大，但也仅能通信和自爆。它们的光脑仅维持基础指令，几乎没有自我保存逻辑，被神母发散到宇宙各个方向寻找目标，通过瞳孔向区域队长发送光波进行通信。\n- 4至6翼（天使长）：具备独立作战的小队指挥官，负责管理一个区域的侦查启曙，将信息回传给神子。其瞳孔本身也是一个大功率激光发射器，高温和强光能分解几乎所有物质。\n\n- 8翼（裁决者）：神母设计裁决者时考虑的是彗星、小型天体的威胁，后来变成针对高威胁单体的猎杀者。通过将光子密集附着在羽翼上，它可以形成等离子切割场。同时，它还具有喷射高能物质流以加速的能力。它是所有启曙中最坚固、最擅长近战格斗的型号，反而比其它高翼启曙更加危险。\n\n- 9翼（大天使长）：它拥有24个瞳孔，全部能量用于编辑并发送光子，制造覆盖整个战场的全息光幻象伪装。这不仅能篡改启曙身份，也可以用作战术武器，几乎所有大型活动都有它的参与。\n\n- 10翼（审判官）：体内拥有微型核聚变腔，与魔力相辅相成下能迅速爆发出核弹的威力。但代价是没有大脑，甚至没有机动能力。它诞生的意义便是作为移动的战略炮台，由九翼掩护、八翼护航，进行毁灭性打击。\n\n- 11翼（神子/辜翼）：一共只有两只，和神母的结构相当，但能级减半。它们可以代替神母进行区域指挥，负责将信息统筹给神母。同时，神母为了防止自己分裂时遭遇危机，分裂出神子后，所有的繁衍工作便由神子代行。\n- 12翼（神母/涂翼）：神母没有任何特化器官，但这也让它有了精细控制魔力并布置法阵的能力，才能在帕拉里斯留下罗格蒂兰的奇观。它大多数时候是作为魔力仓储，给军队补充能量。'}]},{id:'海族',title:'海族',content:'远古纪元，在理论上不可能产生生命的万米深海，海族却经过长远的进化，成功立足在这片生命荒漠里。\n\n海族并不单纯地指一个种族，就像魔族一样，是对海洋魔化种的总称。作为纯粹的魔化种，海族的力量难以想象地强大，极端个体甚至能影响到一小片海域的生态。\n\n此处仅列举部分海族。',children:[{id:'噬海者',title:'噬海者',content:'在十万米深海床附近，高温热泉、高压环境与自然魔法共同催化了一种特殊的嵌合体生命形式。噬海者便是深海极端环境下的惊人产物，在远古纪元末期就已出现。\n\n其核心生物质是一种"水基凝胶骨架"，由特殊的"多糖-蛋白复合物"构成，含水量超过97%，但通过特殊魔力蛋白的交联作用获得了惊人的结构强度。\n这种凝胶骨架能像活体组织一样生长、修复，且密度略低于海水，使食海兽能够在水层中悬浮。\n\n噬海者处于海洋食物链的绝对顶端，但并非活跃捕食者，甚至不是智慧生物，只是一种大型滤食生物。\n\n## 生理构造\n\n噬海者体长500至800米（记录最大个体达1400米），高度100至300米。其外观呈鲸形，但更为扁平狭长，如同一片移动的山脊。除了头部巨大的口，身体极速缩小，后半段变窄，整体呈类似沙漏的不规则体型。\n\n### 水基凝胶外皮\n\n噬海者的皮肤通体呈青蓝至深蓝色，皮肤表面有半透明的凝胶质感，由三层结构构成：\n\n| 层次 | 名称          |  厚度  | 成分与功能                                                                                 |\n| :----- | :-------------- | :-------: | :------------------------------------------------------------------------------------------- |\n| 外层 | 水膜层        |  2-5米  | 动态水凝胶，密度可调，用于缓冲冲击、吸收声呐探测。水流可在外层表面形成层流，减少运动阻力。 |\n| 中层 | 凝胶骨架层    | 10-30米 | 魔力蛋白交联的多糖凝胶，提供主要结构强度。内含无数微小腔室，用于储存浮力气体和魔力。       |\n| 内层 | 肌肉-神经丛层 | 5-15米 | 由径向和环向肌肉纤维构成，控制体形变化和嘴部微小运动，使皮肤可以脉动。                     |\n\n### 消化系统\n\n噬海者的消化系统占据了最大的体积，可以说它完全由皮肤和消化道组成：\n\n- 口腔：永久大张、无法闭合，从正面看就是一个巨大的黑洞。口腔内壁布满数百万根纤毛触须（长度1-5米），持续摆动产生向内的水流，将面前的一切事物送进口中。\n- 食道：进入口腔后，内壁不断收窄，变成宽达数十米的肌性管道。内壁有螺旋排列的研磨脊，由硅质骨针构成，用于粉碎硬壳猎物。\n- 前胃：巨大的化学消化腔，分泌强酸性消化液，同时释放魔力蛋白分解酶。\n- 后胃：共生发酵腔，栖息着数百种专性共生微生物，负责分解纤维素、几丁质等难以消化的有机物。\n- 肠道：盘区折叠在尾部，长达数公里，表面积通过绒毛状突起极大扩展。\n\n### 浮力调节系统\n\n噬海者的凝胶骨架内分布着大量气腺囊，可分泌或重吸收特定气体（主要是氮气和微量甲烷），精确控制浮力。这使得噬海者可以在海面至数万米深度的范围内垂直迁移，而无需消耗大量能量。\n同时，噬海者独特的构造也让它无惧水压威胁，本身就是伪流体构成的它能在大多数海洋环境生存。\n\n## 魔力系统\n\n噬海者拥有所有非智慧生物中最庞大的魔力系统，已经形成一个小型的生态聚落：\n\n- 凝胶骨架本身即为储魔器官，魔力蛋白均匀分布在凝胶的交联网络中，使整个身体皮肤成为一个巨大的生物魔力容器。据估算，一头噬海者的储魔量相当于一座中型城市的魔力水晶矿藏。\n- 凝胶骨架中的液体通道网络作为导流器官，与循环系统并联，调用魔力参与生物化学。\n- 纤毛与肠道是噬海者的效应器官，经过特化各自负责固定的功能。每根触须末端都有激发细胞，可感应释放高强度电场脉冲，麻痹或杀死猎物。而肠道内壁细胞相当于一个献祭法阵，源源不断地将摄入的生物质转化为魔力，供给给其它部位。\n\n## 生命周期与生态意义\n\n噬海者并不算严谨意义的生物，虽然它拥有细胞结构，但所有的生命活动依靠激素传递、调控，并无大脑或复杂神经网。\n其寿命理论无限，却并没有繁殖功能。现已知的噬海者个体不到四位数，几乎都存在了千万年，承担重要的生态意义。\n这也意味着，如果要捕猎噬海者，这种不可再生资源是非常珍贵的，其本身也不是珍贵炼金材料。\n\n噬海者大多数时间在深水层缓慢漂移，时速不超3公里，张开巨口持续过滤海水，每天过滤的水量可达数百立方公里。它完全不挑食，浮游生物、鱼群，甚至误入其口中的小型鲸类，都会被吞噬。\n吞噬后，噬海者能带来巨量的魔力，并且多数逸散到体外参与海水循环，是一个重要的魔力产生器。因此对于许多海洋生物来说，噬海者是一个移动的自助餐厅，噬海者表皮和周围常聚集着复杂的生物群落，既向噬海者索取魔力，又会自发地保护噬海者。\n\n因为无智慧，所以噬海者对海洋种族基本无害，除了那些不幸撞进它口中的生物。它的一切吞噬都是被动的滤食行为，不会主动追击，即使受到攻击也没有痛觉、没有反应。但攻击往往会激怒寄生噬海者的海洋生物，或是依赖噬海者获取魔力的物种，这些生物会为了保护自己的魔力源攻击伤害噬海者的东西。\n\n噬海者每3-5年会进行一次垂直迁徙，从深海上升到浅海，最终半浮出海面，持续数周后再返回深海。'},{id:'利维坦',title:'利维坦',content:'利维坦的直系祖先是深海巨型鳗形鱼，一种在高压、低温、低光环境中演化出的伏击捕食者。在魔力的催化下，这一谱系突破了体型上限，最终登上海洋食物链的顶层掠食者位置。\n\n## 生理构造\n\n利维坦的外观类蛇，头部略宽大，长有狰狞的长獠牙。其皮肤透明，能看见身体内部构造。沿身体两侧分布着数排可控发光细胞，用于种内通讯和诱捕猎物，在深海中就像一条灯带。尾部有类似桨叶的结构，肌肉发达，是主要的推进器官。\n\n利维坦的视力基本退化，只能捕捉明显的发光，无法看清具体场景。但它的魔力感官非常强大，在无障碍的海底，感知范围接近数十千米，能迅速定位周围的魔化种。\n然而缺点也很明显，利维坦就像一个固定范围的定频雷达，只能观测到附近的魔力物质。如果远离利维坦，或者不携带魔力，在弱光情况下会完全消失在利维坦的感知网里。\n\n为了支撑自己百米长的蛇形躯体，它进化出了众多的适应器官：\n\n- 魔化线粒体：这是一种融合了魔力蛋白的线粒体变体，内部有近似法阵的生物大分子结构，可以直接利用魔力产生ATP。它的转换效率是常规有氧代谢的3倍以上，这使得利维坦能以低食物摄入量维持巨大体型的消耗。\n\n- 分布式循环系统：利维坦没有心脏，沿脊柱分布着12个串联搏动器官，每个负责其所在体节的血液循环。这使得血液无需从头部泵到尾尖，大大降低了心脏负荷，提高其运动效能。此外，利维坦的血液中含有高携氧蛋白（体积更大的血红蛋白，甜甜圈状，携氧能力是普通血红蛋白的数倍），通过皮肤从海水中获取氧气，即使在低氧深海中也能高效供氧。\n\n-  液态骨骼与抗压结构：利维坦的轴向支撑结构是液压骨骼，一系列充满高压液体的封闭腔室，由高强度胶原蛋白壁分隔。这种结构在深海高压环境下反而更加稳定，比硬骨更轻、更灵活。肌肉沿液压骨骼呈螺旋排列，收缩时产生的扭力驱动身体前进。但这也导致利维坦无法进入浅海，否则会爆体而亡。\n\n但高消耗仍然存在，这使得利维坦以伏击为主，追踪为辅。它们常会在海底峡谷或热泉口附近潜伏，或者盘成一个发光球诱敌。而利维坦最喜欢的便是噬海者，十分愿意跟随噬海者获取魔力并保护它们。\n\n利维坦为卵胎生，妊娠期约5年，每胎仅1条幼体。幼体出生时长约8-12米，会在浅海区域生长50-80年后，随着体型逐渐增长而进入深海，而后再也无法抵达浅海，寿命约800年。\n\n## 魔力系统\n\n利维坦的魔力系统非常精简，主要用于维生与狩猎：\n\n- 储魔器官是位于颅腔后部的魔力髓质，由特化的胶质细胞构成，储存高浓度魔力蛋白。\n- 导流器官沿脊柱的神经管分布，与神经系统高度整合。\n- 效应器官是口腔内的电激细胞，可在咬合时释放高压电脉冲，瞬间麻痹大型猎物，也能破坏多数运行的法阵。而它自身的皮肤表层绝缘，电流不会干扰到自己。'},{id:'海须',title:'海须',content:'在远古纪元末期，四颗创世之石中的一颗沉入深海海床，其散发的魔力与深海热泉的极端环境相互作用，孕育出了一片细菌群落。这些细菌在魔力作用下形成共生体，逐渐发展出细胞分化、组织分工，最终在数百万年的演化中形成了多细胞智慧生物海须。海须是帕拉里斯上最古老的高智慧种族，比人类、魔族、兽人都要早数个纪元，远在陆地文明诞生之前便已征服海底世界。\n\n## 生理构造\n\n海须的主体呈椭圆形或梨形，类似章鱼但更为厚重。其体长5至15米，拥有8条主触手，长可达体长的2-3倍。触手腹面密布吸盘，每个吸盘都独立受控，可执行精细操作。\n\n- 头部、主体：大脑分三叶，分别负责逻辑、记忆、魔力控制，所有主要器官都无硬质骨骼，由静水压骨架支撑。\n- 触手：每根触手内有一条独立的神经索，可独立行动。触手肌肉分为纵向、横向、螺旋三层，可实现任意方向的弯曲、扭转、伸缩。\n- 吸盘：直径5至30厘米不等，雄性大小不均、排列混乱，雌性则相对整齐。每个吸盘都含有化学感受器和压力感受器，相当于一个微型感觉器官。\n- 外套膜：包裹主体的肌肉层，通过收缩喷射水流提供推进力。\n- 鳃腔：位于主体两侧，内有三对羽状鳃。海水通过外套膜吸入，经鳃腔排出，完成气体交换。\n\n- 皮肤：海须的皮肤布满色素细胞（黑、紫、蓝、红、金五色）和反光细胞，通过神经控制色素细胞的扩张与收缩，海须可以迅速完成全身颜色和图案的变化。这种拟态能力既能伪装保护自己，也可用于种内通讯和情绪表达。\n\n海须是雌雄同体，但需要异体受精。繁殖时，两只海须缠绕触手，交换装有精子的触手囊。受精卵在雌性（暂时性角色）的外套膜内孵化。每次产卵100至500颗，但只有不到十颗能存活到成年。\n\n海须的视力出乎意料的很好，并且拥有强大的灵视，让它们对环境拥有很强的勘测力。\n\n## 魔力系统\n\n海须拥有最古老、最精密的魔力系统，它们灵活的身体让其成为最优质的法师之一：\n\n- 主体内的魔力腔体是其储魔器官。这是一个由特殊生物膜包裹的腔室，内部储存着高浓度魔力蛋白液，可以储存相当于自身体重20%的大量魔力（以能量当量计）。\n- 导流器官是触手内的魔力导管，它们与神经索并行，将魔力从主体输送到触手末端。\n- 效应器官是触手末端的激发簇，这些特化的激发细胞可以像手指一样精细地控制原质激发，成片的细胞本身就能起到小型法阵的作用。'}]},{id:'人种',title:'人种',content:'人种包括人类和矮人，灵长类动物。两者基本相似，但不完全相同。',children:[{id:'人族',title:'人族',content:'远古纪元时，原始智人便在演化下出现。但一直到龙纪元2043年，人类都处于其它强大物种的压制之下。\n幸运的是，人类依靠强大的繁衍能力挺到了新生纪元，开始登上世界舞台。\n\n而在混沌日，部分人类的基因突变让他们有了挑战魔化种的资格，但也仅称得上是挑战。\n\n## 魔力系统\n\n人类始祖并不具备使用原质直接增幅机体的能力，因为他们的智慧已经足以供其苟活。因此，人类并不属于魔化种，仅仅是由于突变获得精神增强，从而可以操纵魔力。\n\n精神增强源于混沌日：部分人类的基因与魔化种发生了微妙的剪切重组，大脑前额叶皮层得到高度特化，能产生更加强大的生物电，拥有了对原质的操控力。\n脱离混沌日后，这种变异在新生纪元便很少再出现，所以大多数魔法师都是家族遗传。人类当中的普通人占比大于90% ，法师实际上是非常稀有的职业。但在庞大的人口基数影响下，法师的数量并不算少。\n\n- 人类体内并没有独立的储魔器官，这与多数能施法的种族大相径庭——他们无法存储魔力。\n\n- 同样的，导流器官也不是人类的必需品，人类没有任何导流器官存在。\n- 变异后的脑是人类的效应器官。大脑皮层高度发达，且与意识紧密关联，能通过后天学习将抽象的思维过程转化成规律的电信号。所以人类施法的底层逻辑是"关联"，因为他们做不到精密操控每一颗神经元，施法其实是"身体 思维"的半自动流程。\n\n由于不同人类的大脑发育程度不同，对魔力的操控力也不同。人们将操控魔力的能力称作精神力，依此评判法师实力。\n\n精神力不是一成不变的，通常随着年龄增长而提升，身体发育成熟后固定。这种成长方式和天赋直接挂钩。\n另一种后天成长的方法，被称作冥想。通过在脑内推演魔力流动，或者机械性地重复法阵构筑，可以形成肌肉记忆，提高思维的规律性，改善身体关联意识与生物电的能力。\n\n### 施法细则\n\n对于人类来说，魔力只能通过法阵转化为具体效应，并且往往依赖环境魔力浓度或魔力水晶。\n因为对于绝大多数普通人来说，像魔化种一样凭空用魔力构筑法阵完全不可能，而法阵则稳定且便于连接水晶。\n\n纯粹通过意识关联还是太过困难，因此人类还会通过咒语（吟唱）与手势辅助施法。本质上还是将特定象征与魔法关联，从而降低身体的翻译难度。\n\n人类拥有的唯一优势便是：理论上掌握全系魔法。对比于娜迦之类的魔化种来说，无疑是有些进步的。但面对魔族，人类便没有任何优势了。\n\n所以人类的血液里没有魔力。这也是为什么血族不喜欢人类，它们一点都不好吃。\n\n### 势力起源关联：邪教的诞生\n\n人类如何变强，一直是一个头疼的问题。\n在新生纪元前期，就已经有人发现，通过施加一些危险的诅咒魔法，或是利用某种奇异的材料（后被称作"畸变之石"），有小概率改造身体，强化精神力，甚至让普通人觉醒。\n但这种办法伴随着巨大的风险，人们更有可能因此得到的是病变、残疾、死亡。但邪修可以跳过冥想与天赋的鸿沟，也因此不断有飞蛾扑火。\n\n这种邪修的方法得到推广后，一开始只有勇敢者用自己做实验。但后来，有人想要总结出稳定、可靠的规律，便开始捕捉无辜者进行人体实验。\n于是，规模扩大后，邪修法遭到全人类反对以及禁止，面临围捕绞杀，这批偏执的人也被称作邪教徒——因为他们坚定地认为有成功的一天，深信不疑。\n后来邪教徒自称"血肉教派"，并以淡化生死为精神荣誉。\n\n在科学发展后，证明了所谓"畸变之石"其实是放射性物质，邪修本质上是在利用基因突变进行赌博。\n尽管知识文化的普及程度日渐提高，但不乏有愚蠢之徒还在加入血肉教派，继续做无用功。'},{id:'矮人族',title:'矮人族',content:'混沌日时，出现了人类演化树上的分歧者，#矮人#。\n\n## 生理构造\n\n矮人的成年身高稳定在1.4米以下，也因此得名矮人。不过矮人并非侏儒，无论男女矮人皆体格敦实，肌肉、骨骼密度极高，体魄比人类更强大。\n\n虽然是个头小，但矮人的基础代谢率是人类的1.5倍，抗毒性极强。并且矮人的大脑与额叶更加发达，这赋予了他们天生的<u>工程学与数学直觉</u>。\n\n## 魔力系统\n\n矮人和人类一样，没有魔力系统。但矮人比人类更可怜，矮人族鲜有变异发生，这导致矮人中出现法师的概率更低。\n\n其余构造与人类全部相同。'}]},{id:'魔族',title:'魔族',content:'在新生纪元以前，魔族概念还很含糊、宽泛，包含了许多魔物在内。但随着血族与魅族的发扬，"魔族"逐渐专指那些拥有**高级智慧的魔化种**。\n\n魔族中较为强大的基本为类人种，基于人类进化而来。其余魔族则各有千秋，但子种族数量屈指可数，没有魔物这么多样。\n',children:[{id:'血族',title:'血族',content:'混沌日，古魔族仍在涅克洛玛洲肆虐，一部分生活在那的人类，在自然魔法诱导下与蝙蝠结合发生变异，成为了血族。\n不同于变成怪物的劣等种，这支血脉保留了人类的狡黠与社会性，同时获得了魔族的魔力亲和，拥有了稳定的肉身和更高等的魔力系统结构。\n\n## 生理构造\n\n作为诞生在混沌日期间的物种，长期不见光的血族进一步表达了来自蝙蝠的基因，变得趋暗弱光。\n\n- 这使他们拥有惨白的皮肤，并和精灵一样长着尖耳。\n- 拥有可变圆、变竖的瞬膜，鲜红虹膜和白色瞳孔，具备出众的夜视能力。\n- 口腔内有四颗尖而长的牙，唾液腺进化出了能分泌麻痹毒素的功能。\n- 肩胛骨处长出蝠翼，大小仅次于天翼族，拥有短程飞行能力，但缺乏特异化机体，无法长途飞行。\n\n此时血族已经可以合成魔力蛋白，并利用魔力蛋白参与能量供给。\n\n## 魔力系统\n\n进入新生纪元后，随着尘埃逐渐散去，面对从未有过的阳光，紫外线威胁让血族不得不进化出完备的魔力系统以抵御阳光：\n\n- 血族的储魔器官位于心脏旁侧，即胸腔右侧，一颗新生器官"魔力核心"出现。魔力核心由三苯魔力蛋白构成，这是一种特殊的魔力蛋白，能固化形成硬质结构，并拥有12个含砷基团。在神经调控下，会释放原质与附近的惰态魔力蛋白结合，实现魔力存取。\n- 血族的导流器官即血管：由动脉包围着魔力核心，参与体循环，将魔力送到全身，再分化到各级毛细血管。因此血族的血液通常含大量魔力，可以直接作药剂使用，被称作"源血"。（所以在血族文化中，互啃代表亲密、信任）\n- 血族的皮下组织中含有一层突触层，这是他们的效应器官，直接连接到脊柱。突触层专门用于传递高强度电信号，进行魔力控制。\n\n### 生理特性\n\n这种强大的魔力系统带来了若干特性：\n\n- 为了抵御阳光，血族会自发性的**消耗魔力给表皮降温并直接提供ATP与基础元素加速自我修复**，以抵消阳光的伤害。这是一种类似于心跳的生理反射，无法被主动操控，会自发进行。它导致血族的皮肤常年冰冰凉凉的，且始终有微量的魔力消耗\n- 由于魔力网络遍布全身，血族的愈合能力强大。被动愈合速度是其他生物的数倍，在主动干涉下，能消耗魔力以肉眼可见的速度恢复伤势，消耗视伤势而定。\n- 血族的效应器官遍布全身表皮，所以血族仅需要动动手脚就能施法，不存在施法弱点。\n\n但代价就是血族的魔力消耗量大、速度快，需要频繁地补充。\n\n#### 血族的厌阳机制\n\n血族讨厌阳光是由身及心的，因为灼伤会带来疼痛，导致血族都会有排斥强日光的心理。\n但血族仍是恒温动物，离不开热与能量。血族并不讨厌火光、灯光，仅仅是对于紫外线的不耐受使他们讨厌日光。在魔力充足时，日光对血族的影响完全可以忽略不计，血族甚至可以像人类一样肆无忌惮地晒日光浴。\n\n## 补魔方式\n\n相比于自己生产魔力，血族更能通过吸食血液大量快速地掠夺其它生物的魔力。血液由口腔进入食道后，会在向胃移动的过程中快速脱去魔力蛋白，流进魔力核心。\n\n而血液则进入胃，在融血腺体分泌的融血酶作用下被分解成营养物质，并产生少量魔力。\n\n因此血族又称吸血鬼。\n\n（所以实际上血族啃树皮也能补魔，因为植物汁液通常也含有魔力蛋白，但是真的很难吃也很慢！）'},{id:'魅族',title:'魅族',content:'继血族诞生之后，类人种魅族很快也出现。同样是人类变异而来，但魅魔吸收了大量生物的基因片段，最终以翅膀、尾巴、魔角交媾，诞生了一种以欲望和爱液为食的奇异生物。她们是魔族中最美丽动人、最不像怪物的一支，却也是最致命的诱捕者，更广为人知的名字是魅魔。\n\n## 生理构造\n\n魅魔多数拥有相当符合乃至超越当前主流审美观的诱人体态，从骨骼比例到肌肉线条都散发着原始的吸引力。皮肤大多呈现健康的粉白或浅淡的薰衣草色，触感温润如玉。\n同时，魅魔一定具备**角、翅、尾、淫纹、体香**五大特征：\n\n- 魔角形态各异，多为深色，可能带有纹理。\n- 翅膀比较特殊，魅魔的翅膀是不到一臂长的小肉翅，定位上仅作装饰作用，主要用于情趣，不具备生理意义功能。\n- 尾巴灵活而细长，末端大多呈桃心状，能像第五肢体一样做出精密缠绕动作，是魅魔的**第二性器**。\n- 每只魅魔的淫纹形状都不一样，位置也不一样，可能在胸口、小腹、大腿。\n- 体香是独一无二的，不同魅魔的体香都不同。\n\n## 魔力系统\n\n和血族类似，魅魔也通过掠夺其它生物的魔力补充自身，但更加"温和"。角、尾是魔力系统的主力。\n\n- 角是魅魔的储魔器官，由复杂的有机聚合物组成，硬度比骨质略高，连接在颅骨上。角内主要结构是复杂的神经网和三苯魔力蛋白，这是一种特殊的魔力蛋白，能固化形成硬质结构，并拥有12个含砷基团。在神经调控下，会释放原质与附近的惰态魔力蛋白结合，实现魔力存取。角的硬度和存储特性让它同时也成为优秀的炼金材料。 （好残忍T^）\n- 尾是魅魔的效应器官，神经高度密集，可以进行魔力调控。\n- 魅魔拥有独立存在的导流器官，这是一条连接角与尾的**魔力通道**，藏于脊柱内部。主道会分支出若干支道缠绕着主动脉、静脉入体，但仅连接生殖、消化系统。\n\n单独转运让魅魔的魔力流动更加安全、高效，但尾部施法较为显眼，是主要弱点之一。\n\n### 性爱补魔与相关特异化\n\n#### 榨取\n\n魅魔通过性行为榨取目标体液，从体液中提取魔力补充自身。为了达到目的，魅魔会使用催情腺体辅助榨取。\n催情腺体遍布位于魅魔体内，可以合成催情酶，在口腔、生殖腔等部位分泌催情粘液。\n\n催情酶是一种蛋白酶神经毒素，作用于内分泌系统、神经系统。\n\n- 催情酶进入生物体内后，会催化、加速魔力蛋白向生殖系统的转运，从而让目标的性分泌液（精液、前列腺液）带有大量魔力蛋白，在释放过程中流失魔力。\n- 不同于大多数催情素，催情酶会**降低敏感度**，**提高高潮阈值**，并不断刺激大脑**产生性欲**。这能大幅延长性交过程，榨取更多魔力。\n\n综合来看，催情酶会让目标持续地发情，产生强烈交配欲望，一定程度上覆盖理智，并在每一次体液释放中损失大量魔力蛋白。\n魅魔自身的免疫系统包含抗体，免疫催情酶，但并不能免疫催情素。同样的，催情酶虽然效果显著，但不像多数化学催情素一样效力强大，有一定概率被特殊个体免疫。\n\n#### 吸收\n\n魅魔的生殖腔内壁会迅速且高效地主动转运魔力蛋白，汇入魔力系统中。\n同时，为了进一步提高榨取效率，魅魔的食道、肠道同样具备这种能力，这让魅魔可以同时榨取三个目标。（说人话就是玩4P）\n\n#### 性交特化措施\n\n为了适配这套生存模式，魅魔的身体衍生出若干特性：\n\n- 敏感：魅魔的性敏感度更高，甚至有一定的性瘾。这是一种生理奖励机制，让多数魅魔不光是为了生存，还是为了获取快感而性交，主观上更愿意去性交榨取魔力。同时，魅魔的角、翅、尾作为神经密集区也高度敏感。相应的，魅魔更加怕痛、怕痒。\n- 多口性交：为了在孕期也能性交，魅魔的肛肠、口腔更加有弹性，且没有异物感，会产生略次于生殖腔的性快感。同时，魅魔不会有不应期，能一直高潮到目标被榨干。（作者真的很执着于让魅魔玩4P）\n- 乳孔快感：魅魔的乳腺里交杂了大量性神经，不仅揉捏会产生快感，乳孔插入也能产生和阴道同级的快感。\n- 淫纹：当魅魔获得快感，会不自主释放相应强度的魔力流过淫纹。淫纹的结构是一个天然法阵，平时不显形，但会随着魔力流过而发光发热，并使魅魔的肌肉收紧、感度提升。这使得魅魔有更加剧烈的高潮反应，既作为奖励机制的一部分，也能给目标带来征服感、成就感，放大目标性欲。\n- 心形瞳孔：魅魔的视网膜上有一层瞬膜，但作用是在强烈兴奋时收缩成的心形，无实际生理意义，仅用于提供性交反馈。\n- 排泄：魅魔**不能脱离常规饮食**，仍需获取食物补充元素、能量。但魅魔的排泄物呈现胶状，具有一定粘性。这种果冻质的排泄方式能有效防止肠道残留，维持通畅以用于性交。（美少女是不会上厕所的！）\n- 体香：除了合成催情酶，魅魔还会合成醇类物质，挥发形成体香。\n\n---\n\n## 剪切受精与遗传\n\n相对于收集雌性的爱液，吸引雄性、被雄性灌注体液显然更加容易。所以魅魔多以雄性生物为目标，种族中**只有雌性**。这产生了若干问题：\n\n- 为了稳定遗传雌性后代，魅魔的性染色体是固定的XX组合，需要有能力剔除Y染色体。\n- 为了保证多样性，魅魔又不能全保留复制，需要有能力引入不同性状。\n\n因此，作为有性生殖的胎生哺乳动物，魅魔的卵细胞是在有丝分裂的基础上，通过"染色体剪切"来实现繁殖的。\n\n### 剪切受精\n\n魅魔的卵细胞由卵原细胞直接有丝分裂形成，无需经过减数分裂再重新受精，每颗卵细胞被复制出来就约等于一颗受精卵。这保证了XX性染色体组的稳定。\n在与精子结合之前，卵细胞不会开始分裂、分化。当精子进入卵细胞后，独有的DNA替换酶会发挥作用，选择性并随机地将精子上的基因剪切到原染色体上。这一过程就是剪切受精。\n并不是所有染色体组都会被剪切受精，但**控制五大特性（角、翅、尾、淫纹、体香）的基因一定会被剪切**。\n\n在这套繁殖系统下，魅魔的排卵期从周期性变为主动性。也就是说，**魅魔不会有月经**，也不会有意外怀孕，只会在主观愿意的情况下进行生育。\n\n#### 遗传规律\n\n剪切受精使得魅魔的繁殖具有以下特性：\n\n- 魅魔的子代一定是雌性魅魔，除非被哥布林或触手族基因覆写。\n- 魅魔相貌大体随母，但五大特征一定是**独一无二**且与母系不相同的，带有许多**父系特征**。\n- 在类人种内，魅魔几乎没有生殖隔离，并有小概率变异出父系器官。'},{id:'阿特拉西族',title:'阿特拉西族',content:'阿特拉西族诞生于混沌日末期的涅克洛玛洲东部裂谷地带。一群在岩缝洞穴中避难的人类，在数百年的地下生活中与深渊巨蛛发生了跨物种的基因嵌合。这场大规模自然魔法下的基因重组，将他们变成了半人半蛛的直立嵌合体，背后伸展出节肢。\n\n阿特拉西族属于魔族，主流魔族社会对他们的态度暧昧而复杂。他们是所有魔族中外形最不像人类的一支，相对血族和魅族来说非常低调，却也是最不好招惹的那一支。\n\n## 生理构造\n\n阿特拉西族是直立嵌合体，体态修长，成年个体身高在160~185cm之间，但由于甲壳的存在，体重比同等体型的人类重约，寿命约200年，在魔族中属于中等偏短。\n\n阿特拉西的主题是类人形躯干，在膝、肘、指、腕、踝关节处覆盖着一层瓷质甲壳。甲壳质感介于抛光陶瓷与蛋白石之间，坚硬、光滑、带有微弱透光性，通常是骨白色。受损的甲壳会在数周至数月内缓慢再生，过程与指甲的生长类似。\n\n阿特拉西拥有四只眼睛，两只主眼在正常位置，形态接近人类的杏眼，虹膜大多是红色。两只副眼位于太阳穴处，较小，呈圆形，只有基础的光感能力，主要用于感知快速移动的物体和光暗变化。副眼的视觉分辨率远不如主眼，但反应速度更快，这让阿特拉西拥有异常的空间警觉。\n\n阿特拉西的上下颌各有一对可伸缩的小型螯肢，平时收纳在口腔侧壁的鞘状结构里，只在捕食或自卫时弹出。螯肢长约1~2cm，尖锐中空，连接着位于下颌两侧的毒腺，有高麻痹作用。\n\n其最显著的特征是从脊柱两侧衍生出的折叠式节肢，数量为4~8条，因个体而异。节肢的基部嵌入脊柱两侧的特化骨槽中，这些骨槽由胸椎的横突扩张形成，提供了牢固的锚定点。\n节肢共三节：基节粗壮，外覆与躯干相同的瓷质甲壳，负责承受力量；中节细长且灵活；末节尖锐，是节肢最精密的部位。完全展开时，每条节肢最大可达两米长，取决于个体体型。\n折叠状态下，节肢收拢于背部，三节紧密叠合，甲壳面拼合成一个几乎无缝的整体，外人很难辨认出其中隐藏着数条肢体。\n\n节肢的末节是整条节肢神经最密集的部位，拥有独立的触觉和精细操控能力。阿特拉西可以同时用所有节肢执行不同的任务，相当于最多拥有十条手臂，这种多线程操作能力在已知智慧种族中是独一无二的。\n\n## 魔力系统\n\n阿特拉西的魔力系统与背部节肢深度耦合。\n\n- 阿特拉西的储魔器官是位于背部的背甲腺，一对嵌入脊柱两侧骨槽深处的大型腺体，恰好位于节肢基部的后方。背甲腺的结构是一种多孔海绵状组织，内部充满角质魔力蛋白。甲壳蛋白在腺体中形成微小的纤维网络，每根纤维的表面都能吸附原质子。\n\n- 背甲腺通过腺脉与节肢壳相连，这是他们的导流器官。腺脉是一套分布于节肢内层的微管道网络，魔力在微孔中流动，速度偏慢但极其稳定。\n- 节肢的末节尖端便是阿特拉西的效应器官。每一条节肢的末端都有一个微小的甲壳开口，内部是一个天然形成的激发腔，呈锥形，内壁由魔力蛋白纤维的精密排列构成。\n  节肢的天然施法能力使阿特拉西尤其擅长虚空施法。四条以上的节肢可以同时在空中刻画魔力路径，效率远超双手施法者。\n\n### 蛛丝与魔力传导\n\n阿特拉西最独特的能力是纺丝。\n\n位于脊柱骨槽深处的丝腺与节肢基部通过专用微管道连接，能分泌一种液态蛋白。分泌出的液态蛋白被输送到节肢末节的纺器中，纺器位于节肢末节尖端旁边的一个小开口处，能将液态蛋白拉伸固化成丝。蛛丝的成分并不普通，是魔力蛋白的变体丝晶蛋白，兼具的抗拉强度和魔力传导性，还可以受分泌液调控具有粘性。丝晶蛋白中硅基团的排列方向在固化时自动对齐，形成天然的各向异性魔力传导结构。\n\n这意味着阿特拉西的蛛丝是一种天然的魔力导线。用蛛丝编织的魔力路径不仅传导效率更高，还能在柔性状态下保持稳定的传导性能，这是任何金属导线都无法做到的。\n\n蛛丝也可以被阿特拉西回收。吞入消化系统后，丝晶蛋白被分解为氨基酸和硅基分子，重新进入丝腺的合成循环。但如果落入外族手中，蛛丝离开阿特拉西身体后依然保持稳定，可以保存数十年，是优秀的魔法材料。\n\n## 繁殖与遗传\n\n阿特拉西是两性繁殖，卵胎生。受精卵在母体内孵化，孕期约八个月，每次产下1~2个新生儿。\n\n新生儿的甲壳柔软如皮革，在生命最初几个月逐渐硬化成完整的瓷质甲壳。幼年阶段约持续八到十年，此后进入青春期，节肢会经历两次蜕换，节肢从柔软的芽体发育为硬化节肢。\n\n阿特拉西的性器官与染色体系统与人类类似，额外有三个染色体组。女性个体通常比男性略小，但节肢的装配数多在6~8条，丝腺也更发达。男性个体的甲壳更厚更重，螯肢稍长，毒液分泌量更大。'}]},{id:'哥布林族',title:'哥布林族',content:'哥布林族或许在混沌日期间已经出现，但更多地被认为是新生纪元的产物。唯一肯定的是，他们在所有智慧种族中出现最晚，很可能是极端环境下发生退化性变异的矮人穴居者。\n\n随着哥布林迅速扩散，主流社会对哥布林的态度从最初的鄙夷逐渐转为警惕，又转为夹杂着恐惧的厌恶。但也掩盖不了他们是这颗星球上适应力最强、最难以根除的智慧生物的事实。\n矮人主流社会至今坚持哥布林与他们毫无关系，但比对显示，哥布语中表示"洞穴""水""火"的几个核心词汇与矮人古语有着不容否认的同源性。\n而哥布林自己则从未怀疑过那个传说的真实性，哥布林萨满会对部落的幼崽讲述同一个故事：很久很久以前，他们曾是地下的主宰，被一群背叛者夺走了家园。\n\n## 生理构造\n\n哥布林是小型直立类人生物，成年个体身高在100-135cm之间，体重18-30kg，在已知智慧种族中体型最小。偏向穴居的他们自然有众多适应地底环境的性征：\n\n- 短寿：哥布林的平均寿命约30~50年，同样是所有智慧种族中最短的。\n\n- 佝偻：脊椎呈轻微的C形弯曲，能在狭窄的岩缝和地道中自如穿行。\n- 肢体过长：体态瘦小的同时，哥布林四肢纤细，手指和脚趾异长。\n- 夜视：哥布林的眼睛大而圆，虹膜为暗金色或琥珀色，瞳孔在暗光中能几乎填满整个虹膜。哥布林因此拥有优秀的夜间视觉，但代价是白天视力较差且在强光下会感到不适。\n- 无毛：哥布林没有任何部位存在体毛，绿肤藻让毛囊无法正常发育。\n- 怪力：哥布林的身材看似瘦弱，但肌肉密度高，拥有与体型不成比例的力量。肌肉纤维以快缩肌为主，赋予他们爆发性的速度和弹跳力，但耐力较差，很容易力竭。\n- 食腐能力：肠道缩短，胃酸浓度升高，能消化半腐烂的肉类而不生病。\n- 尖耳：非常长的尖耳，比精灵和魔族的更长，且有密集的活动肌。\n\n要论哥布林最显著的外貌特征，那还得是绿色皮肤，这源自寄生在真皮层中的一种共生光合藻类绿肤藻。\n\n绿肤藻是一种单细胞魔化藻类，含有类似高等植物叶绿体的光合色素，但吸收光谱比叶绿体更宽，能利用地下环境中微弱的生物荧光和地热辐射进行光合作用。绿肤藻在真皮层中形成密集的网状菌落，通过哥布林的毛细血管获取水分和矿物质，同时将光合产物直接释放到血液中。\n在食物充足的条件下，这种共生关系为哥布林提供大量额外能量，意味着哥布林比同等体型的其他生物更能忍受饥荒，生命力更加顽强。\n\n绿肤藻的密度因个体而异，也因环境而异。生活在潮湿阴暗环境中的哥布林皮肤呈鲜艳的苔绿色，藻类密度最高；生活在干燥环境中的哥布林皮肤偏灰绿色，藻类密度较低。这种表型同样具有可塑性，同一只哥布林在迁移到潮湿环境数月后皮肤会变得更绿。\n\n绿肤藻也给哥布林带来了一个弱点，对干旱环境敏感。在干燥环境中，绿肤藻会大量死亡，导致皮肤表层剥落、剧烈瘙痒和能量供应下降，脱水超过三天就可能致命。哥布林因此本能地回避干燥环境，他们的定居点总是在水源附近，并在沙漠和戈壁绝迹。\n\n一些哥布林由于变异拥有异于常人的体型，通常身高接近两米，肌肉壮硕。这些哥布林被称作大哥布林，是哥布林的中坚战力。\n\n### 语言与智力\n\n哥布林的智力被主流社会严重低估。他们虽然不会建造城市、不会冶炼金属、不会书写文字，但这不代表他们愚蠢。\n\n哥布林的智力是高度**实用导向**的。他们拥有出色的空间记忆能力，能在复杂的洞穴网络中精准地记住每一处水源和食物储藏点。他们擅长模仿和学习，能粗糙地模仿魔导器和蒸汽机械的使用。他们拥有卓越的团队协作能力，不同角色的哥布林会在没有语言沟通的情况下默契配合。\n\n哥布林使用的语言被称作哥布语，是一种由喉音、嘶嘶声和短促音节组成的声音系统。语法简单，没有时态变化，词汇量不超过几百个。\n但哥布语真正的信息载体不是声音，而是在发声同时做出的**耳廓动作**，称作耳廓语。哥布林灵活的耳朵可以做出数十种不同的姿态，每一种姿态都为同一段声音赋予了不同的语境含义（威胁、示弱、欺骗、呼唤、警告）。\n主流种族很少能注意到这一点，因此在他们的印象中，哥布林的语言不过是"野兽般的嘶叫"，但哥布林依靠彼此观察却能满足复杂交流需求。\n\n哥布林也能学习通用语，但仅限于几百个常用词汇和简单句。他们无法理解更抽象的词汇及概念，所有学习都围绕具体的需求展开：食物、武器、威胁、逃跑。\n\n### 演化真相\n\n尽管未被文明所探查清楚，但哥布林确实起源于矮人。\n\n混沌日快结束时，一群穴居矮人意外被困在封闭的地下洞穴系统中，与地表完全隔绝。\n洞穴中存在几条低品位的魔力水晶矿脉，在远古纪元便催生出了一个独特的地下生态系统，以魔化菌类与光合藻类为基础。\n\n最初的几代人还能维持矮人的特征，但洞穴中没有金属矿藏、没有阳光、没有可耕种的土地。冶炼技艺因缺乏材料而逐渐失传，魔力感知因环境魔力浓度太低而慢慢钝化，唯一充足的是洞穴壁上生长的厚厚菌毯和小型的盲鱼。前者成为他们的主食，后者成为偶尔的蛋白质补充。\n\n绿肤藻的共生关系正是在这一时期建立的。长期以菌毯为食的穴居矮人，肠道中寄居的绿肤藻通过某种粘膜破损的偶然机会进入了血液循环，并最终在真皮层中定殖。\n这场意外的共生为穴居矮人提供了额外的能量来源，大大提高了他们在食物匮乏环境中的生存率。但从寄主的角度来看，这开启了矮人向哥布林的退化之路。\n\n数代之后，基因层面的变化开始显现。长期近亲繁殖配合洞穴的低剂量魔力辐射，诱导了多项不可逆的基因突变：体型缩小、毛发脱落……\n\n低魔力环境更是让魔化器官的维护成本高于收益，魔力相关基因在自然选择中被迅速淘汰。当这群完全变异的生物终于找到通往地表的出口时，他们已经不再是矮人，语言也退化为一套简单的喉系统。他们早已失去和矮人同源的认同感，在生理和文化意义上都成为一个独立的种族，被所有其他智慧种族视为丑陋的异类。\n\n---\n\n## 魔力系统\n\n哥布林的魔法天赋是所有智慧种族中最弱的，他们甚至不算是魔化种，只是和魔力有微弱关联。\n\n储量方面，绿肤藻能吸附微量环境原质子，但吸附量极少，远不足以支撑主动施法。其身体器官也缺乏相应的运用能力，对魔力完全脱敏。\n\n精神力层面更是灾难，约万分之一的少数哥布林个体才会拥有微弱的魔力操控能力，上限大致相当于人类儿童的水平。这些个体通常在部落中担任萨满角色，能通过简单的介质施法使用最基础的魔法。\n\n这一缺陷深刻塑造了哥布林对魔法的态度，也一定程度上演变成文化。他们渴望拥有其他种族的魔力天赋，这种嫉妒转化为更直接的行为模式：盗窃魔法物品和绑架施法者。\n哥布林部落中常常囤积着抢来的法阵基盘、魔力水晶和符文器具，即使他们中的大多数根本无法使用。哥布林同样对法师抱有更大的敌意，以及强烈的征服欲，事实表明法师往往遭到更暴力的性侵。\n\n---\n\n## 单性遗传详解\n\n一直以来的高死亡率环境淘汰了少生优育策略，让哥布林偏向于多生快长，并且更加极端：**哥布林中没有雌性**，纯粹依靠侵犯外族进行繁殖。\n\n哥布林幼崽生长极快，2-3年即可达到性成熟，此时身高约80-90cm，再经过1-2年达到完全成年体型。\n\n### 基因覆写\n\n哥布林采用两性繁殖，但本身只有雄性，演化出类似触手的寄生性生殖策略。\n\n哥布林雄性产生的生殖细胞携带一种基因覆写酶，这是哥布林独有的DNA修饰酶系统，其为何出现至今仍是未解之谜。\n当哥布林雄性与其他类人种雌性进行生殖行为时，基因覆写酶会在受精过程中发挥作用：精子进入异种卵细胞后，基因覆写酶被激活，将卵细胞核中来自母体的绝大部分遗传信息切除，仅保留启动胚胎发育所必需的印迹基因和线粒体DNA，再将哥布林的遗传信息写入被清空的细胞核中。\n\n简言之，无论母体是什么种族，**后代永远是哥布林**。\n\n在面对魅魔时，哥布林的基因覆写机制更加强大。魅魔的XX锁定遗传和剪切受精机制，面对彻底的全面覆写，明显处于劣势。覆写酶能跳过魅魔卵细胞的染色体编辑流程。\n\n需要强调的是，这不是哥布林主观选择的策略。在哥布林的认知中，这种行为就像进食和呼吸一样自然。他们不认为自己做错了什么，这是他们唯一知道的繁殖方式。'},{id:'魔物',title:'魔物',content:'从星球拥有魔力的那一刻起，就注定了魔化种的存在。\n但并不是所有魔化种都具有高等智慧，现如今几乎所有的智慧魔化种都是由人类基因发育而来。而除开类人种，由那些低等物种进化而来的，被统称为#魔物#。\n\n所以从定义上来看，魔物绝对不是特指单一种族，也并不一定是危险、强大的，即使一只变异的小草也是魔物。\n\n下列子文档介绍了一些经典的常见魔物。',children:[{id:'亚龙族',title:'亚龙族',content:'远古纪元的物种大爆发中，爬行动物在富氧与魔力的双重催化下体型暴涨，演化出类似恐龙的魔化种#亚龙族#，成为当之无愧的霸主。它们是龙族的前身，却与龙族有天壤之别。\n\n## 生理构造\n\n亚龙族是类龙爬行魔物的总称，而非单一物种。它们形态多样，普遍保留爬行动物的鳞甲、四肢与冷血代谢。\n亚龙的体型从数米到数十米不等，远古全盛时期的巨型个体可达百米级别，但进入新生纪元只有少数还能维持巨体。\n\n亚龙与龙族共享一套同源构造，但处处都显得原始：\n\n- 鳞片：覆瓦状鳞甲，是龙鳞的前体。内层仅有薄魔力沉积层，甚至完全没有，因此不像龙鳞那样能在充能时发光，颜色也相对单调。\n- 头冠/骨角：部分亚龙头部生有骨冠、骨棘或角，是龙角的原始雏形，也是其天然的效应器官。材质为普通骨质，远不及龙族的角晶。\n- 翼：少数翼行亚龙拥有骨架翼膜构成的翅膀，是龙翼的雏形，但翼上无鳞、关节无骨刺，飞行能力远逊。\n- 尾：粗壮的蜥尾，无龙族末端的须尾。\n\n亚龙族大致可分三支：\n\n- 陆行亚龙：占据陆地，如暴掠龙、角盾龙、甲尾龙等，是亚龙的主体。\n- 翼行亚龙：占据天空，以翼膜滑翔、俯冲捕食。\n- 水行亚龙：占据水域，水蛇即属此类，是龙族的直系祖先。\n\n只可惜亚龙族是低智慧魔物，仅有掠食者的本能与最基础的狡诈，无语言、无文明、无社会组织，属于#魔物#定义下由低等物种进化而来的典型代表。\n\n## 魔力系统\n\n亚龙的魔力系统可以用"龙族的原始版"一言蔽之，结构粗糙、效率低下，绝大多数个体终其一生都不曾主动施法：\n\n- 亚龙的#储魔器官#是骨髓。亚龙髓蛋白作为一种低效的魔力蛋白变体，仅含8个含砷基团，吸附原质子的能力有限，魔力主要封存在骨骼与骨髓之中。\n- #导流器官#是原始骨脉，即骨骼内部天然形成的空腔与微管道。它没有龙族骨脉那样的蛋白质内衬，传导缓慢、沿途损耗大。\n- #效应器官#是头冠、骨角或背棘。这些骨质结构上的天然激发符文残缺不全，无法像龙角那样精细操控魔力。亚龙的魔力出口主要用于被动强化自身，如骨骼、鳞甲与肌肉爆发力。少数亚龙拥有本能性的喷吐能力，能释放酸液、火焰、毒雾等，构成了高级龙种。\n\n## 性生态与繁殖\n\n亚龙为两性卵生，绝大多数个体雌性大于雄性，这与蛇、蜥蜴等祖先类群一致。更大的雌性既利于产卵，也便于在繁殖期压制雄性。\n\n雄性亚龙的头冠、骨角与背棘普遍比雌性发达。繁殖季到来时，雄性会通过效应器官释放魔力，令头冠与骨棘泛起微弱的角焰或光晕，进行求偶展示。\n亚龙的卵必须吸附环境魔力方能孵化，雄性的魔力越充沛，往往也意味着其栖息的领地越富魔，雌性据此挑选魔力储备更充足的雄性。\n\n与多数爬行动物相同，雄性亚龙拥有一对半阴茎，交配时膨大进入泄殖腔。交配过程中伴随微量的魔力交换，雌性借此进一步确认雄性的魔力储量与健康程度。\n部分大型食肉亚龙保留着祖先的性食同类本能，交配后，雌性有时会反口吞食雄性，作为一种高效的魔力补充。雄性因此在繁殖期保持高度警觉，交配甫一结束便迅速撤离。\n\n亚龙卵的外壳是硅酸盐复合物，但吸附魔力的能力远逊于龙蛋。亚龙必须将卵产在魔力富集处，如热泉边、腐殖堆、低品矿脉附近，借环境魔力孵化。\n绝大多数亚龙产完卵即离开，以数量取胜。少数水行亚龙有简单的护卵本能，会盘踞在卵旁直到孵化。\n\n由于产卵会大量消耗雌性的魔力储备，因此在魔力贫瘠的区域，亚龙不会进入繁殖状态。龙纪元被龙族大量捕食、混沌日食物链崩溃，都曾将亚龙的繁殖压制到濒危边缘。如今它们仅能在魔力充沛的区域维持稳定种群。\n\n## 生态与现状\n\n### 历史地位变迁\n\n亚龙的巨大体型是富氧环境与魔力共同维系的产物，但除了远古纪元成为星球霸主，后续便再没有掀起风浪。\n\n龙纪元时，龙族横扫泛古陆中心，将显眼的亚龙当作主要食物来源。亚龙体型大、骨髓含魔力，是龙族理想的口粮，导致龙族聚居点附近亚龙数量锐减。\n而在混沌日后，尘埃遮蔽导致大气含氧量降低，多数巨型亚龙更是因无法维持代谢而饿死或缩水。食物链崩溃之下，亚龙进一步锐减。但作为魔化种，它们在魔力充沛的区域仍能借魔力补全能量需求，中小型亚龙得以存续至今。它们在富魔地区广布，凡是植被覆盖的复杂地带都能见到。\n\n新生纪元初期，失去主人约束的亚龙曾造成短期的兽潮，用无与伦比的肉体强度继续称霸地区，但种族数量锐减使它们无法再统治整个大陆。\n随着魔法体系和机械的出现，亚龙变得可以对抗。不过亚龙仍然是非常恐怖的掠食者，对于缺乏大规模武装的地区是灾害级别的存在。\n\n#萨拉默托深渊#中遍布的#龙化生物#实际上和亚龙脱不了联系。它们是突变更加随机的亚龙，并融合了其它生物的性状。\n\n### 价值\n\n亚龙是重要的魔物材料来源。鳞甲可制护具，骨骼可作魔力容器与法阵基盘，骨髓可提炼魔力蛋白，毒囊与喷吐器官是炼金原料。龙族当年捕食亚龙，也有一部分原因是看中其骨髓中封存的魔力。\n冒险者公会经常有捕猎亚龙的委托，由于其高难度、高收益，已经被默认为一种资历考核，能捕猎亚龙的小队无疑会获得大量声望。\n\n而亚龙的军用价值同样显赫。无论在海陆空，亚龙不仅有较好的防护，还比多数机械更加灵活。各大国家基本都会驯化亚龙，组建龙骑士军队，作为一支独立的特种力量。'},{id:'史莱姆',title:'史莱姆',content:'史莱姆是最常见、最原始的魔化种之一。其起源可追溯至远古纪元原质初现、真核单细胞生物繁盛的时期。在魔力的催化下，原始粘细菌与藻类群落发生共生聚合，最终演化出这种以凝胶为躯体、以单核为中枢的简单生命形式。具体时间已不可考，但史莱姆无疑是魔化生命演化树上最靠近根部的一支。\n\n史莱姆分布极广，几乎在所有湿润、有魔力的环境都能见到，是魔物食物链最底层的一环。它们滤食腐殖质、苔藓、小型生物与魔化藻类，数量庞大却多数温驯，是冒险者新手期最理想的入门猎物。\n\n## 生理构造\n\n史莱姆的主体是一团半透明的凝胶体，含水量极高，没有骨骼，也没有明显的器官分化。\n构成凝胶体的是一种特化的"质胶细胞"，其细胞膜外包裹着一层由魔力蛋白交联而成的胶质外被，使史莱姆整体呈现果冻般的弹性与流动性。\n史莱姆可以缓慢变形、流动、包裹猎物，但速度迟缓，黏稠度与形态受魔力和水分含量调控。缺水时变得黏稠、行动迟滞，魔力充足时则更流畅。\n\n凝胶体中心藏着一个致密的史莱姆核，这是史莱姆唯一的硬质结构，也是它储魔、神经与效应三位一体的生命核心。核内是凝胶蛋白与简单的神经细胞团，核被摧毁，史莱姆即告死亡。\n仅有一小团神经簇的史莱姆智力低下，仅有趋利避害的本能反射，无强大学习能力，无语言。\n\n随着环境不同，史莱姆也会发生相适应的变化。典型变种有：\n\n- 酸液史莱姆。凝胶体含强酸性消化液，能腐蚀金属与皮甲。\n- 魔晶史莱姆。体内析出微型魔力水晶颗粒，是低阶魔力材料的重要来源。\n- 巨型史莱姆。在魔力充沛区域长期积累魔力的个体，体积可达数米，能包裹整头牲畜。\n\n\n## 魔力系统\n\n史莱姆的魔力系统高度简化，储魔、导流、效应几乎集中于一体：\n\n- 储魔器官是核心。核内的凝胶蛋白吸附原质、储存魔力，储量有限，多数史莱姆不足几十目。\n- 导流器官是自核向外放射的蛋白纤维网。这些纤维贯穿整个凝胶体，将魔力输送到全身。\n- 效应器官既是核心本身，也是体表凝胶。史莱姆没有分化的效应器官，核心直接通过生物电激发原质，实现有限的魔法效应。主要是分泌酸液、黏液，或产生微弱的魔力震动，辅助狩猎与进食。\n\n史莱姆核作为常见的低阶魔力材料，可制作小型魔力容器、入门法阵的储能节点，也是炼金术的基础辅料；凝胶体可提炼为炼金凝胶，用作黏合剂、润滑剂或药剂基质。\n总的来说，史莱姆是一种具备相当实用价值的魔物，甚至可以用作清洁球来去除一些犄角旮旯的污渍。\n\n## 繁殖与生命周期\n\n史莱姆没有性别，采用分裂生殖。核心一分为二，凝胶体随之分裂，两个新个体各自拥有独立核心。分裂需要充足的魔力与水分储备，魔力不足时分裂会推迟。\n\n史莱姆没有明确寿命上限，只要核心完整便可近乎无限地存活。凝胶体受损后可以再生，唯一不可逆的损伤是核心的破坏。\n核心会随魔力与有机物的积累而逐渐长大，达到阈值即触发分裂。在魔力充沛的情况下，史莱姆可以无限增殖。\n\n在分裂之外，史莱姆还保留着一种更接近有性生殖的融合生殖。当个体核心受损、需要互补修复时，两团史莱姆会缓慢地相互靠近、合为一体。两个核心在共用的躯体内交换凝胶蛋白与魔力信息，随后再分裂成多个携带混合性状的新个体。这是史莱姆引入遗传变异、维持多样性的唯一途径。\n\n过程常持续数小时，没有主动与被动之分，也没有痛觉与快感。对史莱姆而言，包裹、渗透、溶解，既是捕食也是生殖。\n但史莱姆常常分不清捕食和繁殖。它们碰到魔力源便会主动包裹上去，尝试溶解魔力源并繁殖，即使这个魔力源是生物。所以史莱姆经常给人以侵犯的错觉，但它们并非有意如此。'}]},{id:'兽人族',title:'兽人族',content:'远古纪元，努尔洲北部的安蒂罗斯山区地形过于复杂，令亚龙难以抵达。本地的兽族（自然种动物）在自然魔法的偶然催化下，发生向人形的高级突变，古兽人族就此诞生。凭借不俗的肉体强度与超越兽族的智慧，他们很快成为当地的顶级掠食者。\n\n兽人族并非单一物种，而是兽族突变后形成的庞大类群的总称。狼、熊、狮、虎、牛、羊、鹿、狐、猫等不同兽种，都各自演化出了对应的兽人支系。\n\n## 生理构造\n\n兽人族是类人直立哺乳动物，在人类形体基础上保留了大量兽族特征：\n\n- 兽耳：位于头顶或头侧，取代人耳、听觉敏锐，是重要的神经密集区。\n- 兽尾：几乎全部兽人都有尾巴，用于平衡与情绪表达，也是躯体施法的主要出口之一。\n- 毛皮：毛发浓密，覆盖部位与颜色因兽种而异，部分兽人身体覆盖大片兽毛，部分只有耳朵和尾巴有体毛。\n- 爪与角：因兽种与食性而异，食肉兽人多为利爪与犬齿，食草兽人多具钝爪或角。\n- 瞳孔：食肉兽人多为竖瞳，食草兽人多为横瞳，与各自的祖先兽类一致。\n- 感官：嗅觉、听觉远超人类，视觉因兽种而异。\n\n兽人族最核心的种族共有特征，是其远胜人类的肉体强度。兽人的肌肉密度、骨骼密度、爆发力与耐力均显著高于人类，这既是他们称霸山区的资本。\n\n兽人生理成年约在15~18岁，普遍早于人类。\n\n## 食性与两派分化\n\n兽人族并不都有魔力系统，其内部最深刻的分野源于食性。\n\n### 自然兽人\n\n混沌日的富魔乱流对一切生物都是威胁，一部分兽人因此演化出疏魔的皮层结构，选择以肉体对抗魔法环境。\n\n绝缘皮层由致密角蛋白与硅酸盐微晶复合而成，位于真皮之下。它的特殊空间结构使原质无法穿透或附着于身体，魔力能量直接作用于其肉体时会被滑开，难以生效。\n这让他们对魔力拥有天然的高抗性，许多需要先输送魔力进入目标体内的高阶魔法都伤害不到他们，例如诅咒、魅惑等。\n需要排除的误区是：魔力抗性不等于魔法抗性。魔法究其根底还是物理攻击，对于已转化成攻击形式的魔力，兽人的绝缘皮层同样无可奈何。\n\n而魔抗的代价是彻底与魔法绝缘，他们无法存储魔力、无法施法，灵视也几乎消失。更麻烦的是，部分治疗魔法也不适用于兽人。\n\n这些自然兽人多为食肉兽人，肉体结构也塑造了他们的生存信仰，是魔洛希派的主体。\n\n### 魔化兽人\n\n另一部分兽人则反其道而行，演化出半魔代谢，选择拥抱魔力来补全生存所需。\n\n这些兽人的代谢系统已经半魔化，能够将环境魔力转化为可直接利用的能量与基础营养素，补全缺乏的营养。这赋予他们强大的环境适应性与耐饥能力，甚至可以长期不进食，仅凭少量水分与魔力维生。\n\n魔化兽人拥有施法能力，但其魔力系统主要参与营养循环，没有精神力特化，非常依赖躯体施法。\n\n魔化兽人主要为食草动物，以及部分弱势食肉动物，是迦米莎派的主体。\n\n## 魔力系统\n\n魔化兽人的魔力系统遍布全身，却缺乏精密结构，是一套典型的本能型系统：\n\n- 其储魔器官是皮下魔脂层。魔化兽人的脂肪组织特化为魔脂，细胞内积累魔脂蛋白，一种含6个含砷基团的魔力蛋白变体。魔力以类似脂肪的能量储备形式，储存在皮下与内脏周围，遍布全身。\n- 导流器官是筋络，即肌肉筋膜与肌腱中的微管道网络，将魔脂层中的魔力输送至全身的神经密集区。\n- 效应器官是神经密集区，如兽耳、兽尾、爪垫、口唇与尾尖。这些区域神经高度密集，能根据意识产生生物电激发原质，完成躯体施法。\n\n在这类结构下，魔化兽人的施法高度本能化，多为近距离、绑定肢体的魔法（爪击附魔、咆哮音波等），难以进行精细的法阵构筑。他们的魔法与肌肉动作绑定，动作越熟练，施法越顺畅。\n\n虽然自然兽人没有施法能力，但他们的毛皮、兽牙、兽爪是常见的贸易材料，适用于制作抗魔护具等，魔化兽人的魔脂则可以提炼为低阶魔力材料。\n安蒂罗斯山区的兽人一直以此与外界进行零星的物物交换，不过由于获取方式血腥，这类制品多来自战利品，鲜有明面交易。\n\n## 繁殖与遗传\n\n兽人族为两性胎生哺乳动物，孕期因兽种而异：小型兽人约3个月，大型兽人约6个月，通常一胎多生。\n\n兽人各兽种之间可以杂交，同科兽人几乎没有生殖隔离，子代的兽种特征遵循混合遗传（如狼兽人与狐兽人结合）。\n兽耳、兽尾、瞳孔等特征的遗传规律复杂，但总体表现为"兽种特征随亲本，强度随机"。\n\n自然兽人与魔化兽人之间同样可以通婚，子代可能随机表达"绝缘皮层"或"半魔代谢"的任一性状。'},{id:'精灵族',title:'精灵族',content:'精灵始祖起源于何时已经无从考证，但据回忆称，精灵始祖是在混沌日时，从母树结出的两颗精灵之果中孵化而来的。\n\n## 生理构造\n\n类人型碳基生物，大多体态修长，耳尖长且向侧后延伸。平均寿命300-600岁，生理成年大约要到20-30岁。成年精灵身高通常在170-195cm之间，体重普偏轻于同体型人类，\n\n精灵具有一定植物性特征：皮肤内含变种光合色素，呈米白色，吸收光谱更宽，在阳光下皮肤会呈现微弱的晶莹感。这些色素位于真皮层特化的光养细胞中，能将光能转化为化学能，同时裂解水分子产生氧自由基，被迅速捕获并转化为抗氧化物质。\n这意味着精灵只需多晒太阳、多喝水即可代替约1/3的日常饮食。长期缺乏光照的精灵会变得虚弱、情绪低落，但不会死亡。\n\n- 耳朵：外耳廓修长且向后上方延伸，耳梢尖细。耳朵区域神经密集，非常敏感。\n- 繁殖：两性繁殖，但受孕率很低，孕期可达两年。每一个新生命的诞生都需要母体从自身剥离一部分肺泡晶核作为"种子晶体"，分走母体大量的魔力储备，因此需要优秀的魔力环境和充足养分。\n- 头发：据统计有半数精灵都是金发，剩下的多是白发，这和能力无关，金发是精灵族中很普遍的基因型，就像人类的黑发一样。\n\n---\n\n## 魔力系统\n\n精灵的魔力系统与呼吸系统深度耦合，这在所有智慧种族中是独一无二的。\n\n- 精灵的储魔器官是散布在肺泡内壁的肺内晶核。这是一种有机与无机结合的杂化晶体，其核心成分是精灵特有的晶胚蛋白。\n  这种纤维状魔力蛋白，拥有14个含硅基团，能够在肺泡上皮细胞表面组装成规则的纳米晶体骨架。硅元素从日常饮食中的植物硅酸盐中摄取，经血液转运至肺部。骨架形成后，晶胚蛋白在肺泡内的高氧环境下持续交联，逐渐形成稳定的晶格结构。因此精灵的魔力储量都具有成长性，会随着时间推移自行上涨，直到成年也不会停止。\n\n- 晶核吸附的魔力不能直接跳进血液，连接晶核与血管的导流器官是晶络，一套比毛细血管更细的魔力传导网络，由晶胚蛋白的变体晶络蛋白构成。晶络会在肺泡上皮细胞与毛细血管内皮细胞之间形成微小的纤维束，每一颗晶核都有数根晶络纤维与之相连，纤维的另一端汇入毛细血管壁。从毛细血管出发，晶络纤维伴随血管网络遍布全身，形成了一个完整的魔力运输系统。\n  晶络还会经常穿插进血液里，让魔力在血管和晶络内均匀分布，减小晶络的承载压力，因此晶络的传导效率也一定程度上受血氧浓度影响。高血氧环境下，晶络蛋白构象舒展，魔力传导速率提升；低血氧环境下，晶络蛋白部分蜷缩，传导受阻。\n\n- 精灵的魔力主要通过手和眼两个部位释放，这也是他们的效应器官。\n\n  - 手掌皮肤下方有密集的晶络末梢，指尖尤为丰富。晶络与神经簇缠绕在一起，让魔力进入手部后直接能受电被调用。\n  - 视网膜后的脉络膜中分布着特殊的灵视神经细胞，这赋予了精灵视觉层面的灵视能力，也被称作光灵视。他们能选择是否开启光灵视，并将魔力流动叠加在正常视野之上，从而直接清晰地看到魔力流。精灵"看到"的魔力流并不是光反射得到的，而是大脑解析灵视器官形成的模拟信号。因此光灵视的范围局限在精灵的魔力感知范围内，和精神力呈正相关。\n    （所以精灵是不会被大量的魔力闪瞎的！）\n\n- 呼吸依赖：有一句笑话是"捂住精灵的嘴他们就哑了火"，然而这却是现实。很多精灵离开呼吸法便失去魔法能力，所以精灵冒险者通常会练习射术，以便远程攻击阻止对手接近自己扰乱呼吸。\n\n皮肤中的光养细胞不仅产生化学能，还与魔力系统存在协同效应，利用光合产生的能量加快魔力吸收。精灵在日照充足的户外，魔力恢复速度是室内的倍数。长期禁闭在黑暗中的精灵不仅缺乏营养，魔力储备也会慢慢枯竭。\n\n所以精灵对自然环境的热爱不仅是一种文化偏好，也是刻在生理结构中的生存需求。\n\n### 施法特性\n\n精灵的魔力储备像一个流动的蓄水池，庞大、稳定但缓慢流淌。\n\n精灵仅有两种效应器官，其中的眼还不具备操控魔力的能力。手虽然拥有高操控精度，但不像外族能直接利用身体本身施法，必须通过构建法阵施法。魔力充沛的精灵也更偏向使用虚空施法。\n\n用流速缓慢的魔力构建法阵相当费时费力，全程不能走神。为了辅助画阵，精灵的施法往往伴随着咏唱。不同于光明教会推崇的咏唱法，精灵的咏唱本质上是为了适应身体特性而控制呼吸。\n精灵的咏唱虽然不能通过潜意识影响意识，但却能在无意识中帮助他们调节呼吸节奏。仔细感受便会发现，音节的长短、停顿、音高，乃至句子的长度，都精确地对应着呼吸与换气的节奏。当节奏正确，魔力流动自然会与施法状态契合，身体会毫无违和感地受到"提示"，知道什么时候改怎么控制魔力流动。\n\n但比较晦涩的是，精灵魔法的咏唱不是咒语，没有文字内容。它的音节源自对自然声音的模仿，各种风声、水声、树叶沙沙声。学习咏唱的过程，本质上是学习如何让呼吸节奏与魔力流动的节奏同步。这种感受难以用语言传授，往往需要数十年言传身教才能精通，让本就复杂的生命魔法传承更加晦涩。\n\n尽管聪敏的外族法师也可以学会生命魔法，甚至由于掌控魔力更加便捷，能比精灵更加快速地施法。但精灵依赖经验积累的施法方式，让它们对魔法的领悟非常深刻，误差往往也更小。并且面对复杂的高位魔法，精灵只需要体会呼吸的感受，便可水到渠成地画出法阵。\n\n除了胜在续航能力、控制精度，最顶尖的精灵法师更是有着无声施法的潜力。他们仅凭呼吸控制就完成施法，被称作默咒。且由于画阵速度缓慢平稳，不太容易被灵视注意到。\n\n但精灵的魔力系统也存在显著局限：\n\n- 爆发力不足：分布式晶络的传导速度慢于集中式导流器官，精灵无法在短时间内倾泻大量魔力，构建法阵也是偏慢的。如果强行大量抽调魔力，不仅会缺氧，还容易导致晶核破裂，被称作魔肺症。快速施法是最被精灵羡慕的天赋。\n- 环境依赖：魔力恢复需要时间和合适的环境，在魔力贫瘠区域，精灵的施法能力会大幅下降。\n- 肺部损伤的致命性：晶核散布在肺泡中，如果肺部遭受严重损伤，如穿刺伤、严重感染，损失的晶核无法再生。大面积肺泡损伤意味着永久的魔力容量下降，这使精灵对呼吸系统的保护意识非常强。\n  反常识的是，魔肺症通常可以治愈。但代价是补充大量魔力，且只能由患者主动康复。拖得时间太久则会导致蛋白坏死硬化，损伤周围细胞，同样会导致无法再生。\n\n---\n\n## 遗传与繁殖\n\n精灵的遗传遵循人类的遗传法则，只不过基因库更庞大。\n\n### 种子晶核\n\n精灵新生儿的晶核不是从零开始生长的。在胎儿发育到约第六个月时，母体必须从自身的肺泡晶核中分离出种子晶核，通过脐带输送到胎儿的肺芽中。\n这个过程需要母体在完全清醒状态下主动执行，是非常精细的操作。母体需要精确地控制每一部分种子晶核的分离程度和输送路径，整个过程持续数小时，伴有剧烈的生理疼痛。\n\n种子晶核一旦离开母体，母体便会损失这部分魔力容量。精灵女性在每次生育后都会经历一段魔力衰退期，通常需要数十年才能通过晶核自然生长恢复到孕前水平。如果操作不得当在肺部留下创伤，甚至可能会永久失去这部分晶核，无法再生。\n\n也因此，每一位精灵的怀孕都是全族的大事，哪怕是世仇也不得针对孕妇，孕妇会得到社会的很大尊重。\n\n### 低受孕率的缘由\n\n精灵女性的生殖系统受魔力储备状态调控，如果晶核总容量低于某个阈值，不足以安全地分离种子晶核，排卵就会被特定激素抑制。\n这是一种演化出的自我保护机制，自然选择淘汰了那些在魔力不足时仍冒险生育的个体，因为她们和胎儿都会在晶核传承过程中死亡。\n\n在魔力环境越好的地方，生育率越高；在贫瘠的外界环境中，生育率会进一步降低。\n\n### 寿命的演化\n\n在每个后代都需要母体付出巨大代价的情况下，精灵不可能大量生育。长寿便确保了即使在极低生育率下，种群仍然能维持正增长。\n可能达几十年的长生育间隔，也意味着每一个孩子都会得到整个社群的全力投入。配合集体抚育传统，精灵虽然少生，但子代的存活率很高。'},{id:'天翼族',title:'天翼族',content:'天翼族诞生于混沌日初期，高空强烈的魔力乱流，使得迁徙中的天鹅与猛禽群落发生了跨物种的基因重组。这些鸟类在自然魔法催化下褪去了兽性，获得了类人形态与智慧，跻身类人魔化种。\n\n## 生理构造\n\n天翼族的生理系统与鸟类保持着更多的相似性。他们在人类形体的基础上背生双翼，翼展3-8米，随魔力强度而增长。\n皮肤呈现无瑕的冷白瓷质感，这是在高空高紫外线环境下演化出的反射角质层。致密的角蛋白微晶能将大部分紫外线反射，同时保留可见光透过以维持维生素D合成。\n\n为了支持飞行，天翼族保有若干生理特化：\n\n- 鹰眼：眼睛拥有高分辨率的远程视觉，能在千米高空分辨地面上的大型物体移动。瞳孔呈竖直梭形，能快速调节进光量以适应从云层到地面的剧烈光线变化。\n- 轻质骨骼：骨骼中空且充盈着流动的魔力，使其身体密度偏低。成年天翼族体重通常在35-55kg之间，远轻于同体型的其他类人种。\n- 气囊组织：除肺部外，天翼族的呼吸系统延伸出多个气囊，嵌入骨骼空腔和皮下组织。这些气囊不仅降低了身体密度，还解决了高空缺氧问题。\n- 双层羽毛：天翼族的翅膀是候鸟形的，翼上覆有洁白的疏水性羽毛，分为两层。外层是坚硬的飞羽，切割气流产生升力；内层是细密的绒羽，填充着惰态魔力，既能保温又能充当魔力储备的缓冲层。\n- 丹红之眼：这是一个位于额头正中的鲜红菱形晶体，与特异功能无关，是天翼族固有的特征。\n\n## 魔力系统\n\n天翼族的魔力系统以翅膀为核心，最精密的施法结构就铺展在数以千计的羽毛之间。\n\n- 天翼族的储魔器官是翼内侧的绒羽层。每一根绒羽的羽小支表面都覆盖着羽晶蛋白，一种与精灵晶胚蛋白同源但在进化路径上分化的魔力蛋白，有10个含硅基团和独特的疏水尾链。单个绒羽的容量微不足道，但翼内侧数以万计的绒羽叠加的总容量相当可观。羽毛会自行吸收周围魔力，天翼族可以有意将羽片张开至最大角度，大幅增加吸附面积，便能完成一次快速充能。\n\n- 每一根飞羽的羽轴内部都有一条细如发丝的羽脉，便是导流器官。羽脉是由羽晶蛋白变体构成的纤维束，沿羽轴从羽根延伸至羽尖。绒羽吸附的魔力通过羽根进入羽脉，沿飞羽向外传导。\n- 效应器官同样位于翅膀，是翼尖处一组特化的**羽簇**。羽毛呈放射状排列，每根羽簇的羽轴内包含高密度神经末梢，直接连接肩胛神经丛，可以说是一撮"会痛的羽毛"。\n  当魔力沿羽脉流至翼尖时，神经信号调控羽簇的舒张与收拢，从而精确控制魔力的释放量、方向和频率。羽簇的形态本身就是一个天然的激发符文，这给了正面翅膀成为法阵的潜力。\n\n整个翼面的飞羽排列都可以受肌肉调控，羽片的间距、角度、叠覆方式，在翼展时形成一个更大尺度的**符文网**，进而构成翼面法阵。\n所以，由于个体翅膀差异，天翼族的魔法都高度个性化。同一个法术，不同天翼族的作用效果可能存在较大差异。\n\n受限于个体翼面形态，复杂魔法很难标准化，所以天翼族还会用翼尖代替手指进行虚空施法。\n\n虽然翅膀带来的魔力掌控性非常强，但也伴随种种劣势：\n\n- 天翼族在高速飞行时难以施法，必须降低自身速度或者静止。\n- 施法同时消耗体能和魔力，连续高强度施法会因翅膀肌肉疲劳而被迫中断，精力必须在施法和飞行之间平衡。\n\n- 翅膀是体积过大的弱点，损伤后不仅剧痛，施法精度也会因此下降。\n\n## 羽毛与传承\n\n天翼族的繁殖为两性胎生，孕期约八个月。新生儿背部的翅芽在出生后数月才开始伸展，绒羽逐渐覆盖，飞羽则要到青春期才完全长成。\n\n在飞羽长成之前，翼面天然法阵尚未成形，羽脉也未发育完全，年轻天翼族无法施法。青春期是天翼族最脆弱的阶段，通常由整个风巢共同保护。\n\n成年后天翼族每年换羽一次，脱落飞羽的羽轴内仍残留少量羽脉纤维，是老一辈天翼族传承魔法的天然介质。天翼族有一种独特的授羽传统，年长者在临近生命终点时，会将最后一套飞羽中最长的一根翼尖羽簇赠予选定的继承者。这根"遗羽"中保存着赠予者一生累积的魔力流动模式，继承者可以通过长时间的研究来阅读这些模式，从而更快速地领悟某些传承已久的魔法。'},{id:'虫族',title:'虫族',content:'龙纪元2043年7月，部分巨虫群落（蚂蚁、蜂类、甲虫等）在混沌日被自然魔法所宠幸，成为一类全新的集群智慧种族虫族。这类针对异种族进行捕食、寄生的大虫具有极端的繁殖扩张本能，并将"性"进化为一种针对异种族的捕食、寄生手段。\n\n严谨区分：虫族和阿拉特西族都有昆虫特征，但前者以"虫"为主导，后者以"类人"为主导。即使是虫母，和阿拉特西也会有明显的外观区别，如更多的虫族器官保留。\n\n## 生理构造\n\n它们是高度社会化的集群生物，拥有碳基生物中最坚硬的外骨骼外壳，普遍类昆虫，但具有更大、更多样的外形。\n\n虫族分化严重，虫形和人形皆有。大体分为三级：\n\n- 下级单位：不具备生殖能力的工虫，但具有生殖器，会无条件侵犯见到的目标，并释放信息素通知其它单位。它们保留着完全的昆虫形态，除体积巨大无过多差异。紧急情况下，会用巨大的身体构成肉体城墙，通过挤压、分泌粘液，甚至把自己定死在硬化剂里，来禁锢目标、保护巢穴和母虫。\n- 上级单位：高度人形化，外形充满魅力，仅在关节处保留虫族甲壳。\n\n  - 雄性卫队：拥有形状狰狞的性器官，全天候发情，会制服并侵犯猎物直到他们失去思考能力，为母虫的产卵做准备。更骇人听闻的是，雄性卫队同样会侵犯雄性目标。\n  - 雌性卫队：以诱惑者的姿态出现，她们会将猎物诱骗回巢穴，用身体将其榨干，成为种马或幼虫的食物。\n- 母虫：唯一具备繁殖能力的虫族，体积大如房屋，像是一个包裹着虫卵的肉块。具有产卵器官，负责对上级单位捕回的雌性产卵。\n\n除此之外，还有一种可以被发射出去的小型寄生体。这些寄生体不具有自主意识，但几乎可以由虫族的任何个体快速制造。它们由简单的反射神经网和肉块聚成，会钻入目标的铠甲缝隙、口鼻、下体、鼻耳穴等一切孔隙，不断刺激敏感点、分泌麻痹液体，直到自身死去。这种寄生体不会自行停止，即使目标瘫痪也会持续工作，通常运作1~3小时，可被用作自慰。\n\n虫族的器官特异化严重：\n\n- 甲壳：带有金属光泽的彩壳，硬度堪比钢铁，能弹开普通刀剑甚至抵御火焰。因此用火对付虫族并不像对付昆虫那样简单。\n\n- 交合针、生殖钩：骨质关节与肉囊混合的生殖器，带有可硬化的绒毛结钩，能够强行锁死交配对象。\n- 输卵刺：虫母拥有可伸缩的管状结构，管侧附有骨刺，能向目标体内注入卵子。\n- 粘液系统：虫族分泌液包含强力费洛蒙，兼具催情剂、硬化剂功能。既能束缚、侵犯目标，也能用于筑巢。\n\n## 魔力系统\n\n虫族不通魔法，魔力对于他们的作用仅限于催化和通信。\n\n- 虫族会将特殊频段的原质（魔力）逸散在空气中，高速流动让它能迅速覆盖整个巢穴，所有单位可以实现近乎无延迟的交流。\n\n- 虫族可以将魔力快速转化成生物制剂，释放如酸液、毒雾、粘液等致命化学战剂。\n\n因此，虫族的魔力系统构造相当简单：\n\n- 虫族的储魔器官位于腹部、胃外侧，利用表面包裹的血管完成身体循环。\n\n- 虫族的导流器官即血管，魔力被血液裹挟，流经各种腺体。\n\n- 腺体即虫族的的效应器官，魔力完全用于腺体的制造。\n\n## 性生态\n\n虫族完全依靠掠夺进行生殖，这让它们无需自己承载孕育职责，也比体外孵化虫卵更加安全。这套高效的生殖机制是虫族得以壮大的资本。\n\n它们偏好捕获拥有魔力天赋的种族，被掠夺的男性会被变为劳工和种马，女性会被变为孵化器。\n为什么需要男性目标？因为虫族无法自己完成受精，只能依靠异族精子。但这也极大程度丰富了虫族基因库，提高其适应性和进化能力。\n\n为了防止苗床因应激反应死亡，虫族会分泌强效迷幻毒素。这种毒素能一定程度地将痛觉信号转化为快感信号，受害者往往在绝望与身体不受控的高潮中沦陷。'},{id:'触手族',title:'触手族',content:'外神冲击战役留下了堆积如山的尸体，这些血肉还没来得及分解，在混沌日的自然魔法轰击下，腐烂有机物的碳链便发生重组，获得了异常的活性，成为最恐怖的掠食者触手族。\n\n## 生理构造\n\n首先最区别于其它高级种族的便是，触手族没有集中的大脑，取而代之的是两套互补的系统：\n\n- 魔力核心：触手族的心脏，一个有机魔力容器，用于存储和调控魔力。触手族的所有生理活动都依赖魔力驱动，核心被摧毁意味着整个个体的死亡。\n- 神经网：贯穿全身的神经网络，没有集中的脑部。神经网上的数千个神经节点共同分担信息处理，除非所有神经节点被同时摧毁，否则它总能重组意识。\n\n这种分散式神经系统让触手族除了核心没有弱点，任何一条触手被切断，断肢中的神经节点仍能独立运作一段时间。\n\n触手族的身体由一种无骨架细胞构成，这种细胞的形态由魔力直接维持。在魔力驱动下，这些组织可以在固体和流体之间自由转换，表面还能生出不同生物质，模拟任何质感和硬度。通透性、粘稠度、刚性都由魔力实时调控，这使得触手族可以在短时间内完成形态变化。\n\n并且由于最初拼合时基因过于混乱，导致正常的细胞分裂无法进行。触手族的细胞已经退化了核酸遗传体系，转而完全依赖魔力来实现生命活动。这是唯一的全生命周期都离不开魔力的魔化种。但也因此，触手的神经网出生后便无法再分裂，通常寿命都不长。\n\n## 魔力系统\n\n- 触手的储魔器官是魔力核心，位于身体最深处，通常被多层肉质包裹保护。魔力核心由变异的魔力蛋白构成，含砷基团数量达到其他生物的数十倍。它不仅存储魔力，还存储着维持效应肉质稳定所需的结构信息，充当基因记录触手族当前的形态配置。\n- 神经网是触手族的导流器官，贯穿全身。触手的神经网同样由变异特化的魔力蛋白纤维构成，既能传输电信号、又能运送魔力，在节约空间的同时也变相加强了神经网的强度。\n- 神经网同时也是效应器官。触手族通常不使用法阵，直接通过神经网操控魔力调整局部躯体，模拟出各种器官。\n\n  - 骨刃/甲壳：提高局部魔力密度，使肉质硬化\n  - 吸盘/绒毛：在表面生成微小的魔力涡流，产生吸附力或振动\n  - 注射针：将肉质延伸为空心管状，用于输送腺体分泌物\n  - 回声定位球：通过魔力振动感知周围环境\n\n---\n\n## 触手族的常见形态\n\n即使无定型，触手还是拥有几类经典的分化形态。\n\n### 狩猎形态\n\n- 触手团：最基本的形态。一个肉球状的魔力核心基座上生长着数根触手。像蜘蛛一样在地板、墙壁和天花板上爬行。直径从数十厘米到数米不等。魔力储量低于2万目，主要靠数量和物理缠绕捕猎，直接进行产卵繁殖。\n- 触手虫：从任意触手母体上分离的独立活体器官。没有魔力核心，依靠残留电荷运作，寿命仅几小时，专门用于钻入铠甲缝隙或体腔寻找神经接口（如尿道、直肠、耳道），持续侵犯直至目标失去反抗能力。作用和虫族寄生体类似。\n\n### 陷阱形态\n\n利用环境伪装，构造封闭的能量循环拘束室。\n\n- 肉壁：像地毯一样覆盖房间表面，拥有高摩擦力和强力粘着性。主要用于制造定居点，供族群存放猎物，通常是一片区域的触手族核心所在，作为苗床存放点。\n- 落穴/壁尻：模拟环境（地板、墙壁），形成只要有猎物经过就会触发陷阱将其抓入内部。内部是一个完美隔音、隔光、屏蔽魔力的囚禁产卵室，其内壁能同时分泌营养液与催情素，猎物往往能在里面存活数月，直到孵化大量后代。\n- 藤壶：悬挂在黑暗处的拟态囊，能模仿环境的光反射（类似隐形），并垂下一根假藤蔓抓取碰到的猎物。一旦接触几乎来不及逃脱，是单体囚禁的极致，它们通常比其它触手更喜欢玩弄目标，会刻意地戏耍目标。\n\n### 高级形态\n\n- 触手服：高度进阶的个体。拥有类似液态服饰的外观（如紧身衣），部分神经网弥补在魔力核心内，确保有长期记忆和接近人类的狡诈智慧。\n  触手服包裹宿主后，通过神经网入侵与宿主的神经系统对接，将自己的神经纤维与宿主的运动神经并联。触手服可以增强宿主的肌肉力量、反射速度，同时通过魔力核心为宿主供能。但这些帮助是有代价的，触手服会利用宿主进行繁殖，也会随心所欲地侵犯宿主。保护宿主只是为了后代的安全，它会持续读取宿主的基因信息，作为繁殖时的基因素材。\n\n- 触手共生体：触手服和宿主达成和平契约后的终极形态，可以不分性别地结合。触手服的魔力核心将与宿主的脊柱融合，并且神经网与宿主的大脑深度互嵌。这种结合一旦完成，两者共享寿命与魔力，无法分离，可以用独有的精神链接脑内交流。\n  触手共生体在外的肉体消亡后，可以通过在宿主子宫内（或）催化假卵"重生"，假卵无繁殖功能，实质等同于触手的一部分肉体器官。\n  共生体通过精神力覆盖周围操控自己的躯体，但不能离开精神力覆盖范围，否则离开部分的触手肉体将失去控制瘫痪。\n\n---\n\n## 性侵略生态\n\n为什么触手族必须侵犯其他种族？问题在于触手族没有稳定的基因组。\n它们已经舍弃了DNA，导致减数分裂和有丝分裂都无法进行。想要长出消耗品肉质很简单，但分化出全新的一套神经网、即新的个体，必须依靠其它种族完成生殖。\n\n### 繁殖过程\n\n触手族的繁殖分为两个阶段。\n\n#### 阶段一：基因采集\n\n触手族需要从其他生物身上采集完整的基因样本注入自己的卵，用来构建后代的遗传基础。\n\n首先，触手侵入目标体内，将神经网与目标的神经系统对接。通过神经接口，触手族读取目标全身细胞的基因信息，将这些基因信息转录到卵中。\n\n#### 阶段二：活体孵化\n\n当触手族从足够多的目标身上采集了基因样本后，它自身却没有稳定的细胞结构和环境来支持胚胎发育，它需要一个活体孵化器。于是触手族会选择一具合适的活体目标（通常是有生殖腔的雌性生物），将受精卵植入目标体内。触手族还会改造目标的子宫或体腔，使其成为一个更优秀的临时孵化室：\n\n首先，它会分泌一种组织改造酶，使目标的子宫壁增厚、血管增生，形成人造胎盘。然后将合成好的胚胎植入，通过人造胎盘供能供氧。\n胚胎在目标体内发育，吸收目标的营养，最终诞生出新的触手族个体。\n\n但触手宝宝也没有维持核酸的能力，新个体在初始DNA端粒耗尽后，神经网的分裂分化就会停止，这时候便可以孵化离体。\n\n### 为什么需要侵犯？\n\n触手族的基因采集效率取决于目标神经系统的活跃程度，目标越兴奋，神经信号越强烈，触手族能读取到的基因信息就越完整。\n而性唤起状态恰好是生物神经系统最活跃的状态之一。此时目标的大脑、脊髓和末梢神经都在高强度运作，全身的细胞活动也处于高峰，触手族在这种状态下采集到的基因样本质量最好。\n此外，性唤起状态下目标的内分泌系统会释放大量激素和体液，触手族可以通过体液汲取目标魔力补充自身。\n因此，触手族在进化中发展出了各种催情手段（催情素、物理刺激、神经微震）。并且触手也渐渐进化出了感觉器官，能接受疼痛、快感等，进一步激发了它们的侵犯热情，也让触手开始热衷于慢慢玩弄目标。\n\n有趣的是，对于自愿配合的宿主，触手族即使不具有情感，也会基于资产保护本能展现出某种病态的宠溺与保护欲。以及被私有化的苗床，特别是高魔力对象，会被视若珍宝，但它们自己侵犯的时候绝对不会手下留情。\n\n---\n\n## 性器官谱\n\n基于其魔力塑形能力，触手族在性掠夺与战斗方面进化出了令人胆寒的多样性，数量取决于想象力。此处仅列举部分分化性器。\n\n### 基础刺激器官\n\n触手族的肉体可以模拟从柔软到坚硬的任何质感，这使得它在物理刺激层面拥有无限可能。\n\n#### 表面纹理类\n\n- 绒毛触手：表面覆盖细密的柔软或粗糙绒毛，像羽毛一样轻扫皮肤。用于全身游走，制造难以忍受的酥痒感。\n- 舌面触手：表面布满味蕾状的突起，模仿猫科动物的倒刺舌，粗糙的舌面刮擦敏感部位（乳头、龟头、阴蒂、会阴）时会产生强烈的摩擦快感。倒刺的硬度和方向可调，顺刮是爱抚，逆刮是惩罚。\n- 波浪触手：表面有规律的波浪状起伏，像按摩棒一样在体内或体表来回蠕动。波浪的频率、振幅和方向都可以精确控制，可以模拟从温柔抚摸到剧烈抽插的任何节奏。\n- 珠链触手：表面镶嵌着一排排光滑的圆形突起，像一串珠子。在进出体腔时，珠链会依次挤压括约肌和内壁，产生一种独特的"一节一节"的充盈感，珠子的大小和间距可调。\n\n#### 形状模拟类\n\n- 仿生触手：可以精确模拟任何种族的生殖器形态，人类的阴茎、魅魔的尾巴、兽人的生殖器，用于给目标一种被熟悉对象侵犯的错位快感。\n- 双头触手：两端都可以膨胀，用于同时刺激两个腔道（如阴道+肛门，或口腔+阴道）。中间段可以扭动，使两端同时旋转。\n- 伞状触手：尖端可以像伞一样展开，在进入体内后撑开，固定位置的同时用伞面内侧的突起刺激内壁。伞面边缘可以贴合宫颈口或前列腺位置进行定点刺激，也可以作塞子用。\n- 环状触手：可以缠绕在身体任何部位（阴茎根部、阴蒂、乳头、脖子），通过节律性收缩提供挤压快感。多根环状触手可以串联，形成连锁挤压效果，从脚踝到脖颈一波一波地向上传递。\n\n### 神经连接器官\n\n触手族最恐怖的能力不是物理刺激，而是直接操纵目标的神经系统，这能让多数目标直接崩溃。\n\n#### 神经接口类\n\n- 神经针：细小的尖端可以无痛刺入皮肤，直接连接到目标的末梢神经。连接后，触手族可以向目标的大脑发送快感信号，直接在神经层面制造高潮。这种快感的强度和持续时间完全由触手族控制：\n\n  - 可以制造持续数小时的连绵高潮，不让目标有片刻喘息。\n  - 可以制造一波一波的脉冲式高潮，每次都比上一次更强烈。\n  - 可以将快感精确投射到身体的任意部位，即使那里根本没有被触碰。\n- 脊椎接口：从尾椎或后颈接入脊髓，直接控制目标的整个下半身或全身的神经信号。触手族可以：\n\n  - 强制目标的身体做出反应（弓背、扭腰、抽搐），即使目标心理上不愿意。\n  - 阻断目标的运动信号，让目标完全无法动弹，但感觉信号完全保留甚至放大。\n  - 将目标的触觉信号反转，抚摸变成刺痛，拍打变成快感。\n\n#### 感官操控类\n\n- 幻感触手：通过神经接口向目标的大脑注入虚拟的触觉信号。目标会"感觉"到有东西在触碰自己身体的某个部位，但实际上那里什么都没有。触手族可以：\n\n  - 制造"幽灵触手"的幻觉，目标时刻感觉全身被无数看不见的手抚摸。\n  - 制造"体内充盈"的幻觉，即使触手还没有进入，目标已经感觉到被填满。\n  - 制造"群体侵犯"的幻觉，即使只有一只触手，目标会感觉被多个对象同时触碰。\n\n### 生化器官\n\n触手族可以通过分泌腺制造生物制剂，从内部操控目标的性体验。\n\n#### 注射类\n\n- 催情针：注射强力催情素，直接作用于目标的下丘脑。效果包括：\n\n  - 性欲持续高涨，无法通过任何方式平息，即使被放走也会持续数小时。\n  - 对任何形式的刺激都产生性反应，即使是风吹过皮肤也会颤抖。\n  - 身体被性欲覆盖，但意识保持清醒，目标清楚地看着自己失控求欢。\n- 超感针：注射神经敏化剂，将目标的触觉灵敏度提升到正常水平的数十倍。正常的性交变得过于强烈，快感和痛感的界限模糊。持续超敏状态会导致目标即使在被触碰后很久，身体仍在颤抖。\n- 润滑针：注射后，目标的全身毛孔都会分泌润滑液，伴随魔力泄露。这使得任何身体接触都带有性意味。\n- 肿胀针：注射后，目标的特定部位（阴蒂、乳头、龟头、阴唇）会充血肿胀到正常大小的数倍，敏感度也随之倍增。肿胀状态可持续数小时到数天。\n- 充盈针：注射后，目标的小腹会产生一种持续的"被填满"的饱胀感，这种感觉类似于憋尿但更强烈，会持续刺激目标产生"想要释放"的渴望。\n\n#### 体液替换类\n\n- 蜜液触手：触手本身会分泌一种温热的、粘稠的甜味液体。这种液体接触皮肤后会迅速蒸发，但在蒸发前会带来一种灼热的刺激感。液体中含有轻微的催情成分，会通过皮肤吸收。\n- 润滑触手：触手表面会渗出一种的透明液体，摩擦系数接近零，这种触手可以毫无阻碍地滑入任何腔道。\n- 热感触手：触手内部可以产生热量，表面温度可在冰冻到烫伤阈值之间调节。\n- 电流触手：触手表面可以释放微弱的生物电脉冲，直接刺激目标的神经末梢。电压和频率可调：\n\n  - 低频脉冲：类似按摩，肌肉会不自主收缩。\n  - 中频脉冲：强烈的麻刺感，覆盖触觉。\n  - 高频脉冲：直接的神经刺激，可以强制引发痉挛。\n\n### 复合器官\n\n- 花蕊触手：尖端像花朵一样可以绽开，露出内部的多层结构。外层是绒毛，中层是舌面倒刺，内层是神经针。进入时，外层绒毛先进行安抚；完全进入后，中层倒刺展开固定位置；最后内层神经针接入目标神经，开始直接输送快感信号。一层一层递进，让目标在不知不觉中从"被抚摸"过渡到"被操控"。\n- 腔室触手：触手内部有一个空腔，可以将目标身体的一部分包裹进去（如整个乳房、阴茎、手臂、甚至半个身体）。腔室内壁可以同时使用多种刺激方式——绒毛轻扫、舌面刮擦、电流刺激、热感交替、负压吸吮。被包裹的部位会同时体验多种快感，难以分辨具体是哪里在被刺激。\n- 节肢触手：像蜈蚣一样分节的触手，每一节都可以独立运动。缠绕身体时，每一节可以同时对不同部位施加不同的刺激。一节在乳头画圈，一节在阴蒂震动，一节在肛门旋转，一节在大腿内侧轻扫。目标会感到全身各处同时被照顾，信息过载般的快感。\n- 镜像触手：触手表面生有无数极细的感知绒毛，可以实时读取目标身体的反应（心率、肌肉紧张度、呼吸频率、皮肤电导）。然后触手族会根据这些数据实时调整刺激方式。目标越接近高潮，刺激就越强烈；目标快要受不了时，刺激又会稍微减弱，让目标始终处于寸止的边缘状态，反复玩弄。\n\n### 心理操控器官\n\n- 梦境触手：在目标入睡后，通过微弱的神经信号接入目标的大脑，操控目标的梦境。触手族可以让目标做一整晚的春梦，梦境中的快感会真实地反映在身体上（潮红、湿润、肌肉痉挛）。\n- 条件反射触手：通过反复的神经刺激，在目标的大脑中建立条件反射。例如：每次目标看到红色，就会自动产生性兴奋；每次听到特定的音调，就会不自主地流水；每次触手族用拟声带说出某个词，目标就会直接高潮。这些条件反射一旦建立就很难消除，成为羞耻的烙印。\n- 快感成瘾触手：通过长期、反复的神经直连刺激，触手族可以重置目标的快感阈值。正常性行为不再能让目标满足，只有触手族的神经直连才能带来高潮。目标会从生理上依赖触手族，就像成瘾者对药物的依赖。脱离触手族后，目标会经历类似戒断反应的症状，焦躁、失眠、性欲亢进但无法满足。\n\n### 特殊用途器官\n\n- 产卵触手：用于将受精卵植入目标体内。触手尖端会先注入麻醉剂和肌肉松弛剂，然后扩张目标的内腔，将卵依次排入。卵的表面有微小的倒钩，会附着在腔壁上继续发育。产卵过程本身可以设计为一种缓慢的、持续的刺激。触手还能射出白稠滚烫的卵液，无任何生理意义，纯粹模拟男性精液。\n- 榨乳触手：专门针对哺乳期（或通过催乳处理）的目标。触手尖端呈喇叭状，可以贴合乳头形成一个密闭空间，通过负压吸吮和节律性挤压来采集乳汁。采集过程中会同时释放微电流刺激乳腺，使产乳量增加。这种触手也可以用于男性的前列腺榨取。\n- 净化触手：触手进入体腔后，会分泌一种溶解性液体，将体腔内的所有分泌物、残留物、甚至目标自身的肠道内容物溶解吸收。然后触手会将这些废物带走，使体腔变得干净、光滑、湿润，随时可以用于下一次植入。'},{id:'娜迦族',title:'娜迦族',content:'混沌日期间，一批人类不幸地被自然魔法冲击，他们吸收了蛇的基因，进化出一种嗜毒为生的半蛇人娜迦族。\n\n# 生理构造\n\n娜迦族上半身保有类人、妖艳的面容与躯干，皮肤光滑无鳞，色调从沙漠的浅金褐到沼泽的暗橄榄不等，随栖息地环境而异。\n腰部平滑过渡为强壮且覆盖着坚硬鳞片的蛇尾，全长3-5米，尾部末端逐渐收窄为灵活的尾尖。鳞片呈覆瓦状排列，腹面鳞片宽大，用于在地面行进时提供抓地力。\n\n其寿命约150-250年，雌性通常比雄性长寿，生理成年约在18-22岁。\n\n娜迦的蛇尾肌肉群发达，能以多种行进模式适应不同地形：在平坦沙地上采用标准的蜿蜒波动，在狭窄岩缝中能以直线爬行收缩肋部肌肉前进，在松软沼泽中则散布体重以侧绕方式行进避免下陷。尾部鳞片表面有一层疏水蜡质层，能防止沙粒或泥浆嵌入鳞缝。\n\n娜迦采用卵胎生，受精卵在母体内孵化，孕期约十个月，每次产下1~2个新生儿。新生儿的尾部鳞片呈暗淡的灰色，还没有形成任何色系。毒腺在婴儿阶段完全无功能，毒素类型会在约六岁左右的第一次换鳞中确立，并在此后持续维持同一色系终生。\n毒素类型的遗传具有母系倾向，子代大概率继承母体的毒素类型，但有一定概率出现变异，产生其他类型的后代。\n\n### 鳞片颜色与毒素外显\n\n娜迦的尾部鳞片是其实力最直观的外显标志。鳞片的色彩直接对应其体内毒素种类，这是娜迦生理学中最独特的特征。不同个体因遗传和后天毒液摄入的差异，尾部鳞片呈现不同的色系：\n\n| 鳞色        | 毒素类型   | 在种群中的大致占比 |\n| ------------- | ------------ | -------------------- |\n| 翡翠绿      | 溶血毒     | 约占四成，最为常见 |\n| 紫色/白色   | 神经麻痹毒 | 约占三成           |\n| 赤铁红      | 肌肉溶解毒 | 约占两成           |\n| 粉珊瑚/纯黑 | 媚毒       | 少数               |\n\n同一色系内部存在深浅和金属光泽的差异，受个体的健康状况、魔力储备和年龄影响。鳞色会在蜕皮后短暂鲜艳，随后逐渐变暗，娜迦在蜕皮后的一周内尾部最为耀眼。\n\n同时，娜迦杂交还有可能出现混合鳞子代，但是概率非常小。混合鳞的鳞色会随机交替显示，类似于不均匀棋盘格。\n\n### 毒腺与毒牙\n\n娜迦的口腔结构与人类相似，但上颌两侧各有一对可伸缩的毒牙。毒牙中空，长度约2-3cm，收纳在口腔上壁的鞘状结构中，只在咬合时弹出。\n\n毒牙根部连接着位于颧骨后方的主毒腺，是娜迦全身毒素的合成中枢。主毒腺持续分泌一种毒液前体，成分因个体的毒素类型而异。前体储存在毒腺的囊状结构中，在被需要时通过毒牙注入目标体内，并可以主动控制毒液的注入量。\n\n娜迦的体液甚至眼泪都携带着低浓度的毒素，这种毒素浓度通常不足以对成年大型生物造成致命伤害，但足以引发皮肤红肿、烧灼感和暂时性麻痹。娜迦彼此之间对这种毒素完全免疫，因此她们可以安然分享食物、互相梳理鳞片、在狭小空间中密集聚居而不受影响。\n但这也意味着娜迦与其他种族之间的物理接触始终存在风险。一只有未愈合伤口的娜迦与外族握手，可能在对方手掌上留下一片持续数日的皮疹。\n\n### 雌雄分化\n\n不同于多数种族，娜迦的雌性比雄性远为强大，这种分化深入生理结构的每一个层面。\n\n雄性全长仅有1.8-2.5米，魔力回路从出生起就处于萎缩状态，仅有微弱的魔力感知能力，储魔器官处于退化状态。\n虽然全部四种毒素类型均可出现，但毒素浓度低，无实战意义。毒腺在成年后会退化到几乎无功能的状态，它们能产生的毒液仅够用于自卫，无法击杀比大型蜥蜴更大的猎物。\n\n社会地位方面，雌性也垄断了所有上层职位，雄性主要充当繁衍工具与底层劳动力。\n\n---\n\n## 魔力系统\n\n在各大智慧种族中，娜迦的演化路径最为极端：他们彻底抛弃了自由施法能力，转而将全部魔力天赋押注在毒素这一条窄路上。\n\n- 娜迦的储魔器官是毒囊，和名字不同，它不负责存储毒液，是一对嵌入主毒腺后方的囊状魔力容器。毒囊蛋白含有18个含硅基团，在毒囊内部形成致密的纤维网状结构，纤维表面吸附从环境中摄取的原质子。毒囊与主毒腺之间通过微管道网络直接连通，当娜迦摄入含毒物质时，这些物质被主毒腺吸收并分解，驱动原质子的吸附和储存。\n  因此，娜迦主要靠吞食毒素来恢复魔力储备。\n  毒囊的大小因个体而异，也因毒素类型而异。以神经毒为特化的娜迦通常拥有最大的毒囊，因为神经毒素的合成需要消耗最多的魔力。\n- 从毒囊到毒牙，魔力的导流器官是毒络，一套伴随唾液腺导管分布的微管道系统。毒络在毒囊与主毒腺之间形成密集的纤维束，沿唾液腺导管延伸至毒牙根部的微型激发腔。\n\n- 效应器官是毒牙根部的激发腔。激发腔的结构是一种精密的球状空隙，内壁由毒囊蛋白的另一种变体排列而成，形成天然的激发符文结构。当魔力沿毒络流入激发腔时，激发腔将原质子激活，激活的能量被用于催化毒液前体的最终转化，使其具有完全生物活性。\n\n换言之，娜迦的毒液不是纯粹的化学物质，它是毒液前体与激发态魔力结合的产物。娜迦毒液的致死剂量和生效速度远超自然界中任何纯化学毒素，因为魔力本身也参与了毒液对目标的破坏过程。毒液进入目标体内后，其中的激发态魔力会继续共振，持续生成微量的毒液降解产物，使毒素在目标体内不断再生直至魔力耗尽。\n\n毒腺在分泌毒液前体的同时，也向消化系统分泌解毒酶。娜迦的肝脏拥有高度发达的酶系，能快速分解超过两百种已知毒素，除了其它生物的生物毒。这种代谢系统的理论极限尚不明确，几乎是全种类覆盖。\n\n也就是说，娜迦除了制毒，同时也能分泌几乎所有种类的解毒剂。\n\n### 施法限制\n\n娜迦无法自由施法，他们的魔力出口被锁定在毒液通路中。激发腔天然只能匹配毒液前体的转化频率，任何试图让魔力绕过毒液发挥其他魔法效果的尝试，都会因频率不匹配而失败。\n\n少数娜迦个体能够将毒液的魔力共振延伸到体表，形成一层被称为毒瘴的魔力薄膜，触碰到这层薄膜的任何生物都会受到类似轻度中毒的效应。但这仍然不是自由施法，只是毒液系统的一种被动延伸，能力罕见且无法被传授。\n\n---\n\n## 毒素类型详解\n\n娜迦的毒素类型由遗传决定，但后天摄入的毒物可以微调毒液的成分和效力，四大毒素类型的持有者在娜迦社会中承担不同的角色。\n\n四大类型的毒素彼此之间不兼容，但不排除少数混合毒持有者，即混合鳞变种。\n混合毒的持有者在娜迦社会中拥有特殊的地位。融合了两种毒素特性的毒液不仅在战斗和刑罚中独一无二，也被认为是母神选中的象征，拥有精神和政治威望，往往是神殿的高级祭司或氏族联盟的仲裁者。\n\n### 溶血毒\n\n破坏红细胞膜，导致目标体内大范围溶血。中毒后几分钟内出现皮肤黄疸、血尿、全身性缺氧，严重中毒者在半小时到数小时内因呼吸衰竭死亡。在非致命剂量下，会恶心、头晕、皮肤发黄、尿液呈红茶色，持续数天至数周。\n\n溶血毒见效快，能快速放倒大型猎物或敌人，通常作为猎手与战士存在。\n\n### 神经麻痹毒\n\n阻断神经肌肉接头的信号传递，导致全身性麻痹。中毒后首先是四肢麻木，然后是呼吸肌麻痹，意识全程保持清醒。在无解毒剂的条件下，高剂量中毒者在数分钟到十几分钟内因窒息死亡。在非致命剂量下，局部麻痹、感官失真（视觉模糊、听觉异常），持续数小时至数天。\n\n神经毒的精准控制性赋予其独特的战术和刑罚价值，拥有者非常适合成为审讯者或处刑官。\n\n### 肌肉溶解毒\n\n溶解骨骼肌细胞膜，将肌肉组织液化为浆状。中毒部位迅速肿胀、变为暗褐色，伴随肌红蛋白大量入血导致的急性肾衰竭。严重中毒者在数小时至数天内因多器官衰竭死亡。在非致命剂量下，会伴随局部剧烈疼痛、肌肉抽搐、受伤部位丧失运动能力数天至数周。\n\n肌肉溶解毒只能通过咬伤注入，这使其成为所有毒素中最接近武器化的一种，也使其持有者更偏向战斗角色。\n\n### 媚毒\n\n媚毒中的激发态魔力会干扰目标大脑边缘系统的开弦振动模式，使负责性欲、依恋感和愉悦感的神经元群发生频率偏移，将其振动频率推向一个与娜迦施毒者自身魔力频率接近的共振带。目标会对施毒者产生强烈的性欲和情感依恋，欲望的强度与注入的毒液剂量成正比。\n\n需要区分的是，它与魅魔催情酶不同。魅魔的催情酶是一种蛋白酶神经毒素，作用于目标的内分泌和神经系统，通过催化魔力蛋白向生殖系统转运来榨取魔力—。娜迦的媚毒则是频率共振，通过干扰目标大脑的开弦振动模式来改变情绪。魅魔催情酶会降低敏感度、提高高潮阈值以延长性交过程，娜迦媚毒则提高敏感度和依恋感，使目标主动配合施毒者的意愿。\n\n此外，魅魔催情酶的作用对象必须是能进行性行为的类人种生物，娜迦媚毒的魔力共振理论上对任何拥有边缘系统或等效神经结构的生物都有效，包括兽类、魔物、甚至某些魔化植物。'}]},{id:'社会文化',title:'社会文化',content:'本文档集描述的所有信息都基于新生纪元最新时代数据，尽可能详尽但不会全面地展示星球上的主要文明文化。几乎所有具备自主外交能力的大型文明，都会被收纳进本文档集。\n部分文明在历史中频繁出现，因此省略了许多重复内容。但部分未提及的种族，会在此详细解释。',children:[{id:'魔族社会',title:'魔族社会',content:''}]},{id:'世界势力',title:'世界势力',content:'',children:[{id:'待补充势力',title:'待补充势力',content:''}]},{id:'世界地标',title:'世界地标',content:'',children:[{id:'待补充地标',title:'待补充地标',content:''}]}]}];function W(e,n,t=0){return e.flatMap(e=>{const a=[{node:e,depth:t}];return e.children?.length&&n.has(e.id)?a.concat(W(e.children,n,t+1)):a})}function O(e,n){for(const t of e){if(t.id===n)return t;const e=O(t.children??[],n);if(e)return e}return null}function j(e){return e.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll('\'','&#039;')}function R(e){return j(e).replace(/`
