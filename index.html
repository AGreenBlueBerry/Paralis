,children:[{id:'魔法体系',title:'魔法体系',content:'帕拉里斯世界观的魔法，是基于现代科学体系改编的硬核魔幻，完全可以用现代科技解释，有着一套完善自洽的逻辑体系。\n\n这套体系微观体系几乎无懈可击，但仅能用于支撑世界观，**世界观内任何已知生命都没有能力探查、理解魔法体系的本质！**\n所以，除了微观魔法体系外，还有一套宏观魔法体系。这套魔法体系是建立在帕拉里斯生物的认知上的，可以直接代入角色认知。',children:[{id:'微观魔法体系',title:'微观魔法体系',content:'**注：本文档内容超越世界观科技水平，从现代科技角度解释魔法现象，不代表世界观的实际科技水平与认知达到现代水平**\n\n## 魔法本质\n\n### 弦宇宙体系\n\n讲述魔法体系前，首先要介绍一下帕拉里斯的宇宙底层体系：弦宇宙。\n\n现代物理体系已经提出弦理论：所有物质本质上都是能量，构成宇宙所有基本粒子的最小单元是具有长度但无宽度的‌一维振动能量线‌。本世界观内称其为宇宙弦。\n宇宙弦的不同振动模式对应着不同的基本粒子及其属性（如质量、电荷），构成17种基础的基本粒子，进而组成更大的物质。而粒子间的相互作用则通过弦的分裂与合并来实现。\n弦宇宙体系就是建立在弦理论的基础上，但大部分架空且非专业，与现代科学存在若干差别。\n\n#### 更高维度与开闭弦\n\n帕拉里斯的三维宇宙位于一个维度空间里，空间本身包括有更高维度，如四维空间。（注：**四维空间绝对不等同于四维时空**，仅代表在坐标轴上多了一个向量）\n\n在整个维度空间里，宇宙弦都可以分为两种：\n\n- 开弦是一根不闭合的线，通常也可以在维度空间里自由移动，但此处在三维空间的背景下讨论，默认开弦指"首尾端点被限制在三维空间内的宇宙弦"，并称三维空间为弦盒。\n  由于端点固定，开弦无法完全脱离弦盒，也就是无法跃迁到四维空间。但开弦的中间部分可以自由摆动、部分离开三维空间。开弦剩余在三维空间的部分不同，构成的基本粒子也不同，如电子、光子、夸克等。\n- 闭弦是一根首尾闭合的线圈，它在维度空间内可以自由移动，完全脱离弦盒，也就是可以在三维和四维里来回跃迁。这让它在很大程度上脱离常规粒子的交互规律，闭弦在三维空间内的投影，可以构成如引力子等具有**跨空间性质**的基粒。\n\n开闭弦不是永恒的！开弦可以被外力扯离弦盒变成闭弦，闭弦也可以被固定下来成为开弦。\n\n### 新基本粒子：原质子\n\n#### 原质子的定义\n\n本体系将能量闭弦视作一种基本粒子原质子，简称原质。\n由于原质子本质属于高维空间，它能在三维空间产生极为魔幻的效应，甚至出现难以理解的超自然力量，这构成了魔法的基础。\n所以原质子也有一个更符合世界观生物认知的名字：魔力。\n\n#### 原质子的特性\n\n宇宙弦进入弦盒后，难免会与其它开弦勾连，就像一个线圈丢进蛛网。在这个过程中，原质子表现出如下特性：\n\n- 稳定：常规情况下原质几乎不与弦盒交互，只有与其它能量波碰撞，才会在三维空间留下自己的能量。这种激发通常不会太过容易，让原质得以一种**非常规物态**的形式稳定存在。简单来说，魔力是不具有任何物理碰撞属性的。\n- 可见：原质可以说是高维空间的实体，在三维世界只留下投影，三维观测者不可能直接看到能量。但原质仍有两种观测方式：\n\n  - 自发光：当原质子和其他粒子接触，也就是闭弦和弦盒内其它开弦碰在一起，它的这一段能量会投影到弦盒内，被称作投影段，激发为肉眼可见的光子。其亮度（光密度）与能量密度成正比，通常非常微弱，所以只有高密度聚集的原质子才能被宏观体量的生物察觉，低密度的原质子无法起到示踪作用。这解释了为什么**普通生物也能看到施法时的魔力流**，但逸散在空气中的**均匀魔力不能肉眼看见**。\n  - 被动感应：当闭弦靠近开弦时，会轻微扰动开弦的振动状态。虽然这种扰动微弱到可以忽略，但部分生物大脑中的特定神经元（灵视神经元）对这类扰动极为敏感，可以将这种扰动翻译成一种空间感知，即魔化种拥有的灵视能力。所以灵视不是视觉，是一种针对魔力进化出的独立感官。\n- 吸附：原质会自发性地吸附于附近拥有特定空间结构的物质（通常是过渡元素，如硅、砷，以及部分有机高分子），并在激发前始终自主保持此状态。魔法水晶通常就是硅酸盐制品，或是近似玻璃制品，以及魔化种的特异性器官也是以此为底层逻辑。\n\n#### 魔力的激发：宇宙弦耦合\n\n魔力通常处于惰态，除了发光不具有任何特殊性质，只在被激发时爆发出巨大的能量，或转化为物质。这与闭弦在弦盒中的运动息息相关：\n\n- 惰态：此时的原质子仍是闭弦状态，但可以被开弦的振动干涉，从而**变性成开弦**。\n- 激活态：激活后的原质子严格来说不属于原质子。激活意味着闭弦变成开弦，也就是这根宇宙弦携带的**能量全部从高维空间跃迁到低维空间**，从而凭空实现恐怖的魔法效果。\n\n而激发则是依赖弦耦合方法：当两根宇宙弦的振动频率足够接近，振动模式之间就能形成稳定的相位关系。此时传递的能量足以改变另一根弦的状态，强弦会使弱弦逐渐与其同步。\n\n应用到原质子上：当存在一个开弦满足上述条件，它就可以使闭弦出现投影段，再逐步同化，令投影段不断扩大。当闭弦被完全断开，全部投影到弦盒内，便成为开弦，完成了原质子的激发。这也意味着一个微型魔法的成功实现，此时原质子便不再是原质子，而是被固化的物质了。\n上述过程中，称开弦为激发弦，闭弦为被激发弦，开弦的频率则称作激发频率。激发频率直接影响到闭弦投影后的效果，能量表现形式完全受激发频率影响。\n\n所以，**魔法实际上是弦激发的产物**。\n\n---\n\n## 魔法相关定义\n\n### 魔力水晶的本质\n\n闭弦在弦盒中运动时，会不可避免地与周围的开弦碰撞，发生微弱的相互作用。大多数物质的分子振动频率与原质子的固有频率不匹配，因此原质碰撞后会直接穿过它们，只会微弱发光。不过，所有的闭弦都巧合地拥有同一段频率，这段频段被称为定耦合带。开弦同样可以有定耦合带，特别是过渡元素（硅、砷）和特定有机高分子，它们的**定耦合带非常宽广**。但这些物质具有的能量又不足以激发原质子，不产生大面积投影段，所以魔力在穿过它们时只会**被锁定在一起**，形成稳定的吸附态。\n\n在宏观角度看来，这些能吸附的材料大多是晶石状的硅酸盐或各类生物材料，称为魔力容器。例如魔力水晶、炼金材料，它们**能存储魔力**。\n而水晶变形、变性时，开弦密度降低或频率变动，锁定能力自然大幅度下降。所以**水晶可以被破坏**。\n当受到更强的开弦吸引，原质子又会被吸引离开，所以水晶内的**魔力可以提取**。\n\n值得注意的是，由于原质仍未激发，所以魔力水晶本身不会有任何变化，包括质量。但这不代表它的容量无限，开弦本身的能量有限，超出容量的原质不会被吸附，所以魔力容器的**容量有限**，存储过多的魔力反倒会**影响容器本身**。\n由于不同物质的频率不同，不同魔力容器的**容量也不同**，定耦合带更广的容器容量更大。容量也是区分容器品质的标准。\n\n#### "创世之石/原质奇点"是什么？\n\n随便翻阅一下世界简史就能发现，原质奇点对世界起了至关重要的作用，那么它究竟是什么？\n简单来说，原质奇点就是一块存储的原质密度接近无穷大的硅晶魔力水晶，但它的材质是独一无二的**共生硅**。\n\n- **共生硅与原质起点：**\n  硅元素位于第三周期，通常来说只有最外层电子成键。而两个"共生硅原子"共用L、M两层电子，也就是说一共有12个共用电子对，这使共生硅稳定得可怕，近乎不可摧毁。\n  共生硅诞生于宇宙伊始，宇宙大爆炸创造了它们。大量共生硅聚集，便形成若干"原质起点"：它的频率几乎完全是定耦合带，是完美的原质容器。而存储在其中的闭弦互相嵌套，进一步扩大容量，原质子近乎无穷无尽（至少对于一颗星球来说）。由于其原质密度堪比黑洞的高，因此称作"奇点"。而对于文明来说，这种能主宰一切的力量被认为是世界的本源之力，因而得名创世之石。\n   *（其实这种说法也没错，它们确实源自宇宙本源）*\n\n---\n\n## 生物与魔法\n\n首先，我们将魔法分为自然魔法与生物魔法：\n\n- 自然魔法指在自然界复杂能量频率环境下产生的、不可预测的魔法，如在原始星球、雷暴天气、磁铁矿附近。往往对地形塑造、物种变异起关键作用。\n- 生物魔法指由于生物体内能量频率变化而产生的魔法，通常效果固定、触发方式规律，效应结果可控。实际上称作"主动魔法"更为合适。\n\n生物魔法的复杂度与威能远不及自然魔法，也不可能达到同样威能，这是能量量级差距。\n\n### 电场在耦合时的优越性\n\n相比于零散的物质，连续且规律的场的耦合能力显然要更好。而在众多场中，引力场过于微弱，希格斯场太过均衡…\n\n在比较下，**电场**既足够强大，又灵活多变，最重要的是容易为生物所操控。因此，**所有生物魔法**以及**多数自然魔法**都是在**电场**的效应下实现的。\n\n### 生物如何操控魔力\n\n生物的神经能发出电信号，而这份信号的变化能力甚至强过精密计算机。所以从理论上来讲，生物天生就是非常适合控制魔力的。\n但生物电仅仅胜在多变，多数生物的电信号强度不够高，因此多数生物都**只能操控魔力移动**，并需要**依赖外置法阵施法**。\n\n特别注意，能利用生物电控制魔力，不代表生物可以像计算机一样精准控制每个神经元。\n这部分"编译"是进化后的大脑自动完成的，在生物的主观视角里，只是用抽象的方式进行思考来实现。这个思考过程多数时候甚至没有具体场景，无法被描述，因此魔法很多时候被认为"凭感觉"，是需要**练习与感悟**才能掌握的，也对**天赋**有严苛要求。\n\n#### 精神力与弦激发的关联\n\n控制魔力的能力被称作精神力，是一个人造概念，作为评判个体施法能力的一大重要标准。精神力由生理结构，意识运行等多重因素决定，主要包括两个领域：\n\n- 范围：生物电能覆盖的范围越广，能感知到的魔力变化就越多，精神力与这种**感知能力**息息相关。\n- 量级：电场强度决定了能同时被耦合的闭弦数量，精神力越大，能同时操控的魔力就越多，这种**操控能力**也是精神力直接决定的。\n\n---\n\n## 法阵与魔法\n\n### 法阵的杠杆原理\n\n生物电信号本身不足以直接激发原质，但它可以启动法阵上的激发符文。\n\n多数生物魔法都要依赖法阵实现，法阵之所以必要，是因为生物电的能量太弱了。\n\n法阵的本质是一台 **"强化谐振器"** 。法师输进法阵的魔力会分成两部分：一部分通过法阵转化为**强大的特定电场信号**，这个被放大的电场信号再作用于另一部分魔力，帮助生物完成他们自身无法触及的信号强度，从而实现魔法效果。\n这就是法阵的杠杆效应，消耗少量魔力撬动大量魔力。\n\n### 法阵的核心部件\n\n一个完整的法阵在精密度上不亚于电路板：\n\n- **献祭窗：** 法阵运行需要将魔力送入法阵以提供原料，献祭窗就是专门留给物质输入的接口。\n  其之所以称作献祭窗，是因为在很多炼金、契约、召唤等法阵里，它也用于放入介质原料。\n- **激发符文：** 它们通常刻画在献祭窗边，拥有几类固定样式，作为法阵的启动器和放大器，其核心功能是将惰态魔力转化为电能。生物电流经激发符文时，符文的几何结构会形成一个微型谐振腔，将原质子直接激发为电子备用。想要使用法阵就得先激活激发符文，换言之，**一个没有激发符文的法阵是无法启动的**。所以也可以通过留空激发符文来制作机关法阵。\n- **魔力路径：**魔力路径分为两类。\n\n  - **魔力控制路径：**魔力控制路径等同于电线，用于传递激发符文中的电子，也可以用于辅助核心语、放大电场等。\n  - **魔力传输路径：**魔力传输路径等同于管线，用于运输魔力进入不同部件，也可以运输其它介质。\n- **魔法符文：** 这是法阵最复杂的部分，直接决定法阵功能。魔法符文又称作核心语，并不具备文字的特征，是一组精度要求极高的特定图案。它的作用是通过路径变化塑造电场形态，从而**调控激发频率**。核心语就像一个模具，同样的魔力倒入不同的模具，会产生不同的魔法结果。\n- **魔法出口：**魔法出口是能量和物质的释放通道，为调制好的质能提供导向，决定魔法的作用域。没有出口的法阵就像没有枪管的子弹，只会炸膛而无法爆发威能，但也可以剑走偏锋，利用无出口法阵创造**不可控**的炸弹。\n- **基盘：**基盘承载法阵的完整结构，主要有三大功能。\n\n  - **结构支撑：** 刻画魔力路径和符文的场所，使其更加稳定，便于长期多次使用。\n  - **热管理：** 弦耦合过程中会有能量损失，主要表现为废热。基盘材料需要快速吸收并散逸这些热量，防止其它部件过热损坏。\n  - **噪声过滤：** 环境中存在大量杂散的开弦振动，可能干扰法阵的精确耦合，高纯度晶体的基盘可以吸收这些噪声。\n\n由此可见，法阵的**精度**是很有必要的！绝非等闲之辈能掌握的技术。就像有机物的反应一样，即使最精准的法阵也无法做到零误差。微小的形变偏差也会导致少量闭弦以错误的频率投影，产生意料之外的副产物。多数情况下，这些副产物少到宏观不可见，但如果法阵偏移太多，就可能产生严重的**魔法事故**。\n\n### 魔法编程学\n\n在多数魔法依赖法阵的情况下，魔法反倒变得较为可控且易推理。通过组合现有的符文以及改良魔力路径，能总结出具有普适性的辅助法阵，创造出很多性能更优秀的改良法阵，或是功能更多样的复合法阵。\n\n但完全创造新魔法是一门极其考验运气的学问——核心语的形状与魔法效果之间的对应关系不是三维空间中的直观逻辑，它**取决于高维空间**的拓扑结构。排除极少数天才，高维空间结构对于多数人来说都是**无法用三维直觉推导**的。因此，发现新的核心语**几乎完全依赖穷举**。历史上大多数核心语都是在意外中发现的，如某个法师画错法阵，却意外得到一个有用的新魔法。\n\n\n### 多样的施法方式\n\n常见的施法方式分为三种：介质施法、虚空施法、直接施法。\n\n- 介质施法：使用物理基盘的法阵。基盘提供了稳定的几何参考和热管理，**容错率高且能复用**，适合长时间、复杂的魔法。绝大多数法师都采用这种方式。\n- 虚空施法：法师用精神力在空中直接构建魔力路径，不依赖物理基盘，**更加灵活快速、便于调整**。但没有基盘辅助，这些法阵通常不够稳定，只能用作一次性施法。\n  同时，施法者需要同时维持路径形状和控制能量流动，相当于一边捏陶一边烧窑，对精神力和熟练度都有很高要求，很容易因为走神而失败。\n- 直接施法：法师直接用精神力控制魔力变化，**施法速度最快**。但废热和副产物会直接作用于施法者自身，且有很高的精神力门槛，对使用者要求苛刻。通常只有具有特化效应器官的魔化种能做到。\n\n---\n\n## 对全部体系下魔法原理的解释\n\n### 光明魔法\n\n光明魔法的底层原理是利用光子的高能特性，将这些能量转化为所需的效果：\n\n- 治愈：直接将能量供应给生物细胞，优先补给伤处和免疫系统。这些能量不会变成ATP，而是在填补各类反应的能量门槛，简易化柠檬酸循环等过程的进行。本质上是加速新陈代谢、生物自愈，所以仅能处理简单病症和伤口，快速止血等，让人感到舒适。\n- 防御：光明护盾主要依赖热能防护，最核心的其实是一层高温等离子，其伴随的实体多是耐高温的晶体颗粒。这些晶体颗粒被创造出来，排列在一起并发光组成光盾。光盾本身的物理性能很差，但它伴随的高温会熔化袭来的物质，同样也可以灼伤接触的对手。\n- 攻击：攻击主要分两种。一种是类似光盾，用高温晶体刺等实体进行杀伤；另一种类似激光或热能灯，用高能进行灼伤损毁。\n- 增益：祝福魔法的本质和治愈其实没多大差别，都是供应能量。只不过祝福魔法优先供应给运动细胞、神经细胞等，形成体能加护、精神加护等效果。\n\n### 死灵魔法\n\n死灵魔法虽然多数针对尸体，但他们仍属于有机大分子，且有成型组织，就仍然有操作空间：\n\n- 控尸：对于尸体，死灵魔法是通过发送电信号控制其身体组织，同时补充能量让其有能力完成基础运动。对于组织同理，一条断臂都能在控制下活动。但对于神经系统严重破坏的器官，或者单纯的骷髅，是无法控制的。\n\n#### 诅咒详解\n\n诅咒并不是什么原理高深的魔法，它和炼金术的本质一样，都是改写物质。所以诅咒魔法对魔力消耗非常大。\n\n正常情况下，生物体的开弦维持着一套稳定的振动模式，这套模式决定了身体的健康状态、器官功能、思维模式。诅咒法阵的核心语会生成一种干扰场，将其中的某些振动模式偏移。\n\n诅咒魔法的对象不限定：\n\n- 为了锁定目标，诅咒法阵需要通过献祭窗中的媒介（如目标的头发、血液）捕获目标的遗传特征，生成一个畸变的干扰信号，再进行释放。\n\n- 诅咒魔法也可以范围性生效，只需要撤除献祭窗中的媒介即可，但要注意作用范围。\n\n按作用对象，诅咒可以分为两类：\n\n- 肉体诅咒：干扰构成身体器官的开弦振动，使其偏离健康状态。常见种类如：\n\n  - 衰败诅咒：加速细胞的衰减周期，使伤口无法愈合、器官快速老化。\n  - 石化诅咒：将细胞的开弦频率向金属盐的方向偏移，使皮肤逐渐硬化。由于只有一个范围，转化的物质种类随机，不是固定石质。\n  - 疫病诅咒：仿照病原体的开弦振动，在目标体内制造病毒。但此类诅咒需要将病原体放进献祭窗以供核酸复制，对材料要求苛刻。\n  - 致盲诅咒：切断视神经，使眼睛无法处理光信号。\n\n- 精神诅咒：干扰大脑神经元的开弦振动，影响思维和感知。常见种类如：\n\n  - 迷乱诅咒：在目标的大脑中注入噪声，使其无法集中思维。\n  - 恐惧诅咒：放大目标与恐惧相关的神经感知，使其持续处于恐慌状态。\n\n解除诅咒可以：\n\n- 解咒魔法：用另一个法阵生成与原诅咒相反的干扰信号，将开弦状态复原。但目标是不断变化的，最终必然与初始状态存在偏移，所以普遍认为诅咒无法完全治愈。\n  而且这种方法需要获取原法阵信息。如果是定向诅咒，还能凭借阅历反推；如果是施法者随机捏造的混乱诅咒，不仅反推困难，在法阵被销毁的情况下，解药便无处可得了。\n- 物理治疗：对于较为浅显的诅咒，例如断肢、瘟疫等，直接使用药物治疗都能恢复。但面对精神诅咒，或是毁伤过于怪异的诅咒（如石化诅咒），只有通过解咒才能治愈。\n\n从某种角度来说，诅咒和解咒就像加密与解密，本质是一套依赖法阵实现的算法。\n\n但每次施放诅咒，诅咒法师自身的开弦也会受到一定程度的干扰，长期施咒会导致法师自身的开弦模式逐渐紊乱。\n这种紊乱属于混乱诅咒，且作用于全身，完全不可逆，表现为：身体器官功能失调、情绪不稳定、精神恍惚、意外增多。\n这也是人们常说的诅咒反噬。\n\n### 元素魔法\n\n元素魔法和炼金术类似，都是创造物质并组合，不多做叙述。\n\n 生命魔法\n\n生命魔法从根本上分为两种路线，治愈和再生。\n\n- 治愈是通过魔力为目标提供身体自愈所需的能量和物质，如ATP、氨基酸，加速目标的自愈过程。一些高级的治愈术还能利用生物催化剂，甚至人造干细胞，大幅加速这个过程。\n- 再生通常针对器官，会按照一个肢体的标准公式，结合目标遗传信息进行肢体重塑。再生术不仅对魔力消耗巨大，还非常考验法师的理解，需要根据目标状态灵活变化。\n\n操控植物则是利用各种信息素与催化物质，来实现对植物的控制，或者大量消耗魔力让植物疯长。\n\n### 心灵魔法\n\n心灵魔法和诅咒类似，不多做描述。\n\n### 炼金魔法\n\n炼金术的核心是献祭。\n\n献祭的底层逻辑是弦的等价交换，将献祭窗中放入的开弦端点由法阵闭合，转为闭弦能量。\n当法阵启动时，献祭窗中的物质被转化为魔力，可以提取魔力，也可以连锁其它符文直接释放魔法。\n\n但是献祭类法术研发难度更高，不同物质对应的频段不同，核心语也要有相应的变化。\n现有的献祭魔法都只能针对特定物质。\n\n附魔技术将法阵或魔法效果附在物品上，进行武器附魔、防具强化等。实际上已经接近魔导科技技术，不过没有那么复杂。\n\n### 其它技巧注解\n\n一些高级魔法的原理非常复杂，这些魔法的开发难度大、学习成本高、普及率极低、使用风险高，不是失传便是禁术。\n\n#### 传送类\n\n传送的本质是让开弦暂时脱离弦盒，在高维空间中移动，再回到弦盒。\n\n传送法阵的核心语会将目标区域内的所有开弦端点从弦盒中剥离，称作游离化，引导其沿第四维坐标移动很短的距离，快速到达目的地。\n开弦到达目的地后，如果是双向法阵，另一端会接收锚定信号，端点将按照原有的组合顺序固定回三维空间。单项法阵则需要自己完成开弦的固化，\n传送距离越远，寻找路径需要的时间越长，魔力消耗越大。\n\n传送法阵是很危险的。虽然超长途传送过程也不会到半秒，但传送本质上是将目标拆散重组。如果过程中被破坏，或者管理重组逻辑的符文被破坏，目标要么从世界上消失，变成游离的弦在高维空间飘荡；要么被混乱重组，一个完整的人会变成一滩血肉。\n\n#### 契约、召唤类\n\n这类魔法并不存在于帕拉里斯中！\n\n## 信仰的真实作用\n\n信仰在物理层面不会产生任何魔力，也不会改变弦耦合的规律，但信仰确实通过以下机制间接提高了施法成功率：\n\n- 生物电稳定：强烈的信念能减少神经系统的杂音，使电场信号更加规律。对于需要精确频率匹配的弦耦合来说，稳定比强度更重要。\n\n- 条件反射训练：反复的祈祷、咏唱、仪式动作本质上是建立条件反射，将特定的生理状态与施法绑定。\n\n- 心理免疫：信仰帮助施法者克服恐惧和犹豫，这两种情绪会产生高振幅的杂乱电信号，严重干扰施法精度。\n\n- 安慰剂效应：如果施法者坚信自己能成功，大脑会不自觉地优化电信号输出。\n\n不同神祇的信徒都能使用魔法，他们信仰的对象各不相同，但控制魔力的神经机制是相同的。'},{id:'宏观魔法体系',title:'宏观魔法体系',content:'**注：此处的宏观体系是针对世界范围的，全部魔法认知的总结，不代表任何个体或文明的认知，也不是由世界观中的文明提出的。意义在于供主持人和玩家阅读，参考相关规则，提供叙事视角注解 。**\n\n生灵们通过古籍、经验和直觉来认知魔法，凭借代代相传发展魔法，认为世界和魔力是由具体元素构成的。\n可惜的是，经过新生纪元十多大文明的千年努力，魔法水平甚至还未能与龙族齐平。\n在无法解释魔力本质的情况下，一切魔法都被视为**神赐的能力**，导致不同属性的魔力之前经常出现信仰冲突。\n\n尽管在物理、化学的发展下，人们对能量和物质的认识逐渐健全，但是魔力的面纱仍然神秘。\n\n## 魔法世界观\n\n与魔法认知高度绑定的，是文明们对世界的认知。尽管从未见过神，但在多文化融合之下，世界形成了一套带有奇幻色彩的多神论世界认知：\n\n在上古时期，众神开辟了世界。光明神化作太阳、构筑星球，生命之神撒下生机，让各类生物得以自由发展。\n神普惠众生，将自己的力量注进世界，世界便有了魔力。随着魔力注入，万物都拥有了灵魂，元素也有了意义。\n而掌管灵魂的便是死神，他与生命之神共同维护生死轮回，保证世界规则的稳定。\n\n而龙族在吸收神力后进化，不仅没有感恩，还霸道横行，肆意占有世界资源。光明神对此怒不可遏，派出天使讨伐龙族，最终亲临世间与龙王对抗。\n怎料龙王过于强大，光明神不得不牺牲自己与龙王同归于尽，大陆也因此崩解重构。\n\n失去龙族的压迫，魔力与元素重新散步世界，精灵、魔族因此而生。\n教会坚信光明神的残念仍在，一直在等待光明神的再临。各大文明借助信仰，开始借用神力，开启发展的篇章。\n\n**注：一切创作和叙事中的世界认知建立在这段基础上，不要被其余文档中的底层原理解释给误导！**\n\n## 文明认知中的魔法\n\n尽管矮人从未停止对魔力的探索，也提出了很多假设，但人们从未了解到魔力的本质。不管科学体系再怎么完善，少数科学家们多么坚信魔法不是超自然力量，它始终有一层无法解释的神秘面纱。\n因此对于绝大多数的人来说，魔法自然要以神的名号去解释。即使要进入蒸汽魔导时代、电子信息时代，神话魔法论还是更容易被人接受。\n\n用神学、元素论和代代相传的经验，不同地区的文明编织了多套自洽的魔法认知体系，连同神话体系一起。这套体系在新生纪元的世界闭环后（约470年），开始被学者们系统地整理和比较，最终形成了跨文明的魔法分类框架。\n然而这份框架并非真理，它充满了误解、偏信和神学包装，乃至形成了一个世界范围的大神话体系。但它确实可用，也确实帮助一代代施法者掌握了魔法。\n\n在文明眼中，除去部分奇异的魔法，多数魔法被分为六大学派。每一学派都有自己的神学来源、施法传统和文化归属。\n\n### 光明魔法\n\n光明魔法是以光明教会所开创、为代表的流派。教会认为，一切光明魔法都是光明神通过信仰赐予信徒的"圣恩"，魔力是虔诚的回报，并不是客观存在、可研究的自然现象。\n\n通常，来自教会的光明法师会通过咏唱，以及圣徽、圣物作为介质进行施法。\n他们认为，光明神将光注入虔诚信徒的灵魂，通过信仰管道传递。咏唱是开启管道的钥匙，圣徽是汇聚圣光的透镜，越虔诚则引动的魔力越强大。\n\n光明类魔法通常表现出在生理学角度上对生物有利的特性，或是在物理上与火焰等发光体有相似特性，如高温、高能。常见用途有：\n\n- 治愈：加速伤口愈合、接断肢、净化毒素。\n- 防御：构建屏障抵御攻击，或者利用高温熔化物质攻击，但对能量攻击无可奈何。\n- 攻击：攻击形式通常离不开光热，使用灼热的圣光w进行杀伤。\n- 增益：祝福目标，可以增强体质、意志或武器。\n\n### 死灵魔法\n\n魔族相信力量存在于万物必经的终结之中，死亡仅是形态的转换。死灵魔法的则是在借用终结的力量，从尸体、亡灵中提取魔力，并让那些已死躯体的灵魂为己所用。\n同时，魔族认为是死神在掌管生命的终结。他们每一次施法都是在和死神交涉，甚至在从死神手中抢走濒死的灵魂。所以魔族对死神尤为敬重，生怕自己的魔法越界触怒死神。\n\n死灵魔法讲究以介质为核心，通过血液、骨粉、组织，配合符文和法阵完成施法，所以它也经常被称作血肉魔法。\n\n死灵魔法的作用效果在根源上离不开生物，高度依赖作用对象。但死灵魔法的作用域实际上非常单一：\n\n- 控尸：赋予尸体、组织临时活性，使其成为仆从。\n- 诅咒：施加负面效果，多是生理性的。诅咒带来的反噬被视为必然，是与死神博弈的代价。\n\n死灵魔法其实也是对生死的一种见解，只是方式比较直白。其与生命魔法在哲学上互相理解，但在手段上截然不同。\n\n### 元素魔法\n\n人们观察到火、水、风、土四种基本力量构成了世界，认为四大元素是所有物质的构成基石。他们认为每一种元素背后都有对应的灵体或神祇，施法本质上是请求这些灵体产生效果。\n实际上各文明均有元素魔法，只是在博茨瓦岗洲尤为发达，成为一大特色。不同文明对元素之灵的态度不同：多数人和精灵视其为平等的自然力量，光明教会视其为光明神的下位仆从，魔族视其为可征服的原始力量。\n\n这些元素魔法都依靠符文和结构的相互组合，通过独特的排列技巧来组合法阵，实现精密的物理效果。\n元素之间并不存在克制关系，元素法师的强弱只在于想象力和创造力。\n\n### 生命魔法\n\n在艾丽尼亚群岛，精灵尊重一切生命。他们的自然魔法不造成伤害，聚焦于对生物的**催化及诱导**，同样被称作生命魔法。\n\n精灵坚信生命的存在是一种概念，母树则是生命之神的化身。他们认为用声音模仿自然的韵律，让自己的魔力融入其他生命的旋律之中，就能和生命共鸣。\n\n之所以会有"自然魔法"和"生命魔法"两种称呼，是因为这类魔法通常具有以下效果：\n\n- 疗愈：治疗生物的各类严重伤势。\n- 再生：高位魔法能直接补全生物残缺的躯体，实用性强于光明魔法。\n- 驾驭植物：可以操控植物、改变植物，这是"自然"的体现。\n\n### 心灵魔法\n\n心灵魔法，又称精神魔法，源自魅魔。她们坚信生物拥有灵魂，执着于对灵魂的研究。\n她们觉得，心灵之海是所有意识共享的底层空间，每一个思考着的生命都在其中漂浮。通过在心灵之海中制造涟漪，就可以使目标接收到施法者设计的信号。\n\n心灵魔法不只是简单的法阵，还经常通过视觉接触、声音、气味等多感官触发。\n\n虽然心灵魔法大多非常困难，但其效果是相当强大的：\n\n- 幻象：可以在目标感知中插入虚假的视听信号，形成小范围的幻境。\n- 情绪操控：干扰目标的思维过程、情感状态，放大或抑制特定情绪。\n- 感官影响：扭曲目标的时空感知，产生空间、时间的感知误差。\n\n### 炼金魔法\n\n炼金术因为冒险者公会而流行，并在后续传播到世界，催生一种高阶职业炼金术士。\n炼金术的信仰色彩非常淡薄，炼金术士更依赖实验和经验，通过魔法改造世间万物，是所有魔法体系里最理性的。炼金术士认为物质由基材和精粹组成，转化就是在不改变基材的前提下替换精粹。\n\n炼金魔法依赖复杂的转换符文，需要多项法阵结构组合，往往还需要各种介质辅助。虽然炼金过程包含了很多化学反应，但起到核心作用的还是魔法，所以和化学有着本质上的差别。\n\n实际上炼金魔法更像一个高级化学生成器，它能平替很多需要复杂条件的反应：\n\n- 物质转化：改变物质的物理或化学性质，不仅是普通的点石成金，还可以改变物质性质，如金属软化、水油互换、硬度提升等。\n- 药剂炼制：利用魔力容器特性制作魔法药剂，可以治疗、补充魔力，效果远大于自然成分药。\n- 装备附魔：将法阵或魔法效果附在物品上，进行武器附魔、防具强化等。实际上已经接近魔导科技技术，不过没有那么复杂。\n- 材料处理：从魔物材料中提取有效魔法成分，进行晶核精炼、毒性分离等。\n\n炼金术在后期和魔导科技已经紧密结合，物理化学体系的成型也让它越来越科学化，很多炼金术士多少都掌握一些魔导技术。\n\n\n---\n\n## 位阶体系\n\n### 法师位阶\n\n世界依照施法者的能力将其划分为若干位阶，方便对法师进行实力评判。\n位阶的主要分类标准是精神力与阅历，尽管表述不同，各文明都同意两点：精神力决定了能操控多少魔力；精神力可以通过某种方式来提升。\n\n具体认知存在细节差异，归结于各文明的文化：\n\n- 教会派人类认为精神力是光明神赐予的恩宠，虔诚祈祷可以增加这份恩宠。\n- 非教会派人类认为精神力源自人的意志，意志随着修行和磨练而强大，意志强大者可以征服更多的元素和魔力。\n- 魔族认为精神力是对死神的敬畏，对生死的正确运用与掌握会使其增强。\n- 精灵认为精神力是与生命的共鸣深度，亲近自然、静修冥想可以深化共鸣。\n\n其余种族缺乏魔法天赋或者高等智慧，并未思考过这些问题。\n\n法师主要依照能力分为三层：\n\n| 称谓                         | 能力范围                                         |\n| ------------------------------ | -------------------------------------------------- |\n| 学徒法师                     | 仅能感知魔力（初步灵视），难以施法，和普通人无异 |\n| 法师                         | 能操控魔力移动，但是这些法师往往要依赖物理法阵   |\n| 大法师（魔族中特称上位魔族） | 已经能进行虚空施法，不依赖物理基盘               |\n\n对于精神力位阶，有两大严重误区需要排除：\n\n**位阶绝对不能用来评判法师的实际能力，核心在于法师的经验积累与应变能力。经常出现学徒法师的知识储备大于法师的情况，也有很多因为生疏而无法发挥天赋的大法师。**\n\n**三个位阶的界限很模糊，实际差异并不绝对、也不明显。有些法师专精于单项魔法精益求精；有些法师精神力强大，只是由于生理限制无法****虚空施法** **。这些都不代表他们比大法师弱小，称谓只是概念划分。**\n\n精神力则从低到高，不均等分为0~20阶。每一阶精神力都是指数级上升，即使是能达到两位数精神力的法师都非常稀有。\n\n### 魔法位阶\n\n魔法按照其复杂度简单进行划分：\n\n- 低位魔法：基础的法阵，通过单个符文和辅助结构实现功能。\n- 中位魔法：多个符文组合，实现单一功能。\n- 高位魔法：多个效果组合实现组合功能，复杂度通常已经可以独立计算，无法系统性归类。\n- 超位魔法：非常生僻的符文，高精度的路线，大多都需要多法阵组合。多数超位魔法还具备立体结构，研发、绘制和使用都相当复杂。\n\n同样的，魔法位阶分类也不绝对。实际使用时，魔法威力很大程度受**法阵规模**和**魔力量**影响，一个巨大的低位法阵威能可能大于高位魔法。\n\n而复合魔法概念比较随意，多个法阵的组合既可以算作高位魔法，也可以算作法阵组，怎么归类众说纷纭，无明确定义。'}]},{id:'世界简史',title:'世界简史',content:'世界总体来说分为三个阶段，远古纪元、龙纪元、新生纪元。\n\n远古纪元是星球原始地理格局塑造，与种族、文明早期发展的时间段。\n\n龙纪元时，星球经历人为的巨大变迁，打开了新生纪元的独特格局。\n\n新生纪元则相对稳定，大小文明摩擦不断，但并没有发生毁灭性的灾难。',children:[{id:'远古纪元',title:'远古纪元',content:'远古纪元时，世界架构与早期生命开始形成，这也是文明们为数不多的安宁时刻。\n"创世之石"在这一阶段的作用非常关键，它们随着地形变迁流落在世界各地，导致的"自然魔法"成为改变世界的重要力量。\n\n---\n\n## 早期星球形成\n\n### 0年~2.3亿年：熔融球\n\n和大多数行星一样，帕拉里斯通过常规天体吸积形成。此时的世界是一个平平无奇的岩石行星，世界是一团炽热的熔融物质，原质在复杂环境的干扰下根本无法发挥作用。\n\n### 2.3亿年~4.4亿年：四次"地壳大塑造"\n\n四颗"原质奇点"同时受到引力捕获，坠入帕拉里斯，极大加速了星球塑造进程。\n\n奇点在机缘巧合下孕育了大量自然魔法，先后产生总共四次"大塑造"，这些地壳大塑造让星球开始变得宜居。\n\n#### 2.5亿年~3.6亿年：地壳降温与固化\n\n随着电磁场的增强，热能开始大批量地被固化成原质，原质又不断地转化为其它物质，让地壳经历了一次迅速的降温。\n\n- 地壳结构：降温后形成的"原始地壳"不同于地球的板块构造，是一个完整的岩石球壳。虽然避免了地震，但地幔层的熔岩流动时常导致地表破裂、火山喷发。\n- 地形：值得注意的是，在混乱的环境下所凝聚的地壳，表面并不平整，山丘、裂谷、悬崖比比皆是。"原始地面"的复杂起伏是导致后期复杂海底地形的主要因素。\n- 有机物产生：在自然魔法和混乱环境的作用下，无机物转化为了有机小分子（如氨基酸、核苷酸），进一步形成有机大分子（如蛋白质、RNA）。\n\n#### 2.9亿年~3.8亿年：大气凝聚\n\n有趣的是，早在藻类生命甚至海洋出现之前，氧气含量就在自然魔法的复杂作用下达到了较高的程度，大气臭氧层初步形成，能阻挡致命的紫外线。这大大加速了后续的生命进化历程。\n\n#### 4.3亿年：超级海洋与原始生命的出现\n\n在一场持续六千万年的史前大雨下，覆盖整个地壳的**超级深海**形成。\n\n- 巨量级深海：最深达十万余米的海洋抢在大陆板块之前覆盖地壳，是"海底断层"现象的根本成因。深海地热使水保持液态，让海底的水不至于被千兆帕级别的水压压成冰。\n- 简单生命的繁衍：随着海洋形成，全球进一步降温，环境逐渐稳定下来，为细菌、病毒的生存创造了条件。不同于地球，帕拉里斯上不存在厌氧生物的繁荣期，因为海洋形成时，氧气含量已经足以供需氧生物繁衍。蓝细菌很快出现，在大量蓝细菌的努力下，这一阶段产生了**巨量的氧气**。\n\n#### 4.4亿年：大陆板块聚合\n\n又一层岩石在自然魔法作用下产生，但并未覆盖整层海洋，而是形成一块漂浮的巨型"远古大陆"，也称"泛古陆"。泛古陆才是陆上生命发展的主要场所，而非原始地面。\n由于自然魔法的不稳定，大陆内部常有巨大的空洞，形成气囊，降低了大陆密度，才让整片泛古陆得以漂浮。\n\n- 海底断层：由于超大陆整块漂浮于海面（类似于冰山），对于地上生物来说，海洋被分成两部分，而"海底"一共有两个。这是帕拉里斯独有的"海底断层"现象。\n\n  - 浅海、海底：被淹没在海平面下的大陆部分，即俗称的"浅海区"，这一部分的"海底"直称为"海底"。\n  - 深海、海床：曾经的原始地面才是真正的海底，对应"深海区"，深海的"海底"被称为"海床"。\n\n---\n\n## 原始生命出现\n\n### 4.4亿年：高等植物起源与海洋生命\n\n一个原本游逛的真核单细胞吞掉了一个能进行光合作用的原核生物，但没有消化它，而是驯化成了叶绿体。藻类植物就此诞生。\n\n同期，节肢动物和早期脊椎动物在海洋混战，甲胄鱼登上历史舞台。\n\n### 4.42亿年：藓类植物登陆与土壤积累\n\n此时臭氧层已经积累到一定厚度，挡住了陆地的致死紫外线，使得生命登陆有了理论层面的可能。但是这时陆地没有土壤，主要是尖锐坚硬的原生岩石区。\n海洋边缘的浅居绿藻踏上陆地，演化成藓类植物开启菌根共生。真菌释放强酸粉碎石头提取矿物基座给植物，植物还以用光转化的糖类。这就是土壤积累的起源。\n\n而在这时，植物已经开始注意到"魔力蛋白"的存在，第一批成功合成魔力蛋白的藓类植物开始运用魔力蛋白。正是这一起源性的结合，导致后续植物几乎全部是魔化种。\n\n### 4.53亿年：蕨类植物与虫族登陆\n\n裸蕨类横空出世，进化出维管组织。由于脱离表面吸水方式限制，植物终于拥有了立体生长的底气。\n迅速地，蕨类进化出"木质素"来支撑身体向阳光发起百米冲刺，无根、几米高的古蕨树出现。巨型的石松（如三四十米高的鳞木）、高大的树形蕨类共同统治世界。\n\n广袤的史前原始森林开始进行疯狂的固碳作用，导致当时大气含氧量过高，陆地遍地是深厚的沼泽。无数断木后来深埋地下，最终形成了煤炭。\n因为高氧气浓度，最早登陆的虫类体型暴涨，半米长的巨脉蜻蜓、数米长的巨型马陆比比皆是。肉鳍鱼肉鳍鱼类学会了用肺呼吸、用鳍爬行，爬上浅滩演化出了两栖动物。\n\n需要加以区分的是，此时的虫类仍是传统意义上的"昆虫"，而非魔化种"虫族"。\n\n同时，在无人注意的深海，高温高压环境与原质促成了另一种独特的生命形式，也是最古老的魔化种："海族"。\n\n### 4.59亿年~4.66亿年：物种大爆发\n\n植物界迎来裸子植物与被子植物，生态迎来繁盛，原始丛林和野草几乎覆盖了整片泛大陆。即使在恶劣的中心沙漠与极地雪原，也有顽强的魔化种扎根。\n海洋植物更为夸张，浅海植物作为生产者，只能沦为动物的口粮。深海植物不面临生存危机，在深海区发展出抗压耐热的海底森林。\n\n随着地表环境不断改善，动物界更是井喷式爆发。\n爬行动物在富氧环境下越长越大，类似恐龙的魔化种"亚龙族"出现，成为霸主级别的存在。\n多数哺乳动物都难以在这些巨物的统治下幸存，只有少部分魔化种才能苟且偷生，在自然选择下魔化种逐渐成为主流，"魔物"开始繁荣。\n\n海洋生态同样繁荣，浅海区的虫鱼没有遭遇过地球上的悲惨灭绝，数量异常庞大。它们在机缘巧合下进一步成为魔化种，整片浅海被塞的满满当当。\n而深海区由于频繁的海床破裂、震动和高温高压影响，除了海族鲜有生物能幸存，但也不乏在极端环境下进化出的极端物种，如"利维坦"、"食海兽"。\n\n这一阶段的生态过于混乱，本就在数量上不占优的智慧种族根本无法发展文明与技术，世界进入很长一段时间的无秩序期。\n\n---\n\n## 早期智慧种族\n\n### 4.66亿年：早期文明\n\n"人族"、"魔族"、"古兽人族"在"物种大爆发"中已经演化出现，各自的境遇却大不相同。但相同的是，魔法和科技水平都极为低下。\n\n#### 人族\n\n孱弱的人类过着生产力低下的原始氏族生活，大体围绕两点聚居：\n\n- 瓦琳妮卡山脉西侧：山脉隔绝了东侧的威胁，人类只需要面对来自西侧的浅海生物，过着还算安稳的渔猎生活。由于季风特殊，雨季太短，农业一直难以得到有效发展。\n- 乌尼尔洲腹地沙漠外缘：躲在偏僻的沙漠绿洲里发展绿洲农业，基本只能维持最低限度生活所需，聚成早期的泰拉西亚古国。频繁面对亚龙侵袭的他们在武装上颇有研究，为日后的战乱埋下伏笔。\n\n在其余各地实际上也有人族存在，但多数都藏匿在原始丛林深处，与猿猴唯一的差别就是会使用简单工具与生火。影响力过于微小，基本可以忽略。\n\n#### 古魔族\n\n除去一枚仍沉在海底的创世之石，其余三颗创世之石都位于涅克洛玛洲，这使得此地生态尤为复杂。\n\n面对海边的巨型森林、高温熔岩湖和火山群、凭空出现的风暴，生物不得不**依赖极端天气带来的魔力**生存，魔化种密度达到最大。\n在一片混乱的物种竞争中，能量需求低、繁衍迅速的"食尸鬼"、"腐殖怪"等低智慧早期魔族无疑是幸存率偏高的，涅克洛玛洲成为古魔族的天堂。\n\n博茨瓦岗洲的人类曾多次向南探索，但难逃成为古魔族口粮的命运，让人类对于这些生物产生难以磨灭的厌恶与恐惧，是人魔种族冲突的渊源。\n\n#### 古兽人族\n\n努尔洲北部的安蒂罗斯山区，过于复杂的地理环境让亚龙难以抵达此处，"兽族"发生了更高级的突变，逐渐向人形进化。兽人氏族凭借不俗的肉体强度、超越其它兽族的智慧，很快成为当地的顶级掠食者。\n\n---\n\n## 龙纪元的开端\n\n在一次雷暴天气，创世之石发生意料之外的反应，附近的亚龙产生惊人的变异，两只龙祖的出现拉开了龙纪元的序幕。'},{id:'龙纪元',title:'龙纪元',content:'在龙族出现后，世界进程简化成了六个字：毁灭、新生、毁灭。\n\n龙纪元虽然只持续了短短的3383年，其中有效的发展期仅有2043年，但对世界带来的影响是绝对革命性的。\n\n---\n\n## 龙族的降临与发展（0年-2041年）\n\n凭借超强的智慧，仅仅用了约200年，龙族很快从本能地运用魔力带来的能量跨步到使用简单魔法。在龙纪元700年内，就完成了对泛古陆的**全部探索**，以及对自身力量的**完全掌控**。\n\n### 统御者降临和客观的秩序\n\n龙纪元0年，也是龙祖降临的那一刻。\n\n凭借对魔力的绝对掌控，以及凌驾于所有种族之上的力量，龙族几乎是横扫了泛古陆中心的亚龙和其它障碍，占据泛古陆中心（现罗格蒂兰的原址）并独霸资源。\n人类、古魔族、古兽人族此时处于石器、青铜器时代，在边缘地带艰难生存。显眼的亚龙无疑是绝佳的食物来源，龙族虽不至于毫无节制地捕猎，但也压榨得附近亚龙数量锐减，客观促进了其余弱势文明的发展。\n\n龙族本性并非残暴不仁，但他们的发展还是在客观上导致了一次小型物种灭绝，所到之处不再有争斗，也不再有混乱的生命。\n而其它的弱小种族，运气好的作为龙族的"宠物"，或是成为可有可无的"储备粮"、"挡路石"。这使得**几乎所有种族对龙族形成刻在基因里的恐惧和服从**。\n\n### 创世之石、超位法阵、环境巨变\n\n在龙族繁衍壮大的过程中，涅克洛玛洲的三颗创世之石被龙族发现。利用创世之石，龙族对部分地区的环境进行了根本性的改造，让荒芜的地方变得宜居，各种奇迹拔地而起：\n\n- 龙纪元0~600年：超大陆偏南部，淮都随着龙族人口壮大而建成，为了压缩住宅面积，龙族也是在这一阶段有了"化人形"的文化习俗。这一大片建筑群都由令人叹为观止的木制榫卯结构建成，分布尽然有序，依靠厚重的城墙与外界隔离。在后来的大陆分裂中沉底变成忒米妮娅。\n- 龙纪元891年：受地形限制，泛古陆中心本是一片荒漠，水汽难以到达。龙族利用创世之石将西部瓦琳妮卡山脉的河流改道，经过中心后汇入东侧托姆山脉。被河流贯穿的是座落于泛古陆正中心的"龙宫"。这是龙族的政治文化中心，呈宫殿状分布。几乎所有的魔法研究与珍贵文献、材料都存放于此。\n- 龙纪元1079年：利用生命魔法，龙族在后艾丽尼亚群岛的板块中心，定点栽培出一颗高达数千米的变异青衫树（即母树），用作休憩、旅游。这是导致精灵族出现的根本原因。\n- 龙纪元1563年：金龙王在澳鑫山脉最东侧内部建立"南极寝宫"，一颗创世之石被存放于此，连同许多核心魔法技术、稀有材料等。经过长期研发，以创世之石为核心的超位法阵组被设置在寝宫底部，用以固结整座山以保护寝宫。\n- 龙纪元1597年：依靠创世之石与超位法阵组，大陆北部矗立着一尊活火山，在最为寒冷的北部形成反自然的"北极两仪眼"温泉。\n\n这个时期也是确立地表上三颗创世之石下落的阶段，分别位于南北极与大陆中心。\n\n---\n\n## 外神冲击战役 (2042年-2043年)\n\n创世之石不仅造福着帕拉里斯原住民，也吸引来了宇宙中的贪婪者，导致一场撕裂大地的灾难发生。\n\n而这场战役的名称却不统一，龙族称外神冲击，其余众族却称神龙战争。\n\n### 龙纪元2042年：降临与试探\n\n在龙族开始改造环境时，来自外太阳系的启曙（由龙族命名）就感应到创世之石散发的力量。\n为了夺取创世之石，实现从十二翼到十三翼的飞升，整个族群开始太空迁徙，最终在龙纪元2042年8月6日抵达太阳系。\n\n靠近帕拉里斯后，启曙也发现了龙族的存在，便派出低翼斥候试探。2042年9月21日，当启曙的第一批斥候抵达星球时，两族产生第一次交锋。\n龙族从未见过比它们还要强大的物种，启曙也没料到宇宙中有其它强大的高等智慧体。在两族完全无法理解对面生理结构的情况下，加上巨大的差异让它们根本无法有效沟通、交流，冲突迅速爆发，以龙族迅速歼灭斥候队告终。\n\n冲突历时极短，但对双方都造成巨大冲击：\n\n- 龙族进入全面紧张、戒备，众弱势物种则是惊喜交加——毁天灭地的战斗场景让它们惧怕，但启曙的光魔法又使生灵们坚信这是拯救世界、镇压龙族的神，启曙也是在这个时期有了"神"的名号。龙族虽本着理性思维，但也一定程度上被影响，半接受了这种说法，称其外神但坚信自身才是主宰世界的力量，神只是虚假的噱头。\n- 这是启曙漫长的吞噬生涯中第一次遇到反抗，神母也是第一次不得不用逻辑思维去制定侵略策略，而不再能横行无忌地吸干整个星球。但显然，缺乏实战经验的神母并不是一位优秀的军事家，启曙本可以凭借压倒性优势闪击帕拉里斯，最终却落得两败俱伤。\n神母第一次面对智慧种群，也产生了收编的想法，后续所有的战役都通过光幻术，顺应本土文化将自己包装光明神，并迅速学习文明文化，以便胜利后的管理。\n\n### 龙纪元2043年：灾难性的战争进程\n\n神母发动全面入侵，采用分点打击、逐级进攻的策略，利用低翼启曙进行全方位的骚扰，再凭借分化的高翼启曙的突袭斩首。\n\n- 2042年11月1日：随着低翼启曙从大陆边缘呈包围势登陆，战争拉开帷幕。龙族面对四面八方的来敌，不得不将各大龙王分配到边缘进行防备。\n- 2043年1月19日：驻守大陆东边的土龙王遭遇突袭，一只从未出现过的八翼启曙利用机动性，配合众多七翼启曙展开包围。落单的土龙王被斩杀，龙族遭到第一次重大失利。\n- 2043年1月21日：在龙族意识到问题之前，第二次突袭降临，驻守西边的水龙王以同样的方式遇难 。\n\n这种斩首战术一开始很有效果，但龙族隐约意识到创世之石是敌人的首要目标，迅速作出响应。它们放弃大陆外缘的荒地，集结力量镇守北极两仪眼与淮都。南极寝宫则作为后盾，采取完全隐蔽的策略。\n\n接下来的一个月内，启曙又发动了数次突袭，分别针对北极与中心。但面对众龙王的集结，裁决者不仅没能完成任务，反而白白葬送了生命。\n\n随着裁决者数量的锐减，加上低翼启曙在战争中持续、大量的消耗，启曙不再有全盛时期的恐怖爆发力。神母眼见态势不对，开始转换策略，重点突破两大核心地带。\n\n- 2043年2月23日：神母派遣一只歼星体与大量护航，登录在星球反面，贴着海面低空向淮都挺进，试图捣毁龙族聚居地。在涅克洛玛洲火山群被发现，火龙王和金龙王带领龙族联截击，最终同归于尽。战斗中高温金属撕裂了歼星体，也撕裂了大地，在火山群东侧撕开了一道裂缝，即萨拉默托深渊。这也是为什么深渊里熔岩、矿产与龙化生物遍布。\n\n后期，随着中坚战力的消亡，侵略越发困难。神母终于忍耐不住，亲自下场发动总攻。\n\n#### 光明神传说的起源\n值得一提的趣闻是，被龙族忽视的弱小种族并没有被启曙忽视，启曙注意到了众族与龙族的矛盾。\n\n2043年1~2月，在简单了解了人族、兽人族的文化后，九翼启曙曾多次以天使的身份被派遣渗透大陆进行"传教"，鼓动这些种族"反抗"龙族的压迫。虽然行动非常成功，光明神的形象与动机被树立，但是弱小的陆地种族完全无力参战，只能默默祈祷。所以这个主意很快被启曙否决了，龙族同样不在意这些微小的影响。\n但启曙的洗脑却根深蒂固，加上陆地种族难以窥探战争真相，以至于这份"光明神传说"一直延续下去，成为这些种族生存的希望，乃至**对新生纪元的世界文化产生巨大影响**。\n\n### 2043年3月19日：大崩坏！混沌视界降临\n\n神母率领两只神子直逼龙宫，快速夺下一颗创世之石，迅速窃习了龙族的魔法积累。通过龙族的文献记载了解到创世之石的引流技巧后，神母与神子配合，利用超位法阵组将龙宫所在的板块生生从超大陆上"抠"了下来，并飞向平流层。这就是浮空群岛罗格蒂兰的由来。\n\n在飞升的板块上，龙祖率领众龙王与神母进行决战，残余部队的战场则转移到了淮都。决战一路从泛古陆中心转移到乌尼尔洲上空的山脉交汇点，此时龙王尽数牺牲，神母最终不敌龙族，启动核心自爆。龙祖在生命的最后一刻，献祭力量、舍弃肉身布阵封锁爆炸，才避免了地表生态被毁。\n\n尽管爆炸被封锁，还是导致两山交汇点被直接抹平，成为著名地标光明谷。先前被挖去一块的泛古陆再也无法维持完整，爆炸后，经历了持续数小时的超级强震，**泛古陆沿着地质裂痕解体**，分裂为四大板块和无数岛屿，各大版块开始漂流，进入混沌日。\n\n---\n\n## 环境重塑、物种更迭、板块漂移（2043年-3383年）\n\n### 混沌日的末日景象\n\n正常情况下，尘埃十余年便会落地。但在复杂的环境下，自然魔法频发，各种乱流此起彼伏，最终爆炸产生的尘埃遮蔽了大气层长达500年，这段时间被称为混沌日。\n\n不过尘埃云并非严丝合缝，像是海绵孔一样不规则地在大气中迁移，间期性漏下的阳光。某些区域可能连续数月黑暗，另一些区域可能常年有微弱光照。\n大型原始森林虽然无法维持规模，但<u>小型植物群落得以存在</u>，给了生物延续的机会。\n\n五百年间，所有文明的积累尽数被摧毁，连同大量历史真相一起消失，世界经历一次重创，但也是一次重生。尘埃与雷暴激活了大量原质，自然魔法导致各种异象频发。经常能看见各种各样的光影在云层里闪烁，各种各样的物体从云层里掉出来。\n\n### 种族变迁\n\n混沌日既是一次物种大灭绝，也是一次物种强化。尸横遍野的大陆充斥着各种基因碎片和魔力乱流，大幅加快了生物变异速度。\n\n#### 灭绝\n\n在混沌日的恶劣环境下，寻找食物是一件并不容易的事情。陆地、海洋的大型生物多因为找不到食物而饿死，亚龙、巨虫、巨型甲胄鱼数量锐减，多数巨型原始森林也因为失去阳光而逐渐消亡，含氧量在大火、雷电、魔法的作用下降低。\n\n浅海区的藻类森林在混沌日前几十年内大面积死亡，依赖其生存的鱼类和甲壳类数量锐减。由于浅海有机物沉降减少，深海生物也在食物削减的情况下受到威胁。唯有深海热泉附近的化能合成生态系统几乎不受影响，成为海洋生命的最后避风港。\n\n#### 进化\n\n混沌日的富魔环境不仅使得许多魔化种更加依赖魔力维生，甚至有部分物种在自然魔法的干涉下，快速重写基因产生定向突变，进化成魔化种或拥有魔化器官。\n\n- 人族：人类有两派，分别居住在地表与地穴里，这也形成两个方向。\n\n  - 地表人类：为了适应魔力，大脑神经元特化，生物电强度变得更高，可激活区域更多。这意味着人类终于有能力激发原质，使用魔法。但个体之间存在巨大天赋差异。\n  - 穴居人类：他们变得更矮，魔力能力比地表人类逊色几分，但却在长期与岩矿打交道的过程中，获得不俗的肌肉力量、身体强度和智慧，形成矮人族。这些经验使得他们的科技经验快速积累，是世界科技的前沿推动者。\n- 兽人族：兽人的进化方向分为两派，各有各的优势。\n\n  - 物理强化：这些兽人形成名为"绝缘皮层"的疏魔结构，依靠肉体强度对抗魔法环境，在混沌日依旧自如地狩猎，多数组成魔洛希派。它们被称作自然兽人，但机体强化的代价就是和魔法基本无缘。\n  - 魔法强化：这些兽人和人类类似，并没有完全魔化。但它们强化的重点不在于大脑，而是"半魔代谢"，利用魔力来补全缺少的营养物质。他们拥有更强的环境适应性，甚至可以不依赖捕猎而生存，多数组成迦米莎派。它们属于魔化兽人，拥有一定的施法能力，但多与一些神经密集区绑定，依赖躯体施法。\n- 虫族：巨虫和亚龙的时代虽然落幕，但部分巨虫群落（蚂蚁、蜂类、甲虫等）在混沌日被自然魔法所宠幸，成为一类全新的集群智慧魔化种族虫族。这类针对异种族进行捕食、寄生的大虫虽然已经没那么骇人，但凭借数量优势甚至比触手族难缠。\n\n#### 变异\n\n不光是许多自然种的魔化变异，自然魔法还创造了大量前所未有的新魔化种。\n\n- 精灵族：龙族种下的那颗青衫树冲破云层的覆盖，顽强活了下来，结出两颗"精灵之果"，孕育出了精灵族以保护自己。\n- 天翼族：天鹅与猛禽群落发生突变，在魔法的洗礼下褪去了兽性，洁白的羽翼和丹红之眼，跻身类人魔化种天翼族。\n- 娜迦族：乌尼尔洲的人类吸收了蛇的基因，进化出一种嗜毒为生的半蛇人娜迦族。\n- 魔族（类人种）：早期魔族多为低级生命，而新的类人种魔族则与人类同源。因此人类对魔族并不会有很明显的生理性恐惧，但对古魔族则是基因里的厌恶。\n\n  - 血族：一部分生活在涅克洛玛洲的人类，在自然魔法诱导下与蝙蝠结合发生变异，成为了血族。不同于变成怪物的劣等魔族，这支血脉保留了人类的狡黠与社会性，同时获得了魔化种的力量，是魔族中的贵族。\n  - 魅族：一支另辟蹊径的类人种魅族在涅克洛玛诞生。同样是人类变异而来，但魅魔吸收了大量生物的基因片段，最终以翅膀、尾巴、魔角交媾，诞生了一种以欲望和爱液为食的奇异生物。她们是魔族中最美丽动人、最不像怪物的一支，却也是最致命的诱捕者。\n- 触手族：在自然魔法的聚合下，外神冲击中腐烂的尸体与血肉发生碳链重组，一种强大的魔物触手族诞生。\n\n需要特别注意的是，哥布林族并不在这个时期产生，它们是新生纪元的产物。\n\n### 地理锚定\n\n混沌日期间，约龙纪元2240年，天翼族诞生后受不了地面乱象，天翼族智者侥幸发现残缺的浮空岛超位法阵组草图，试图将正在海上漂流的西风浮屿板块抬升作为净土。法阵竟幸运地意外启动并完成了闭环，分流罗格蒂兰创世之石的能量，让西风浮屿板块就此成为真正的西风浮屿。\n\n漂流的板块相继撞上海底山脉停止运动，逐渐与海底连为一体，使地理区块固定下来。同期，忒米妮娅板块也沉底，淮都废墟变成了神秘的海底城市，埋藏了大量珍贵遗产。\n海面的躁动让海族不堪其扰，最终聚集在普罗地海，通过海底最大的那颗创世之石建立海族圣坛，强行稳住了一片海域，连带上面的岛屿也被静止住。海神岛和静谧之海由此而生。\n\n终于在2599年，尘埃逐渐稳定，落入地表与海洋。但原质带来的影响却未消散，世界进入"高魔时代"，开启新生纪元。'},{id:'新生纪元',title:'新生纪元',content:'新生纪元实际上还能再分为多段时期：\n\n- 封闭期：此时各片大陆之间完全独立，各自发展、互不相干。\n- 中古时期：航海技术发达，大陆之间取得联系，世界重新变成一体。同时魔法与科技迅速进步，工业革命的影子开始浮现。\n- 蒸汽时代：文明完成了科技跨越，工业革命爆发，但战争也一同到来。世界格局开始重塑。\n- 全面战争时期：世界冲突的高潮，大小战争贯穿世界，各地阴暗面开始浮出水面。但战争也推动各国制度进步与完善，同样加快了科技进步历程。',children:[{id:'封闭期',title:'封闭期',content:'在泛古陆分裂后，受复杂历史、地理因素影响，每片大陆上的种族与文明各自面临不同境遇，在新生纪元前期走向了截然不同的路径。\n\n而最与地球人类文明差异的无疑是社会进程：各文明本就有一定的生产力与科技积累，只是受混沌日的影响使得文明无法聚集成固定的社会形态，但无法阻止生产力的持续发展。因而在混沌日结束的初期，很快就出现大量跨越原始社会，实现奴隶制、封建制甚至更高等级制度的民族与国家。\n\n在高生产力下，通常来说，这些文明有民主与独裁两条路径：\n\n- 如果生产力达到极高程度，并且这种生产力是去中心化的，那么确实有可能跳过封建制度。物质丰裕会消除阶级剥削的基础，而技术赋权会让每个人拥有平等的参与能力。\n- 但生产力本身不会自动带来民主，权力结构、文化传统和分配制度才是决定性的变量。如果生产力集中在少数人手里，仍然会落入寡头政治。\n\n而更鲜明的，文化差异带来的发展差异更是显著，**文化是极为重要的历史推动因素**，必须尤为关注。\n\n---\n\n## 博茨瓦岗洲\n\n博茨瓦岗洲的西海岸本就是魔化种的密集地，混沌日让众多魔物，与新的可怕种族触手族泛滥，迷雾树的存在更是让人望而生畏。但魔物泛滥也具有两面性：\n\n- 负面：原本生活在西边的人类被迫躲进瓦琳妮卡山脉，在山脉里艰难地苟活，不断向东逃窜。人们难以有效定居，社会发展停滞。\n- 正面：在长期与魔物斗争的生存危机中，人们总结出了依赖魔物材料使用简单魔法的技术，这使得魔法进程大幅加快。\n\n历经约500年挣扎，人类终于在山区形成初步的社会结构，各氏族开始积累生产力。混沌日结束后，人们终于可以离开山脉，走进平原。\n但大陆东部同样不安全，复杂的森林与丘陵地形与广阔的地貌带来了生产居住场地，也出现种类更加多样的魔物。\n\n值得注意的是博洲的文化：经历了混沌日数代人的挣扎，人类意识到团结是最安全的生存之道，无论是主动还是被动。这形成一种刻在基因里的**和谐互助文化**。总观博洲的发展，即使一开始经历过封建统治，在各种制约下也更接近**半封建半民主**，是民主制度与共同发展的典范。\n\n### 社会建立\n\n0~100年间，人类迅速扩散，在发展初期便迅速走向整体，并形成主流的三种聚居点：\n\n- 前哨站和小型村落广泛地分布在森林与山脉中，采集林地中的资源，但面临魔物频繁侵扰的风险。\n- 常有一些富有的农户与手工业者会共同集资建成庄园。不同于地球上的庄园是领主私有资产，博洲的庄园是中产阶级的聚居点，通常在远离城镇的地方，为了丰饶的土地或稀有资源而建，并拥有自己的城墙、城堡与小型社会系统。通常初建者为领主，后续的外来者则为佃户。\n- 城镇主要坐落在中纬度地区的平原带上，一开始是一些富庶的家族落根，逐渐吸收外来住户后发展壮大。公民在城镇的外围开垦荒地，依赖城墙和平坦的地形抵御魔物侵袭。\n\n随着生产力发展，贫富差距越发明显，城镇与庄园在领主的管理下运行，制度各不相同。\n\n100~300年间，社会形态稳定，早期封建制度开始形成。\n但在小封建制度下，剥削并不严重：\n\n- 魔物随时可能攻城，任何领主若剥削过重，农民就会直接逃往另一个城镇，防御亏空并导致灭城危机。\n- 生产魔法普及度较高，且存有可开垦的大量荒地，多数农民有能力保障自己的生活，对城镇的依附度很低。\n\n为保全人口，城镇管理者必须讨好公民，否则人口流失会导致防御空虚，封建进程推进非常缓慢。\n\n#### 阶级关系特写\n\n受魔法辅助，博洲生产力处于封建鼎盛期水平，甚至有过之而无不及，小农经济发达。在城镇建成后，工商业与手工业迅速跟进，经济体系稳定，自由贸易发达。\n\n地主制转变为一种更加平等的雇佣关系，城主与富农雇佣无地的农户耕作，并分出部分土地作为酬劳。实际上，博洲仅能分为富农阶级和贫农阶级，而非对立的地主、农民关系。\n独裁与剥削的难度极大，除了生产力过于发达导致财富难以出现巨大偏差，文化也是一大限制因素。和平正义的观念已经贯彻居民的认知，任何强封建的兆头都是众矢之的。\n\n### 冒险者的流行\n\n人们有强烈的向外探索的需求，于是冒险者这一职业孕育而生。\n\n一开始的冒险者都是些散户，有的是自发结队外出，也有攒了些名气而受到委托者。当冒险者的数量达到一定程度，约270~310年间，催生了一个中间组织冒险者公会。公会本质上是一个委托、雇佣组织，允许任何合法公民在此发布委托，只收取少量手续费，而冒险者则可以更方便的获取任务。\n\n公会在短时间内迅速发展壮大，冒险者数量陡增，逐渐开始处理更宽泛的业务，从杂物、农事到战斗、科研，成为一个全能组织。\n\n公会的诞生使人类的探索进程显著加速，魔法在组织化地推动下进步迅速，职业与分工体系日渐完善。同时，公会盛行也进一步导致封建统治力量削弱，人们的自由度越来越高，领主的话语权一度下降，甚至依赖雇佣冒险者来抵御魔物、保护庄园。\n\n### 民主制度的建立\n\n随着冒险者公会壮大、城镇规模持续扩充，至310年规模已经到达城市级别。城主面临种种统治危机：\n\n- 城镇的防御越来越依赖雇佣冒险者，公民对社会保障要求逐渐提高。开支逐年增加，而税收却而难以加增。多数城主开始负支出，面临严重的个人经济危机。\n\n- 在教育事业的普及与推动下，年轻一代的公民公开质疑城主统治的合理性。城主发现自己的命令越来越难以执行，乃至卫兵都开始同情改革派。\n- 冒险者公会发展壮大后，开始承担越来越多的公共服务（治安、勘探、救援、基础设施维护），城主的存在日渐淡化。\n\n407年，在持续的多方压力下，某位城主主动提出退位，保留名誉头衔和一部分土地。此举很快得到效仿，直至426年，众城市彻底脱离封建，博洲开启了全球独一份的民主进程。在众群体的努力下，法律逐渐完善，社会规章得到保障，一直延续到电气时代经久不衰。\n\n#### 历史典故：德里克事变\n406年，北境重镇"铁门城"遭遇百年一遇的魔物潮。\n\n城主阿尔德里克三世倾尽家财雇佣冒险者，仍险些破城。战后清算时发现，城主的个人负债已达城镇三年税收总和。\n战后面对公民的质询，一位年轻的历史教师当众发问："一个连自己财政都无法维持的领主，凭什么拥有统治权？"\n\n这个问题引发了全城大辩论。三个月后，城主在新年主动提出退位，成为博洲第一位"名誉城主"。\n人们将这次事件称作"德里克事变"，他也被后世评价为"民主的敲门砖"。\n\n取得自治的城市迅速建立起一套完备的城市机构。\n\n#### 权力机构：公民大会\n\n所有拥有"城镇公民权"的成年居民（在本地居住满2年，并完成一次民兵轮值）组成公民大会，职能包括：\n\n- 制定和修改城镇基本法。\n- 审批年度预算和重大公共工程。\n- 弹劾和罢免所有公职人员。\n\n当城市人口超过一定规模后，公民大会改为抽签选出的**公民代表会议**。\n\n#### 行政机构：轮值委员会\n\n委员会共7人，由公民大会抽签产生，任期仅三年，规定不得连任。分为防务、资源、建设、外交、记录、仲裁（2名）六个职能。\n碎片化的权力使得任何人都不可能在三年内建立稳固的权力基础。委员无薪，但可获得"公民荣誉津贴"（如优先购买魔法装备、子女入学资格等），以防止因贫困而无法履职。\n\n#### 暴力机关：民兵队\n\n所有成年男性公民都有服2年兵役的义务，主要职责为保护城镇。民兵队兼任执法部门，负责逮捕、关押罪犯。\n\n民兵队常设永久队长1名，由公民大会从有3年以上服役经验者中选出，负责日常训练和排班。队长仅负责训练和排班，**无权调动民兵出战**，出战命令需由轮值委员会下达。\n\n### 民主联盟落定\n\n魔物的存在使得城市之间难以建立稳定的陆路联系，每个城市都是相对孤立的防御据点。加上每个城市都能自给自足，不需要依赖外部资源，博洲总体处于一种"邦联制"状态。\n\n各城的法律、税收、外交政策虽然完全自主，但它们都拥有两个共性：冒险者公会、魔物危机。作为跨城市的组织，冒险者公会在各城设有分会。它在客观上促进了各城之间的信息流通和人员往来，某种程度上起到了"准中央机构"的作用：协调跨城市的冒险任务、发布全大陆范围的魔物潮预警。\n\n在各方促进下，于439年，卑津城市联盟结成。各城签订一份《城市互助公约》，条律复杂，但主要针对经济、政治与安全领域：\n\n- 各城的法律、税收、外交政策完全自主，但不得设立关税壁垒。\n- 各城之间不得互相攻击，任何城市遭受魔物攻击时，其他城市必须派兵支援。\n\n### 分类学和炼金术的发展\n\n在这片自由的大陆上，不仅#魔法科学#成就显著，在#自然科学#方面，博洲人同样有着不俗的建树。\n\n魔物分类学可追溯到320年代，冒险者公会的第一任总记录官"艾琳·怀特伍德"编纂了《魔物图鉴》第一卷，收录了博洲已知的二百余种魔物。她的分类体系虽然粗糙，按"危险等级"和"栖息地"排列，但开启了系统记录的传统。到400年代，《魔物图鉴》已扩展至十二卷，收录超过八百种魔物，配有详尽的解剖图和习性描述，成为冒险者的必读手册。\n\n炼金术的理论化是博洲的另一大贡献。虽然并不能解释魔法是什么，但#炼金术士#和#法师#们坚持物质主义立场：魔法效果来自于材料本身的性质，绝非神明的意志。\n约380年，炼金术士"奥兰多"发表了《炼金原理》，首次尝试用一套统一的理论解释魔法材料的反应规律，提出"一切物质都由少数几种基元组成"，与地球早期的"四元素"哲学论类似。\n虽然奥兰多的具体理论后来被证明大量错误，但他严谨的实验方法：控制变量、记录结果、归纳规律，为科学探索与实事精神奠定了重要基石。\n\n---\n\n## 涅克洛玛洲\n\n涅克洛玛洲是魔族的天下。作为后起之秀，除了萨拉默托深渊边的龙化生物和山谷里的独眼巨人，没有任何种族在身体上比魔族更具优势。甚至在混沌日期间，魔族就可以冒着风险外出狩猎，是天然的**顶级掠食者**。\n\n魔族内部的冲突在于"统治权"：人人都想当被尊敬的管理者，渴望最优质的资源与社会地位。从内部冲突中走出的魔族是**激进自傲**的，对外族的态度自然也偏向**征服**。\n\n因而，魔族的发展史一直围绕着权力的转移，在大家族势力和自由势力中反复迁移。\n\n### 家族冲突和长老议会\n\n进入新生纪元，魔族开始扩散，短短70年就占据了富饶的大陆中央。魔族以家族为单位活动，大家族逐渐在各地定居下来。部分小家庭则聚集在一起，出现聚居地。\n\n大家族占据了最肥沃、安全的土地，并持续圈地、扩地，占领了大量领土。随着人口持续增长，野生魔族对土地的需求不断扩大，开始觊觎大家族的领土。\n为了维护自身的利益，147年，十三个巨型家族联合起来，组成了覆盖大半居住地的长老议会，在最危险的深渊边建立议事厅，彰显其威望与实力。\n\n长老议会划定了各家族与领土的界限，对野生魔族采用两税法进行管理，分别针对租地与城镇的居民：\n\n- 领地税：允许野生魔族**租用**家族的领土，但在家族领地内定居、狩猎、耕作的魔族，需将年产量的20%上缴家族。每季由当地领主派收税官清点记录，以实物（粮食、矿石、魔物材料）或等价物品缴纳。作为交换，家族承诺维护领地内的秩序，并调解内部纠纷。\n- 守护税：大家族以"镇守深渊、庇护万民"的名义，向各聚居地征收"守护税"，声称长老议会肩负抵御龙化生物的责任，并禁止外人靠近深渊。税额按城镇规模核定，每年由长老议会统一征收，再按各家族的"守备贡献"分配。但实际上，龙化生物几乎不离开深渊，并没有非常危险。大部分税款都被大家族截留储备，仅有少数用作建立一些形式上的防御工事。\n\n### 城市起义和自治\n\n野生魔族本就可以脱离大家族的保护生存，几十年过去，随着魔法逐渐应用于农业生产与铁器出现，生产力进一步提高。\n\n野生魔族变得富裕，势力开始扩大，城镇规模更加宽泛，多处达到小城市规模，渴望脱离大家族的管制。长老议会非但没有减税，反而以"维护深渊防线"为由，将守护税提高了50%。\n城镇代表多次向长老议会上请愿减税，却被集体驳回。\n\n与此同时，议会内部也因分配不均爆发争执：233年，守卫深渊东侧的三个家族声称自己承担了多数防务，对税收分配过少而不满，要求重新分配。\n争论无果后，他们转而加重对领土的税收，遭到野生魔族的抵制。冲突逐渐激化，遭到部分居民的公开反对，**统治地位受到威胁**。\n\n289年，在当时最大的市镇阖尼拉，一位魅魔"百熙·忧夜"站了出来，凭借其出色的人脉和统御力，联络各地秘密组建起义军。\n随后的292年春，趁各大家族开会时，各大城市同时发难，起义军迅速汇集攻向大家族领土，百熙率军先后灭"希刹利尔家族"与"罗伊家族"，气势正盛。但同年夏季，剩余十一个家族迅速组军，凭借积累的资源和兵力优势将起义军逼退至阖尼拉城。双方陷入僵持：起义军守城有余但**无力反攻**，家族联军**攻城不下**且面临围攻风险。\n\n百熙自知起义军难敌家族势力，于是独自与长老议会对峙，以和平解决为条件要求取得城市自治。\n293年，经过权衡和商议，长老议会最终*承认城市自治**，但还有多项要求：\n\n- 外交权：城市不得和任何势力单独签订条约，需要经过长老议会审批。\n- 行政权：城市的日常行政需要在议会监管之下，重大事项需要经过长老议会审议。\n- 军事权：城市允许拥有自己的军队，但军队规模不得超过城镇人口的3%。\n- 税收权：城市可自行征收城市税，守护税改为"自治贡金"，减半缴纳。\n- 司法权：涉及家族成员的案件需移交长老议会审理，其余由城市自行治理。\n\n同时，百熙提出要求进入长老议会，作为所有城市居民的共同代表，并将议事厅扩建为常设议政场所魔王堡，她作为统领、代表所有城市的魔王。\n长老议会同样意识到，13个家族各自为政、缺乏统一指挥，在面对内部叛乱时反应迟缓，于是通过了百熙的提议，由她担任议会的**常任议长**，并将家族核心势力迁至魔王堡周围。\n魔王实际上承担了协调城市与旧家族关系的使命，在长老议会中被赋予了**较高的话语权**。但城市的自治贡金未能上缴或出现叛乱，都由魔王承担责任。\n\n随着时间推移，魔王堡周围逐渐聚集了服务人员、商人、工匠，形成城市。最终发展为魔王城，成为魔族实质上的首都。\n\n### 政权的回落\n\n293~351年百熙在位期间，始终无法突破议会设下的限制。城市虽然获得了自治权，但每一项重大决策都需要议会审批，城市的发展处处受制。\n她认为自己无法取得议会的信任，但如果王位能够传给一个**家族出身的人**，也许就能打破这个僵局。\n\n她的血族伴侣"琦玡"在起义前就与她相爱，一路辅佐百熙取得起义的成功。在得知百熙的苦恼后，他坦白自己来自"西淋默德"家族，只是怕被百熙拒绝而掩盖了自己的身世。\n百熙很快便接受了这个事实，互相深爱的他们彼此信任，琦玡是她能找到的、唯一愿意站在城市一边的家族成员，她最终选择在251年移交王位给琦玡。\n\n登基前，琦玡的身世意外走漏到议会中，西淋默德家族以"公开身世"为要挟，要求他配合议会的计划篡位。声称如果不配合，将公开他协助起义军的情报，面临处决的风险，而百熙也会失去群众的信任。琦玡虽然精通政治运作，但他低估了家族的冷酷，他以为只要自己照做，家族就会信守承诺放过百熙。\n\n琦玡继位后，家族以百熙的安全为要挟，迫使他联合长老议会颁布《王位继承法》，规定**魅族血脉与女性全部被禁止纳入王室血脉**。但同时也给予魔王多项特权：\n\n- 否决权：魔王有权否决议会关于城市事务的任何决议，议会若要坚持，需获得四分之三以上多数再次通过。\n- 赦免权：魔王有权赦免城市居民的罪行，但前提是监禁处罚年份小于十年。\n- 提案权：魔王有权直接向议会提交法案，议会必须在30日内审议。\n\n同时，他以个人身份争取到一项附加条款：城市的自治贡金从守护税的一半降至三分之一*。\n\n尽管理解琦玡所受到的压力，但百熙还是遏制不住内心的痛苦。被软禁在王堡中，她看着琦玡以魔王身份签署了第一批法令，自治贡金下调、城市获得否决权。法令确实对城市有利，但她无法接受自己深爱的人亲手剥夺了自己族群的继承权。三个月后，她在拥吻琦玡后当面自刎，终年仅81岁。\n尽管百熙落得悲剧，但她的精神被众人永远铭记，后世也尊称这位初代魔王为"革命女王"。\n\n统治权半落回家族手里，并利用琦玡制定了众多对家族有利的法律，但琦玡继位后带来的好处也是显然的。虽然大量民众反对琦玡的背叛，但他同样为城市带来了大量利益，这仅仅是个人情感与道德的问题，不是统治层面的暴政。尽管民众并不爱戴他，但推翻琦玡意味着失去一切，而新的城市领袖尚未出现，城市与家族在百熙的牺牲下暂时维持住了**平衡**。\n\n百余年过去，魔族直到中古时期才终于打破稳定局面。\n\n#### 历史人物：百熙的身世\n百熙·忧夜原是罗伊家族的商业代理，常年往返于各城镇之间，积累了广泛的人脉。\n身为魅魔，她是一位优秀的社交家，同时也有着不俗的政治头脑。\n\n她亲眼目睹家族如何以"守护税"之名榨取城镇财富，目睹了长老议会的内部运作，也曾多次替城镇递交减税请愿却屡屡被驳回。\n当长老议会宣布加税50%时，看着身边的朋友生活越来越困难，她终于下定决心，要为野生魔族争取该有的权益。\n\n### 解剖与医学发展\n\n世界最领先的医学不起源于伤者众多的冒险者，也不来自精通自然魔法的精灵，而是来自魔族。\n\n解剖学在涅克洛玛洲有着悠久的历史，无论魔物还是同族，魔族学者不忌讳解剖尸体。而战争带来的医疗需求，和大量伤亡者提供的实践机会，让解剖学的进步异常顺利。\n301年，在稳定的政局下，血族学者"伊格纳修斯"得以完成《生物结构论》，详细描述了脊椎动物的共同器官蓝图。他是第一个指出"不同种族有共同祖先"的学者，这一论断在两百年后引发了比教会圣典争议更大的风波，却在魔族入侵人类时得到了有力论证。\n\n魅族的同族生育现象一直被魔族所好奇，遗传现象的观察是魔族科学的独特贡献。通过长期记录家族谱系中的性状传递，魅魔"莉莉安娜"发现某些特征（如特定的魔角形状、眼睛颜色）会在后代中重现。她没有摸清基因的底层机制，也没有提出完善的体系，但她的观察记录构成了世界上最早的一套遗传学笔记。\n\n---\n\n## 乌尼尔洲\n\n龙纪元时，乌洲与泛古陆中心邻近，且无天险阻碍，不仅直面多次大型战役，同时也是启曙洗脑活动的尝试点。虽然并未改变外神冲击战役的格局，但对人类的影响却是革命性的：\n\n- 在种种因素加持下，乌洲的光明信仰浓郁，人类几乎依赖光明神提供的信念才在这片地狱活下来，光明教会成了所有人的精神依靠，这直接导致教会取得过度集中的**控制力**。\n- 在启曙的鼓动下，人类本该被激起反抗精神，但苦于和龙族实力差距过于悬殊，人类最终只能不断祈祷光明神的庇护。乌洲的人类文化因此带有两面性的矛盾：\n\n  - 对外带有浓厚的民族主义、排外性与仇恨。龙族是压倒性的强敌，人类无法反抗，积压的愤怒需要出口，最终指向其它异族。\n  - 对内又具有强烈的服从性、软弱性、依赖性。祈祷和依赖教会是唯一的生存方式，质疑教会等于质疑生存本身，最终形成思想钢印。\n\n因而，乌洲陷入一种**高度集权的封建神学统治**当中。\n\n### 教会分裂\n\n混沌日带来的不仅是环境巨变，期间也给乌洲的人类带来一次割裂。\n\n混沌日的异变发生后，人类分支矮人变异而生，但天灾却没有平息的兆头。 人类对龙族的恐惧与愤怒无处发泄，逐渐转化为对内部异见者的猜疑与迫害。教会认为混沌日是光明神对人类降下神罚，但原因无人知晓。于是他们将矮人视作"有罪者"，决定将矮人驱逐出当时人类的主要聚居点（多伦山脉脚下）以换取救赎。\n对于这个决议，多数绝望的人都表示支持，但有少部分人却认为矮人无罪、这种思想过于激进。最终，人多势众的"激进派"将矮人**硬驱逐**进光明谷接受"净化"，两派人之间也出现不可理解、调和的矛盾，"保守派"被放逐南方沙漠。\n\n从此开始，光明教会出现最早的分裂：北教与南教。\n\n### 早期国家建立\n\n#### 拉古教廷\n\n混沌日平息后，北教的狂热分子马上建立起拉古教廷（拉古在古语中意为"解放"），积极探索光明谷遗留资源。在短短50年内，光明魔法取得迅速进步，咏唱施法也开始被主流所认可，并被用于农业生产中，为魔法发展做出巨大贡献。\n拉古教廷没有很分明的国家机构，但内部的高度组织化让它具有一定国家的特性。\n\n#### 大凛国\n\n南教环绕伊腊塔干沙漠分布，主要聚集在西海岸。随着生产力发展，人口规模与进一步扩大，人们迫切需要法律与管理来保护富余的私有资产。\n新生纪元40年左右，一位贤君建立"大凛国"，早期国家出现。\n大凛国已经初步掌握炼铜技术，在制陶、种植、畜牧方面相当熟练，取得一定的文明成果。\n\n#### 吉莉丘利尔城邦\n\n而矮人并没有死在光明谷里，奇迹般地逃向东边，在托姆山脉东侧埋下仇恨的种子。\n矮人社会保留着较为原始的部落制，依靠长老世袭管理。但矮人的生产力水平异常发达，天赋使他们很快掌握了炼铜甚至炼铁技术，建立吉莉丘利尔城邦。\n\n### 教会的统一\n\n随着荒地开垦，大凛国的财富持续分化，私有制快速发展。此时大凛国的疆域已经抵达西南海岸，包括数个大型城池与众多小城邦。\n\n为了统治辽阔的疆域，国王以神使的身份自居，通过巡游维持对各城的控制，各城由世袭祭司家族管理。\n在教会思想的深度影响下，国王可以以"神谕"名义轻易撤换不忠者，发动其它城池的力量进行管理，这让大凛国在一定时间内居于稳定。\n\n#### 大凛国的农奴制改革\n\n新生纪元55年，在国君临终后，大凛国统治权落入其亲信"卡修斯"手中，建立幅员辽阔的大凛帝国。\n\n卡修斯一上任便大肆推行**土地国有化**，将公有土地收归王室，无地者沦为"国有农奴"。统治十年间，他逐步收紧政策，先后颁布《土地法令》《农奴管理条例》，农奴人权被逐步剥夺。他一再贬低农奴的尊严与价值，57年《农奴法典》颁布更是以法律形式界定农奴为"国家财产"，允许地主间的奴隶交易，农奴制正式以法律的形式界定。\n\n同时，为了应对有钱有地的大家族势力并管理农奴，卡修斯大力扩充军队，建立暴力机关、司法部门，但主要维护奴隶主的利益。\n\n#### 农奴起义与血腥镇压\n\n改革不久，64年前后，各地爆发激烈的农奴起义，卡修斯不得已向北教求援。\n\n此时的北教已经经历了三任教主的更迭，早已不是当初那个纯粹的光明教会，第三任教主格里高利一世在利益催使下派出"传教团"镇压起义。\n传教团表面上是去"纠正不敬神谕的错误思想"，实质却是一支魔法武装部队，以"清洗异端"的名义指控起义的农奴，进行暴力镇压，开始形成**对异端施加酷刑以达到震慑**的惯用手段。\n传教团掌握强大的光明魔法，但对卡修斯声称"需要特定仪式和圣物加持"，且每次大规模施法后需休整数月，依此不断从大凛国榨取利益和资源。\n\n67年，经过三年血腥镇压，起义军溃败。但战时生产积极性低下，加上对北教的不断支出，国库大幅亏空。\n\n#### 南北会议\n\n虽然起义军很快溃败，但传教团却没有撤离大凛国。68年，南教在压力下与北教谈判。\n\n格里高利一世承诺保留南教部分自治权，换取南教**承认北教为正统教派**。格里高利一世登基称教皇，改拉古教廷为拉古王国，进行一场自上而下的教会改革。\n教会以**神权分封制**运行，在教皇之下设红衣枢机主教，既是宗教领袖，也是世俗领主。大凛国领土被划分为12个教区，主教以思想审查的名义监视政权运作。大凛帝国逐渐被分化，王室的话语权遭到削弱，各地城主掌握更多的自治权。\n\n而后，格里高利一世沉迷享乐，建立宗教裁判所，用作排除异己、维护统治，给予其**极高的执行权**。红衣主教纷纷效仿，教会内部严重腐化。\n部分旧贵族的利益在改革中被触动，出现了反对的声音。但在教会的异端政策下，加以各王国力量的支持，"异端"很快被铲平。\n\n这次统一使南北分散的文化得以交流互鉴，客观促进了魔法、技术的推广与国家、制度的发展，但也给农奴生活带来沉重的打击。\n\n### 教会统治下的发展\n\n#### 领土扩张与制度完善\n\n新生纪元70~150年左右，人类持续向南部探索，以分封制为基础在南部建立大小城邦。但交通不发达使得城主拥有高度自治权，军政在一定程度上脱离王室的监管。\n扩张期间，格里高利一世去世，格里高利二世继位。新教皇更加腐败，公开出售神职，教廷内部派系斗争越发激烈。\n\n历经长久的斗争，各邦国逐渐形成**宗教宗法体系**：\n\n- 81年发布的《光明教典》衍生出繁复的宗教礼节。教皇为"光明神在世间的唯一代言人"（大宗），红衣主教为地方宗教领主（小宗），城主为更低一级的神权贵族，各邦国继承人必须在拉古教廷接受**三年神学教育**后才能继位。\n- 农奴不但要上交土地税，教会还频繁征收神券，农奴负担沉重。社会一度陷入精神压抑，人们对教会的压迫感到不满，但又无法表达反对，对光明神的信念陷入混乱。\n\n119年，王国向东部的山脉进发，并发现矮人文明的存在。人类以魔法技术交换矮人先进的冶铁工艺和部分锻造技术。乌洲进入**冶铁时代**，农业生产力大幅提升。\n\n#### 帝国分裂与藩镇割据\n\n进入铁器时代后，在经济飞速发展时，教会高层却仍沉迷享乐，疏于对地方的管理。在农产品富余的情况下，大凛王国却仍实施**农奴制**，引发人民强烈不满，阶级矛盾严重。\n\n235年，卡修斯之孙、泰图斯三世继位。泰图斯三世不满教廷频繁征税和干涉内政，次年便拒绝向教廷缴纳当年神券，并公开质疑教皇的世俗统治权。\n237年春，教皇派红衣主教秘密联络各地藩王，暗示铲除叛教者便能得到正统地位。237年夏，藩王联合发表《讨逆宣言》，以泰图斯三世"叛教"为由起兵。\n为了鼓励农奴的战斗欲望，教会作出承诺：参战农奴可恢复人身自由，并分得一小块土地，但必须永远追随光明神的正义。各地农奴积极响应，王城内部也出现反叛势力。在内外夹击下，王室在半个月内迅速覆灭，泰图斯三世被处决。\n\n讨伐战虽然历时极短，但对社会发展具有重大意义：\n\n- 权力中心：讨伐结束后，大凛王国分裂为37个邦国，由原藩王和军事贵族割据。拉古王国却以参战势力复杂为由，委推正统名义的归属，使拉古王国位于**独尊地位**，成为实至名归的教皇国，凭此向所有王国收取高额神税。\n- 社会制度：利用讨伐战，藩王们顺势将贫富矛盾归咎于国王昏庸无能，将矛盾转移到王室上再歼灭，缓和阶级矛盾，顺势进入**封建时代**。但各国统治细则各不相同，未完成制度统一。\n- 精神巩固：教会将先前的压迫全部归咎为大凛国王的暴虐，将教会势力再次包装为解放者，积极分发土地，稳固了人们混乱的信仰。但分配到农民手中的都是荒地，最终仍需服务大地主以租得更多耕地。\n\n#### 扶弱抑强政策\n\n250~280年间，教皇不断运作维持割据状态。当某邦国**过于强大**时，教皇以"异端"名义号召其他邦国**联合讨伐**；弱小的邦国则获得教廷的特别庇护，甚至会减免税款。\n\n- 每年冬至，各邦国必须派代表团参加拉古王国的"光明大典"，这是效忠的象征。光明大典实质却是对各国状态的普查，防止出现失控情况。\n- 宗教审判权被全面收回，邦国间的纠纷由宗教裁判所仲裁，但仲裁结果往往偏向暗地里**出价更高**的一方。\n\n有了国王的先例，各藩王都害怕自己成为下一个被围攻的对象。各国王不断利用教条给对手"戴高帽"，同时还要讨好拉古王国，以免被视作异端，群起而攻之。\n\n同时，拉古王国内部的权力持续扩散，逐渐从教皇分散到一个中央教团手上，成员皆为拉古王国的大贵族。\n\n### 矮人崛起\n\n314年，矮人利用获得的魔法知识，结合自身的先进冶炼技术，研发出**早期魔导器雏形**。开始探索物理学，魔导技术逐渐成熟。\n矮人城邦吉莉丘利尔持续扩建，人口达到数十万，成为乌洲东部不可忽视的力量。\n\n在帝国分裂后，矮人暗中向部分邦国出售武器，加剧人类内战。教会发现后，宣布与矮人贸易为"叛教行为"，将矮人作为旧王室的替代品，全面把矛盾指向矮人。\n但部分邦国包括拉古王国本身仍存在**秘密交易**。教会以跨山讨伐不便为由，迟迟不发兵进攻，仅偶尔公开处决矮人以维系矛盾指向，防止服从和信仰动摇。\n\n### 与世隔绝的娜迦\n\n在人类与矮人热火朝天时，悄然诞生的娜迦族却与外界毫无瓜葛。他们生活在伊腊塔干沙漠深处的绿洲里，泉眼连接地下水，丰富的水资源让绿洲一度成为沼泽。\n\n娜迦族过着原始的采集、农业生活，人口增长缓慢，在母系氏族的运作下繁衍。由于沙漠难以跨越，加上人类无暇探索，娜迦也无力穿过沙漠，两族从未碰面。\n\n### 物理学与蒸汽机\n\n在自然科学方面，矮人是最早将世界视为一台精密机器的种族，锻造传统使他们对物质的运动规律有着天然的亲近感，对物理学发展做出重大贡献。\n\n在300年初，矮人便有了"力"的概念，但力学定律的雏形是在340年由矮人学者"巴林·铜锤"正式提出。他通过观察矿井中的滑轮组、锻造锤的落点和水车的转动，总结出三条朴素但实用的法则：\n\n- 物体在没有外力作用时保持静止或匀速运动。\n- 力越大，运动变化越快。\n- 施加力于物体，物体必回以等大的力。\n  这些法则刻在铜板表面，镶嵌在吉莉丘利尔城邦的公共水钟上。\n\n热能研究紧随其后，蒸汽机的发明并非凭空创造奇迹。弗迪系统研究了水的沸腾过程，发现了一个关键事实：水在沸腾时温度不再上升，但吸收的热量却在不断增加。\n他将这种看不见的热称为"潜热"，并在358年蒸汽机问世前就发表了《论热与汽》的论文。\n\n358年，著名的矮人工匠弗迪发明了蒸汽机。\n矮人很快将这项技术投入进生产中，初用于矿井排水和纺织业，试点试验取得成效后开始全面推广。366年，矮人领地已经全面普及蒸汽机技术。\n由于星球演化时缺少大型成煤期，蒸汽机使用的主要燃料是木炭和泥炭，森林开始被大量砍伐。但蒸汽机的进步还是有限，规模局限在小型生产上。\n\n后续的矮人学者进一步将"功"与"热"联系起来，在367年设计出第一个定量量热装置，并正式提出"能量"概念。虽然精度粗糙，但它使"能量"从一个模糊的直觉变成了可以测量的量，使世界分为"物质"和"能量"。\n\n矮人提出最为大胆的假说，便是认为魔力也是能量。但魔力太难以捉摸，缺乏魔法天赋的矮人也难以系统性地研究魔力，最终仅停留在一句假设。\n这个假说流传到外界后遭到强烈否定，尤其是以信仰为力量源的邻居光明教会。他们非常排斥这种有损神威的说法，连带着矮人的物理体系也被拒之门外，使得这次小型工业革命并未传到人类中。\n\n### 后教会时代\n\n451年，安稳了许久的教会还是生出变革。一位年轻的历史学者在拉古教廷档案室中发现**被篡改的圣典手稿**，暗示光明神信仰可能起源于古代娜迦族，沙漠中也散落着龙纪元时的大型石质建筑遗迹。\n\n学者被宗教裁判所迅速处决，但手稿内容已在暗中流传。\n部分邦国借此开始质疑教会的合法性，出现"原教旨主义"和"改革派"的分化。教会为巩固统治，宣布对所有非人类种族进行全面"净化"。\n乌洲陷入**宗教战争**，教会同时与矮人和内部异见者作战，消耗巨大。过度混杂的地缘政治和东西间隔的地势，也让净化难以推动。\n\n457年，净化的进度甚微，教会不得不暂时停止清洗，教会急需找到**新的外敌**以统一内部实力。\n\n### 天文学的进步\n在教会严密的思想控制下，乌洲的自然科学发展受到严重束缚，但天文与农学是例外。\n\n星图绘制在乌洲有着悠久的传统，在370年代进入了精细化阶段。拉古教廷修道士"佩特鲁斯"利用简易的象限仪和星盘，耗时二十年编制了《光明星表》，记录了超过一千颗恒星的位置。他的工作上是为"理解光明神的创造秩序"，但其观测记录之精确，已经超越了宗教信仰的需要，在后续被人们发掘出了重要天文学价值。\n\n天体运行模型是乌洲科学史上最具争议的话题，因为教会的物理学储备并不足以测算出星球运动。\n420年，一位匿名学者（后世考证可能是一位矮人留学者的笔名）发表了《天体运行论》，提出帕拉里斯围绕恒星运行，不是宇宙的中心。和在地球的境遇不同，日心说没有遭到压制，反而受到教会的推崇，认为他们所环绕守护的是光明神的居所，并开始有了地圆说。\n\n### 哥布林专栏：起源与扩散\n\n哥布林最早的起源地是托姆山脉东侧的深部洞穴系统，这里曾是矮人祖先在新生纪元初期穴居的场所，也是矮人主流社会在向外发展后遗弃的区域。\n当这群已经完全变异的生物在约新生纪元300年首次出现在地表时，他们与矮人之间已经不存在任何可以沟通的文化或语言桥梁。矮人守卫在矿山外围偶遇这些"绿皮小怪物"时，将这些绿皮生物定性为某种洞穴寄生物，就像是矿井里的害虫一样。\n\n哥布林最初只敢在夜间活动，阳光灼伤他们的眼睛，干燥的空气让绿肤藻脱落。他们躲藏在废弃矿坑、枯井、野兽废弃的巢穴里，以小型啮齿动物和昆虫为食。少数矮人矿工报告说夜间听到过奇怪的声音，并经常有女性失踪的案件，但这些报告被当作矿工酒后的胡言乱语，从未被认真对待。\n\n哥布林在乌尼尔洲的早期扩散几乎没有留下任何文字记录，他们从托姆山脉东麓出发，沿着地下洞穴网络和水道系统向外扩散。任何存在稳定食物来源的地方，如农田边缘、城镇垃圾场、牧场外围，都会在几年内出现哥布林的身影。到约400年时，哥布林已经遍布乌尼尔洲东部的丘陵和低地。\n\n他们尤其偏好矮人矿区的废弃矿井，这些矿井提供了理想的栖息环境：潮湿、阴暗、通风良好、远离地表威胁。\n矮人起初用捕兽夹和毒饵来清除矿井中的哥布林，但哥布林有着出色的认知能力，他们不仅学会了识别和避开陷阱，还将含有毒饵的食物悄悄推入竞争对手族群的巢穴中。\n尽管这些活动引起了矮人的警觉，但只要哥布林不被发现在矿井中出现，矿场主就懒得花费成本去彻底清除他们。\n\n而教会对哥布林更是漠不关心。在教会的宇宙观中，所有智慧种族都是由光明神创造并赋予了特定使命的。哥布林没有可供拯救的灵魂，没有值得教化的智慧，没有与光明神相关的任何神话传说。教会的神学家在简短讨论后认定，哥布林是"未在规划中被创造的存在"。这意味着他们被排除在神圣叙事之外，无论存在与否都无碍于神的计划。教会没有声称哥布林是不可接触的异端，也没有宣称消灭哥布林是神圣的使命，哥布林因此既没有遭到系统的迫害，也没有获得任何形式的承认。\n\n他们像老鼠一样存在、繁殖、死亡，无人在意，却也因此积攒了大量人力，得以扩散到世界各地。\n\n---\n\n## 努尔洲\n\n混沌日期间，努尔洲的人类高度分散，几乎遍布大陆。而兽人则称霸安蒂罗斯山区，两族各自偏安。从这一刻开始，就注定了人兽两族未来不会太平。\n\n不像博茨瓦岗洲需要面临大量魔物侵袭，这里的地势更加平坦，魔物种类也相对较少，却略显贫瘠。刚进入新生纪元，身居北半洲平原的人类就发展起大规模农业，以弥补土地肥力的不足。\n同时，人类迅速发明了青铜冶炼法，生产力直线推动，建立起众多国家，在中北部、中部、南部形成规模庞大的国家群。约70年，人类进入其黄金时代。\n\n此时的兽人社会以氏族为基本单位，每个氏族由一位酋长统领。与魔族不同，兽人的社会结构更加松散，没有形成跨氏族的统一政权，依靠狩猎和采集生活。\n但即使这样，兽人也有一样东西是人类无法比拟的：肉体强度。这是兽人后续入侵人类的资本，但过度的自信也导致他们没落。\n\n### 兽人侵袭和人类统一\n\n在没有天敌的情况下，兽人实力迅速扩张。80年左右，兽人开始南下走出山脉，和人类抢夺平原资源。而此时的人类因为土地资源矛盾频发，各国忙于内战，无心管辖兽人。\n随着南下兽人越来越多，北方的卢尼西古国是最先遭殃的。103年，面对兽人的一次小型集结，缺乏防备的它们不到一周便被兽人攻破，居民全部变成食物或奴隶。这一突破使得部分人类国家开始警觉，尤其是其中最强大的牙里加王国。\n\n牙里加王国看到了兽人的强大力量，丝毫没有低估他们，先进地提出人类应该短暂地团结，而各国就领导权问题久争不让。\n此时的牙里加国王，威廉·亚特劳斯并非等闲之辈。他在位的前十年，通过联姻、贸易协定和军事同盟，已经将周边五个小国纳入势力范围。\n126年，他决定以"商讨组建联合军团"为名设宴，宴会上，他展示了一份伪造的"兽人内应名单"，声称在座有人与兽人勾结。\n这一消息引发了在场宾客的动荡，国王又设法引发了一场混乱。在混乱中，他的卫队以"保护国王"为由控制了会场。北方国家的领导集团被当场扣押，随后以"通敌罪"处决。\n\n威廉随即发兵，由于各国高层已被斩首，群龙无首之下，三个国家在两周内投降。剩余两个国家组织了抵抗，但在牙里加军队和已经投降国家的夹击下，半年内也被平定。\n\n眼见兽人南犯越来越频繁，牙里加国王威廉·亚特劳斯设宴请各国领导人商议，希望能共同出兵抵抗兽人。在宴会上，他却设伏强杀所有参会高层，随后迅速发兵收编各国。\n随着较近的几个国家率先被统一，牙里加的势力迅速壮大。远处的小国虽马上有人接替领导位，却已经不敌牙里加。\n\n牙里加迅速完成北半洲人类的统一，建立起幅员辽阔的牙里加帝国。\n\n而此时的南半洲同样大小国林立，主要都是矿业国家，依托科里克山脉资源发展。\n\n### 南北半洲的联系\n\n牙里加统一后，于131年开始规划，最终于179年成功北筑三道长城，不断加强边防巩固。\n对内进行了封建制改革完善制度，整套官制与军功挂钩，激发人们保家卫国的热情。\n但持续数十年的工程也消耗了海量资源，北方的森林几乎被砍伐殆尽，浅层矿脉也已枯竭，帝国急需优质铁矿和木材。\n\n同时，国土抵达长白海峡的帝国终于可以向南探索。143年，南部北边两处势力较大的国家最先与牙里加接触，康普尼西王国和斯大里共和国对北方来客持抵御态度，但总体还算融洽。\n152年，当牙里加深入了解，得知南方拥有丰富矿产资源后，通过外交希望能前往开采平原地区所缺乏的资源。康国本已同意，在斯国的反对下，最终两国否决了牙里加的请求。\n\n可这并没有阻止牙里加的野心，牙里加国王派遣勘探队秘密绘制了南方的海岸线和军事布防图，同时在国内大肆宣传"南方富庶但拒绝分享，意图坐视北方被兽人拖垮"。\n同时，牙里加筹集物资大力研发铁甲舰队，预计从西海岸登陆偷袭斯大里。\n\n164年末，牙里加以"保障帝国生存权"为名，发动西海岸登陆战。选择斯大里共和国作为突破口，是因为斯大里是南方登陆口中最薄弱的一环，它的海军规模小，且与康普尼西存在领土争端。\n牙里加的铁甲舰队在风暴的掩护下于深夜登陆，迅速占领了斯大里的西海岸港口。斯大里紧急向康普尼西求援，但康国犹豫了，他们怀疑这是斯大里与牙里加合演的苦肉计，目的是引诱康国出兵。\n\n等到康国确认斯大里确实被攻击时，牙里加已经占领了斯大里三分之一领土。康国这才发兵，但牙里加一面与康国军队对峙，一面加紧对斯大里的攻势。两个月后，斯大里投降，割让北部矿山。\n康普尼西失去了盟友，独自面对牙里加的军事压力。在权衡了战争成本和收益后，康国选择签署和约，永久割让北部矿山地区给牙里加。\n\n南半洲除了康普尼西和斯大里，还有大小十余个国家，以矿业和冶金闻名。它们之间虽然也有竞争，但在面对外部威胁时，一直存在松散的"科里克矿业同盟"。牙里加入侵后，剩余国家迅速召开紧急会议，将同盟升级为南方联盟，约定军事互助。然而牙里加并没有吞并两国，只将其作为半殖民地掠夺矿产资源。\n\n### 兽人内乱\n\n兽人的人口增长太快，250年起，安蒂罗斯山区的猎物已经彻底不足以支撑全部落，必须找到新的食物来源。\n\n南下扩张后，部分食草兽人接触到了人类的农耕文明，开始尝试种植作物和驯养动物，并在安蒂罗斯山脚建立第一个农业定居点，开始与人类进行物物交换。\n食草兽人责怪兽人的暴虐，让他们失去和人类交流的机会，而食肉动物认为这不仅是懦弱的表现，还是背叛兽人传统。257年，随着资源危机加剧，最终兽人内部产生分裂。食肉兽人在酋长"魔洛希"的带领下占据山区北部，成为日后的魔洛希派；食草兽人在女先知"迦米莎"的带领下退往山区南部，建立农业村落，成为迦米莎派。\n虽然明面上分裂成两派，但矛盾压迫下兽人反而开始局部统一，变得有组织性。\n\n两派系不绝对是按进食习惯划分，仅在立场上代表和平与侵略。\n\n### 短暂的稳定\n\n魔洛希派多次尝试突破长城防线，均被击退。而迦米莎开始尝试融入人类社会，不惜以成为劳工为代价，希望获得和平。\n\n牙里加帝国不断加固长城，军费开支久高不下，依赖南方资源暂时还能维持国家运行。312年，牙里加开始扩大铁甲船队规模，开始向南缓慢探索。\n\n---\n\n## 艾丽尼亚群岛\n\n龙族种下的母树在尘埃云中独自支撑了数百年，凭借高耸树冠穿透尘幕，在阳光下维持着光合作用。\n没有人知道它为什么活着，也许是它自身已经发生了某种不可逆的魔化变异。母树已经不再是龙族当年种下的那棵青衫树。它变异成了一种介于植物与魔力结晶之间的存在，树干内部布满了发光脉络，树液粘稠如银，根系中沉积着纯度惊人的魔力水晶。\n\n青衫树原属于裸子植物，但混沌日的某天，母树吸收了人类基因，意外结出两颗精灵之果。这两颗果实孕育了精灵始祖，他们自称初芽与初叶，一男一女。\n\n精灵的历史从这一刻开始，他们没有内斗，也不向外扩张，在宁静祥和中探索自然。\n\n### 庇护下的繁衍\n\n初芽与初叶在母树脚下度过了最初的百年，他们称母树为伊瑟拉弥，意为"守望者"。母树的树冠直径已经超过数公里，在尘埃云下撑开了一片相对安全的穹顶。树冠过滤了部分有毒尘埃，根系蒸腾的水汽形成局部微气候，让树冠下的环境能维持生命。\n\n最初的生活非常简陋，他们没有工具和知识，也没有任何文明积累，唯一的优势是母树赋予的魔法天赋。他们用母树脱落的枝条制作工具，用树皮纤维编织衣物，用树洞作为居所。\n母树的根系已经深入大陆下表面，能够从海底岩层中抽取溶解的原质，通过树干内部的发光脉络输送到枝叶。精灵发现，在母树周围呼吸就能缓慢补充魔力，他们的肺泡晶核与母树散逸的魔力形成了天然的补给循环。这决定了精灵在整个混沌日阶段都无法远离母树。\n\n到混沌日结束时，精灵人口已经增长到约千人，分化出几个家族，围绕母树建立了最早的定居点根冠聚落。这是一个由活木和藤蔓编织而成的半树栖聚落，房屋悬挂在母树的低枝上，或者搭建在凸起的树根之间。精灵在这一阶段发展出了基础的植物培育技术，整体仍处于氏族社会阶段。\n\n生命魔法体系也是在这时发芽的。精灵似乎对生命魔法有敏锐的直觉，迅速掌握了简单的法阵，并开始有了魔法呼吸的雏形。\n\n### 群岛的探索与建设\n\n混沌日过去，阳光重新普照大地，露出五块被母树根系连结在一起的岛屿全貌。\n\n阳光的回归触发了精灵文明的爆发式增长。光合色素衍生物让精灵在充足的日照下几乎不需要进食，大量时间和精力被释放出来，投入到魔法研究、艺术创作和社会建设中。与世隔绝的精灵族在安全的环境下，完成了群岛的多项建设。\n\n#### 母树岛\n\n母树所在岛屿作为主岛，被称作母树岛。利用魔法引导，母树的枝条按照特定形状生长，逐渐形成了一座活木构成的宏伟建筑群伊瑟拉弥圣殿。\n\n圣殿既是祭祀场所，也是精灵社会的政治核心。精灵没有王室或君主，长寿使他们对权力的理解与短寿种族截然不同。在精灵看来，任何独裁者都等不到自然死亡就会被推翻，而一场战争的成本在群岛上实在太高了。所以精灵政治天然倾向于共识与协商，非常热爱和平。\n长老圆环是精灵的最高决策机构，任何年龄超过200岁的精灵都有资格申请加入，经过一系列魔法与智慧的测试后，合格者成为长老。圆环没有固定人数，但通常维持在30人之间，重大决策需要圆环全体表决，以三分之二多数通过。\n\n随着人口增长，根冠聚落早已不敷使用。新生纪元127年，长老圆环决定在主岛正式建城，并在封闭期成功落定。\n精灵以母树的树种为这座新城命名青衫城，以此铭记伊瑟拉弥的庇护。青衫城位于母树岛中央谷地，以母树为北界，向南呈扇形展开。他们将幼年青衫树苗栽种在规划好的位置上，用生命魔法引导其生长方向。树干弯折成拱门，枝条交织成墙壁，根系隆起形成阶梯……\n整个建造过程持续数上百年，但建成后的房屋是活的，不仅四季常青，还能塑造魔力环境。\n\n城市一共分为三环：\n\n- 内环：紧邻母树脚下，长老圆环、伊瑟拉弥圣殿与活叶法典库坐落于此。只有长老、圣殿侍者与受邀者可以进入。\n- 中环：青衫树屋密集分布，每棵成年青衫可容纳一到三户精灵，树冠交织形成天然的遮阳穹顶。林间地面保留着原始植被，小径蜿蜒，从天上俯视就像一片自然森林。\n  城中心有一眼天然泉伊瑟拉弥之镜。泉水来自母树根系从深层岩缝中泵出的地下水，溶解了微量母树树液的成分，富含游离矿物质和魔力，长期饮用能缓慢促进晶核生长。晨间取水、午后休憩、傍晚集会都在泉边进行，新生儿在命名仪式上也必须用泉水沐浴，象征母树对孩子的祝福。\n- 外环：工坊、市集分布于此。一条名为千根径的步道环绕外环，规划出整片交通网络，因沿途遍布母树露出地面的气根而得名。\n\n精灵对人口增长始终抱有刻意的节制。长老圆环在青衫城建成之初就确立了铁律，城市的规模不得超过母树树冠覆盖范围的两倍，以避免过度消耗母树的魔力供给。到封闭期末，青衫城人口稳定在六千人，其余精灵迁往其它附属岛屿的次生聚落。\n\n##### 母树特产介绍：伊瑟拉弥之泪\n\n在混沌日结束后，或许是没有生存危机，或许是魔力环境不足以激活母树结果，它再也没有结出过精灵之果。\n\n但它仍然定期产出一种较小的果实，精灵称之为伊瑟拉弥之泪。这种果实的汁液是高纯度的液态魔力，是精灵最珍贵的魔法材料，用于重大仪式和危重治疗。\n\n#### 繁生岛\n\n母树岛的面积仅排第二，繁生岛才是群岛中面积最大的岛屿，位于主岛西侧。这里地势平坦、土壤肥沃，土质是母树根系在数千年间从海底搬运上来的沉积物。\n\n精灵将这里建设为第二聚居地和农业生产基地。由于精灵的生育率低，繁生岛逐渐发展出了一套独特的生育支持体系：\n\n- 孕母休养林：怀孕的精灵女性在孕期最后一年会移居到专门的休养林中。这里的植物经过生命魔法特殊培育，能持续释放高浓度魔力，帮助母体补充被胎儿分走的魔力储备。\n- 晶核传承仪式：孕妇分离种子晶体时都会经历这个仪式，通常由多名长老共同辅助完成，以确保母子平安。\n- 共育社群：由于每个孩子都来之不易，精灵社会形成了集体抚育的传统。年长的精灵即使没有血缘关系，也会主动参与照料和教育，不同家族之间关系和睦。\n\n到400年左右，繁生岛上已经形成了数十个大小聚落，人口占精灵总数的六成。\n\n#### 林语岛\n\n林语岛位于主岛西南侧，地势起伏，覆盖着茂密的原始森林。这里的魔力环境异常活跃，母树的一条主要根系恰好从岛下穿过，导致岛上植物普遍魔化。\n\n精灵学者发现，林语岛上的植物之间存在一种魔力信号传导网络，通过根系和菌丝连接，整片森林能够传递简单的信息。但在魔力加持下，其传导速度和复杂度远超自然演化水平。\n这一发现催生了精灵独有的林语术，一种通过与植物魔力网络共鸣来获取信息、传递指令的魔法。\n\n精通林语术的精灵学者不仅能够，感知森林中任何异常（入侵者、病变、火灾），还能向特定植物下达简单指令（如藤蔓），林语岛逐渐成为精灵的学术中心。\n岛上的活木书院是精灵最古老的魔法研究机构，建筑本体由数棵经过精密塑形的巨树交织而成。文字被刻入特殊培育的叶片中，叶片在魔力滋养下永不枯萎，反而会随着知识更新而生长出新的注解，称作活木书。\n\n#### 海藤岛\n\n海藤岛位于主岛北方，是群岛中距离母树根系最远的一个岛，因此植被相对稀疏。\n\n岛屿边缘生长着半水生藤蔓海丝藤，它的藤条可以从悬崖垂入海水中，长达数百米。海丝藤的叶片在水下会分泌一种粘性物质，捕获浮游生物和小型鱼类作为养分。\n精灵从海丝藤的生存策略中获得了灵感，利用生命魔法培育了改良版的海丝藤，将其作为活体渔网。海藤岛因此成为群岛渔业和海洋资源开发的中心。\n\n海藤岛也是精灵与海洋生态互动的窗口。浅海区的鱼群、甲壳类和海生植物在这里被系统地研究和利用。精灵通过与海洋植物的共鸣（类似于林语术的变体），在生态系统层面管理渔业资源。\n\n海藤岛精灵在浅海活动中偶然目击过海族的踪迹，但两者从未建立正式接触。精灵将海族视为"深海的精灵"，在古老的诗歌中有所记载，却不知道对方也是一个文明种族。\n\n#### 潮汐花园\n\n潮汐花园是群岛中最小的一座岛，位于东南方，面积不过数平方公里。它地势很低，每日的潮汐涨落会让岛的边缘区交替淹没与暴露。\n\n精灵在潮汐花园培育了随潮汐生长的特殊植物群落，根系在海水退去时深扎泥滩，涨潮时完全没入水中，花朵在特定月相下同时绽放。这种极致的自然美感使潮汐花园成为精灵的精神修养圣地。年轻的精灵会在成年礼时独自前往潮汐花园静修数日，在潮汐的节奏中冥想，被认为是在与自然共鸣。\n\n这里也是精灵艺术的发源地。精灵最早的诗歌、音乐和舞蹈都以潮汐为灵感，模仿波浪的节奏和月光的变幻。\n\n---\n\n## 西风浮屿\n\n西风浮屿的前身是泛古陆在混沌日解体时撕裂出的一块碎片。这块碎片随洋流在泛大洋西部漂流了约两百年，面积约相当于一座大型岛屿。\n在自然魔法的紊乱环境中，板块内部形成了大量气囊状空洞，使其密度远低于普通岩层。\n\n天翼族诞生后，地面持续数百年的尘埃云与魔法乱流让他们不堪其扰。混沌日前期，天翼族幸运地发现了这片漂浮的岛屿，危在旦夕的种族蜗居于此。\n一位被后世称为举风者的智者，在探索高空时偶然发现了一组残缺的超位法阵草图。这张草图是混沌日前某位龙族学者绘制的研究手稿，不知为何遗落在云层中，被气流带到了天翼族迁徙路线上。\n\n举风者并不理解超位法阵的原理，但她直觉地意识到这些符文与罗格蒂兰有关。经过多年尝试，她在漂流的西风浮屿板块上刻下了那组残缺的符文。\n法阵竟意外启动，它通过某种未知的共鸣机制，分流了罗格蒂兰内创世之石的能量。板块开始缓慢抬升，最终稳定在距海面约四千米的高空，在泛大洋上空的西风带徘徊，成为第二座浮空岛。\n\n天翼族从此有了家园。\n\n### 平淡的社会发展\n\n与世隔绝的天翼族比精灵更加安宁，低物质生活从根本上扼杀了贫富分化和社会矛盾，也让社会进程非常缓慢，以至于时间线变得模糊。\n\n在高空环境下，虽然成功避开地表的天灾，但岛屿表面常年笼罩在稀薄的高空空气中，气温偏低，紫外线强烈，农业发展困难。除了被称作天空树的无果树种，其余植物便只剩些苔藓、地衣和匍匐灌木。\n这使得天翼族的主要食物来源是捕猎鸟群。惊喜的是，岛屿下层生长着一种垂叶藤。这种藤蔓在魔力催化下生长迅速，依靠分枝顽强地生存，且烧制后味道鲜美，成为捕鸟外重要的食物来源。\n另外，岛屿中央有一处天镜湖，湖水来自高空凝结的水汽，是唯一稳定的淡水来源。\n\n由于板块内部密布气囊空洞，经过侵蚀和人力开凿，形成错综复杂的洞穴网络。天翼族主要居住在洞穴中，这里避风、恒温，外壁的岩层隔绝了高空的严寒与紫外线。在开凿过程中，还发现一种依赖魔力维生并可照明的光苔，依靠存取魔力即可实现"开关灯"效果。\n\n### 社会结构\n\n天翼族的人口不过万余人，社会以风巢为基本单位。\n\n风巢既是居住地，也是一个以血缘和师承关系为纽带的社群，每个风巢由一位风领主管理。风领主不是世袭的，继任者必须完成一次环飞浮屿的考验，以证明自己的飞行耐力与魔力掌控。\n所有风领主组成风主会议，每三年在岛屿中央的天镜湖畔集会一次，商议全族事务。天翼族社会的规模尚不需要成文法，通过共识来协调风巢间的资源分配和纠纷。\n\n风领主的权威完全建立在飞行能力和魔法造诣之上，狩猎被视为头等大事，社会气质偏向务实与进取。\n\n岛屿中央的风神殿是绝对的禁地。那里存放的是维持浮峪运作的超位法阵组，为了保护浮峪免于坠落，即使是风领主也只能在例行检查时入内。\n\n至于外交方面，天翼族对暴力动荡的地面文明缺乏兴趣。在鹰眼中，那些爬行在地表的生物渺小如蝼蚁，他们的战争和贸易被孤高的天翼族当做可供观赏的消遣，也因此掌握了很多不为人知的秘闻。偶尔会有天翼族下至陆地，但多是收集些稀有材料，或者作物种子。即使偶尔有目击事件，也被地面种族当做传说了事。\n不过教会却因为天翼族更加坚定地相信光明神的存在，还把目击到的天翼族误当成天使。'},{id:'中古时期',title:'中古时期',content:'在各地战争的推动下，几场意外让各大洲开始联络，世界逐渐走向整体，进入中古时期。\n这一时期的开始标志是世界联络，总体特征是频发的战争，与无处不在的科技、魔法、文化交流，最终停滞在南极岛登上地图板块的一日。\n\n## 乌洲和努洲的邂逅\n\n### 人兽战争与南北战争\n\n约360左右，此时牙里加和南方的冷战达到巅峰，来自北部兽人的压力持续扩大。\n\n与此同时，一场持续多年的严重干旱带着寒潮降临，导致山区猎物锐减、农作物绝收。迦米莎派尝试向人类求助，但被牙里加帝国拒绝，魔洛希南下劫掠屡屡受挫。在外部压力下，兽人两派不得不统一意见：人类不会接纳他们，无论他们是战是和。魔洛希派主动联系迦米莎派，提出暂时联合，承诺在攻破长城后，迦米莎派可获得长城以南的农业区，魔洛希派继续向南掠夺。\n363年，兽人联军正式发动南下攻势，第一次人兽战争开始。\n\n牙里加没有料到兽人能集结如此庞大的势力，猝不及防之下急忙抽兵北防，南部防御力量亏空。面对这个良机，南方联盟毫不犹豫地发动夹击，同步发起第一次南北战争，一路将牙里加打退到长白海峡，夺回了北部矿山。\n不同于面临生存危机，南方联盟仅仅是想收复失地，攻势没有兽人那么坚决。牙里加退至长白海峡后，凭借天险还能勉强抵御，便将重心放在北方，优先解决兽人。\n\n不通魔法的努尔周人类面对强悍的兽人节节败退，北方战事告急。364年，兽人很快攻破第一道长城，还灵活地采用"假烽火"战术，干扰牙里加的战时通信。\n面对压力，牙里加决定出动铁甲船队，沿西侧箭洋海域绕至后方夹击。\n\n### 工业革命的传递\n\n牙里加船队的行驶并不顺利，在航行几周后，意外误入一条未知的洋流，他们抵达乌尼尔洲，遇上了刚完成工业革命的矮人。\n\n矮人对这从未见过的人类势力充满警惕，但精巧的铁甲舰让他们产生了共鸣。进行深入交流后，双方达成战略合作：\n牙里加长期提供大陆更广阔的资源，并带来丰富的近海航行经验，而矮人则分享蒸汽技术和优质锻造工艺。\n\n船队带着新技术和蒸汽样机返航，虽然其原定计划失败，但这场意外收获让牙里加发现新的出路。牙里加在国内全面推行新技术。365年，融合了蒸汽技术和新的锻造工艺，全新的蒸汽舰队取代了铁甲舰，兼具动力与防护。\n\n而矮人方面也在全力研究航海技术，力求向外探索发现新资源。他们制造的蒸汽战舰工艺更加精良，很快便追上了牙里加的进度。\n\n### 哥布林渗透\n\n哥布林会潜入停靠在港口的货船中，藏匿在货物堆里、锚链舱中或船底压舱物的间隙中。他们的体型让他们能够躲藏数天甚至数周不被发现，绿肤藻在黑暗潮湿的船舱中依然能提供基础能量补充。当船只抵达新大陆卸货时，哥布林便趁夜色溜下船，在新的土地上寻找栖身之处。\n\n矮人与牙里加帝国建立贸易关系后，跨洲船舶交通日益频繁。这无意间促进了哥布林的扩散，每一艘跨洲货船都可能携带一小群偷渡者。\n\n哥布林很快进入安蒂罗斯山脉。这里的环境与他们在乌尼尔洲的起源地非常相似，洞穴密布、水源充足、猎物丰沛，这让哥布林的人口迅速增长。\n兽人是哥布林在努尔洲遇到的主要挑战。兽人的领土意识很强，任何进入猎场的生物都可能被当作猎物。尤其是掠夺雌性的行为，让哥布林风评极差，很快便成为各势力公敌。\n与此同时，哥布林开始在牙里加帝国边境地区的记录中以"害兽"的名义被提及。帝国将哥布林定性为有害生物而非智慧种族，这一定性允许帝国在法律上不给予哥布林任何人权保护，边境地区的农户会用捕兽夹和毒饵来保护牲畜圈。\n\n但哥布林顽强的繁殖能力，以及隐蔽的居住习惯，反而让他们的规模越来越庞大。到500年时，哥布林已经在安蒂罗斯山区建立了稳固的种群。\n550年代，多个国家正式将哥布林定性为"有害生物"，让更多的人可以合法地处死他们。在制度层面，哥布林被彻底排除在智慧种族的保护圈之外。\n\n### 战争落定\n\n366年，第二道长城失守。凭借强大的海上力量，牙里加决定发动总攻势。\n蒸汽舰队绕至敌后战场，切断了粮食供应路线，随后原地坚守。由于战线太长，前线的兽人大军来不及做出反应，便陷入弹尽粮绝的境地。牙里加趁此机会发动总攻，兽人大军溃败。\n\n决战后，牙里加并未赶尽杀绝，反而逐渐放开种族政策，允许兽人作为劳工进入帝国。\n面对绝境，迦米莎派选择妥协，接受牙里加的条件，迁入帝国划定的"兽人保留区"成为帝国附庸。兽人内部再次分裂，彻底失去南犯的力量。\n\n---\n\n## 三洲混战\n\n### 魔族北侵\n\n自百熙自刎后，涅洲的政权逐渐稳定下来。琦玡在位期间，城市与家族的平衡虽然脆弱，但总算维持了数十年的和平。\n然而这种和平是以人口增长为代价的，作为长寿种，魔族活跃人口增长非常迅速，涅洲本就不丰富的资源开始紧张。\n\n442年，长老议会派遣的勘探队从被方返回，带回了惊人的消息：越过赤道海域后，他们发现了一片富饶的大陆——博茨瓦岗洲。\n那里森林茂密、矿脉丰富。虽然从未见过人类，但魔族发现人类并不强大，防御体系主要针对魔物，对成建制的军队缺乏准备。\n\n长老议会内部展开了激烈的争论，认为这是缓解涅洲资源压力的绝佳机会。最终，议会作出承诺：参战的野生魔族可以在征服地获得土地和资源。\n这一承诺极大地调动了参军的积极性，魔族迅速组建起一支怀揣野心的军队。443年春，魔族舰队从涅洲北部港口出发，渡过赤道，在博洲南部海岸登陆。\n\n### 博洲的危机\n\n博洲南部几乎没有像样的防御力量，卑津城市联盟成立仅四年，各城之间的协调机制还很薄弱。更重要的是，博洲的军事体系完全是针对魔物设计的。纵使冒险者小队擅长探索、侦察和小规模战斗，但面对成体系的魔族大军，这种分散的兵源分布反而成了致命弱点。\n\n魔族大军简洁而高效地一路平推，以大量征召兵为前锋，精锐力量穿插其中。博洲的冒险者小队在正面战场上不堪一击，单兵作战能力再强也无法抵挡军阵冲锋。并且冒险者难以有效集结，往往来不及对魔族进攻做出反应。\n\n更糟糕的是，博洲人类从未见过魔族。他们习惯于对抗没有智商的魔物，面对一个会使用战术、会设伏、会佯退的智慧种族，原有的作战经验完全失效。南线战场在三个月内全面溃败，魔族一路北上，连克七座城市。\n\n然而，魔族的补给线也在迅速拉长，长老议会没有足够的人力来管理如此庞大的征服地。当先锋部队抵达博洲中部平原南缘时，议会下令停止推进。\n\n446年初，战线在博洲中南部稳定下来：\n\n- 魔族占据了南部的大片森林和沿海地区，建立殖民据点，并放开内部管理，允许野生魔族外出游猎。\n- 博洲人类则收缩到中北部平原的城塞中，双方进入对峙状态，冒险者小队面对零散的魔族攻击终于能勉强抵抗。\n\n### 教会西进\n\n光明教会此时正面临内外交困：手稿事件引发的信仰危机、宗教战争消耗巨大；东部矮人越来越不受控制，人类邦国离心离德。教会急需一个新的外敌来转移矛盾、统一内部。\n\n455年，一艘在风暴中迷失方向的乌洲商船被洋流带到了博洲西海岸，途径斯图尔特群岛，群岛正是以这位船长的名字命名。\n船员们对发现这片全新的土地感到惊喜，但遇到原住民后，他们惊恐地发现，这片大陆正在遭受某种未知智慧生物的侵略。他们带着这个消息返回乌洲，立刻引起了教会的高度重视。教会不光看中魔族入侵一事对舆论的巨大影响力，更是盯上了博洲的丰富资源。\n\n457年，教会停止清洗后，迅速组织了一支由宗教裁判所主导的调查团。教会的调查团很快发现，博洲的局势比他们想象的更有利：\n\n- 博洲人类和他们一样对魔族一无所知，这意味着人类有了新的共同敌人，一个任由教会捏造的敌人。\n- 博洲的民主制度在战争面前暴露出弱点：轮值委员会每三年换一届，缺乏长期战略规划；民兵队长无权调动部队，重大决策需要公民大会审议，反应迟缓。这给了教会军队占据主导的机会。\n- 博洲人类对魔族的恐惧正在滋长。随着战争持续，越来越多的难民涌入北方城市，社会压力巨大，恐惧便意味着信仰可以存在、可以推广。\n\n教会敏锐地抓住了这个机会，他们开始在博洲各城市活动，巧妙地利用了博洲人的恐惧和对魔族的无知，传播一套精心包装的极端民族主义叙事：\n"魔族是远古时代被光明神封印的邪恶种族，如今封印松动，它们卷土重来。只有信仰光明神，获得神的力量，才能抵御这场浩劫。"\n\n即使教会自己都不了解魔族，但这套说辞意外的有效。博洲开始出现教会的信徒，尤其是来自南部的难民。\n而乌洲本土的人类也有了一个全新的外敌，这个外敌远在天边，却又实打实地影响人们的精神生活。在教会有意宣传下，国内民众普遍同情博洲人类遭遇，并梦想着参军出征。\n\n### 教会的全面渗透\n\n教会在博洲采用了多层次的渗透策略：\n\n- 魔法援助：教会向博洲城市派遣光明魔法师，帮助治疗伤员、抵御入侵。这些魔法师确实拥有博洲人从未见过的光明魔法，几次小规模的"圣光退敌"表演迅速在难民中赢得了声誉。\n- 思想渗透：教会以"传播光明神的福音"为名，在各城市建立了传教点，实际上作为情报站，收集博洲的政治、军事信息。教会很快掌握了各城市之间的矛盾和弱点。\n- 权力收敛：教会开始在学校和公共场所传播光明教义，巧妙地避开对民主制度的直接攻击，而是强调"在危机时期，需要更强的领导力"。\n\n### 博洲的分裂\n\n教会的渗透很快在博洲社会中引发了分裂：\n\n- 改革派（主要是战争难民和底层民众）：认为教会的光明魔法确实有效，应该接受教会的帮助，部分人开始虔诚地认同教会的宗教体系。\n- 传统派（主要是老牌城市的公民和冒险者公会成员）：认为教会是外来势力，其真实目的是控制博洲。他们主张依靠自己的力量，维持民主传统。\n\n随着渗透深入，矛盾扩大，两派的争论在465年的卑津城市联盟大会上爆发。大会最终以微弱多数否决了改革派的提案，但裂痕已经产生。\n教会并没有因此放弃，他们转而开始拉拢个别城市，试图在联盟内部制造分裂。\n\n然而，教会没有预料到的是，他们在博洲的活动也引起了长老议会的注意。魔族开始注意到这些更强大的力量，并有意观察教会势力的威胁。\n\n### 第一次圣战\n\n教会需要一场胜利来证明光明魔法的价值，468年，教会经过十余年的渗透和准备，认为时机已经成熟。他们从乌洲调集了一支由光明法师组成的"圣战军团"，以及多支光明骑士团，都是精通光明魔法的精锐，决定用战争证明教会的权威。\n\n教会计划一路冲破防线，攻击魔族在南线的后勤枢纽"灰石堡"。灰石堡原本是博洲的一座矿业城镇，被魔族占领后改为物资中转站。这里储存着前线魔族军队近半数的粮草和装备，但在征服区的安逸状态下，守军只有两个不满编的家族征召兵。\n\n圣战军团在468年7月21日黎明时分发动突袭，经过数日鏖战，突破了魔族长期松懈的多道防线。最终灰石堡被攻破，储存的物资被付之一炬。\n\n消息传回魔族后方，长老议会大为震动。尽管早已有所听闻北部出现新的技术，但还是惊于这种前所未见的，会发光的魔法。\n议会认为补给线拉得太长，深入北方平原作战风险太大，更何况要面对一群未知的力量。最终决定暂时退让，向南撤离一段距离。\n\n468年末，魔族主动放弃了灰石堡及周边几处不易防守的前哨据点，将防线略微南撤，退回到更容易防守的河流沿线。他们的主要目的本来就是资源掠夺，并非全面征服。\n尽管已经撤退，但双方小摩擦不断，时常有小型战争爆发。\n\n### 文化互鉴与魔法交融\n\n这场中型规模的冲突虽然军事意义有限，但它打开了一扇交流的窗口。\n\n魔法层面的交流：\n\n- 博洲的自然魔法师与教会的光明魔法师开始接触。博洲的魔法体系建立在魔物材料的基础上，炼金术发达；而乌洲的光明魔法则强调对光明的使用。两种体系截然不同，但互相启发。\n  教会也从博洲魔法师那里学到了很多：如何利用魔物材料制作魔法道具，如何依赖器皿材料增幅自身，这些知识让人类的魔法体系变得更加丰富。\n- 同时，魔族的暗魔法、死灵魔法和幻术也与人类产生碰撞。这些强大的力量除了可怕，更有丰富的研究价值。博洲人类多方面、多领域的魔法种类也流进魔族社会，魔法体系的复杂化开始促进魔族的魔法教育事业发展。\n\n文化层面的碰撞：\n\n- 博洲的互助文化与乌洲的等级文化形成了鲜明对比，博洲人无法理解为什么教会内部有如此严格的等级制度，而教会也对博洲的公民大会感到震惊。一些博洲难民虽然接受光明信仰，但他们的理解与乌洲正统教义有很大差异。他们逐渐传出一种 "多神教"文化，倾向于将光明神视为"众多自然力量中的一种"，不是唯一的真神，这种异端理解让教会既恼火又无可奈何。\n- 魔族通过俘虏和间谍逐渐了解了教会和博洲人的关系，对实力的自信让他们不屑于作出官方辩护，没有对教会的仇恨言论做出任何回应。但有时候魔族民众也会费解，明明人类之间也有侵略和战争，为什么唯独惧怕他们。\n\n#### 遗传学发展\n\n魔族不喜欢吃人，也不会胡乱烧杀抢掠 ，但他们有自己独特的生理需求。许多人类被圈养成为血库，或者成为魅魔泄欲的工具（并不算太坏，甚至有人会为此主动倒戈）。\n但还有许多更惨的人类会遭到解剖（不过出于人道主义会先被处死）。\n\n这都源自301年那条"不同种族有共同祖先"的假说。魔族见到人类后，发现两族的外形非常相似。他们没有简单地把人类视为异己，而是在长期的解剖研究中发现，魔族和人类的身体结构几乎完全相同。魔族里很快出现假说，认为魔族或许起源于人类，加上人类的历史明显比魔族久远，假说一时之间得到不少认同。\n\n为了稳定战局，长老议会不得不在战时禁止讨论。战后，这个假说很快又引起注意，并在将来登入世界科学家们的视野。\n另外一个重要发现是，魔族发现魅魔体内存在人类没有的魔力通道。虽然魔族没能意识到这一发现的意义，但这却在后续变向支撑着矮人认为魔力是能量的观点。\n\n---\n\n## 联合舰队的世界探索\n\n### 牙里加复进\n\n兽人战争结束后，牙里加帝国进入了短暂的恢复期，蒸汽技术的普及让帝国的生产力大幅提升。380年，牙里加国王下令扩建蒸汽舰队。与十年前的老式铁甲舰不同，新舰队装备了矮人工艺锻造的蒸汽机，以及从，航速更快、续航更远。\n\n382年，蒸汽舰队再次南下。这一次南方联盟没有抵抗，他们面对卷土重来的骇人舰队，主动交出部分矿山。\n经过短暂的谈判，牙里加重新控制了北部矿区的开采权。作为交换，他们向南方北部国家提供部分蒸汽技术和先进武器，暗地里也希望联盟内部因为实力不均产生分裂。\n\n### 联合舰队\n\n矮人的蒸汽技术与牙里加的航海技术碰撞后，催生了一个大胆的计划：组建一支联合探索舰队，航行到已知世界的尽头。\n\n402年，第一支联合舰队从矮人港口出发。舰队由十艘船组成，包括各式蒸汽战舰、补给船，预计沿箭洋向南驶入泛大洋。\n\n#### 海上城邦的起源\n\n与牙里加的合作不仅让矮人获得了宝贵的航海经验，还让他们开始思考一个大胆的问题：既然陆地上的资源有限，为什么不把城市建到海上去？\n\n418年，第一座实验性的海上平台在矮人领海建成。它利用巨大的铁皮囊泡提供浮力，用铁锚固定在海床上，依靠蒸汽动力驱动的水泵行进。虽然简陋，但它证明了海上定居的可行性。\n随后的几十年里，矮人不断完善这项技术。他们建造了越来越大的海上平台，最终在500年左右集齐资源，发展出了真正的巨型海上城邦诺克耐维斯。\n\n### 精灵问世\n\n459年，舰队沿着乌洲东海岸南下，首先到达了艾丽尼亚群岛精灵的家园。\n\n精灵拥有高度发达的魔法文明，但对外界几乎一无所知。当蒸汽舰队抵达群岛时，精灵们既震惊又好奇：\n\n- 他们从未见过蒸汽机这样的机械造物，这种没有生命却能运转的机器让他们惊奇。\n- 蒸汽机燃烧木炭产生的烟雾和噪音，让热爱自然的精灵感到不适，厌恶其带来的污染。\n- 同时，这些外来者的异常力量，也让精灵族感到威胁。\n\n但好在这支舰队十分友好，经过数周的接触和谈判，对外界的好奇心最终战胜了恐惧。精灵长老也预感到，世界正在发生变化，闭门造车只会让精灵落后。\n精灵最终决定派出一支由学者和魔法师组成的使团，随舰队一起出海。\n\n精灵的生命魔法可以在远航中解决粮食、水源和疾病问题，这对于长期航海至关重要，让舰队获得远洋航行的能力。\n\n### 东西接轨、世界闭环\n\n在蒸汽动力加持下，又有了精灵生命魔法的支持，舰队得以向东出发，穿越无风的静谧之海。468年，舰队成功穿越静谧之海，抵达了博茨瓦岗洲的西南海岸。\n\n舰队靠岸时偏南，遇到的不是博洲人类，而是魔族的巡逻队。双方都感到震悚，魔族从未见过蒸汽船，舰队也从未见过魔族。武装对峙持续了数个小时，最终双方都派出使者。\n\n交流的过程充满了戏剧性，魔族发现舰队上不仅有人类，还有陌生的矮人、精灵，显然不是正与他们交战的势力。舰队发现魔族虽然外表怪异，但举止优雅、谈吐得体，尤其是贵族阶层，展现出极高的文化素养。\n双方交换了航海图，惊讶地发现各自的版图完全不重合。把它们拼在一起，却正好补全了几乎整个世界的样貌。这个发现意义重大：它不仅直接证实了地圆说，也意味着世界第一次完成闭环。\n\n### 通商与合作\n\n长老议会很快就意识到了这些外来者的价值，无论是蒸汽技术还是生命魔法，都是他们闻所未闻的强大助力。\n同时，魔族还发现精灵与他们在外貌上有不少相似之处，尖耳、修长的体型、较长的寿命。精灵也对魔族的贵族礼节印象深刻，两族之间很快就建立了一种微妙的亲近感。\n（本世界观与传统西幻大相径庭，精灵不再完全归属人类阵营）\n\n471年，魔族与联合舰队签署了《普罗地海通商条约》，开放经过普罗地海的两洲商道。魔族开始引进蒸汽技术和精灵魔法，同时向外界出口涅洲特有的魔法材料和魔物制品。\n一条稳定的跨洲航线建立，商船开始定期往返于各大洲之间，技术、文化、思想开始以前所未有的速度传播。世界从此是一个正在形成的整体。\n\n---\n\n## 版图完善与科技革命\n\n随着跨洲航线的建立，信息开始以前所未有的速度在各大洲之间流动。\n\n- 游吟诗人是最早的传播者，他们跟随商船穿梭于各个港口，在酒馆和集市中吟唱来自远方的歌谣。博洲的魔物、乌洲的教会、涅洲的魔族、努洲的兽人战争，这些故事被添油加醋后传遍世界，激发了无数人对远方的想象。\n- 商人紧随其后，他们带来了实实在在的货物：博洲的魔物材料、乌洲的光明圣物、涅洲的魔法制品、努洲的矿产、精灵群岛的生命药剂。每一件商品背后都藏着一个关于遥远大陆的故事。\n- 教团则是信息传播中最有组织的力量。教会在博洲的传教活动虽然进展缓慢，但传教士们写回乌洲的信件和报告，构成了乌洲人对新世界最系统的认知。这些报告经过教廷的筛选和修改后，被分发到各个邦国，塑造着乌洲民众对世界的理解。\n\n### 罗格蒂兰问世\n\n在矮人埋头研究魔导科技的同时，联合探索舰队继续向未知海域前进。\n\n489年，舰队在穿越泛大洋中心区域时，瞭望手发现前方的海面上出现了一座悬浮在空中的岛屿。起初船员们以为是海市蜃楼，但船只靠近后，所有人都震惊了：这是一座真正的浮空岛。\n\n罗格蒂兰的发现震惊了世界，人们并未发现怎么登岛，但浓郁的光明痕迹还是让教会注意到了它。教会认为这是光明神留下的圣殿，命名为罗格蒂兰，并执着的展开对圣地的探索。\n\n### 发现南极岛\n\n罗格蒂兰发现后，舰队继续向南航行。随着纬度越来越高，气温开始急剧下降。海面上出现了浮冰，船员们不得不放慢航速。\n\n492年初，舰队在浓雾中看到了一片被冰雪覆盖的大陆，世界的极点#南极岛。南极岛暴风雪常年不断，气温低至舰队无法深入探索，只能沿着海岸线粗略测绘了部分地形。\n\n但即使是这样粗略的探索，也已经足够让学者们拼出世界的完整版图了。这世界被彻底证明是一个球体，引发了一波天文地理界的振奋，也是自然科学的一大进步。\n\n从这一刻起，各大洲不再是孤立的文明岛屿，而是一个正在形成中的全球文明。\n\n### 科学技术汇聚、魔导科技初现\n\n490年代，各大洲的科学研究虽然风格迥异，但已经开始通过贸易网络相互交流。这种用观察、实验和逻辑推理来理解自然的方法，被称作科学。\n\n科学之风随着大陆联系吹遍全球，并吸引众多学者成为科学家。在科学上，文明展现出超越性的团结性，很多科学家无视种族矛盾与仇恨，聚集在一起共事。众多的论文、图册成功翻译，并传播到世界各地。正是这种跨文明的科学交流，为魔导科技革命奠定了认知基础。下个时代的矮人工匠设计第一台实用魔导引擎时，使用的不仅仅是自己的知识，而是全球学者数百年积累的智慧结晶。\n\n矮人最初对博洲的战事并不太在意。他们与教会有旧怨，但那是几百年前的事了；与魔族隔着整个大洋，没有任何利益冲突。矮人更关心的是蒸汽技术的改良和海上城邦的扩建。\n然而，随着关于博洲的消息越来越多，矮人学者开始注意到一个重要的信息：博洲人掌握着一基于魔物材料的独特魔法体系。这种魔法与乌洲的光明魔法、精灵的生命魔法都截然不同，它不依赖于信仰或自然感应，仅通过加工魔物身上的材料来释放法术。\n\n矮人早在两百多年前就发明了魔导器的雏形，但由于缺乏系统的魔法理论支持，这项技术一直停留在"会发光的机器"阶段，无法真正实用化。博洲的自然魔法体系，恰好可以填补这个空白。矮人迅速派出了使团前往博洲，以蒸汽技术换取博洲的魔法知识。这笔交易对双方都有利，博洲人急需蒸汽机来提升生产力、对抗魔族，矮人则急需魔法理论来完善魔导技术。\n\n矮人工匠和博洲魔法师的合作很快取得了成果，博洲的魔法师教会了矮人如何从魔物材料中提取魔法能量，如何用符文来引导和储存这些能量。矮人则将这些知识应用到了机械设计中。\n\n第一台真正意义上的魔导机械诞生于海上城邦中，它的外观是一个巨大的黄铜球体，内部嵌入了数十枚经过精密加工的魔法晶石。虽然这台原型机效率低下、成本高昂，但它证明了一个重要的原理：魔法和机械是可以结合的。\n\n矮人将这个新领域称为魔导科技，它的发展前景是巨大的，能直接引发第二次工业革命。如果能够小型化，魔导引擎可以驱动车辆、船只，甚至飞行器；如果能够放大，它可以为整个城市提供清洁能源。\n\n并且，魔族的解剖学发现也给魔力认知带来一次冲击。矮人在得知魅魔体内存在魔力通道后，众说纷纭：有人认为魔力是可以转化为能量的物质，有人认为魔力是可以被存储的能量形式，更有人觉得魔力以质能二象性的形态存在。这一发现反倒让魔力认知重回迷茫，却也激发了科学家更执着的探索欲。'},{id:'蒸汽魔导时代',title:'蒸汽魔导时代',content:'世界版图完整后，各大洲的生存危机缓解，进入了一段相对和平的技术积累期，罕见地稳定了近百年。跨洲贸易的繁荣带来了前所未有的物质技术交流，而真正引爆时代变革的是矮人。\n\n蒸汽魔导时代始于魔导科技实用化，以交通革命与世界贸易网络的全面形成为标志。这一时期，文明完成了从蒸汽到魔导的技术跨越，飞艇与潜艇重塑了全球交通格局，也促进矛盾激化。\n\n---\n\n## 魔导科技革命\n\n### 魔导机械的诞生\n\n512年第一台试验魔导机械诞生后，矮人迅速意识到这项技术的潜力远不止于实验室里的原型机。然而从原型到实用，中间横亘着众多技术鸿沟：散热问题、符文精度、材料成本……\n\n矮人工匠与博洲魔法师的合作在这一阶段进入了蜜月期，双方在矮人海上城邦诺克耐维斯设立了第一所魔导工坊。凭借丰富的海洋资源和远离陆地争端的安全环境，迅速成为全球魔导科技的研究中心。\n在双方呕心沥血的投入下，魔导科技很快取得两大突破：\n\n- 微型符文（约564年）：传统法阵需要手工绘制，精度受限于工匠的技艺和工具的锐度，生产慢、易失误，始终难以突破。尽管教会一直抵制矮人，但面对这股冉冉升起的科学力量，教会最终还是松了口。在光明魔法的助力下，远超时代的激光雕刻技术问世。尽管激光魔法的压缩度和精度还不足以媲美光刻机，却已经让法阵能精确到毫米级，在一定程度上降低门槛、提高效率。\n  激光魔法结合在机械臂上，成为了早期机床，开始带动工业化的大规模生产。\n- 热能循环法阵（约612年）：早期的魔导原型机运行不到十分钟就会因过热而停机。在多方合作下，一套闭路热循环法阵最终被研发出来。\n  从法阵基盘的"热管理"功能出发，这套法阵可以将废热部分转化为魔力，反馈回献祭窗。虽然单次循环的回收率很低，但经过堆叠与排列，整个系统的能量效率和运作时长至少能翻几倍。\n\n619年，诺克耐维斯工坊推出了第一台商用魔导引擎"铁心"。这台引擎的核心是一个篮球大小的球形魔力舱，周围环绕着复杂的能量转换法阵。它输出功率约等于一台大型蒸汽机，但重量远低于后者，且无需锅炉预热、无需燃烧供能，只需法师用微弱电流激活激发符文，再不断提供魔力即可。\n\n同时，为了缩短工期并量产，矮人工匠发明了酸蚀法：先用蜡在金属基盘上勾勒符文轮廓，再用强酸腐蚀暴露部分，最后用熔融的魔力传导金属（如银或秘银合金）填充蚀刻槽。\n这一工艺大幅提升了魔导机械的制作效率，酸蚀法的出现也标志着印刷式法阵的诞生。虽然印刷法阵的精度不如手工蚀刻，但成本骤降、产量暴增，使魔导器从贵族玩具变成了普通人也能负担的商品。\n\n同期，造船工艺也得到改良，蒸汽船只进化为魔导船只。\n\n### 蒸汽到魔导的过渡\n\n蒸汽机在矮人社会中已经根深蒂固，数以千计的工厂、矿井、船只都依赖它。更换引擎意味着停业、培训新工人、改造整个动力传输系统。大部分工坊主对魔导引擎持观望态度，只在新建工厂时才考虑采用。\n\n真正推动过渡的是能源成本。蒸汽机依赖木炭和泥炭，而帕拉里斯缺乏大型成煤期，森林资源在蒸汽时代已经被大量消耗。尽管魔力水晶还是明显更加昂贵，魔导机械的制作也并不便宜，但魔导机械在精密作业和交通领域展现出的性价比，让它的经济效益远优于蒸汽机。\n同时，在法师融入社会的情况下，魔导机械带来的紧密人机关系，也远胜于操纵大型蒸汽机。到677年，矮人领地内的新建工厂已有大量采用魔导引擎，这一过渡期被后世称为第二次工业革命或魔导革命。\n\n魔导科技进步直接带动魔力水晶的需求，人们投入到对魔力水晶的开发中，魔力采矿业得到世界重视。\n\n魔导科技进步也催生了一套魔力度量体系。虽然对于魔力本质的问题仍争论不休，但矮人定义的魔力单位"目"一直沿用至今，并被世界所接受。\n\n### 飞艇的诞生和完善\n\n魔导引擎轻量化、无需燃料补给的特性，不仅强化了蒸汽船只的性能，也使航空成为技术上可行的命题。\n\n早在491年就有了蒸汽飞艇。它采用最朴素的飞行思路，利用热空气或轻气体，将舱室安装在填充氢气的大型气囊下方，依赖螺旋桨助推。但气囊飞艇有致命的弱点：氢气易燃、气囊体积庞大导致机动性差、受天气影响严重。它们在短途运输和军事侦察中发挥了一定作用，却远非理想的航空工具。\n\n489年罗格蒂兰被发现后，无数探险家、学者和野心家试图登上这座浮空岛。教会派出的小队经过多年探索，终于在503年发现了散布在浮空岛底部边缘的残缺超位法阵组。虽然无人能理解龙族的超位法阵原理，但其中一部分符文图案被学者们临摹下来，带回地面研究。\n学者发现，超位法阵组中有一组符文与反重力效应相关，这个发现为飞艇的研发提供了关键的理论基础。（从本质上来说，这个符文能够使开弦端点部分脱离弦盒，从而减轻物体重量，但并不被法师所知晓）对罗格蒂兰超位法阵的研究终于在638年取得突破。他们从中提取出了一组"减重符文"。虽然远不及龙族原版的威能，但足以重型船只的重量减轻到可以上天。\n\n有了关键技术突破，将减重符文与魔导引擎结合，矮人在645年制造了第一艘魔导飞艇"苍穹号"，依靠船体底部蚀刻的减重符文阵列和魔导引擎驱动。\n\n魔导飞艇的出现是真正意义上的航空革命。虽然早期的符文飞艇载重有限、速度不快，造价昂贵，但与马车或帆船相比已经是天壤之别。\n随着减重符文的进一步优化，飞艇的载重和航程持续增加。660年代，矮人工匠推出了模块化飞艇设计，将船体分为动力舱、货舱和乘客舱，可以根据需求灵活组合。\n\n670年，第一条定期飞艇航线在矮人领地内开通，连接吉莉丘利尔与诺克耐维斯。随后航线迅速扩展：\n\n- 678年：第一条跨洲飞艇航线开通，连接矮人领地与牙里加帝国首都。航程从海路的两周缩短到了三天。\n- 683年：牙里加帝国建立了覆盖全境的飞艇网络，将北方长城沿线与南部矿区紧密联系。航线在后续进一步扩展到南方联盟，让努尔洲遥远的南北方联络在一起。\n- 692年：博洲冒险者公会投资建设了连接各成员城市的飞艇航线，使博洲分散的城邦第一次实现了几日可达的紧密联系。\n- 705年：魔族与精灵联合开辟了跨越赤道的飞艇航线，连接涅克洛玛洲与艾丽尼亚群岛。\n\n到蒸汽魔导时代末期，飞艇已成为全球客运和轻量高值货物运输的主流方式。虽然海运仍在大宗货物运输中占据优势，但飞艇的速度优势在军事、客运、邮件、贸易领域无可匹敌。\n\n### 潜艇的研发\n\n潜艇的研发动力来自对深海的探索欲。古人自以为到达的海底，却在近代发现海洋断层后被证明是"虚假的"，人们开始好奇海洋断层之下是什么。\n据传说记载称，海底城市忒米妮娅（龙纪元沉入海底的淮都废墟）埋藏着大量古代遗产，而静谧之海的奇观更是引人遐想，这些深海宝藏自古以来就是探险家们魂牵梦萦的目标。\n\n潜艇的研发比飞艇晚了约二十年，因为水环境对技术的要求更加苛刻：\n\n- 耐压壳体（约630年）：矮人冶金工艺精湛，他们用多层锻压钢制造球形耐压舱，辅以结构符文，使潜艇能够承受深海的水压。\n- 仿生设计（约635年）：工匠从鱼类的游动中获得灵感，设计了一种"仿鳍推进器"。由魔导引擎驱动的柔性金属鳍片，模仿鱼尾的摆动产生推力，既能降低噪音，又提高了灵活性。\n- 魔力供氧（约657年）：水下维生一直是难题，在全力研发下，精灵的生命魔法发挥了关键作用。他们设计了一种"呼吸法阵"，通过富集周围海水中溶解的空气，持续向舱内供给以呼吸。\n\n663年，第一艘实用潜艇"探路者号"在诺克耐维斯下水。这艘潜艇长约二十米，球形耐压舱直径约四米，可容纳五名船员。它的设计潜深为4500米，实际试航中成功下潜至约3000米的深度。\n\n但弊端也很明显，缺乏电子信息设备，完全依赖魔导机械运作的潜艇只能依靠探照灯和肉眼观察环境，在深海弱光环境中完全是一个瞎子。因此潜艇大多于百米内的浅海作业，且不敢离开陆地太远。\n\n---\n\n## 全球格局的持续变化\n\n矮人并未垄断魔导科技（除了前沿的核心技术），随着全球贸易网络的形成，魔导科技通过商路流向各大洲，也引发大量世界性变革。\n\n### 海陆接触\n\n自潜艇研发后，科考活动同步跟进。潜艇在浅海区发现了多种前所未见的生物，包括海族生命。\n\n第一次遭遇海族是在671年，"磷虾号"小型潜艇遇到巡航的噬海者。探照灯打在噬海者表皮上时，吸引了大量环绕在它身边的喜光海洋生物。被包围的磷虾号甚至来不及窥探噬海者全貌，便惊惶地逃离。\n幸运的是，小型潜艇的魔力波动还不足以吸引利维坦的追杀，让这只潜艇逃回了地表。乘员表现出明显的恐慌，并终生拒绝接近海洋。\n\n后续又出现多次目击噬海者生物群落的事件，直到一次噬海者浮出海面，并意外吞噬一支小型商船队。\n这次灾难引起全世界的重视，对这只神秘的深海巨物怀有强烈的危机感。699年，各国势力聚集在静谧之海中央，将此地命名为海神岛，展开深潜活动探秘海底真相。\n\n海神岛下方便是海须圣地。由于在海底缺乏冶炼条件，海须还是第一次见到这种机械造物，心中的恐惧不比陆地种族少。\n为了保全圣地，海族主动接触潜艇。双方在艰难地长期沟通后，海族凭借惊人的智商掌握了地表的语言。\n最终，海族允许潜艇在圣地外的特定海域探索，并同意贸易海陆资源。海神岛开始成为重要的珍稀资源贸易据点，也成为静谧之海片区的商业中转站。\n\n### 哥布林全球扩散\n\n500年后，哥布林通过赤道贸易船抵达了博茨瓦岗洲，这片新世界为他们提供了无尽的荒地和无人看管的山丘。他们的登陆点很可能在博洲西部海岸，靠近迷雾丛林边缘的无人区域，远离卑津城市联盟的管辖范围。\n\n博洲的分散聚落结构反而利于哥布林扩散。在乌尼尔洲，哥布林必须避开矮人密集的矿井和人类沿海城邦；在博洲，各个城邦之间是大片的荒野和无人管理的林地，哥布林可以自如地从一个无人区迁移到另一个无人区而不会被发现。\n\n冒险者公会开始收到大量"清剿哥布林巢穴"的委托，这些委托通常来自庄园主或偏远村庄的居民，内容惊人地一致。\n这类任务报酬低、风险小、但面对野外营地还好，清缴复杂的地穴非常繁琐。一些年轻的冒险者把清剿哥布林当作入门训练，但很快发现这些绿皮小人比看起来更难对付。\n为了更好地清除他们，公会档案室保存着大量关于哥布林行为的观察记录，其规模和详尽程度远超任何其他种族的研究。在这些报告中，哥布林被细致地分为多个亚类：矿坑哥布林、丛林哥布林、荒漠哥布林、城市哥布林等，每一个亚类都有不同的行为模式。这些研究揭示了他们超乎预期的认知灵活性，哥布林开始遭到重视，被评价为一个很有威胁的种族。\n\n等到全球贸易网络全面形成后，飞艇和蒸汽船让跨洲交通变得前所未有的便捷。飞艇货运舱可能是哥布林最主要的偷渡载体，一艘标准货运飞艇的底部货舱有数十个隔间，其中总有几个是空的、未锁的、仅放着维护工具或备用零件。哥布林只需在飞艇停靠港口的时候溜进货舱，藏在所有东西之间，蜷缩在魔导引擎的余温中，就能在两天内穿越整片大洋。\n到700年，哥布林已经遍布全球所有大洲，只要有文明的地方，就有哥布林的位置。他们的种群密度与外族的聚居区高度正相关。\n\n### 牙里加帝国称霸\n\n新兴技术的出现重塑了全球贸易格局，而牙里加帝国因其独特的地理位置，成为最早的受益者。\n凭借与矮人的战略合作关系，牙里加在630年代就已经引进了第一批魔导引擎，用于矿山排水和纺织业，并不忘初心地投入进战舰武装中。\n\n在帆船时代，长白海峡的洋流复杂、风向多变，通行效率低下。但飞艇不受洋流和影响，蒸汽船只更是可以无视海面条件，长白海峡的战略价值因此飙升。掌握长白海峡的帝国仅凭关税便成为全球首富。\n更重要的是，牙里加恰好位于四大板块的地理中心。十字路口的位置，使牙里加成为海神岛之外最大的贸易中转枢纽。\n\n与乌洲教会的封闭政策形成鲜明对比，牙里加在贸易上采取高度开放的态度。港口对任何种族开放，只要遵守帝国法律，都可以自由经商。并借鉴博洲的部分法律体系，建立了相对公正的商业法庭，契约纠纷可以在法庭上获得裁决。这让更多国际商人愿意在牙里加进行长期投资，也让这里成为少有的种族混居地。\n\n中立性质也让牙里加货币成为跨种族的全球通用货币，帝国严格控制治币技术，并用魔法进行防伪处理。\n自此，牙里加迎来它的黄金时代。首都亚特劳斯城在650年已拥有超过八十万人口，是全球最大的城市，并已经出现了世界上最早的银行体系。商人可以获得一张"信用券"，凭券在帝国的任何分行提取等值货币，这解决了长途贸易中携带大量货币的安全问题。到670年左右，"信用券"本身已经在商人之间流通，成为事实上的纸币。\n\n同时，牙里加也是一个科技文化大熔炉。街头的语言多达数十种，各族的节日在城中轮流上演。为了方便交流，牙里加政府在632年设计了一套简单易学的通用语并大力推广，让人们可以无障碍交流。\n文化交融催生了独特的"牙里加风格"，融合了多族元素的建筑、音乐、服饰和烹饪，后来传播到世界各地，科技也随之传播到全球。\n\n### 兽人分裂\n\n黄金时代的繁荣并没有平等地惠及所有种族，对于兽人而言，这个时代是分化与流散的终章。\n\n#### 闭关锁国\n\n自363年人兽战争失败后，魔洛希派的处境每况愈下。\n\n390年代至440年代，魔洛希派兽人多次尝试突破长城防线，但牙里加的防御体系越来越完善，每一次进攻都以惨重的伤亡收场。蒸汽魔导时代开始后，力量的天平进一步向人类倾斜。面对这种降维打击，魔洛希派的军事优势荡然无存。\n\n最后一次大规模进攻发生在521年，这场战役被称为"赤雪之战"。魔洛希派集结了山区几乎所有能战斗的成年兽人，人数超过十万，选择在冬季进攻。当兽人冲锋到长城脚下时，等待他们的是早已严阵以待的魔导弩炮和从空中俯射的魔弹。万名兽人战士倒在长城脚下，魔洛希派的主力被彻底摧毁，此后再无力发动大规模进攻。\n\n战后，魔洛希派彻底放弃了南下的野心，退入安蒂罗斯山区的深处。这里地势崎岖、气候严酷，人类军队难以深入讨伐。牙里加帝国采取了封锁策略，在山脉南麓设置哨站，阻止兽人南下，但放弃对山区内部进行清剿。魔洛希派因此得以在山区中维持一种半隔绝的生存状态，回归了狩猎和采集的传统生活方式，人口在低水平上维持平衡。\n少数魔洛希兽人偶尔与外界进行零星的物物交换，用山区的毛皮和药材换取人类制造的工具。他们将过去的失败归咎于与人类接触带来的堕落，将迦米莎派视为叛徒，将山区的艰苦生活美化为"纯正兽人传统"的体现。这种文化使他们在贫困中维持了尊严，却也将他们牢牢锁在了历史的边缘。\n\n安蒂罗斯山脉与文明世界渐行渐远，也因此逐渐成为一片法外之地。\n\n#### 走向世界\n\n与魔洛希派的困守形成鲜明对比，迦米莎派兽人以牺牲尊严换来生存之路。\n\n人兽战争后，帝国划定的"兽人保留区"虽然土地贫瘠、面积有限，但迦米莎兽人凭借吃苦耐劳的品性，和优良的身体素质，农耕畜牧颇有成就。\n逐渐地，迦米莎派发展出了一种"半融入"的社会模式。他们学会了人类的语言和农耕技术，在保留区内建立了自己的村落和简单的手工业。少数迦米莎兽人被允许进入人类城镇，从事体力劳动，主要在矿山、码头和建筑工地。\n可惜帝国法律对兽人的保护非常有限，杀死一个兽人劳工的刑罚远轻于杀死一个人类公民。\n\n蒸汽魔导时代到来，意外地为迦米莎兽人打开了新的生存空间。\n随着全球贸易的发展，各大洲对廉价劳动力的需求急剧增加。其它种族的工人不仅成本更高，还受到行会、法律和工会的保护。而兽人劳工不仅健壮、耐力惊人，还不需要高工资、不享有严苛法律保护，成为雇主眼中的理想劳动力。\n\n约550年代开始，牙里加帝国就开始少量地向南方联盟输出兽人劳工。进入蒸汽魔导时代，更是系统性地向海外输送劳动力。\n名义上是允许兽人自愿出国务工，实际上却是保留区内有限的经济机会让大多数迦米莎兽人别无选择。帝国会从每份劳工契约中抽取佣金，形成了一条利润丰厚的产业链。\n\n到700年，迦米莎兽人的足迹已经遍布全球，逐渐形成了一种离散族群文化。尽管在各地都处于社会底层，但他们之间发展出了紧密的互助网络。同一座城市的迦米莎劳工通常会聚集居住，形成"兽人区"。他们在陌生的土地上保留了自己的语言、宗教和习俗，同时也不断吸收当地文化的元素。\n到蒸汽魔导时代末期，各地的迦米莎后裔已经发展出了各具特色的地域变体文化，和当地种族高度融合。\n\n### 南方联盟的裂痕\n\n南方联盟一直紧盯割让给牙里加帝国侵占的北部矿山，与帝国维持着一种微妙的冷和平关系。在蒸汽魔导时代到来后，全球对矿产的需求呈爆发式增长，南方联盟也迎来又一次剧变。\n\n魔导引擎的量产需要大量合金，科里克山脉拥有全球已探明的最多矿脉。魔导科技的每一次进步，都在拉动南方联盟的出口收入攀升。到680年代，南方联盟已成为全球最大的矿产出口地，同时也是高品质矿石和贵金属的主要供应方。联盟各国凭借矿产出口积累了大量财富，首都和各主要矿业城市的面貌发生了翻天覆地的变化，魔导路灯、公共飞艇站、银行、交易所，样样齐全。\n\n矿产繁荣却也放大了联盟内部的先天性裂痕，矛盾日益激化：\n\n- 矿业寡头与中小矿主：科里克山脉的矿权集中在少数几个大家族手中，这些家族原本只是地方贵族，但矿产贸易带来的财富让他们在几十年内膨胀为跨国寡头。中小矿主被挤压到边缘矿脉，利润微薄，对寡头的垄断日益不满。\n- 出口国与加工国：联盟内部出现了"出口派"和"加工派"的分化。出口国主要是山脉北麓国家，倾向于直接出口原矿和粗炼金属，利润高、见效快；加工国主要是南麓沿海国家，海运渠道不如北方，希望在国内建立魔导工坊，出口高附加值的精炼合金和预制基盘。但加工国的工坊技术远不如矮人，产品质量在国际市场上缺乏高端竞争力，让他们无法说服出口国改变贸易结构，利润始终不如北麓国家。\n- 依赖牙里加的矛盾：南方联盟的大部分矿产通过牙里加控制的长白海峡运往全球，帝国关税虽然在中立原则下对所有贸易国公平征收，但每年从南方联盟出口贸易中抽取的关税总额是惊人的。加上中古时期割让矿山的积怨，联盟内部始终存在不满的声音。\n\n671年，牙里加帝国提出了一项看似合理的提议：在长白海峡南岸建设一座由帝国控股的大型魔导工坊，专门加工南方联盟的矿产。\n\n帝国承诺提供矮人技术支持和优厚的利润分成，却仍然在南方联盟内部引发了激烈争论。这正好解决了出口派远销关税重的问题，帝国工坊却会彻底垄断精炼环节，加工派将沦为纯粹的原料供应地。\n联盟最后以微弱多数否决了提议，但牙里加并不罢休，转而与联盟北方的个别国家进行谈判，还归还了部分矿山，试图瓦解联盟的团结。到680年代，矿业同盟的几个核心成员国已经开始与帝国秘密往来。一股新的紧张氛围正在积聚，这次的南北冲突不再是南北洲，而是南半洲的南北矿区，围绕产业链展开争夺。\n\n### 艾丽尼亚开放后的百年\n\n459年联合舰队抵达艾丽尼亚群岛后，精灵从一个封闭了近千年的种族，骤然暴露在世界的注目中。对于这个寿命漫长、生活节奏缓慢的种族而言，外界的变化速度快得令人窒息。\n矮人的蒸汽机在几十年内更新了三代，世界版图在百年间重组了数次。而精灵的一位长老从青年到中年，就可能见证一个外来帝国的兴衰。\n\n精灵的人口早已分布到世界，种族终于得以扩充。多数精灵都喜欢博洲的氛围，成为冒险者中的重要力量。在与光明教会深入交流魔法技术时，也在乌洲建立了一个小邦国艾杜勒斯。\n\n面对日新月异的科技力量，精灵没有全盘接受或全盘拒绝，而是走了一条选择性融入的道路。\n\n#### 母树岛条约\n\n631年，矮人希望建立固定商业航线，连接艾丽尼亚群岛。在此之前，精灵随有和联合舰队出海的精力，但仍然存在严重抗拒。\n\n于是精灵同各方签署了《母树岛条约》，在当时看来几乎是苛刻的孤立主义：\n\n- 外族船只只能停靠海藤岛指定港口，不得接近母树岛。\n- 岛上禁止建设任何以燃烧为动力的工厂。\n- 出入岛交流都需经长老圆环批准，每次不超过十年。\n\n矮人工匠对此颇有微词，他们原本希望在母树岛建立一个大型魔导工坊，利用这里丰富的魔力环境，但精灵不为所动。长老圆环在内部辩论中达成共识：母树是底线。\n\n随着魔导科技的成熟，精灵终于开始小规模的引进魔导技术，并在繁生岛设立唯一一个空运站。\n尽管如此，任何工业活动都不会被允许接近母树，他们对母树的保护堪称宗教的虔诚。这份坚持让精灵在之后的数百年里始终处于全球化的边缘位置，他们确实有参与其中，却从未被卷入浪潮中央。\n\n但后来的历史证明，正是这种谨慎让精灵避免了外界的又一波混乱。\n\n#### 与魔族的平衡\n\n精灵与魔族之间的亲近感从中古时期的第一次接触就埋下了种子。两族在外形上确实有相似之处，这让精灵在魔族面前没有面对其他外来者时的那种生理性隔阂。但深入交流之后，双方都意识到彼此的精神内核截然不同：魔族激进、自傲、以征服为荣；精灵内敛、审慎、以和谐为追求。\n这并没有导致冲突，反而形成了一种奇特的互补性吸引力。魔族贵族欣赏精灵的优雅与智慧，精灵学者则对魔族在极端环境中锤炼出的生存哲学感到好奇。\n\n705年魔族与精灵联合开辟飞艇航线，连接涅克洛玛洲与艾丽尼亚群岛。这是精灵签署的最开放的一项对外协议，进口无法自产的金属和矿物，摆脱对矮人的单一技术依赖，这让两族关系进一步靠近。\n\n但这条航线也引发了精灵内部的争论，尤其是后来机械神教的出现，让部分长老担忧，与魔族走得太近会让精灵卷入不应有的冲突。因此，和魔族在政治上的交流始终有限，最多局限在商业、技术层面交流。\n\n### 娜迦问世\n\n娜迦族生活在乌尼尔洲伊腊塔干沙漠深处，这片沙漠在新生纪元数百年间从未被人类真正穿越。沙漠外围的人类邦国知道沙漠中有绿洲，但没有矿脉或森林资源，从来没有足够的动力去深入探索。\n\n682年，教会在乌洲内部建设连接南北邦国的飞艇航线时，一艘飞往南方教区的货运飞艇在沙漠上空遭遇沙暴，偏离航线近两百公里。风暴过后，船员在整理船体时发现了沙漠腹地的一大片绿洲，绵延数十里、几乎可以称作沼泽。湿地中有简陋的木制建筑和人工开凿的水道，人形的生物在植被间穿梭。\n\n飞艇降低高度后，船员看清了那些生物：上半身是类人躯体，下半身是覆盖鳞片的蛇尾。双方的对视只持续了片刻，娜迦从未见过飞艇，绝大多数个体迅速潜入水中或躲入植被深处。飞艇也未久留，船体在沙暴中受损严重，必须尽快返回基地。\n\n教会在收到报告后进行了小规模的后续调查，确认了娜迦族的存在。此时的教会被更紧迫的事务淹没，没有为难娜迦族。娜迦也意外地没有表现出威胁意愿，并随着人类走出沙漠。\n很快，娜迦的优秀制度技术便让他们在世界有了一席之地。他们不仅是毒药师，也是解药师。虽然人口相对非常稀少，但总归是成功走向世界。\n\n---\n\n## 世界矛盾恶化\n\n之所以单独分一个板块，是因为这几个地区的发展紧密相关，并直接引发后续的世界最大矛盾。\n\n### 光明教会的挣扎与转向\n\n光明教会在进入蒸汽魔导时代后面临着前所未有的信仰危机，魔导机械不依赖神赐，不信光明神也能操作，从根本上动摇了"魔法来自光明神恩赐"的教义根基。\n\n教会的应对措施是附魔理论：声称魔导器之所以能运作，是因为矮人工匠在制造过程中"无意间"使用了神赐予世界的魔力，而教会通过附魔仪式让这些魔力"归正"。这套说辞在底层信徒中仍然有效，但在受过教育的神职人员内部，信仰危机在持续蔓延。\n\n尴尬的是，教会迫切需要先进技术来对抗魔族，最终在660年代松了口。了换取矮人的魔导技术，教会不得不开放光明谷的多条魔力水晶矿脉。到了690年代，光明谷东侧已经被露天矿坑蚕食得面目全非。\n事实上，历经千百年传承，信仰已经根深蒂固，连教皇自己都分不清神话是真是假。教会内部普遍认为出卖圣地就是出卖灵魂，正在变成自己曾经讨伐的"异端"。\n\n保守派开始公开抵制光明谷的进一步开采，宗教裁判所逮捕了几名带头抗议的修道士，却引发了更大规模的内部震动。部分修道院宣布脱离教廷管辖，在山区建立隐修据点，自称"原初光明会"，这是教会自457年结束清洗以来最严重的一次分裂。\n\n时任教皇深知教会正在不可逆转地衰落，他需要一场能让信徒重新跪下的神迹。\n\n巧合的是，684年，天翼族出现了。\n\n### 博洲民主的困境\n\n博洲在蒸汽魔导时代面临前所未有的挑战。魔导科技使生产力跃升，也带来贫富分化，联盟内部出现了"富城"与"穷城"的裂痕，这是博洲民主制度建立以来从未遇到过的内部不平等危机。\n\n#### 发展不平衡的矛盾\n\n卑津城市联盟的北方城市，如铁门城、卑津城、辰砂港等，拥有与矮人最早建立的贸易关系。截止700年整，北方三城的魔导工坊数量过百，产品覆盖魔导引擎、民用魔导器和冒险者专用装备。\n而南方城市，在第一次圣战后长期处于前线的边缘地带，则几乎没有任何魔导工坊。南方经济依赖的是农业、伐木和低端冶炼，这些产业在魔导时代的利润率远不如魔导制造业。\n\n从北到南，经济呈明显下行趋势，南方甚至逐渐成为北方倾销商品，获取原料的场地。贫富差距已经大到不容忽视的地步，南方城市开始无力维持基础公共服务，部分城镇甚至拖欠民兵队薪饷。\n\n另外，飞艇和潜艇的出现让冒险者的业务范围从陆地扩展到天空和深海，公会开始设立飞行分部和潜水支部，催生了天空骑士和深海猎人这两个新兴职业。公会的跨城协调能力进一步增强，在飞艇航线管理、深海资源勘探、国际仲裁中扮演越来越重要的角色。到700年左右，冒险者公会已经是一个事实上的跨洲组织，在各大洲都设有办事处，冒险者职业也风靡全球。\n\n可冒险者工业的业务拓展反而加剧了矛盾。公会虽然是中立机构，但飞艇航线的规划、深海资源的勘探需要大量投资，公会自然地倾向于与北方富裕城市合作，这让中南部城市感到被双重边缘化：既没有工坊，也分不到新产业的份额。\n\n#### 教会留下的裂痕\n\n教会留下的影响正在持续发酵，中古时期的渗透虽然被卑津城市联盟的多数城市抵制，但并未消失，教会的介入已经在博洲造成两大新矛盾：\n\n- 思想分裂：第一次圣战期间北逃的难民已经繁衍了两三代人，他们中的许多人接受了教会的光明信仰，形成了稳定的信众群体。这使得博洲许多城市都有规模可观的教堂，信众多为底层劳工和难民后裔，在人们的精神生活中占有举足轻重的地位。\n- 神权代表之争：部分信众在公民大会上要求设立"神权代表"，让光明教会的司祭在公民大会上拥有席位。这个要求在传统派看来荒谬至极，也直接引起原驻势力对教会不满。\n\n多次辩论后，联盟通过了折中方案：允许司祭以个人身份参加公民大会发言，但无表决权。\n\n#### 初步方案与僵局\n\n面对内部危机，博洲的知识界并非无动于衷。685年，一群来自中部城市的代表提出了一份《均衡提案》：\n\n- 财政平衡基金：北方城市每年向联盟缴纳其魔导工坊利润的8%，成立共同基金，用于资助南方城市的基础设施建设和工坊引进。\n- 技术共享条款：获得基金资助的城市必须向联盟开放其新建工坊的技术成果，防止知识垄断。\n- 职业转型培训：冒险者公会承诺在南方城市设立飞行和潜水培训分部，帮助当地年轻人进入新兴产业。\n\n这份提案在688年的卑津城市联盟大会上被提交表决，但高层早已在利润洪流中迷失自我，投票结果是戏剧性的分裂。南方城市全票赞成，中部城市多数赞成，北方城市联合抵制。\n提案最终被否决，但所有人都知道，问题不会因为否决投票而消失。博洲的民主制度在这一次大会上暴露出严重缺陷：当多数与少数之间的利益冲突足够尖锐时，制度本身没有提供有效的化解机制。\n\n到695年，部分南方小城开始绕过联盟，直接与教会建立贸易关系。教会比北方城市更愿意以低价出售魔导器，换取南方城市在政治和信仰上的效忠。\n\n#### 技术丰富\n\n不过好消息是，以冒险者公会为纽带的分布式生产网络，虽然让产品质量参差不齐，但也充满地方特色与生产活力。博洲的产业创新和实用化是出类拔萃的，在世界市场上都具有创新竞争力。\n\n### 天翼族危机\n\n684年，一支货运飞艇在航线上看到一座悬浮在云海之上的岛屿，西风浮屿。\n\n飞艇的接近立即被天翼族巡逻队察觉，巡逻队员迅速包围了飞艇，审视这个从未见过的金属造物。船员全都僵在了甲板上，他们从未有过关于天翼族的记载，但这明显与光明教会神话体系中的天使相似。\n\n双方在极度的紧张中完成了第一次交流，天翼族的语言与任何地面语系都没有亲缘关系，他们的态度并不友好，表达了明显的驱逐意图。飞艇被迫返航，带回了天翼族的初步信息：一个有翼的类人种族，生活在四千米高空的浮岛上。\n\n魔导学界为之震动，他们居住的岛屿稳定悬浮在天上，如果能破译其技术，魔导飞艇可能再次出现划时代的跃进。\n\n#### 孤立派与回归派的争论\n\n与此同时，西风浮屿内部也爆发了剧烈争论。\n\n天翼族社会在封闭的千年里从未直面过陆地种族，他们的世界观建立在一个隐形的前提之上：天空属于天翼族，与地面互不干涉。但显然，被视为蝼蚁的生物，进步速度远超他们想象。风主会议围绕如何应对外来者分裂为两派：\n\n- 孤立派以风领主"萨菲拉斯"为首。他主张立即隐蔽浮屿，在浮屿周围制造永久的云层遮蔽，让飞艇再也无法找到他们。他认为地面种族是贪婪的生物，他们一旦确认浮屿的存在，就会觊觎超位法阵的技术，接触只会带来灾难。\n- 回归派以年轻的风领主"艾琳诺"为首。她的曾曾祖母是举风者的弟子，遗物中保存着举风者手稿的残片。这些手稿表明，举风者从未主张过与地面彻底隔绝，甚至还尝试设计过如何让群岛重回海面。艾琳诺认为，地面种族既然已经能飞上天空，天翼族就无法永远躲藏。与其被动暴露，不如在力量平衡尚未被打破之前主动建立外交关系，了解这个世界正在发生什么。\n\n双方的争论持续了整整两年，回避外部世界已经融入了天翼族的文化本能，孤立派在风主会议中占据多数。\n\n687年，一艘带有牙里加帝国标志的勘探飞艇抵达了西风浮屿。矮人的情报已经传遍全球，牙里加帝国显然比矮人更热衷于外交。帝国使节带来了一整箱牙里加信用券，面值等同于一座魔导工坊的造价，以及一封由帝皇亲笔签署的同盟邀请函。\n\n孤立派将这份礼物视为威胁，认为陆地想用钱买下他们。但回归派却反唇相讥，认为他们无法对抗帝国的强大力量。\n风主议会最后选择派出艾琳诺为使节，随帝国飞艇前往地面，了解地表世界。天翼族绝不会全面开放，但选择开始了解地面。\n\n### 教会狂热与二次圣战\n\n艾琳诺抵达地面的消息传到乌洲时，光明教会正处于信仰危机的谷底。教皇在第一时间召集了枢机主教团，手中握着一份探子的详细报告：艾琳诺的洁白羽翼、冷白瓷皮肤、金色瞳孔、轻盈如无重的体态。这些特征与教会两千年来所追寻"天使"的形象高度重合，这令他们无比激动，来不及细想便认定这是天使降临。\n\n教会在艾琳诺抵达牙里加帝国仅仅两周后，就在拉古教廷发表了被称为"天使谕令"的公开布道，逻辑简洁而不可反驳：\n\n"龙纪元时期，光明神曾派遣天使降临世界，与龙族作战。如今天使的后裔重新出现在世人面前，这不是巧合，是光明神在回应教会的祈祷。在教会被机械腐蚀，被世俗思想侵蚀的黑暗时刻，神重新向世界张开眼睛。天使不是传说，天使有血肉、有翅膀、会说我们的语言。天使就在这片天空之上，而天使的降临只能意味着一件事，光明神的远征即将重启。"\n\n整个教会沸腾了，无数人涌向街头，跪在尘埃中对着天空祈祷。那些因为疑惑而离开教会的修士、因为光明谷被挖而心碎的虔诚信徒、在世俗邦国的酒馆里被嘲笑为"迷信"的信众，终于有了回击质疑的武器。\n\n#### 第二次圣战发动\n\n教皇巧妙地利用了这股狂热，他宣布天使的降临是对教会不作为的谴责。光明神把天使送到世人面前，是希望教会重新承担起对抗魔族的神圣使命，被魔族玷污的博洲南部必须被收回。\n\n博洲南部从468年第一次圣战后就一直处于魔族控制之下。两百多年后，魔族在那里建立了稳固的殖民据点，与原住民杂居通商。\n但教会的叙事中，那些原住民，包括已经与魔族通婚数代的人类，都是被邪神洗脑的异端。\n\n教会很快集结了一支远超第一次圣战规模的远征军，大量圣光骑士团、光明法师联队、狂热教徒入伍。690年代中期，远征军登上教会的武装飞艇和蒸汽船，驶向博洲，发动第二次圣战。\n\n卑津联盟对此的反应是尴尬而分裂的。南方城市早已因经济困境对联盟失望，部分城市暗中欢迎教会的到来，主动提供补给。北方城市强烈反对任何外国军队进入博洲，要求联盟派民兵拦截。\n但联盟本身缺乏统一的军事指挥权，民兵队归各城自己管，轮值委员会只能协调不能命令。联盟还在争论的时候，远征军已经于694年在博洲西南海岸登陆，旗帜上绣着展翅的光明天使。\n\n### 魔族溃败引发内部革命\n\n魔族引进魔导技术始于640年代，初期主要由长老议会控制的几个大家族牵头。然而到680年代，涅洲的魔导工业已经大大超出了议会预想的规模。\n\n涅洲并不缺乏矿产资源，萨拉默托深渊内的稀有金属种类众多，周边的火山地带富含硫化物矿脉，神龙战争遗留的金属碎屑沉积形成了易于开采的浅层矿藏。魔族擅长在高风险环境中作业，深渊边沿的矿业和冶炼产业在几十年内迅速膨胀。魔导引擎的普及进一步加速了这一进程。\n\n到680年代，光是一个边缘城市就已经拥有数十座工厂，用于冶炼、锻造和军械制造。\n\n即非家族出身的野生魔族也在这场工业浪潮中抓住机会，工坊主、矿业承包商、飞艇货运商人、魔法材料中间商……一批脱胎于平民的魔族资产者悄然积累了可观的财富。\n他们与家族贵族之间的差距不在于富有程度，而在于更致命的政治地位。议会中的绝大多数席位由大家族世袭，民间商人无论多有钱，都无权参与立法。而家族一切涉及高利润的产业都在向家族倾斜，税收和法律不断压制民间工商业活动。\n\n这股矛盾在几十年间缓慢积聚，但并没有爆发。民间资产阶级虽然不满，却还能在家族体制的夹缝中找到利润空间。\n\n#### 前线崩溃\n\n教会远征军在699年正式开战后，长老议会最初的反应是自信的。过去两百多年里，博洲南部的殖民据点一直稳固，议会的军事评估认为这次远征不过是第一次圣战的翻版。\n\n第一次圣战时，教会的武装力量以圣光魔法为主，在战术灵活性和机动性上远不如分散行动的魔族军队。第二次圣战时，教会不仅拥有了魔导武装，更拥有了飞艇运输和魔法轰炸能力。这次远征军的人数更是上一次的数倍，几十万人的军队士气空前，高喊着"天使在上"的圣战军，与两百年前被迫参战的农奴征召兵有着天壤之别。\n\n前线在开战第一年就丢掉了三个外围据点。长老议会下令增兵，但增兵意味着更多的军需。军需订单全部落在了大家族控制的工坊手中，所有军工订单由议会统一分配，民间工坊又一次与利益失之交臂。\n\n民间商人愤怒了，军事危机不仅没有弥合家族与平民之间的裂痕，反而让它变成了鸿沟。家族越来越富，平民越来越穷。部分民间商人开始与冒险者公会甚至教会接触，绕过议会直接进行贸易。\n\n#### 资产阶级革命与王位更迭\n\n血族男性"卢瑟·安理卓德"起初并不是革命者。他是一位矿业承包商，在深渊东侧拥有三座赤铜矿和一座小型魔导冶炼厂，手下雇有数百名工人。他的商业版图在680年代迅速扩张，他公开拒绝向任何家族缴纳关系贡金，靠着积极引进的新技术自力更生。\n\n圣战爆发后，卢瑟的三座矿被强征。名义上是战时采购，实际上给他的报价远低于市场价。他试图向议会申诉，但连议会的大门都没进去。无功而返后，他开始在矿区建立独立的防御武装。\n议会不允许民间拥有超过一定规模的武装力量，但面对博洲圣战的压力，议会对后方管控出现了松动。卢瑟的武装一开始被登记为矿场保安队，但实际上装备了从牙里加走贸易渠道购买的魔导武器。\n\n随着前线溃败的加剧，议会的威信开始动摇，质疑在野生魔族中蔓延。\n战争暴露了家族体制的深层腐朽，大家族把持了军需供应，却没有任何一个家族在前线承担起真正的军事指挥责任。他们乐于发战争财，却不愿在战争中牺牲，依靠森林和西边险阻地形纠缠拖延，甚至早已规划好赚够钱就撤退，无视民族尊严与战士的牺牲。军需官员吃回扣、军火质量参差不齐、前线指挥官与后勤扯皮……消息从前线传回后方，每一则都让议会的合法性消退一分。\n\n703年，卢瑟拒绝继续向议会纳税。他的矿区武装驱赶了前来收税的议会代表，议会以叛乱名义发出逮捕令，但没有任何执法队愿意深入卢瑟控制的矿区，只因内部武装过于强大。\n卢瑟的抵抗迅速产生了示范效应，数月之内，深渊沿线的十几个民间矿业城镇相继效仿，各大城市还暗中支持矿场主，议会税收系统濒临瘫痪。\n\n紧接着，在704年，卢瑟带领的野生魔族武装便集结于魔王城外，人数超过三万，发动卢瑟革命。琦玡早已对家族灰心，悄悄内应打开城门，革命军顺利攻入城内。城中兵力空缺，很快便被控制，长老议会不得不紧急从前线全面撤军回防，第二次圣战也以教会胜利告终。\n\n卢瑟·安理卓德取代琦玡，成为第三任魔王。长老议会面对众多城市的联合革命，以及规模越发庞大的正在集结的革命军，不得不妥协，并新增6个城市代表入会。涅洲的政治天平正在从家族统治向二元结构的轨道移动，这次革命实质上是一次资产阶级革命，本质是为了打破大家族对新型工商业的打压。'},{id:'全面战争时期',title:'全面战争时期',content:'顾名思义，全面战争时期的主旋律便是战争。全球各地围绕各自的纠纷展开战乱，几乎所有文明都被卷入这场前所未有的漩涡。战火以一种不可遏制的方式蔓延开来，前两个时代积聚的所有矛盾在同一时刻找到了出口。\n\n而推动这一切走向失控的，恰恰是那些本应维持和平的力量。\n\n---\n\n## 灰暗地带浮现\n\n### 海神岛的堕落\n\n海神岛它不属于任何大洲，不受任何国家管辖，名义上由海族控制，但海族对陆地种族的内部事务既不理解也不关心，海族唯一的底线是海须圣地的安全。只要不触碰这条红线，海族对岛上的陆地种族行为一概不过问。\n而各大势力对海神岛的态度同样是微妙的。海神岛是唯一能获取深海特产。因此没有任何势力愿意率先打破中立，去承担破坏海陆关系的骂名。这种多方默许的监管真空，使海神岛迅速演变为一个不受任何法律约束的灰暗地带。\n\n全面战争时期，海神岛的黑市贸易在发展到前所未有的规模。军备状态的各国对魔导引擎、魔力水晶、合金材料、符文基盘的需求激增，但合法贸易受到关税、禁运和产能限制的严重制约。\n海神岛的走私商提供了一条免税、免审查的贩卖通道。商船名义上驶往海神岛进行"深海资源贸易"，实际在途中将货物转卖给等候在公海的交战方船只。\n\n情报交易同样是热门生意，海神岛汇集了来自各地的情报，当然包括假情报。这里成为国家之间政治博弈的重要场所。\n\n海族对海神岛的演变并非毫无察觉，但他们的认知框架无法理解黑市或走私概念。在海族的思维中，只要不发生暴力冲突、不威胁圣地安全，他们无意干涉陆地种族之间那些复杂的规则纠纷。\n部分海族长老私下对陆地种族的混乱感到困惑和失望。他们原本以为开放接触能带来和平交流，但看到的却是陆地种族把他们的圣地门口变成了一个藏污纳垢的交易场。少数保守派海族开始主张重新关闭海须圣地，但多数长老认为已经打开的通道无法关闭，而且海族也从贸易中获得了大量陆地技术，尤其是金属工具和魔导器。这些物资对缺乏冶炼条件的海底社会发展至关重要。\n\n海神岛因此维持着它窘迫的中立。它的存在既是和平交流的象征，也是战争态势下种种黑暗的缩影。\n\n### 机械神教与情色产业链\n\n血肉机械的诞生比机械神教早了近半个世纪，这项技术最初的推动者仅仅是一位在矿业事故中失去左臂的魔族工匠。\n\n他原是深渊东侧一座矿井的机械维护工。648年，矿道内一台老式魔导引擎散热失效，高温蒸汽炸裂了管道。工匠的左臂从肘关节以下被飞溅的金属碎片削断，右脸严重烧伤。矿主支付了一次性的赔偿金后就将他解雇了。\n\n一个失去肢体的底层工匠根本看不到未来，正规的医疗魔法被教会和贵族垄断，精灵治疗师远在千里之外且收费高昂，而野生魔族社区缺乏价格实惠的公共医疗。\n然而他没有等死，利用赔偿金购买了一台报废的小型魔导引擎、一些二手酸蚀工具和几块低品质魔力水晶。然后，他在深渊边找到一具刚死不久的龙化生物的尸体。将龙化生物的上臂骨骼掏空，嵌入微型魔导引擎，用自学的死灵魔法激活残存的细胞，再用自己的神经末梢与引擎的激发符文直接连接。\n\n他的铁骨臂最终成功保留下来，在深渊矿区引起轰动。矿工是最容易受伤的群体，每年都有大量残障事故发生，这项技术自然在底层社会流传开来，并逐渐在世界范围拥有巨大影响力。\n这项技术大多用于魔力天赋不强的弱小魔族，或是没钱寻求再生法术的残疾者。主流魔族社会并不喜欢这种技术，认为降低了自己的档次，因此并未被推广。在矿区流传数十年后，从简单的义肢到替代部分脏器功能的微型魔导引擎，血肉机械的产品种类已经相当丰富，作为一种廉价的医疗替代方案在底层社会传播。\n\n然而，这项技术在不经意间被某些极端的魅魔注意到了。\n魅魔以性爱榨取魔力维生，其身体结构为此高度特化。但无论魅魔的生理有多适应，每一次榨取都需要消耗时间和精力，而目标的魔力储备是有限的。一些魅魔开始思考：如果能用血肉机械将身体改造，让榨取过程完全自动化、持续化、无需主动参与，会发生什么？\n答案就是机械神教的诞生。\n\n最初只是在涅洲情色场所中的一股小众潮流。魅魔们用微型魔导引擎驱动改造过的生殖器官和消化系统，配合死灵魔法维持组织活性，创造出一种半机械半肉体的情色机器。这些改造魅魔可以在完全失去意识的状态下继续工作，大幅提高了榨取效率。部分魅魔还发现，这种状态下她们自己也能持续获得快感。痛觉被切断，快感却被放大。\n\n这种体验让一些魅魔彻底沉沦。她们将自己改造成越来越接近机器的形态，并围绕着这种极端体验发展出了一套扭曲的信仰体系。机械神教由此从情色产业中脱胎，成为一个真正的宗教。\n实际上在魅魔中，这种极端想法非常小众，因为她们的性能力已经足够强大了。但随着贸易流向世界，机械神教的信众在其它种族中迅速扩大。任何种族中那些对快感上瘾的人、在战争中精神崩溃的人、被生活碾压到想要彻底逃避的人，都可能被它的教义所吸引。\n到700年整，机械神教已经在各大洲的建立了秘密据点，形成了一个跨越国界的地下网络。\n\n但对于主流魔族社会而言，机械神教是一个难以启齿的耻辱，他们并不接受这一门派起源于魅魔，反而成为第一个抵制的势力。\n\n### 哥布林专栏：世界范围的敌视\n\n在全面战争期间，哥布林迎来了意外的人口增长。\n\n临时迁移潮和后方骚乱，以及频繁的战争，制造了大量无人看护的农田、无人值守的仓库、以及无人掩埋的尸体，这些都是哥布林的免费食物源。\n同时，混乱动荡的世界也让哥布林的人口掳掠更加容易、隐蔽且合理。众多废弃的死寂空间成了哥布林的乐园，哥布林问题成为多个社会不得不正视的棘手议题。\n\n但世界上也出现了反对现行歧视政策的微弱声音。几位学者指出，哥布林的智力水平远高于兽类，能够制作简单工具、使用陷阱、通过模仿学习语言、在代际之间传承知识，这些都是智慧种族的特征，在法律上应当享有一定的权利。然而，这些学者的声音几乎得不到回应，反而有人尖锐地指出：你愿意用你的母亲和女儿做赌注吗？\n\n---\n\n## 全球战争爆发\n\n### 努尔洲内战\n\n努尔洲先一步陷入了内战的泥潭。\n\n牙里加帝国在671年提出的提案虽被联盟否决，但通过各种渗透手段，到全面战争爆发前夕，矿业同盟实际上已经名存实亡。北方矿区国家与牙里加帝国的经济联系日益紧密，大量矿产出货依赖帝国的港口和关税优惠。部分北方国家的矿业寡头甚至开始持有牙里加银行的股份。南方沿海国家则被排除在这个利益圈之外，经济处境在第二次圣战期间进一步恶化，贸易航线受到战事干扰，加工品找不到买家。\n\n约709年，康普尼西王国单方面宣布与牙里加帝国签署新的矿产贸易协定，大幅降低对联盟内南方国家的原料供应配额。这违背了联盟当初"互相开放资源"的承诺，引发了南方国家的强烈抗议。\n南方加工国在联盟大会上要求对康普尼西实施制裁，但北方国家联合否决了这一提案，联盟的内部分裂从经济矛盾升级为政治对抗。\n\n#### 战争爆发\n\n710年，南方盟国宣布退出科里克矿业同盟，并封锁了科里克山脉南麓的主要矿道，阻止北方矿车通行。康普尼西随即派兵前往矿道，要求恢复通行。双方武装在矿道入口对峙了三天后擦枪走火，冲突迅速升级为全面战争。\n\n牙里加帝国在战争初期采取了审慎观望的态度。帝国对北方国家的承诺仅限于贸易协定，不包括军事同盟。帝国不想在努尔洲的山区陷入一场长期消耗战，但也不想失去北方矿区这个关键原材料来源。\n帝国最终选择向北方国家提供魔导武器、后勤补给和军事顾问，但不直接派兵参战。这种做法让北方国家在战场上维持了优势，但也让南方联盟将牙里加视为事实上的敌人，尽管双方在法理上并未开战。\n\n到712年末，努尔洲的形势已经非常复杂。北方矿区国家控制着科里克山脉北麓，陷入与南方国家的消耗战。南方沿海国家封锁了部分矿区通路，但因缺乏资源而面临军工短缺。\n\n### 魔族反攻失败与全国崩盘\n\n在革命初期，革命派的力量是团结的。但在革命成功之后，目标不同使魔族内部又开始分化：\n\n- 尝到甜头的小资产阶级希望进一步削弱家族权力，进而全面自由化经济。\n- 市民希望改善生活条件、降低物价。\n- 出于魔族的骄傲，军队迫切希望发动反攻，为死去的战友复仇。\n\n除了内部分化，革命派所面对的敌人也在持续发难。长老议会虽然被迫妥协并新增了6个城市代表席位，但旧家族成员仍然掌握着大量土地、矿产、仓库和传统贸易网络。他们表面上接受了新体制，暗地里却在源源不断地设置障碍，各项改革提案在家族代表的联合抵制下屡屡受挫。\n\n707年，卢瑟面对多方压力焦头烂额，认为应优先解决教会的威胁，下令发动反攻。这本应是一次快速的局部战斗，证明新政权有能力保卫魔族的领土，但卢瑟的军事顾问低估了对方的军队规模。\n\n第二次圣战的胜利让教会的权威空前高涨，圣战军不仅没有在战后回撤，反而留在博洲南部巩固防御，并持续渗透博洲城市。\n先前的战斗一直由家族议会控制，卢瑟缺乏对军事情报的全面了解，试图集中力量从正面突防。反攻以惨重失败收场，损失上万名士兵后被迫撤退。\n卢瑟的威望急剧下降，资产阶级开始质疑他是否具备军事领导能力。更糟糕的是，这次失利触发了经济连锁反应。反攻的军费开支本已让刚刚稳定下来的财政再次紧张，战败的损失进一步加剧了货币贬值。各城市的物价飞涨，市民的不满从旧家族身上转移到了新政权身上。\n\n反攻失败同样加剧前线将领的离心。第二次圣战虽然以魔族退败告终，但教会并未全面占领博洲南部。从乌洲到博洲的补给线和通讯线实在过长，兵力在夺取几个核心据点后也接近极限，双方在博洲中南部的河流沿线形成一条停火线。\n大量魔族军队仍驻扎在停火线以南的防线中，前线将领大多也是野生魔族出身，对后方革命的反应非常复杂。他们乐于见得家族势力的削弱，但对卢瑟政权的执政能力越来越怀疑。失去对指挥的信任后，部分军队开始独立行动，压榨当地人类社区，绕过魔王城直接征税和征粮，尝试找到突破口。\n\n魔王城对前线的控制力正在以肉眼可见的速度衰退，卢瑟却无法弥补自己犯下的致命错误，魔族需要更贤能的人站出来替他收拾残局。\n\n### 矮人的战争经济与道德困境\n\n矮人从未正式参战全面战争时期的任何一场主要冲突，但他们制造的魔导引擎、符文基盘和军用飞艇被交战各方广泛使用。诺克耐维斯的工坊在战争期间进入了前所未有的满负荷运转，来自各地的军火订单积压在每一家工坊的账簿上，交货期排到了三年之后。\n\n矮人社会对此并非没有争议。吉莉丘利尔的长老议会多次辩论是否应该限制武器出口，但每次都是实用主义占了上风。\n事实上，矮人确实悄悄执行了一套不公开的差异化出口政策：对教会的武器出口加收隐性附加费，对博洲和牙里加帝国则以优惠价格出售防御性装备，但没有任何矮人工匠对此感到自豪，他们始终认为科技不应该被这样使用。\n\n### 精灵的压力\n\n母树岛条约的苛刻条款让精灵在和平时期被边缘化，在战争时期反而成了保护层。艾丽尼亚群岛因为缺乏战略价值和工业设施，从未成为任何一方的攻击目标。但这并不意味着精灵可以安然置身事外。\n\n难民潮是精灵面临的最大挑战。战争制造的流离失所者远远超过各国接受能力，一部分难民将目光转向了精灵群岛。精灵并非冷血无情，他们确实开放了海藤岛作为紧急难民安置点，但母树岛条约禁止大规模外来人口进入的限制，意味着他们只能接纳远远不够的人数。精灵治疗师在各大洲的诊所也因战争而被迫关闭，许多精灵还被迫卷入战争之中。\n\n同时，精灵与魔族的飞艇航线在战争期间被迫中断。虽然没有正式断交，但商业往来基本停滞。部分长老认为应该彻底中断与魔族的关系以示中立，另一部分则认为战争期间才更需要保持对话渠道。\n而他们在与魔族接近的同时又面临着教会和博洲的外交压力，这让精灵陷入了道德焦虑，难以独善其身。\n\n---\n\n## 国际力量的新一轮积累\n\n在战争之外，各国或是主动或是被动地收获了许多实用的经验，尤其在政治与科技方面。\n\n### 魔族二次革命和体制重构\n\n#### 萨拉查政变\n\n血族男性"萨拉查·德布莫尔"出身于德布莫尔家族，长老议会成员族之一。他天生便拥有过人的政治头脑，以及狠辣果断的性格。按照常规轨迹，萨拉查应该成为家族的中坚力量，坐享祖辈积累的财富。\n\n在年轻时，他被送往牙里加帝国留学，在亚特劳斯城度过青年时光，目睹了牙里加先进的开放贸易制度、银行体系、世俗法治结构。回到涅洲后，他对家族引以为傲的血统政治产生深刻怀疑，并开始担忧整个魔族的未来。\n萨拉查首先在自己的领地中推行一系列小规模改革：允许民间商人在家族矿场中承包开采权、积极引入敌对势力的先进技术、建立魔族最早的城镇议事会。这些改革在经济上是成功的，在政治上却让他成为家族中的异类，他的父亲不止一次斥责他背离祖道。\n命运非常巧合，萨拉查与卢瑟结识数十年，是知根知底的挚友。他眼见卢瑟难以胜任魔王的职位，选择挺身而出。\n\n710年末的一次全院会议之前，他秘密联络了前线中层军官，以及六个城市代表中最激进的三位。凭借自己过去的为人和表现，成功说服他们提供军事支持。\n710年6月11日会议当天，萨拉查早已安排心腹控制住会场，并突然发难，在台面上控制住卢瑟及其城中所有亲近力量。他以家族成员的身份当众要求卢瑟让位，将决策权移交给议会。全场哗然，各家族都以为有机可乘纷纷支持，其余三位城市代表措手不及，军队将领则保持沉默。卢瑟在短暂的对峙后，当庭妥协让位，萨拉查政变迅速取得成功。\n\n##### 政治改革\n\n自蒸汽魔导时代已来，一直不可忽视的是，城市力量正在不断壮大，已经可以和家族力量持平。\n萨拉查的先进之处便在此：他并未明确站队，意识到两方都过于强大且独立，统一是不可能的，分裂更是不可取的。魔族社会急需的是重新分配权力，否则必然引发双方直接的武装冲突。\n\n710年末至711年初，萨拉查召集各方在魔王城进行持续数月的闭门谈判。\n城市方面的筹码是实打实的。革命期间集结的数万武装尚未解散，各城市商会联名表示如果谈判破裂将联合罢工，前线的下层军官也站在城市一边。家族则是拥有大量财富积累、广阔的土地和行政经验。没有家族的配合，任何新制度都无法运作。\n\n711年3月，谈判以魔王城宪章公布告终，这是魔族历史上第一部成文的宪制性文件，标志魔族从松散的二元体制正式进入议会制君主立宪制。\n\n##### 魔王权力落实\n\n在新体制下，魔王也拥有以下实际权力：\n\n- 行政权：魔王作为行政首脑，负责任命和罢免各部门大臣（财政、军事、外交、内务、司法），组成魔王内阁。内阁直接向魔王负责，负责日常行政运转。\n- 军事指挥权：魔王是魔族武装力量的最高统帅。战时，魔王可在一线指挥部队；和平时期，所有军事部署由魔王通过军事大臣执行。但宣战、签署停战协议、军事预算的批准权在议会。\n- 议会召集与解散权：魔王有权召集议会会议，也有权提出解散议会，要求重新选举。每次解散后，新的议会必须在60天内产生，同一任魔王任期内最多解散议会一次。\n- 外交权：魔王作为国家象征，代表魔族签署国际条约，但条约须经议会批准才能生效。\n- 赦免权：魔王有权赦免犯人，但赦免权不适用于被议会弹劾定罪的官员。\n\n同时，魔王要受到以下约束：\n\n- 魔王本人不经议会批准，不得征税、变更税率或发行债务。\n- 魔王发布的行政命令不得与议会通过的法律相抵触。\n- 议会若以半数以上通过弹劾案，魔王的大臣可以被议会弹劾，同一大臣被弹劾两次，魔王不得再次任命该人进入内阁。\n- 魔王本人可以被议会提出不信任动议，需至少三分之一代表联署，若获得半数以上通过，魔王由议会重新选举。\n\n##### 议会重构\n\n为了公平分配权力，萨拉查对议会进行彻底改革，之后的议会由上下两院组成：\n\n- 上院仍拥有13个席位，由历史悠久的大家族世袭，实际上就是旧长老议会。上院代表魔族的传统和传承，其席位不可取消，但可以由家族内部更换代表。\n  上院的权力集中体现在审议和延迟，下院通过的法案必须经上院审议，上院可以退回要求修改，但无权永久否决。若下院以三分之二多数再次通过同一法案，上院必须接受。\n\n- 下院席位数量按各城市纳税人口比例分配，初始设为13席，与上院席位数量相等，此后每十年根据各城市人口和纳税额调整一次。各城市的代表由该城市的城市议事会选举产生，任期三年，可连任。\n  下院的权力集中体现在立法和预算审批，所有税收、财政拨款、经济法规的修改必须由下院发起，上院无权主动提出。\n\n并且，《魔王城宪章》确立了议员的法律保护：\n\n- 议事豁免权：针对家族惯用的"事后算账"手段，议员在议会内的发言和投票不受任何民事或刑事追诉，让代表可以真正表达意见。\n\n- 议员资格可由原选举机构罢免：城市议事会可罢免自己选出的下院代表并重新选举；家族可更换自己世袭的上院代表。这意味着代表必须对自己所代表的势力负责，无法在选上后高枕无忧。\n\n两院合并后，任何一方都不能绕过另一方，单独通过任何重大决策。同时，议会共同拥有以下核心权力，共同制衡魔王，让魔王不成为任何一方的工具：\n\n- 立法权：所有法律须经两院通过。\n- 财权：税收、预算、公债须经下院发起、两院通过，未经议会批准不得动用国库。魔王内阁的各部门年度预算由议会审批，不通过则不得执行。\n- 批准权：国际条约、宣战、媾和须经议会批准。\n- 弹劾权：两院联名可弹劾内阁大臣（半数通过即可），可对魔王提出不信任动议。\n- 调查权：议会可设立调查委员会，调查内阁部门或地方行政的违法行为。被调查者必须在规定期限内提供文件、接受质询，否则构成违法。\n\n##### 城市自治\n\n《魔王城宪章》的另一个核心突破，是将城市的自治权从行政权中剥离出来，使其不再受魔王或议会直接管辖。这一部分的立法名义是"因地制宜原则"，但实质上是在家族与城市之间建立了一道清晰的边界。\n\n每个城市都新设立城市议事会，组成方式可由各城市自行决定，既可以由各行会选代表，也可以由市民直接选举。前提是议事会的产生方式必须得到该市市民的公开认可，且中央不得干预。\n\n议事会的权力包括：\n\n- 城市内部的税收、治安、公共工程 、 市集管理由议事会自主决定。魔王内阁可以在全国范围内征收国家税（如关税、矿产税、战时特别税），城市层面的市政税由议事会自行制定和征收，不上交魔王城。\n- 城市可以建立自己的市卫队，仅限于城市治安和防御，不受魔王军队的直接指挥。市卫队的规模和装备由议事会自定，但须报备军事大臣。\n- 城市议事会有权选举和罢免下院代表，下院代表绝不是中央委派的直属官员，而是地方反向发送向中央的代表。\n- 城市议事会可制定市政法令，法律效力限于本市范围内。市政法令不得与议会通过的国家法律相抵触，如有争议，由魔王城的最高法院裁决。\n\n为了防止庞大领土中的内战，萨拉查同时保留了魔王城对城市的若干底线性权力：\n\n- 各城市之间不得建立独立的军事同盟或外交条约，城市的对外关系属于魔王与议会的外交权限。\n- 在战时紧急状态下，魔王有权临时征调市卫队参与国防，但须经议会事后追认。若议会否决追认，魔王必须在15天内归还征调的部队并赔偿城市损失。\n- 城市议事会如被议会三分之二多数认定为"违法行使职权"，魔王有权暂停议事会运作并重新组织选举，但魔王本人无权单方面解散议事会。\n\n以前城市只能用暴力和罢工胁迫议会，现在城市可以通过下院席位、市政法令、独立的财政权和警权在制度内对抗家族，这无疑平抚了新兴资产阶级的态度。\n\n##### 最高法院\n\n在《魔王城宪章》之前，魔族的司法体系是分裂的。家族领地内部由家族自行审判，城市由各自的地方法官审判，魔王城也没有统一的最高司法机构。家族成员的案件按惯例移交长老议会审理，实际上意味着家族不对法律负责。\n\n萨拉查废除家族独立审判权，设立了最高法院。这是一个全新的机构，不隶属于魔王，也不隶属于议会。三名大法官，由魔王提名、议会批准任命，任期终身制，只有被议会三分之二多数弹劾才能罢免。\n最高法院负责裁决议会法律与市政法令之间的冲突；裁决魔王行政命令是否违宪越宪；审理涉及家族成员的重大刑事和民事案件；接受申诉，裁定行政部门是否违法。\n\n从此，全国势力都被放在在同一部法律下受审判。\n\n大法官终身制也是萨拉查最受争议的设计之一。反对者认为终身制让大法官不受任何制衡，萨拉查却认为频繁换任会让选举变成贿赂大赛，不如选三个有能力的人，让他们一直坐到老。\n\n#### 全方位的制衡关系\n\n《魔王城宪章》之所以不同于之前的权力分配，在于它没有给任何一方最终决定权。\n\n新体制下的魔族被分为三大势力：家族、议会、城市。实质上，三方对应的是贵族、中央与地方力量。\n在过去，魔族从未有过政治核心，即使设立魔王城，也不足以构成中央政治机构的权威。魔王和议会所代表的中央机构正式确立，让贵族势力和地方势力从此有一层间隔。每一方都可以启动对另一方的制约程序，要想达到目的，就必须在规则框架内争取。这至少让社会上的明争转为暗斗，免去大动干戈的武装冲突。\n\n#### 清洗与稳定\n\n宪章签署之后，萨拉查迅速发动系统性的政治清洗，目标是那些在旧体制中积累满身污垢的腐败家族长老。\n\n靠着过去数年间收集的完整证据链：收受贿赂、贪污税款、战时倒卖军需、妨碍改革。在宪章确立的法治框架下，他通过新成立的最高法院逐一审判，四个最有势力的家族长老被剥夺议员资格，家族的许多财产也被清缴，汇入国库。\n\n旧家族的损失无疑是惨重的，但他们仍然在制度中仍有一席之地，并不再面临被暴力推翻的危险。他们虽然被迫接受这个新格局，但对萨拉查颇具微词，让中央在日后行政中并非一帆风顺。\n同时，旧社会的封建礼教并未根除，家族建立起的文化秩序是难以被改革的。例如，魅魔虽然已经恢复合法继承权力，但仍然在政治核心里饱受歧视，仍然会遭到恶意针对。\n\n之后的时间里，萨拉查全面推动多项恢复措施：\n\n- 土地与矿权改革：家族垄断但长期无力开发的土地和边缘矿山，经议会批准后向民间公开拍卖或出租。此举迅速解放被压制的民间资本，新开矿场和扩建工坊在后续两年内贡献了相当可观的产能增量，为前线的持续作战提供基础。\n- 军需统一调配：战时物资管理局对军工订单统一招标，家族和民间工坊在同等条件下竞争。这不仅平息了民间对家族垄断军需的长期怨气，也让后方生产逐渐对接前线需求。\n\n- 武装力量改编：前线各大指挥官被纳入统一的战区指挥体系，但保留较大的战术自主权，不再事事等待魔王城决策。军队招募向所有魔族开放，家族贵族军官被要求与平民军官同等待遇，抗拒者退役。\n\n- 贸易与外交转向：在战争封锁的大环境下，与牙里加帝国和精灵的既有贸易点被继续维持，保持关键物资的进口渠道不中断。同时，积极推进情报网络构建，获取外界政治动向。\n\n### 博洲分裂\n\n博洲的民主制度在全面战争中终于承受不住压力而断裂，但断裂本身反而打开了一条出乎意料的重生之路。\n\n#### 南方脱离与教区形成\n\n715年，南方七个城市的公民大会在两个月内相继通过了脱离卑津城市联盟的决议，宣布成立南博洲自治邦联。\n\n分裂的表面原因是经济上的长期积怨，南方城市认为联盟已经沦为北方工坊主的统治工具，但更深层的推力来自教会。\n第二次圣战胜利后，教会在博洲南部的影响力已经无可撼动。南方城市的信众群体在战争期间膨胀到了人口的一半以上，部分城市的司祭实际上已经取代轮值委员会成为当地最有号召力的人物。圣战军的驻留也让南方城市习惯了教会的军事保护。\n\n教会敏锐地抓住了这个机会。拉古教廷没有以征服者的姿态出现，而是向南博洲邦联提出协议：各邦国保留自己的公民大会和地方习惯法，教会不派遣主教直接参与日常行政。作为交换，邦联接受教会的宗主权，各邦国被划分为正式的教区，在涉及信仰、教育、跨邦纠纷仲裁等领域接受教会的指导。\n\n南方城市的精英阶层在教会体制中找到比联盟内部更有利可图的位置，他们成为教区行政官，管理着教会在南博洲征收的什一税和贸易收入。教会的宗教权威与南方地方精英的经济利益实现了利益绑定。\n到718年，南博洲邦联已经实质上成为教会在地理上最远的教省。拉古教廷在南方的驻军、教堂网络和行政体系让这片区域在名义上仍属博洲，实则已经没有回头路可走。\n\n####
